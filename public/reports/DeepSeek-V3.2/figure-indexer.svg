<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="idx-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">每个历史位置都打分，但一次比较只有少数几个小头</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黄 = 索引头（ReLU / FP8）；灰 = 主注意力那种「全部 Query 头」。H^I 未公开，黄块只画 3 个加省略号。</text>

<rect x="40" y="76" width="520" height="280" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="300" y="104" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">一次 I_{t,s}：当前 t 对某个历史 s</text>
<rect x="70" y="122" width="120" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="130" y="149" font-size="13" fill="#111827" text-anchor="middle">h_t</text>
<rect x="70" y="186" width="56" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="98" y="211" font-size="12" fill="#111827" text-anchor="middle">q_1</text>
<rect x="134" y="186" width="56" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="162" y="211" font-size="12" fill="#111827" text-anchor="middle">q_2</text>
<rect x="198" y="186" width="56" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="226" y="211" font-size="12" fill="#111827" text-anchor="middle">q_3</text>
<text x="268" y="211" font-size="16" fill="#9ca3af">…</text>
<rect x="310" y="186" width="90" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="355" y="211" font-size="12" fill="#111827" text-anchor="middle">k_s^I</text>
<text x="70" y="248" font-size="12" fill="#5fa886">q_1 · k → 正，留下</text>
<text x="70" y="268" font-size="12" fill="#dc2626">q_2 · k → 负，ReLU 成 0</text>
<text x="70" y="288" font-size="12" fill="#5fa886">q_3 · k → 正，留下</text>
<rect x="310" y="248" width="210" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="415" y="275" font-size="13" fill="#111827" text-anchor="middle">w 加权求和 → I_{t,s}</text>
<text x="300" y="338" font-size="12" fill="#6b7280" text-anchor="middle">w 也来自 h_t。负分这条侦察兵被掐掉。</text>

<rect x="580" y="76" width="500" height="280" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="830" y="104" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">对照：主注意力一次比较更贵</text>
<rect x="620" y="130" width="36" height="36" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="662" y="130" width="36" height="36" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="704" y="130" width="36" height="36" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="760" y="154" font-size="16" fill="#9ca3af">…</text>
<text x="830" y="184" font-size="12" fill="#6b7280" text-anchor="middle">索引器：少数小头，FP8 点积</text>
<rect x="620" y="210" width="360" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="800" y="233" font-size="13" fill="#111827" text-anchor="middle">主注意力：全部 Query 头 × 完整 KV</text>
<text x="830" y="270" font-size="12" fill="#6b7280" text-anchor="middle">灰条更长 = 一次比较更贵。不是倍数，报告没给 H^I。</text>
<text x="830" y="330" font-size="12" fill="#6b7280" text-anchor="middle">两边都要对每个历史位置做一次。平方项还在。</text>

<text x="30" y="390" font-size="13" fill="#111827" font-weight="700">历史方向：每个位置一个 I_{t,s}</text>
<rect x="40" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="62" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="84" y="406" width="18" height="22" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="106" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="128" y="406" width="18" height="22" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="150" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="172" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="194" y="406" width="18" height="22" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="216" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="238" y="406" width="18" height="22" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="268" y="422" font-size="16" fill="#9ca3af">…</text>
<text x="300" y="422" font-size="12" fill="#6b7280">绿格 = 后来进 Top-k 的位置。黄格也打过分，只是没被选。</text>

<text x="30" y="458" font-size="13" fill="#6b7280">据 PDF p.3 式 1 与 p.4 Figure 2 重画。全景（谁打分、谁精读）仍见上一张。</text>
<text x="30" y="482" font-size="13" fill="#6b7280">DSA 没有把 O(L^2) 消掉，只是把平方放进单价最低的算子。</text>
</svg>
