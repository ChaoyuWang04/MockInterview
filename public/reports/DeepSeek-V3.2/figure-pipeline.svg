<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="360" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">只改注意力，却带动预热、稀疏训练和混合 RL</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 基座；绿 = 本报告的训练阶段。报告没有给参数量、层数或专家数。</text>
<rect x="40" y="90" width="200" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="140" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">V3.1-Terminus</text>
<text x="140" y="140" font-size="12" fill="#374151" text-anchor="middle">上下文已 128K</text>
<rect x="280" y="90" width="200" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="380" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">密集预热</text>
<text x="380" y="140" font-size="12" fill="#374151" text-anchor="middle">只训索引器 2.1B</text>
<rect x="520" y="90" width="220" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="630" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">稀疏训练</text>
<text x="630" y="140" font-size="12" fill="#374151" text-anchor="middle">主模型 + 索引器 943.7B</text>
<rect x="780" y="90" width="300" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="930" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">混合 RL</text>
<text x="930" y="140" font-size="12" fill="#374151" text-anchor="middle">推理 / Agent / 对齐同一阶段</text>
<rect x="520" y="200" width="220" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="630" y="234" font-size="13" fill="#111827" text-anchor="middle">DeepSeek-V3.2</text>
<rect x="780" y="200" width="300" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="930" y="234" font-size="13" fill="#111827" text-anchor="middle">V3.2-Speciale · 只推推理</text>
<line x1="240" y1="125" x2="272" y2="125" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="480" y1="125" x2="512" y2="125" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="740" y1="125" x2="772" y2="125" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="300" font-size="13" fill="#6b7280">据 PDF p.3–6 重画。架构与 DeepSeek-V3.2-Exp 相同；MLA / MoE 见 DeepSeek-V2 一篇和 DeepSeek-V3 一篇。</text>
<text x="30" y="324" font-size="13" fill="#6b7280">最大上下文 128K，不是百万级。那是 DeepSeek-V4 一篇的事。</text>
</svg>
