<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">一百万 Token：局部、相关历史、全局轮廓分三条通道</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黄 = 混合注意力；绿 = 残差与优化器；紫 = 后训练。两种规模：Flash 284B/13B，Pro 1.6T/49B。</text>
<rect x="40" y="90" width="240" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="160" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">CSA</text>
<text x="160" y="140" font-size="12" fill="#374151" text-anchor="middle">先压缩再精读相关历史</text>
<rect x="320" y="90" width="240" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="440" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">HCA</text>
<text x="440" y="140" font-size="12" fill="#374151" text-anchor="middle">更粗的全局回看</text>
<rect x="600" y="90" width="240" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="720" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">SWA</text>
<text x="720" y="140" font-size="12" fill="#374151" text-anchor="middle">只细看眼前一小段</text>
<rect x="40" y="190" width="240" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="160" y="218" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">mHC</text>
<text x="160" y="240" font-size="12" fill="#374151" text-anchor="middle">多路受控残差</text>
<rect x="320" y="190" width="240" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="440" y="218" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Muon + AdamW</text>
<text x="440" y="240" font-size="12" fill="#374151" text-anchor="middle">两类优化器</text>
<rect x="600" y="190" width="240" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="720" y="218" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MoE + MTP</text>
<text x="720" y="240" font-size="12" fill="#374151" text-anchor="middle">沿用前代稀疏计算</text>
<rect x="40" y="290" width="360" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="220" y="324" font-size="13" fill="#111827" text-anchor="middle">领域 RL + 多教师蒸馏</text>
<rect x="440" y="290" width="400" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="640" y="324" font-size="13" fill="#111827" text-anchor="middle">V4-Flash / V4-Pro · 三档推理强度</text>
<text x="30" y="380" font-size="13" fill="#6b7280">据 PDF p.5、p.24–25 重画。V4-Pro 单 Token 推理 FLOPs 约为 V3.2 的 27%，KV Cache 约 10%（报告估算，不是端到端延迟）。</text>
<text x="30" y="404" font-size="13" fill="#6b7280">mHC 出处见 mHC 一篇；本篇只画它在百万上下文里怎么接。</text>
</svg>
