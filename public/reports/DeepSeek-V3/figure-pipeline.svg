<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">V3 不换架构，把四笔账分别按住</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 沿用 V2 的 MLA 与 DeepSeekMoE；绿 = 本报告新增；黄 = 系统。注意力和专家切法见 DeepSeek-V2 一篇。</text>
<rect x="40" y="90" width="240" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160" y="124" font-size="13" fill="#111827" text-anchor="middle">MLA · 沿用 V2</text>
<rect x="320" y="90" width="280" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="460" y="124" font-size="13" fill="#111827" text-anchor="middle">DeepSeekMoE · 1 共享 + 256 路由</text>
<rect x="640" y="90" width="220" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="750" y="124" font-size="13" fill="#111827" text-anchor="middle">无辅助损失 bias</text>
<rect x="880" y="90" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="980" y="124" font-size="13" fill="#111827" text-anchor="middle">MTP</text>
<rect x="40" y="180" width="320" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="200" y="214" font-size="13" fill="#111827" text-anchor="middle">FP8 混合精度训练</text>
<rect x="400" y="180" width="360" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="580" y="214" font-size="13" fill="#111827" text-anchor="middle">DualPipe + 跨节点 all-to-all</text>
<rect x="800" y="180" width="280" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="940" y="214" font-size="13" fill="#111827" text-anchor="middle">671B / 37B 激活</text>
<rect x="40" y="270" width="240" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160" y="304" font-size="13" fill="#111827" text-anchor="middle">YaRN 4K → 128K</text>
<rect x="320" y="270" width="280" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="460" y="304" font-size="13" fill="#111827" text-anchor="middle">SFT 1.5M · 含 R1 数据</text>
<rect x="640" y="270" width="440" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="860" y="304" font-size="13" fill="#111827" text-anchor="middle">GRPO → 对话模型</text>
<text x="30" y="370" font-size="13" fill="#6b7280">据报告第 2–5 节重画，是结构关系，不是严格时间线。完整训练 278.8 万 H800 GPU 小时（PDF p.5）。</text>
<text x="30" y="394" font-size="13" fill="#6b7280">四笔账：路由塌缩、all-to-all、显存、FP8 动态范围。每笔都把代价挪到更便宜的地方。</text>
</svg>
