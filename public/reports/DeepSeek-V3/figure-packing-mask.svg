<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="460" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">同一套打包，预训练能偷看，SFT 必须隔离</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰块 = 拼进同一条序列的文档/样本。绿箭头 = 注意力能看见；红虚线 = 样本掩码挡住。示意，不是语料原文。</text>

<text x="30" y="88" font-size="14" fill="#111827" font-weight="700">预训练（PDF p.22）：document packing，没有跨样本掩码</text>
<rect x="40" y="104" width="280" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="180" y="134" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">文档 A · 代码</text>
<text x="180" y="156" font-size="12" fill="#374151" text-anchor="middle">一段函数</text>
<rect x="360" y="104" width="280" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="500" y="134" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">文档 B · 网页</text>
<text x="500" y="156" font-size="12" fill="#374151" text-anchor="middle">一篇说明文字</text>
<rect x="680" y="104" width="400" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="880" y="134" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">文档 C · 长文本</text>
<text x="880" y="156" font-size="12" fill="#374151" text-anchor="middle">被截进同一条 4K 序列</text>
<text x="30" y="198" font-size="13" fill="#5fa886">C 能看见 A 和 B。报告没解释为什么；实现更简单，注意力 kernel 也不用换。</text>

<text x="30" y="240" font-size="14" fill="#111827" font-weight="700">SFT（PDF p.29）：同样打包，但加样本掩码</text>
<rect x="40" y="256" width="320" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="200" y="286" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">样本 1</text>
<text x="200" y="308" font-size="12" fill="#374151" text-anchor="middle">问题 + 回答</text>
<rect x="400" y="256" width="320" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="560" y="286" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">样本 2</text>
<text x="560" y="308" font-size="12" fill="#374151" text-anchor="middle">问题 + 回答</text>
<rect x="760" y="256" width="320" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="920" y="286" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">样本 3</text>
<text x="920" y="308" font-size="12" fill="#374151" text-anchor="middle">问题 + 回答</text>
<line x1="360" y1="256" x2="360" y2="326" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="720" y1="256" x2="720" y2="326" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="30" y="354" font-size="13" fill="#dc2626">红虚线处互不可见。否则模型可能学会「答案出现在下一条提示词之前」。</text>

<text x="30" y="392" font-size="13" fill="#6b7280">据 PDF p.22 与 p.29 重画。预训练 4K 序列；SFT 同样多样本打包。V4 预训练改成 sample-level mask，见 DeepSeek-V4 一篇。</text>
<text x="30" y="416" font-size="13" fill="#6b7280">报告没有公开打包进同一条序列的真实文档。色块只表示「能看见 / 看不见」，不是语料原文。</text>
<text x="30" y="440" font-size="13" fill="#6b7280">同一技术选项在两个阶段可以取反。不要因为上一阶段这么做就沿用。</text>
</svg>
