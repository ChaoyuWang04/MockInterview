<marker id="qc8r-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
<rect x="40" y="80" width="1040" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
