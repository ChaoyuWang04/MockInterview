<rect x="860" y="148" width="220" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="40" y="300" width="500" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<rect x="580" y="300" width="500" height="150" rx="8" fill="#ffffff" stroke="#8f8bd8" stroke-dasharray="5 4"/>
<rect x="60" y="336" width="460" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="600" y="336" width="140" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-dasharray="5 4"/>
