<text x="192" y="438" font-size="11" fill="#9ca3af" text-anchor="middle">每个专家 = 原来的 FFN</text>
<text x="560" y="438" font-size="11" fill="#9ca3af" text-anchor="middle">中间维变成原来的 1/m</text>
<text x="928" y="438" font-size="11" fill="#9ca3af" text-anchor="middle">绿块绕过路由器，每个 Token 必经</text>

