<rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">DeepSeekMoE：切细再留共享，总参和每次激活计算量不变</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 未激活的路由专家；紫 = 本次激活的路由专家；绿 = 共享专家（每个 Token 都走）。块越宽表示专家越大。</text>

<rect x="16" y="70" width="352" height="378" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="384" y="70" width="352" height="378" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="752" y="70" width="352" height="378" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<text x="192" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 常规 top-2</text>
<text x="192" y="114" font-size="11" fill="#6b7280" text-anchor="middle">GShard 是这一幅；Switch 是 top-1</text>
<text x="560" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) + 细粒度切分</text>
<text x="560" y="114" font-size="11" fill="#6b7280" text-anchor="middle">N 个切成 2N 个更小的，K：2 变成 4</text>
<text x="928" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) + 共享专家隔离</text>
<text x="928" y="114" font-size="11" fill="#6b7280" text-anchor="middle">完整 DeepSeekMoE，路由 K 收到 3</text>

