<text x="36" y="488" font-size="14" fill="#111827" font-weight="700">和 Switch / GShard 不一样的地方</text>
<text x="36" y="514" font-size="13" fill="#6b7280">Switch Transformer：专家和原来 FFN 一样大，每个 Token 只进 1 个（top-1）。</text>
<text x="36" y="536" font-size="13" fill="#6b7280">GShard：同样大的专家，每个 Token 进 2 个，就是左幅 (a)。</text>
<text x="36" y="558" font-size="13" fill="#6b7280">DeepSeekMoE：先把专家切细（中幅），再隔离共享专家（右幅绿块）；路由少激活同样个数。</text>
<text x="36" y="580" font-size="13" fill="#6b7280">三幅的专家总参数、每次激活的计算量保持不变（PDF p. 5 Figure 2 图注）。</text>
</svg>
