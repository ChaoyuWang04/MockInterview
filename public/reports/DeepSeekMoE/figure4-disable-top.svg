<text x="30" y="460" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 13 Figure 4 重画。盖住 1/16 之后，DeepSeekMoE 跳到约 7.5，GShard ×1.5 约 5.5；到 4/16 前者近 9，后者仍在 8 以下。</text>
<text x="30" y="484" font-size="13" fill="#6b7280" text-anchor="start">论文判断：细切加共享的路由专家更不可替代、冗余更低。两边其实都依赖头部，差别是相对的。</text>
