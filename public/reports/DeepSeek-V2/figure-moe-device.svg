<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">V2 的 MoE：沿用细切加共享，再加设备受限路由</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 共享专家（每个 Token 都走）；紫 = 本次激活的路由专家；黄 = 路由器。灰 = 未激活。</text>
<rect x="40" y="80" width="1040" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<rect x="80" y="140" width="120" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="140" y="168" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">共享 1</text>
<rect x="220" y="140" width="120" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="280" y="168" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">共享 2</text>
<text x="200" y="230" font-size="11" fill="#6b7280" text-anchor="middle">每个 Token 必经，不进路由器</text>
<rect x="420" y="140" width="48" height="70" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="444" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<rect x="480" y="140" width="48" height="70" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="504" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<rect x="540" y="140" width="48" height="70" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="564" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<rect x="600" y="140" width="48" height="70" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="624" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">4</text>
<rect x="660" y="140" width="48" height="70" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="684" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">5</text>
<rect x="720" y="140" width="48" height="70" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="744" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">6</text>
<rect x="780" y="140" width="48" height="70" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="804" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">…</text>
<rect x="960" y="140" width="48" height="70" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="984" y="180" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">160</text>
<text x="720" y="230" font-size="11" fill="#6b7280" text-anchor="middle">160 个路由专家里激活 6 个</text>
<rect x="420" y="260" width="320" height="50" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="580" y="290" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">先挑 3 台设备，再在其中做 top-6</text>
<text x="580" y="330" font-size="12" fill="#9ca3af" text-anchor="middle">Input Hidden  u_t</text>
<text x="140" y="330" font-size="12" fill="#9ca3af" text-anchor="middle">Output Hidden</text>
<text x="30" y="410" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5 Figure 2 与 p. 9–10 重画。细切加共享的算法动机见 DeepSeekMoE 一篇；V2 多出来的是设备受限（M = 3、D = 8）。</text>
<text x="30" y="434" font-size="13" fill="#6b7280" text-anchor="start">单个专家中间维 1536，稠密 FFN 中间维 12288 的 1/8；2 共享 + 6 路由 = 8，算力对齐一个稠密 FFN。12288 是权重里的实现尺寸，PDF 只写了专家维。</text>
<text x="30" y="458" font-size="13" fill="#6b7280" text-anchor="start">实践中 M 不小于 3 时，效果与不受限 top-K 大体持平（PDF p. 10）。</text>
</svg>
