<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="400" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">迭代 RL：第一轮抬得最多，后面变慢</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = iteration-0；黄 = iteration-1；绿 = iteration-2。模型是 DeepSeekMath-Instruct 7B。数字是本文按图读的近似值。</text>
<text x="280" y="86" font-size="13" fill="#111827" font-weight="700">GSM8K</text>
<line x1="80" y1="100" x2="80" y2="280" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="80" y1="280" x2="520" y2="280" stroke="#9ca3af" stroke-width="1.2"/>
<polyline points="80,220 190,180 300,160 410,150 520,148" fill="none" stroke="#b9b9b9" stroke-width="2"/>
<polyline points="80,170 190,150 300,138 410,128 520,122" fill="none" stroke="#d4a24c" stroke-width="2"/>
<polyline points="80,160 190,140 300,120 410,110 520,100" fill="none" stroke="#5fa886" stroke-width="2.4"/>
<text x="80" y="296" font-size="11" fill="#9ca3af">0 步</text>
<text x="500" y="296" font-size="11" fill="#9ca3af">约 5300 步</text>
<text x="820" y="86" font-size="13" fill="#111827" font-weight="700">MATH</text>
<line x1="620" y1="100" x2="620" y2="280" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="620" y1="280" x2="1060" y2="280" stroke="#9ca3af" stroke-width="1.2"/>
<polyline points="620,250 730,210 840,190 950,178 1060,176" fill="none" stroke="#b9b9b9" stroke-width="2"/>
<polyline points="620,180 730,150 840,128 950,118 1060,116" fill="none" stroke="#d4a24c" stroke-width="2"/>
<polyline points="620,176 730,148 840,126 950,118 1060,114" fill="none" stroke="#5fa886" stroke-width="2.4"/>
<text x="620" y="296" font-size="11" fill="#9ca3af">0 步</text>
<text x="1040" y="296" font-size="11" fill="#9ca3af">约 5300 步</text>
<text x="30" y="340" font-size="13" fill="#6b7280">据 PDF p.20 Figure 6 重画。GSM8K 约 85–87 → 87–88 → 近 89；MATH 约 49 → 51–52，第二轮几乎贴着第一轮。</text>
<text x="30" y="364" font-size="13" fill="#6b7280">论文没有数值表。外层每轮把参考模型重置为当前策略，并用 10% 历史数据续训奖励模型。</text>
</svg>
