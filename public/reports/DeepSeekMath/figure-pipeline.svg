<text x="500" y="124" font-size="13" fill="#111827" text-anchor="middle">数学语料 120B Token</text>
<line x1="280" y1="118" x2="352" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="180" width="240" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160" y="214" font-size="13" fill="#111827" text-anchor="middle">Coder-Base-v1.5 7B</text>
<rect x="360" y="180" width="280" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="500" y="214" font-size="13" fill="#111827" text-anchor="middle">Math-Base 7B · 500B Token</text>
<line x1="280" y1="208" x2="352" y2="208" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="500" y1="146" x2="500" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="720" y="180" width="180" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="810" y="214" font-size="13" fill="#111827" text-anchor="middle">Instruct 7B</text>
<line x1="640" y1="208" x2="712" y2="208" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="920" y="180" width="160" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="1000" y="214" font-size="13" fill="#111827" text-anchor="middle">RL 7B</text>
<line x1="900" y1="208" x2="912" y2="208" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="720" y="270" width="360" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="900" y="304" font-size="13" fill="#111827" text-anchor="middle">统一梯度视角：SFT / RFT / DPO / PPO / GRPO</text>
<line x1="1000" y1="236" x2="1000" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="370" font-size="13" fill="#6b7280">据 PDF p.5、p.8、p.10、p.15 重画。奖励模型从 Base 训，再进 GRPO。</text>
<text x="30" y="394" font-size="13" fill="#6b7280">左是数据工程，中是三代模型，右下是分析工作。</text>
</svg>
