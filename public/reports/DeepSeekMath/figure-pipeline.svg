<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">两条线：捞语料训 7B，再用 GRPO 做 RL</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黄 = 数据；绿 = 模型代际；紫 = 分析，不产出模型。DeepSeekMath 不是从零训的。</text>
<rect x="40" y="90" width="240" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="160" y="124" font-size="13" fill="#111827" text-anchor="middle">Common Crawl 40B 页</text>
