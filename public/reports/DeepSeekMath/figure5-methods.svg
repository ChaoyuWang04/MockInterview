<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">三个旋钮拆开看：在线采样、连续有正负的系数、过程监督</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = RFT；黄 = Online RFT；紫 = GRPO+OS；绿 = GRPO+PS。模型是 DeepSeekMath-Instruct 1.3B，不是 7B。</text>
<text x="280" y="86" font-size="13" fill="#111827" font-weight="700">GSM8K</text>
