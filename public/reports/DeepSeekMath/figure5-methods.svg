<polyline points="80,250 180,226 300,190 420,166 520,150" fill="none" stroke="#8f8bd8" stroke-width="2"/>
<polyline points="80,236 180,210 300,170 420,140 520,118" fill="none" stroke="#5fa886" stroke-width="2.4"/>
