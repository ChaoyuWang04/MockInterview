<polyline points="620,260 730,248 840,236 950,228 1060,224" fill="none" stroke="#b9b9b9" stroke-width="2"/>
<polyline points="620,250 730,230 840,210 950,198 1060,186" fill="none" stroke="#d4a24c" stroke-width="2"/>
<polyline points="620,236 730,220 840,200 950,188 1060,176" fill="none" stroke="#8f8bd8" stroke-width="2"/>
<polyline points="620,210 730,190 840,168 950,150 1060,132" fill="none" stroke="#5fa886" stroke-width="2.4"/>
<text x="620" y="316" font-size="11" fill="#9ca3af">0 步</text>
<text x="1040" y="316" font-size="11" fill="#9ca3af">约 8000 步</text>
<text x="30" y="360" font-size="13" fill="#6b7280">据 PDF p.19 Figure 5 重画，示意精度。论文没有数值表，也没有多种子。绿线最高；黄线明显压过灰线。</text>
<text x="30" y="384" font-size="13" fill="#6b7280">Online RFT 不惩罚错误回答，对所有正确回答用同样力度；GRPO 按奖励值大小做差异化强化和惩罚。</text>
</svg>
