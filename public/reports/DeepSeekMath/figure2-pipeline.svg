<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" width="1120" height="410" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="410" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">分类器和种子互相喂养，跑四轮才停</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 自动召回；黄 = 人只标 URL 路径，不标页面。超过 10% 命中率的域名整站再看。</text>
<rect x="60" y="100" width="220" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="170" y="128" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">种子语料</text>
<text x="170" y="150" font-size="12" fill="#374151" text-anchor="middle">第一轮用 OpenWebMath</text>
<rect x="360" y="100" width="220" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="470" y="128" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">fastText 分类器</text>
<text x="470" y="150" font-size="12" fill="#374151" text-anchor="middle">故意用最便宜的线性模型</text>
<rect x="660" y="100" width="400" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="860" y="128" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">从 40B 页里按分数召回</text>
<text x="860" y="150" font-size="12" fill="#374151" text-anchor="middle">第一轮保留 top 40B Token</text>
<line x1="280" y1="135" x2="352" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="580" y1="135" x2="652" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="60" y="250" width="320" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="220" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">按域名统计命中率</text>
<text x="220" y="300" font-size="12" fill="#374151" text-anchor="middle">超过 10% 判为数学站点</text>
<rect x="460" y="250" width="320" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="620" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">人工标 URL 路径</text>
<text x="620" y="300" font-size="12" fill="#374151" text-anchor="middle">例如 mathoverflow.net/questions</text>
<rect x="860" y="250" width="200" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="960" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">加回种子</text>
<text x="960" y="300" font-size="12" fill="#374151" text-anchor="middle">漏召回的进下一轮</text>
<line x1="380" y1="285" x2="452" y2="285" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="780" y1="285" x2="852" y2="285" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="360" font-size="13" fill="#6b7280">据 PDF p.5 Figure 2 重画。四轮后 3550 万页、120B Token；第四轮 98% 已在第三轮收到，于是停。</text>
<text x="30" y="384" font-size="13" fill="#6b7280">分类器要跑 400 亿页，所以不用 BERT。人的时间花在路径规则上，一条规则可能带回几十万页。</text>
</svg>
