<rect x="0" y="0" width="1120" height="460" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">八平面两层胖树：GPU i 永远走平面 i</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">每一色一块独立的叶子-脊网。跨平面没有直连，必须在节点内转发。这是打折的多平面，不是理想多端口网卡。</text>
