<text x="985" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">平面 3</text>
<rect x="915" y="125" width="140" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="985" y="148" font-size="12" fill="#111827" text-anchor="middle">脊交换机</text>
<rect x="880" y="175" width="90" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="925" y="198" font-size="12" fill="#111827" text-anchor="middle">叶</text>
<rect x="1000" y="175" width="90" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1045" y="198" font-size="12" fill="#111827" text-anchor="middle">叶</text>
<rect x="915" y="225" width="140" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="985" y="248" font-size="12" fill="#111827" text-anchor="middle">GPU 3 + NIC 3</text>
<text x="30" y="310" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p.8–9 Figure 3 重画，只画 4/8 个平面。8 张网卡 = 8 张互不直连的网；理论上两层接到 16384 卡，政策下只部署两千出头。</text>
<text x="30" y="334" font-size="13" fill="#6b7280" text-anchor="start">理想 Figure 4：一张网卡多个端口、一个 QP 洒到多平面，乱序到达要网卡原生支持。CX7 做不到，训 V3 的网是「并没有完全实现设想」。</text>
<text x="30" y="358" font-size="13" fill="#6b7280" text-anchor="start">每端点成本和两层胖树一样（约 4.39 k$），规模却够到三层才能碰到的上万卡；三层每端点约 7.5 k$。</text>
<text x="30" y="394" font-size="13" fill="#6b7280" text-anchor="start">NCCL 的 PXN 能靠 NVLink 做跨平面转发，所以训练数字和单平面多轨几乎打平。</text>
</svg>
