<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">节点受限路由：IB 只按节点数付钱，所以先限制节点</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 最坏（8 个节点各中一个）；绿 = 最多 4 个节点，节点内用 NVLink 转发。一份 IB 流量喂多个专家。</text>
<rect x="40" y="80" width="500" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<rect x="580" y="80" width="500" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="290" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 不限制：IB 付 8t</text>
<text x="830" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) 最多 4 个节点：IB 付 4t</text>
<rect x="70" y="140" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="115" y="170" font-size="12" fill="#111827" text-anchor="middle">节点 1</text>
<rect x="180" y="140" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="225" y="170" font-size="12" fill="#111827" text-anchor="middle">节点 2</text>
<rect x="290" y="140" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="335" y="170" font-size="12" fill="#111827" text-anchor="middle">节点 3</text>
<rect x="400" y="140" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="445" y="170" font-size="12" fill="#111827" text-anchor="middle">节点 4</text>
<rect x="70" y="210" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="115" y="240" font-size="12" fill="#111827" text-anchor="middle">节点 5</text>
<rect x="180" y="210" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="225" y="240" font-size="12" fill="#111827" text-anchor="middle">节点 6</text>
<rect x="290" y="210" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="335" y="240" font-size="12" fill="#111827" text-anchor="middle">节点 7</text>
<rect x="400" y="210" width="90" height="50" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="445" y="240" font-size="12" fill="#111827" text-anchor="middle">节点 8</text>
<rect x="620" y="155" width="90" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="665" y="180" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">节点 1</text>
<text x="665" y="200" font-size="11" fill="#6b7280" text-anchor="middle">多专家</text>
<rect x="730" y="155" width="90" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="775" y="180" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">节点 2</text>
<text x="775" y="200" font-size="11" fill="#6b7280" text-anchor="middle">多专家</text>
<rect x="840" y="155" width="90" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="885" y="180" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">节点 3</text>
<text x="885" y="200" font-size="11" fill="#6b7280" text-anchor="middle">多专家</text>
<rect x="950" y="155" width="90" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="995" y="180" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">节点 4</text>
<text x="995" y="200" font-size="11" fill="#6b7280" text-anchor="middle">多专家</text>
<text x="290" y="350" font-size="12" fill="#9ca3af" text-anchor="middle">8 个目标专家落 8 个节点</text>
<text x="830" y="350" font-size="12" fill="#9ca3af" text-anchor="middle">同节点专家只走一次 IB</text>
<text x="30" y="400" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p.7 §4.3 重画。设定：8 节点、64 卡、256 路由专家，每卡 4 个；每 Token 1 共享 + 8 路由。</text>
<text x="30" y="424" font-size="13" fill="#6b7280" text-anchor="start">256 个专家分成 8 组、每组 32 个、一组一个节点；算法保证最多送到 4 个节点。M=4 是 4:1 带宽差写进搜索空间，不是搜出来的最优。</text>
<text x="30" y="448" font-size="13" fill="#6b7280" text-anchor="start">换一块 NVLink 没被砍的卡，这个 4 就该重算。V3 技术报告写的是 3.2 倍能喂约 13 个专家；本篇改用 4:1，因果说得更硬。</text>
</svg>
