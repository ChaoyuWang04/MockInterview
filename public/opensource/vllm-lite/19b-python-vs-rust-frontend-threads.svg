<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 676" width="1120" height="676" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="676" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">API 层的五件事:Python 前端与 Rust 前端各让哪些线程来做</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每行是两边都必须做的一件事。灰 = 这一行归哪段代码,紫 = 和 HTTP 收发共用的线程,黄 = 从 HTTP 线程挪开、</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">专做渲染与切词的线程池,绿 = 只管和引擎收发的线程;虚线框 = 进程。两边接的是同一条 ZMQ 边界,EngineCore 以下一样。</text>
<rect x="204" y="100" width="420" height="414" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="216" y="124" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Python API 进程</text>
<text x="216" y="142" font-size="11" fill="#6b7280" text-anchor="start">可多开:每个都是这一整列的一份,各连全部 EngineCore</text>
<rect x="626" y="100" width="468" height="414" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="638" y="124" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Rust 前端进程</text>
<text x="638" y="142" font-size="11" fill="#6b7280" text-anchor="start">只开 1 个,多开 API 进程的设置被忽略</text>
<text x="30" y="194" font-size="13" fill="#111827" text-anchor="start" font-weight="700">渲染聊天模板 · 切词</text>
<text x="30" y="212" font-size="11" fill="#6b7280" text-anchor="start">每条新请求一次</text>
<text x="30" y="262" font-size="13" fill="#111827" text-anchor="start" font-weight="700">HTTP 收发</text>
<text x="30" y="280" font-size="11" fill="#6b7280" text-anchor="start">收请求、写 SSE</text>
<line x1="30" y1="232.0" x2="200" y2="232.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="30" y="330" font-size="13" fill="#111827" text-anchor="start" font-weight="700">反切词 · 判停止串</text>
<text x="30" y="348" font-size="11" fill="#6b7280" text-anchor="start">每步每条在跑的请求</text>
<line x1="30" y1="300.0" x2="200" y2="300.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="30" y="398" font-size="13" fill="#111827" text-anchor="start" font-weight="700">推理段与工具调用切分</text>
<text x="30" y="416" font-size="11" fill="#6b7280" text-anchor="start">每个流式块</text>
<line x1="30" y1="368.0" x2="200" y2="368.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="30" y="466" font-size="13" fill="#111827" text-anchor="start" font-weight="700">和引擎收发</text>
<text x="30" y="484" font-size="11" fill="#6b7280" text-anchor="start">打包解包、走 ZMQ</text>
<line x1="30" y1="436.0" x2="200" y2="436.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="216" y="168" width="150" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="226" y="188" font-size="13" fill="#111827" text-anchor="start" font-weight="700">渲染器</text>
<text x="226" y="205" font-size="11" fill="#6b7280" text-anchor="start">按模型架构选</text>
<rect x="216" y="236" width="150" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="226" y="256" font-size="13" fill="#111827" text-anchor="start" font-weight="700">FastAPI 路由</text>
<text x="226" y="273" font-size="11" fill="#6b7280" text-anchor="start">每种协议一组</text>
<rect x="216" y="304" width="150" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="226" y="324" font-size="13" fill="#111827" text-anchor="start" font-weight="700">输出处理器</text>
<text x="226" y="341" font-size="11" fill="#6b7280" text-anchor="start">每条请求一个增量反切词器</text>
<rect x="216" y="372" width="150" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="226" y="392" font-size="13" fill="#111827" text-anchor="start" font-weight="700">统一解析器</text>
<text x="226" y="409" font-size="11" fill="#6b7280" text-anchor="start">每条请求一个</text>
<rect x="216" y="440" width="150" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="226" y="460" font-size="13" fill="#111827" text-anchor="start" font-weight="700">引擎客户端</text>
<text x="226" y="477" font-size="11" fill="#6b7280" text-anchor="start">msgpack 编解码</text>
<rect x="376" y="168" width="236" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="386" y="188" font-size="13" fill="#111827" text-anchor="start" font-weight="700">渲染线程池</text>
<text x="386" y="205" font-size="11" fill="#6b7280" text-anchor="start">默认 1 个线程;模板和切词都丢进来,</text>
<text x="386" y="220" font-size="11" fill="#6b7280" text-anchor="start">一条长 prompt 切词时别的照常</text>
<rect x="376" y="236" width="236" height="264" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="386" y="256" font-size="13" fill="#111827" text-anchor="start" font-weight="700">1 个事件循环线程</text>
<text x="386" y="273" font-size="11" fill="#6b7280" text-anchor="start">下面四行在同一个线程上轮流跑,</text>
<text x="386" y="288" font-size="11" fill="#6b7280" text-anchor="start">任何一行慢了,其余几行一起等</text>
<line x1="386" y1="300.0" x2="602" y2="300.0" stroke="#8f8bd8" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="386" y="338" font-size="11" fill="#6b7280" text-anchor="start">输出协程:每处理 128 条让一次循环</text>
<line x1="386" y1="368.0" x2="602" y2="368.0" stroke="#8f8bd8" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="386" y="406" font-size="11" fill="#6b7280" text-anchor="start">每条请求自己的流式协程里切</text>
<line x1="386" y1="436.0" x2="602" y2="436.0" stroke="#8f8bd8" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="386" y="474" font-size="11" fill="#6b7280" text-anchor="start">收包协程常驻,发包就地做</text>
<rect x="638" y="168" width="172" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="648" y="188" font-size="12" fill="#111827" text-anchor="start" font-weight="700">vllm-chat + vllm-text</text>
<text x="648" y="205" font-size="11" fill="#6b7280" text-anchor="start">chat 渲染模板,text 切词</text>
<rect x="638" y="236" width="172" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="648" y="256" font-size="12" fill="#111827" text-anchor="start" font-weight="700">vllm-server</text>
<text x="648" y="273" font-size="11" fill="#6b7280" text-anchor="start">axum 写的 OpenAI 兼容服务</text>
<rect x="638" y="304" width="172" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="648" y="324" font-size="12" fill="#111827" text-anchor="start" font-weight="700">vllm-text</text>
<text x="648" y="341" font-size="11" fill="#6b7280" text-anchor="start">增量反切词,停止串也在这判</text>
<rect x="638" y="372" width="172" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="648" y="392" font-size="12" fill="#111827" text-anchor="start" font-weight="700">vllm-chat</text>
<text x="648" y="409" font-size="11" fill="#6b7280" text-anchor="start">思考段与工具调用切分</text>
<rect x="638" y="440" width="172" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="648" y="460" font-size="12" fill="#111827" text-anchor="start" font-weight="700">vllm-llm + 引擎客户端</text>
<text x="648" y="477" font-size="11" fill="#6b7280" text-anchor="start">薄门面 + ZMQ、MessagePack</text>
<rect x="820" y="168" width="262" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="830" y="188" font-size="13" fill="#111827" text-anchor="start" font-weight="700">请求运行时:可用核数,最多 32</text>
<text x="830" y="205" font-size="11" fill="#6b7280" text-anchor="start">聊天、补全路由整个挪进来:渲染、切词、</text>
<text x="830" y="220" font-size="11" fill="#6b7280" text-anchor="start">组装请求并提交,不占 HTTP 的线程</text>
<rect x="820" y="236" width="262" height="196" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="830" y="256" font-size="13" fill="#111827" text-anchor="start" font-weight="700">HTTP 运行时:可用核数,最多 32</text>
<text x="830" y="273" font-size="11" fill="#6b7280" text-anchor="start">多线程,没有「一次只跑一个」的限制</text>
<line x1="830" y1="300.0" x2="1072" y2="300.0" stroke="#8f8bd8" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="830" y1="368.0" x2="1072" y2="368.0" stroke="#8f8bd8" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="830" y="330" font-size="11" fill="#6b7280" text-anchor="start">流式时响应体在这里一块块往外推,</text>
<text x="830" y="346" font-size="11" fill="#6b7280" text-anchor="start">反切词与切分就在推的时候做;</text>
<text x="830" y="398" font-size="11" fill="#6b7280" text-anchor="start">非流式时这两行留在请求运行时里,</text>
<text x="830" y="414" font-size="11" fill="#6b7280" text-anchor="start">收齐整段再回</text>
<rect x="820" y="440" width="262" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="830" y="460" font-size="13" fill="#111827" text-anchor="start" font-weight="700">ZMQ 运行时:默认 4 个线程</text>
<text x="830" y="477" font-size="11" fill="#6b7280" text-anchor="start">收包、按请求分发、发包与中止</text>
<text x="30" y="552" font-size="13" fill="#111827" text-anchor="start" font-weight="700">进程边界</text>
<rect x="204" y="530" width="890" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="649.0" y="552" font-size="12" fill="#111827" text-anchor="middle">同一条 ZMQ 边界、同一套 MessagePack 消息:去程是新请求与中止,回程是每步新出的 token 编号</text>
<line x1="494.0" y1="514" x2="494.0" y2="528" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="951.0" y1="514" x2="951.0" y2="528" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="204" y="580" width="890" height="50" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="216" y="602" font-size="14" fill="#111827" text-anchor="start" font-weight="700">EngineCore 进程,及其下的 GPU worker</text>
<text x="216" y="619" font-size="11" fill="#6b7280" text-anchor="start">换不换前端,这一层一行不改(进程拓扑见 01 章)</text>
<line x1="649.0" y1="564" x2="649.0" y2="578" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="646" font-size="11" fill="#9ca3af" text-anchor="start">Rust 前端由 Python 的启动命令拉起:EngineCore 照常起,绑好的监听套接字和两端地址交给 Rust 子进程,Python 留下来盯进程死活;Rust 分层最上面的命令行层接住这一步。</text>
<text x="30" y="664" font-size="11" fill="#9ca3af" text-anchor="start">Rust 这边的线程数都能用环境变量改,名字在第五节;Rust 前端缺的路由与参数见第三节。</text>
</svg>