<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 708" width="1120" height="708" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="708" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一条推理模型的工具调用请求在 API 层走一圈:三个入口并成一条路,回来的文字切成三路</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">灰 = 每条请求都走的站,紫 = 思考段,绿 = 正文,黄 = 工具调用,红 = 解析器没开或切错时的去向;</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">虚线框 = 进程边界。回来的那条流以 vLLM 的 Qwen3 解析器认的格式为例,五个标记见图下注。</text>
<rect x="30" y="96" width="820" height="540" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="118" font-size="14" fill="#111827" text-anchor="start" font-weight="700">API 进程</text>
<text x="44" y="136" font-size="11" fill="#6b7280" text-anchor="start">换成 Rust 前端时,整个框换成一个多线程进程;它和 EngineCore 之间的边界一点不变</text>
<rect x="50" y="150" width="200" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="60" y="171" font-size="14" fill="#111827" text-anchor="start" font-weight="700">OpenAI 聊天</text>
<text x="60" y="189" font-size="11" fill="#6b7280" text-anchor="start">主干,直接进下一站</text>
<rect x="50" y="212" width="200" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="60" y="233" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Responses</text>
<text x="60" y="251" font-size="11" fill="#6b7280" text-anchor="start">另一套事件格式,渲染与切分共用</text>
<rect x="50" y="274" width="200" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="60" y="295" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Anthropic Messages</text>
<text x="60" y="313" font-size="11" fill="#6b7280" text-anchor="start">先翻译成一条 OpenAI 聊天请求</text>
<rect x="300" y="150" width="310" height="176" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="310" y="171" font-size="14" fill="#111827" text-anchor="start" font-weight="700">渲染聊天模板 · 切词</text>
<text x="310" y="189" font-size="11" fill="#6b7280" text-anchor="start">渲染器按架构选:DeepSeek V3.2/V4、Inkling</text>
<text x="310" y="204" font-size="11" fill="#6b7280" text-anchor="start">用代码拼,Kimi K3 另有一个,其余走 Jinja</text>
<text x="310" y="219" font-size="11" fill="#6b7280" text-anchor="start">模板:启动指定 &gt; 处理器 &gt; 分词器 &gt; 内置</text>
<text x="310" y="234" font-size="11" fill="#6b7280" text-anchor="start">思考开不开是模板变量</text>
<text x="310" y="249" font-size="11" fill="#6b7280" text-anchor="start">请求字段 → 采样参数:请求 &gt; 模型自带</text>
<text x="310" y="264" font-size="11" fill="#6b7280" text-anchor="start">看一眼提示词:思考段是不是已经关了</text>
<polyline points="250,176.0 272,176.0 272,238 300,238" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="250,238.0 272,238.0 272,238 300,238" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="250,300.0 272,300.0 272,238 300,238" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<rect x="880" y="96" width="210" height="220" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="894" y="118" font-size="14" fill="#111827" text-anchor="start" font-weight="700">EngineCore 进程</text>
<text x="894" y="136" font-size="11" fill="#6b7280" text-anchor="start">本章不动它</text>
<rect x="894" y="152" width="182" height="82" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="904" y="173" font-size="14" fill="#111827" text-anchor="start" font-weight="700">调度 · 前向 · 采样</text>
<text x="904" y="191" font-size="11" fill="#6b7280" text-anchor="start">收到「思考已结束」时,</text>
<text x="904" y="206" font-size="11" fill="#6b7280" text-anchor="start">格式约束从第一个 token</text>
<text x="904" y="221" font-size="11" fill="#6b7280" text-anchor="start">起生效(14 章)</text>
<line x1="610" y1="200" x2="894" y2="200" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="730" y="176" font-size="11" fill="#6b7280" text-anchor="middle">token 编号 + 采样参数</text>
<text x="730" y="191" font-size="11" fill="#6b7280" text-anchor="middle">+ 思考是否已结束</text>
<text x="60" y="360" font-size="11" fill="#6b7280" text-anchor="start">回来的增量:反切词成文字后,一块一块喂给这条请求自己的解析器</text>
<rect x="60" y="372" width="88" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="104.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">思考开始标记</text>
<rect x="148" y="372" width="172" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="234.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">要先查一下天气……</text>
<rect x="320" y="372" width="88" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="364.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">思考结束标记</text>
<rect x="408" y="372" width="134" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="475.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">我帮你查一下。</text>
<rect x="542" y="372" width="88" height="40" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="586.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">调用开始标记</text>
<rect x="630" y="372" width="98" height="40" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="679.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">函数名与参数</text>
<rect x="728" y="372" width="84" height="40" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="770.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">调用结束标记</text>
<polyline points="985.0,234 985.0,340 826,340 826,392.0 812,392.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="977.0" y="334" font-size="11" fill="#6b7280" text-anchor="end">每步新 token</text>
<rect x="60" y="448" width="340" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="70" y="469" font-size="14" fill="#111827" text-anchor="start" font-weight="700">推理解析器:结束标记之前都算思考</text>
<text x="70" y="487" font-size="11" fill="#6b7280" text-anchor="start">特殊标记按 token 编号认,不靠拼出来的文字</text>
<rect x="410" y="448" width="124" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="420" y="469" font-size="14" fill="#111827" text-anchor="start" font-weight="700">谁都不管</text>
<text x="420" y="487" font-size="11" fill="#6b7280" text-anchor="start">原样当正文</text>
<rect x="542" y="448" width="270" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="552" y="469" font-size="14" fill="#111827" text-anchor="start" font-weight="700">工具解析器:认出调用开头</text>
<text x="552" y="487" font-size="11" fill="#6b7280" text-anchor="start">先吐函数名,再一段段吐参数</text>
<line x1="230" y1="412" x2="230" y2="448" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="472" y1="412" x2="472" y2="448" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="677" y1="412" x2="677" y2="448" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="60" y="548" width="340" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="70" y="569" font-size="14" fill="#111827" text-anchor="start" font-weight="700">推理内容字段</text>
<text x="70" y="587" font-size="11" fill="#6b7280" text-anchor="start">流式时逐块跟着走</text>
<text x="70" y="602" font-size="11" fill="#6b7280" text-anchor="start">Anthropic 里是思考块</text>
<rect x="410" y="548" width="124" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="420" y="569" font-size="14" fill="#111827" text-anchor="start" font-weight="700">正文字段</text>
<text x="420" y="587" font-size="11" fill="#6b7280" text-anchor="start">Anthropic 里</text>
<text x="420" y="602" font-size="11" fill="#6b7280" text-anchor="start">是文本块</text>
<rect x="542" y="548" width="270" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="552" y="569" font-size="14" fill="#111827" text-anchor="start" font-weight="700">工具调用列表</text>
<text x="552" y="587" font-size="11" fill="#6b7280" text-anchor="start">结束原因变成「工具调用」</text>
<text x="552" y="602" font-size="11" fill="#6b7280" text-anchor="start">Anthropic 里是工具块</text>
<line x1="230" y1="510" x2="230" y2="548" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="472" y1="510" x2="472" y2="548" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="677" y1="510" x2="677" y2="548" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="880" y="448" width="210" height="78" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="890" y="469" font-size="13" fill="#111827" text-anchor="start" font-weight="700">工具解析器没开或选错</text>
<text x="890" y="487" font-size="11" fill="#6b7280" text-anchor="start">黄段原样留在正文里,</text>
<text x="890" y="502" font-size="11" fill="#6b7280" text-anchor="start">工具调用列表是空的</text>
<polyline points="812,479 880,479" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="880" y="560" width="210" height="74" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="890" y="581" font-size="13" fill="#111827" text-anchor="start" font-weight="700">等不到思考结束标记</text>
<text x="890" y="599" font-size="11" fill="#6b7280" text-anchor="start">被截断或这轮没思考:</text>
<text x="890" y="614" font-size="11" fill="#6b7280" text-anchor="start">整段进推理内容,正文为空</text>
<polyline points="230,610 230,624 880,624" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="30" y="658" font-size="11" fill="#9ca3af" text-anchor="start">Qwen3 格式的标记:思考开始与结束是 &lt;think&gt; 与 &lt;/think&gt;,调用开始与结束是 &lt;tool_call&gt; 与 &lt;/tool_call&gt;,中间用 &lt;function=名字&gt; 与 &lt;parameter=名字&gt; 写函数和参数。</text>
<text x="30" y="676" font-size="11" fill="#9ca3af" text-anchor="start">Anthropic 流式:先照常生成 OpenAI 的 SSE 文本,再逐行解析回对象、重包成 Anthropic 事件。</text>
<text x="30" y="694" font-size="11" fill="#9ca3af" text-anchor="start">一块文字的结尾像某个标记的开头时(比如只来了一个左尖括号),解析器先扣住,确认不是标记才吐。</text>
</svg>