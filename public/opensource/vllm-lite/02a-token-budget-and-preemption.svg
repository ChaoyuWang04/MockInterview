<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker></defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">vLLM 一步调度:token 预算按队列顺序分,块不够时踢 running 队尾</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = running 里的 decode,黄 = running 里没算完的 prompt 续算一块,紫 = 这一步从 waiting 新收的请求,</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">红 = 被抢占的那条,灰 = 还在 waiting 里排队;上半的条长按 token 数等比例画。</text>
<text x="30" y="108" font-size="14" fill="#111827" text-anchor="start" font-weight="700">上:一步的预算 8192 token(70 GB 以上非 A100 卡的在线服务默认)</text>
<text x="30" y="126" font-size="11" fill="#6b7280" text-anchor="start">running 队列按进队顺序先分,剩下的才轮到 waiting 队首;L 是一条 32768 token 的 prompt,之前几步已算 12288。</text>
<text x="30" y="176" font-size="13" fill="#111827" text-anchor="start" font-weight="700">长 prompt 阈值不设</text>
<text x="30" y="193" font-size="11" fill="#6b7280" text-anchor="start">(默认)</text>
<rect x="230" y="160" width="9.609375" height="38" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="239.609375" y="160" width="810.390625" height="38" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="644.8046875" y="183.5" font-size="12" fill="#111827" text-anchor="middle">L 续算 8096:一条请求吃掉剩下的全部预算</text>
<text x="230" y="154" font-size="11" fill="#6b7280" text-anchor="start">96 条 decode 各 1 token</text>
<text x="1050" y="154" font-size="11" fill="#6b7280" text-anchor="end">8192</text>
<text x="230" y="214" font-size="11" fill="#9ca3af" text-anchor="start">waiting 里的 W1、W2、W3 这一步一个都收不进,TTFT 跟着 L 的剩余长度往后排</text>
<text x="30" y="266" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阈值设 2048</text>
<text x="30" y="283" font-size="11" fill="#6b7280" text-anchor="start">(每条每步最多 2048)</text>
<rect x="230" y="250" width="9.609375" height="38" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="239.609375" y="250" width="205.0" height="38" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="342.109375" y="273.5" font-size="12" fill="#111827" text-anchor="middle">L 续算 2048</text>
<rect x="444.609375" y="250" width="200.1953125" height="38" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="544.70703125" y="273.5" font-size="12" fill="#111827" text-anchor="middle">W1 整条 2000</text>
<rect x="644.8046875" y="250" width="205.0" height="38" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="747.3046875" y="273.5" font-size="12" fill="#111827" text-anchor="middle">W2 6000 的第一块 2048</text>
<rect x="849.8046875" y="250" width="200.1953125" height="38" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="949.90234375" y="273.5" font-size="12" fill="#111827" text-anchor="middle">W3 整条 2000</text>
<text x="230" y="244" font-size="11" fill="#6b7280" text-anchor="start">96 条 decode 各 1 token</text>
<text x="1050" y="244" font-size="11" fill="#6b7280" text-anchor="end">8192</text>
<text x="230" y="304" font-size="11" fill="#9ca3af" text-anchor="start">同样 8192 个 token,分给了 4 条 prompt;W2 进门前要先确认整条 6000 的块都放得下</text>
<line x1="30" y1="332" x2="1090" y2="332" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="30" y="354" font-size="14" fill="#111827" text-anchor="start" font-weight="700">下:接着上面的 B 行,下一步给某条 decode 补块时池里没有空块</text>
<text x="30" y="416" font-size="13" fill="#111827" text-anchor="start" font-weight="700">running</text>
<text x="30" y="433" font-size="11" fill="#6b7280" text-anchor="start">按进队顺序,左边先分</text>
<rect x="230" y="400" width="240" height="38" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="350" y="423.5" font-size="12" fill="#111827" text-anchor="middle">96 条 decode</text>
<rect x="470" y="400" width="100" height="38" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="520" y="423.5" font-size="12" fill="#111827" text-anchor="middle">L</text>
<rect x="570" y="400" width="80" height="38" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="610" y="423.5" font-size="12" fill="#111827" text-anchor="middle">W1</text>
<rect x="650" y="400" width="80" height="38" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="690" y="423.5" font-size="12" fill="#111827" text-anchor="middle">W2</text>
<rect x="730" y="400" width="80" height="38" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="770" y="423.5" font-size="12" fill="#111827" text-anchor="middle">W3</text>
<text x="250" y="392" font-size="11" fill="#6b7280" text-anchor="start">① 这条要新块,分配失败</text>
<text x="810" y="392" font-size="11" fill="#6b7280" text-anchor="end">队尾 = 最后进来的</text>
<text x="30" y="526" font-size="13" fill="#111827" text-anchor="start" font-weight="700">waiting</text>
<text x="30" y="543" font-size="11" fill="#6b7280" text-anchor="start">队首在左</text>
<rect x="230" y="510" width="80" height="38" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="270" y="533.5" font-size="12" fill="#111827" text-anchor="middle">W3</text>
<rect x="310" y="510" width="80" height="38" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="350" y="533.5" font-size="12" fill="#6b7280" text-anchor="middle">W4</text>
<rect x="390" y="510" width="80" height="38" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="430" y="533.5" font-size="12" fill="#6b7280" text-anchor="middle">W5</text>
<text x="480" y="533.5" font-size="12" fill="#6b7280" text-anchor="start">…</text>
<polyline points="770,438 770,470 270,470 270,510" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="500" y="464" font-size="11" fill="#6b7280" text-anchor="middle">② 出队,放回 waiting 队首;已算 token 清零,之后从头 prefill</text>
<rect x="900" y="380" width="190" height="180" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="912" y="400" font-size="13" fill="#111827" text-anchor="start" font-weight="700">KV 块池</text>
<text x="912" y="416" font-size="11" fill="#6b7280" text-anchor="start">块与容量怎么算见 03 章</text>
<rect x="914" y="430" width="22" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="942" y="430" width="22" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="970" y="430" width="22" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="998" y="430" width="22" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="1026" y="430" width="22" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="1054" y="430" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<rect x="914" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<rect x="942" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<rect x="970" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<rect x="998" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<rect x="1026" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<rect x="1054" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<text x="912" y="506" font-size="11" fill="#6b7280" text-anchor="start">红格 = W3 还回来的块</text>
<text x="912" y="538" font-size="11" fill="#6b7280" text-anchor="start">白格 = 别的请求占着</text>
<polyline points="810,419 900,419" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="855.0" y="412" font-size="11" fill="#6b7280" text-anchor="middle">块全部还回</text>
<text x="30" y="590" font-size="11" fill="#9ca3af" text-anchor="start">③ 还不够就再踢新的队尾,踢到正在补块的这条自己为止;这一步只要踢过人,waiting 一条也不收。</text>
<text x="30" y="608" font-size="11" fill="#9ca3af" text-anchor="start">优先级模式下不踢队尾,改踢优先级数值最大、同级里最晚到的那条;被踢的块若带着前缀哈希,重算时可能被前缀缓存捡回一部分(04 章)。</text>
</svg>