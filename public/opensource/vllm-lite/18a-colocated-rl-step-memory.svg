<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">训推共卡时的一个 RL step:每一段显存里住着什么</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = 推理进程手里、内容可用;灰 = 物理页已还给驱动、虚拟地址留着;红 = 物理页拿回来了、内容不能用;</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">紫 = 训练进程在用这张卡;黄 = 主机锁页内存里的备份;白虚线 = 训练侧自己管,不归 vLLM。</text>
