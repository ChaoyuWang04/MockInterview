<text x="250.0" y="118" font-size="12" fill="#6b7280" text-anchor="middle">① 生成 rollout</text>
<text x="362.0" y="118" font-size="12" fill="#6b7280" text-anchor="middle">② 暂停、清缓存</text>
<text x="474.0" y="118" font-size="12" fill="#6b7280" text-anchor="middle">③ 放显存</text>
<text x="586.0" y="118" font-size="12" fill="#6b7280" text-anchor="middle">④ 训练</text>
