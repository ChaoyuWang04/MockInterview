<text x="30" y="500" font-size="11" fill="#9ca3af" text-anchor="start">level 2 的接口顺序:/sleep?level=2 → 训练 → /wake_up?tags=weights → 训练侧 send_weights() 走 IPC → /wake_up?tags=kv_cache;</text>
<text x="30" y="518" font-size="11" fill="#9ca3af" text-anchor="start">全部醒来才自动恢复调度。/sleep 默认 mode=abort,在飞请求在 ② 被放掉;传 mode=keep 则留在队列里,⑧ 时按新权重从头重算。</text>
