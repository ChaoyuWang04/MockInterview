<text x="30" y="618" font-size="11" fill="#9ca3af" text-anchor="start">假定 FlashInfer 与 DeepGEMM 都装着;H100 上块 FP8 小批走 FlashInfer、大批走 DeepGEMM,都不可用时退到 CUTLASS 块量化。</text>
<text x="30" y="636" font-size="11" fill="#9ca3af" text-anchor="start">选中谁只在启动日志里打一行 info;专家层按格式另查一套表(11 章),KV 精度见正文第三节与 06 章。</text>
