<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 656" width="1120" height="656" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="656" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一份量化 checkpoint 在三代卡上落到哪族 kernel</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每格是那一层矩阵乘的真实样子:上条是权重进显存的位宽,下条是激活进张量核的位宽,条长按 4、8、16 bit 等比画。</text>
<text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">紫 = 启动时的分派链;绿 = 按 checkpoint 设计的精度在低精度张量核上算;黄 = 卡上没有对口张量核,降级成只压权重。</text>
<rect x="30" y="100" width="186" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="42" y="121" font-size="13" fill="#111827" text-anchor="start" font-weight="700">方法名</text>
<text x="42" y="139" font-size="11" fill="#6b7280" text-anchor="start">checkpoint 自带或命令行给</text>
<line x1="219" y1="125.0" x2="240" y2="125.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="243" y="100" width="186" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="255" y="121" font-size="13" fill="#111827" text-anchor="start" font-weight="700">配置类</text>
<text x="255" y="139" font-size="11" fill="#6b7280" text-anchor="start">查算力下限与激活精度</text>
<line x1="432" y1="125.0" x2="453" y2="125.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="456" y="100" width="186" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="468" y="121" font-size="13" fill="#111827" text-anchor="start" font-weight="700">每层一个量化方法</text>
<text x="468" y="139" font-size="11" fill="#6b7280" text-anchor="start">建权重、整理、前向</text>
<line x1="645" y1="125.0" x2="666" y2="125.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="669" y="100" width="186" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="681" y="121" font-size="13" fill="#111827" text-anchor="start" font-weight="700">按格式查 kernel 表</text>
<text x="681" y="139" font-size="11" fill="#6b7280" text-anchor="start">每个平台一串先后</text>
<line x1="858" y1="125.0" x2="879" y2="125.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="882" y="100" width="186" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="894" y="121" font-size="13" fill="#111827" text-anchor="start" font-weight="700">第一个自报能跑的</text>
<text x="894" y="139" font-size="11" fill="#6b7280" text-anchor="start">卡能跑,形状粒度能做</text>
<text x="312" y="198" font-size="14" fill="#111827" text-anchor="start" font-weight="700">A100(SM80)</text>
<text x="312" y="216" font-size="11" fill="#6b7280" text-anchor="start">没有 FP8、FP4 张量核</text>
<text x="582" y="198" font-size="14" fill="#111827" text-anchor="start" font-weight="700">H100(SM90)</text>
<text x="582" y="216" font-size="11" fill="#6b7280" text-anchor="start">有 FP8,没有 FP4 张量核</text>
<text x="852" y="198" font-size="14" fill="#111827" text-anchor="start" font-weight="700">B200(SM100)</text>
<text x="852" y="216" font-size="11" fill="#6b7280" text-anchor="start">FP8 与 FP4 张量核都有</text>
