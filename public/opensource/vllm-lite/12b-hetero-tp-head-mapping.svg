<text x="546" y="400" font-size="11" fill="#6b7280" text-anchor="start">一张 D 卡读好几张 P 卡:</text>
<text x="546" y="416" font-size="11" fill="#6b7280" text-anchor="start">D 把自己每块的头那一段切成 2 份,</text>
<text x="546" y="432" font-size="11" fill="#6b7280" text-anchor="start">各从一张 P 卡读 1 段,拼齐 4 个头。</text>
<text x="546" y="464" font-size="11" fill="#9ca3af" text-anchor="start">P 的卡数多于 KV 头数时,相邻几张</text>
<text x="546" y="480" font-size="11" fill="#9ca3af" text-anchor="start">P 卡存的是同一个头,D 只读其中</text>
<text x="546" y="496" font-size="11" fill="#9ca3af" text-anchor="start">一张;普通的非 MLA 模型不许在这时</text>
<text x="546" y="512" font-size="11" fill="#9ca3af" text-anchor="start">让 D 的卡数更少(第六节)。</text>
<rect x="730" y="96" width="360" height="356" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="744" y="120" font-size="14" fill="#111827" text-anchor="start" font-weight="700">为什么非 MLA 模型要改块内排法</text>
<text x="744" y="140" font-size="11" fill="#6b7280" text-anchor="start">情形一里 P 卡 0 的一层一块,块内只画 4 个 token 位;</text>
<text x="744" y="156" font-size="11" fill="#6b7280" text-anchor="start">D 卡 0 要从中取头 0、头 1</text>
<text x="744" y="186" font-size="13" fill="#111827" text-anchor="start" font-weight="700">默认:token 在外、头在内</text>
<rect x="750" y="200" width="40" height="26" rx="3" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><line x1="770" y1="205" x2="770" y2="221" stroke="#d9877a" stroke-width="0.8"/>
<rect x="790" y="200" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><line x1="810" y1="205" x2="810" y2="221" stroke="#b9b9b9" stroke-width="0.8"/>
<text x="790" y="242" font-size="11" fill="#6b7280" text-anchor="middle">token 0</text>
<rect x="830" y="200" width="40" height="26" rx="3" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><line x1="850" y1="205" x2="850" y2="221" stroke="#d9877a" stroke-width="0.8"/>
<rect x="870" y="200" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><line x1="890" y1="205" x2="890" y2="221" stroke="#b9b9b9" stroke-width="0.8"/>
<text x="870" y="242" font-size="11" fill="#6b7280" text-anchor="middle">token 1</text>
<rect x="910" y="200" width="40" height="26" rx="3" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><line x1="930" y1="205" x2="930" y2="221" stroke="#d9877a" stroke-width="0.8"/>
<rect x="950" y="200" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><line x1="970" y1="205" x2="970" y2="221" stroke="#b9b9b9" stroke-width="0.8"/>
<text x="950" y="242" font-size="11" fill="#6b7280" text-anchor="middle">token 2</text>
<rect x="990" y="200" width="40" height="26" rx="3" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><line x1="1010" y1="205" x2="1010" y2="221" stroke="#d9877a" stroke-width="0.8"/>
<rect x="1030" y="200" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><line x1="1050" y1="205" x2="1050" y2="221" stroke="#b9b9b9" stroke-width="0.8"/>
<text x="1030" y="242" font-size="11" fill="#6b7280" text-anchor="middle">token 3</text>
<text x="744" y="266" font-size="11" fill="#6b7280" text-anchor="start">每个 token 位里 4 个头挨着放,头 0、头 1 在每个</text>
<text x="744" y="282" font-size="11" fill="#6b7280" text-anchor="start">token 位里各占一小截:一块拆成 4 段读,块越大越碎</text>
<text x="744" y="332" font-size="13" fill="#111827" text-anchor="start" font-weight="700">NIXL、Mooncake 改成:头在外、token 在内</text>
<rect x="750" y="346" width="80" height="26" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><line x1="770" y1="351" x2="770" y2="367" stroke="#5fa886" stroke-width="0.8"/><line x1="790" y1="351" x2="790" y2="367" stroke="#5fa886" stroke-width="0.8"/><line x1="810" y1="351" x2="810" y2="367" stroke="#5fa886" stroke-width="0.8"/>
<text x="790" y="388" font-size="11" fill="#6b7280" text-anchor="middle">头0</text>
