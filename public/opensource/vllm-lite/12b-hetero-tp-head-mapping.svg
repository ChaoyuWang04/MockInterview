<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">PD 两边 TP 不同时,D 的每张卡去 P 的哪几张卡读哪几个 KV 头</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">示意模型有 8 个 KV 头,两边 TP 差 2 倍,以默认的 NIXL 连接器为例。灰 = 某张卡上存的 KV 头,绿 = D 发起的一次连续读取,</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">红 = 换成 token 在外的块内排法后,同样几个头被拆成的碎片,紫 = MLA 模型各卡相同的那一份 KV;虚线框 = 一张卡。</text>
