<text x="546" y="164" font-size="11" fill="#6b7280" text-anchor="start">几张 D 卡读同一张 P 卡:</text>
<text x="546" y="180" font-size="11" fill="#6b7280" text-anchor="start">每张 D 卡按自己的序号在 P 卡的</text>
<text x="546" y="196" font-size="11" fill="#6b7280" text-anchor="start">每块里跳过前面几份头,只取属于</text>
<text x="546" y="212" font-size="11" fill="#6b7280" text-anchor="start">自己的那一份,每层每块读 1 段。</text>
<text x="546" y="236" font-size="11" fill="#6b7280" text-anchor="start">P 卡收齐 2 张 D 卡的通知才还块。</text>
<text x="546" y="264" font-size="11" fill="#9ca3af" text-anchor="start">TP 相同时是它的特例:1 张 D 卡</text>
<text x="546" y="280" font-size="11" fill="#9ca3af" text-anchor="start">整块读 1 张 P 卡。</text>
