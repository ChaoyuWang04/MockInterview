<text x="848" y="480" font-size="11" fill="#6b7280" text-anchor="start">状态大小和长度无关:只留最近 2 块;</text>
<text x="848" y="496" font-size="11" fill="#6b7280" text-anchor="start">不开前缀缓存时整条请求只有 1 块</text>
<text x="50" y="540" font-size="11" fill="#9ca3af" text-anchor="start">这条请求实际占 7 + 2 + 2 = 11 块;若三组都按全注意力记账,要 7 × 3 = 21 块。Mamba 混合模型的真实块大小会被抬高,这里只示意记账方式。</text>
