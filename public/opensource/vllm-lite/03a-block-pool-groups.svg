<rect x="518" y="154" width="38" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="537.0" y="176.68" font-size="13" fill="#6b7280" text-anchor="middle">11</text>
<rect x="560" y="154" width="38" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="579.0" y="176.68" font-size="13" fill="#111827" text-anchor="middle">12</text>
<rect x="602" y="154" width="38" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="621.0" y="176.68" font-size="13" fill="#6b7280" text-anchor="middle">13</text>
<rect x="644" y="154" width="38" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="663.0" y="176.68" font-size="13" fill="#6b7280" text-anchor="middle">14</text>
