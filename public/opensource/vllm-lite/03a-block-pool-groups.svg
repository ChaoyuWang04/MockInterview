<rect x="980" y="154" width="38" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="999.0" y="176.68" font-size="13" fill="#6b7280" text-anchor="middle">22</text>
<rect x="1022" y="154" width="38" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="1041.0" y="176.68" font-size="13" fill="#6b7280" text-anchor="middle">23</text>
<text x="56" y="212" font-size="11" fill="#9ca3af" text-anchor="start">灰块只是没人引用;它还池后原来的内容还在,下一条请求命中同样的前缀时可以直接拿回去(04 章)。</text>
<rect x="30" y="244" width="1060" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="46" y="268" font-size="14" fill="#111827" text-anchor="start" font-weight="700">同一条请求的三张块表</text>
<text x="46" y="286" font-size="11" fill="#6b7280" text-anchor="start">每组一张,格子按 token 位置排,每格 16 个 token;组内所有层共用这一张表</text>
<text x="325.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">0–15</text>
<text x="403.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">16–31</text>
<text x="481.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">32–47</text>
<text x="559.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">48–63</text>
<text x="637.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">64–79</text>
<text x="715.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">80–95</text>
<text x="793.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">96–111</text>
<text x="50" y="348" font-size="14" fill="#111827" text-anchor="start" font-weight="700">全注意力组</text>
<text x="50" y="366" font-size="11" fill="#6b7280" text-anchor="start">每个 token 都要看</text>
<rect x="290" y="332" width="70" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="325.0" y="356.68" font-size="13" fill="#111827" text-anchor="middle">3</text>
