<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="580" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一个块池,三类注意力层各记各的账</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">示意:块大小 16 个 token,这条请求已算到第 112 个 token,滑动窗口 32。每个格子里的数字是块号,块号相同就是同一段显存。</text>
<text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">绿 = 全注意力组的块,紫 = 滑窗组的块,黄 = Mamba 组的块,红 = 0 号空块(占位,不占实际容量),灰 = 空闲或别的请求在用。</text>
<rect x="30" y="96" width="1060" height="128" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="46" y="120" font-size="14" fill="#111827" text-anchor="start" font-weight="700">块池:启动时切好的 N 个等大的块</text>
<text x="46" y="138" font-size="11" fill="#6b7280" text-anchor="start">一块的字节数 = 组内层数 × 块大小 × 每层每 token 的字节数;所有组的这个数相同,所以任何一块都能发给任何一组</text>
<rect x="56" y="154" width="38" height="36" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="75.0" y="176.68" font-size="13" fill="#111827" text-anchor="middle">0</text>
