<rect x="524" y="398" width="70" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="559.0" y="422.68" font-size="13" fill="#111827" text-anchor="middle">0</text>
<rect x="602" y="398" width="70" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="637.0" y="422.68" font-size="13" fill="#111827" text-anchor="middle">0</text>
<rect x="680" y="398" width="70" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="715.0" y="422.68" font-size="13" fill="#111827" text-anchor="middle">9</text>
<rect x="758" y="398" width="70" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="793.0" y="422.68" font-size="13" fill="#111827" text-anchor="middle">20</text>
<text x="848" y="414" font-size="11" fill="#6b7280" text-anchor="start">窗口外的 5 格换成 0 号,</text>
<text x="848" y="430" font-size="11" fill="#6b7280" text-anchor="start">原来那 5 块当场还池</text>
<text x="50" y="480" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Mamba 组</text>
<text x="50" y="498" font-size="11" fill="#6b7280" text-anchor="start">每层只有一份定长状态</text>
<rect x="290" y="464" width="70" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="325.0" y="488.68" font-size="13" fill="#111827" text-anchor="middle">0</text>
