<text x="848" y="348" font-size="11" fill="#6b7280" text-anchor="start">7 块全留着,</text>
<text x="848" y="364" font-size="11" fill="#6b7280" text-anchor="start">请求结束才还池</text>
<text x="50" y="414" font-size="14" fill="#111827" text-anchor="start" font-weight="700">滑窗组</text>
<text x="50" y="432" font-size="11" fill="#6b7280" text-anchor="start">只看最近 32 个 token</text>
