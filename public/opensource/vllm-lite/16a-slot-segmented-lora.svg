<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一步前向怎么同时算 3 个适配器</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">一批 4 条请求共 10 个 token:R1 挂 sql、R3 挂 poem、R4 挂 chat,R2 不挂。GPU 上开 3 个槽,秩上限 16,隐藏维 4096。</text>
<text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">紫 = poem(槽 0),绿 = sql(槽 1,秩 8),黄 = chat(槽 2),灰 = 本步不走 LoRA,红 = 按秩上限补的零;虚线框 = 堆成一块的张量或 CPU 缓存。</text>
