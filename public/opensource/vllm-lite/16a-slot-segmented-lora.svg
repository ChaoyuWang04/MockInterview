<text x="30" y="218" font-size="11" fill="#9ca3af" text-anchor="start">排序只动下标,不搬 token;kernel 的第三维固定开「槽数 + 1」= 4 格,正好一格一段,读到「无」或空位的格子当场退出。</text>
<text x="30" y="250" font-size="14" fill="#111827" text-anchor="start" font-weight="700">③ 每段两次矩阵乘:按段读 A 的一格缩到秩 16,再按段读 B 的一格扩回 4096,加到底座这一层的输出上</text>
