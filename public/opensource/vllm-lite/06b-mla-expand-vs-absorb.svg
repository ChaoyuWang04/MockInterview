<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">MLA 的两条算法:展开成 128 个头各一份,还是 128 个头共用一份潜向量</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">DeepSeek V3 的维度;条的长度按维数成比例,背后叠着影子的是每个头各一份,没有影子的是全部头共用一份。</text>
<text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">绿 = cache 里存的潜向量,紫 = cache 里存的位置部分,黄 = 经上投影算出来的部分,灰 = query 自带的部分。</text>
<text x="44" y="126" font-size="14" fill="#111827" text-anchor="start" font-weight="700">cache 里每个 token 存的</text>
<rect x="260" y="104" width="204.8" height="34" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="362.4" y="126.0" font-size="12" fill="#111827" text-anchor="middle">潜向量 512 维</text>
<rect x="464.8" y="104" width="25.6" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="477.6" y="126.0" font-size="12" fill="#111827" text-anchor="middle">64</text>
<text x="506.4" y="126" font-size="11" fill="#6b7280" text-anchor="start">两条路径读的是同一份 cache,区别只在怎么算</text>
<rect x="24" y="162" width="1072" height="162" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="40" y="186" font-size="14" fill="#111827" text-anchor="start" font-weight="700">展开:prefill 用,省算力</text>
<text x="40" y="204" font-size="11" fill="#6b7280" text-anchor="start">先用上投影把历史潜向量还原成每个头的 K、V,再做普通多头注意力;还原要按历史长度乘一遍大矩阵</text>
<text x="44" y="230" font-size="13" fill="#111827" text-anchor="start" font-weight="700">Q · 128 个头各一份</text>
<rect x="59" y="241" width="76.80000000000001" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="54" y="246" width="76.80000000000001" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="49" y="251" width="76.80000000000001" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="44" y="256" width="51.2" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="69.6" y="278.0" font-size="12" fill="#111827" text-anchor="middle">128</text>
<rect x="95.2" y="256" width="25.6" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="108.0" y="278.0" font-size="12" fill="#111827" text-anchor="middle">64</text>
<text x="44" y="308" font-size="11" fill="#6b7280" text-anchor="start">QK 维 192</text>
<text x="420" y="230" font-size="13" fill="#111827" text-anchor="start" font-weight="700">K · 128 个头各一份</text>
<rect x="435" y="241" width="76.80000000000001" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="430" y="246" width="76.80000000000001" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="425" y="251" width="76.80000000000001" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="420" y="256" width="51.2" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="445.6" y="278.0" font-size="12" fill="#111827" text-anchor="middle">128</text>
<rect x="471.2" y="256" width="25.6" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="484.0" y="278.0" font-size="12" fill="#111827" text-anchor="middle">64</text>
<text x="420" y="308" font-size="11" fill="#6b7280" text-anchor="start">位置部分 64 维各头共用,复制到每个头</text>
<text x="800" y="230" font-size="13" fill="#111827" text-anchor="start" font-weight="700">V · 128 个头各一份</text>
<rect x="815" y="241" width="51.2" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="810" y="246" width="51.2" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="805" y="251" width="51.2" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="800" y="256" width="51.2" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="825.6" y="278.0" font-size="12" fill="#111827" text-anchor="middle">128</text>
<text x="800" y="308" font-size="11" fill="#6b7280" text-anchor="start">V 维 128</text>
<rect x="24" y="340" width="1072" height="162" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="40" y="364" font-size="14" fill="#111827" text-anchor="start" font-weight="700">吸收:decode 用,省带宽</text>
<text x="40" y="382" font-size="11" fill="#6b7280" text-anchor="start">把 K 的上投影提前乘进 query,直接拿潜向量当 K 和 V;每次点积长了 3 倍,但 KV 只读 1 份</text>
<text x="44" y="408" font-size="13" fill="#111827" text-anchor="start" font-weight="700">Q · 128 个头各一份</text>
<rect x="59" y="419" width="230.4" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="54" y="424" width="230.4" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="49" y="429" width="230.4" height="34" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
<rect x="44" y="434" width="204.8" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="146.4" y="456.0" font-size="12" fill="#111827" text-anchor="middle">512</text>
<rect x="248.8" y="434" width="25.6" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="261.6" y="456.0" font-size="12" fill="#111827" text-anchor="middle">64</text>
<text x="44" y="486" font-size="11" fill="#6b7280" text-anchor="start">QK 维 576</text>
<text x="420" y="408" font-size="13" fill="#111827" text-anchor="start" font-weight="700">K · 128 个头共用</text>
<rect x="420" y="434" width="204.8" height="34" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="522.4" y="456.0" font-size="12" fill="#111827" text-anchor="middle">潜向量 512</text>
<rect x="624.8" y="434" width="25.6" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="637.5999999999999" y="456.0" font-size="12" fill="#111827" text-anchor="middle">64</text>
<text x="420" y="486" font-size="11" fill="#6b7280" text-anchor="start">形状就是 MQA</text>
<text x="800" y="408" font-size="13" fill="#111827" text-anchor="start" font-weight="700">V · 128 个头共用</text>
<rect x="800" y="434" width="204.8" height="34" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="902.4" y="456.0" font-size="12" fill="#111827" text-anchor="middle">同一份潜向量 512</text>
<text x="800" y="486" font-size="11" fill="#6b7280" text-anchor="start">V 维 512;输出再乘 V 的上投影回到 128</text>
<rect x="24" y="518" width="1072" height="162" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="40" y="542" font-size="14" fill="#111827" text-anchor="start" font-weight="700">同一批在 MLA 层里按 token 切成前后两段,两段各用一个后端</text>
<text x="40" y="560" font-size="11" fill="#6b7280" text-anchor="start">示意:ModelRunner 已把短请求排在批的前面(07 章);「多短算 decode」由主后端定</text>
<rect x="44" y="576" width="412" height="34" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<text x="250.0" y="598" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前段:decode 与 query 足够短的请求</text>
<rect x="456" y="576" width="620" height="34" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<text x="766.0" y="598" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">后段:其余请求的 prefill token</text>
<line x1="250.0" y1="610" x2="250.0" y2="632" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="766.0" y1="610" x2="766.0" y2="632" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="52" y="650" font-size="12" fill="#111827" text-anchor="start" font-weight="700">走吸收 · 主后端:平台候选表选出来的那一个</text>
<text x="52" y="668" font-size="11" fill="#6b7280" text-anchor="start">FlashAttention MLA:query ≤ 512 算 decode;FlashMLA:≤ 128 且要等长</text>
<text x="464" y="650" font-size="12" fill="#111827" text-anchor="start" font-weight="700">走展开 · 另有一张 prefill 候选表单独选</text>
<text x="464" y="668" font-size="11" fill="#6b7280" text-anchor="start">Hopper 及更早只有 FlashAttention;历史按 65536 个 token 的工作区分块还原,再按 log-sum-exp 合并</text>
</svg>