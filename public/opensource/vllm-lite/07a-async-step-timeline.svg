<text x="281" y="340" font-size="11" fill="#6b7280" text-anchor="start">② 排第 2 步时第 1 步还没采样:请求 r 只记「多了 1 个占位」,不知道它的值</text>
<line x1="390" y1="372" x2="390" y2="358" stroke="#9ca3af" stroke-width="1.4"/>
<text x="386" y="356" font-size="11" fill="#6b7280" text-anchor="start">③ 第 1 步结果拷回后,调度器用真值换掉占位、判结束;这时第 2 步已在 GPU 上</text>
<polyline points="350,488 350,504 390,504 390,490" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="346" y="522" font-size="11" fill="#6b7280" text-anchor="start">① 第 1 步采样把 token 写进 r 在持久状态表里的那一行;第 2 步前向开头由 GPU 按本步顺序读出来当输入,不经 CPU</text>
<text x="210" y="544" font-size="11" fill="#9ca3af" text-anchor="start">同样长的时间里 GPU 跑了 7 步,步与步之间没有空档;只要「收 + 调度 + 准备」比一步前向短,CPU 的时间全被藏住。</text>
<line x1="30" y1="572" x2="1090" y2="572" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="30" y="596" font-size="11" fill="#9ca3af" text-anchor="start">迟到的输出:r 在第 N 步采出结束符时,第 N+1 步已经发出,那 1 个 token 照算,收结果时发现请求已结束就丢掉;</text>
<text x="30" y="614" font-size="11" fill="#9ca3af" text-anchor="start">r 在两步之间被抢占时,在路上那一步的 token 回来照样记进请求,但不动已清零的计数,等它回来之后 r 才能重新排队。</text>
