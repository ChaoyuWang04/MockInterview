<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">异步调度:第 N+1 步的调度与输入准备藏进第 N 步的前向,采样出的 token 不经 CPU 直接喂给下一步</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = 调度一步,黄 = 准备输入并排进 GPU 流,绿 = GPU 前向加采样,灰 = 结果拷回 CPU 与调度器收结果,红虚框 = GPU 空等。</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">上下两半用同一条时间轴、同样的每段耗时画,横向长度就是时长;各段长短是示意比例,不是实测。</text>
<text x="30" y="112" font-size="14" fill="#111827" text-anchor="start" font-weight="700">上:异步调度关掉时,一步一步串着走</text>
<text x="30" y="130" font-size="11" fill="#6b7280" text-anchor="start">CPU 收完第 N 步的结果才开始排第 N+1 步;这段时间 GPU 什么也不干。</text>
