<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" width="1120" height="690" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="690" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">vLLM KV 下放:块什么时候写出去、命中时怎么拉回来</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每一列是 1 步。绿 = GPU 前向,黄 = GPU 与 CPU 之间的拷贝(单独的拷贝流),紫 = 磁盘读写(EngineCore 里的 I/O 线程),</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">灰 = CPU 里已占槽但还在写、查不到,白 = CPU 里可命中,红 = B 不在这一步的批里。</text>
<text x="30" y="110" font-size="14" fill="#111827" text-anchor="start" font-weight="700">上:写出。请求 A 的 prompt 4096 token 分两步算完,之后 decode</text>
<text x="30" y="128" font-size="11" fill="#6b7280" text-anchor="start">每步算完的满块在调度时登记,下一步前向发出之前才提交拷贝;16 token 一块,每步 2048 token 就是 128 块。</text>
<line x1="200" y1="164" x2="200" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="376" y1="164" x2="376" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="552" y1="164" x2="552" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="728" y1="164" x2="728" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="904" y1="164" x2="904" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="1080" y1="164" x2="1080" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="288.0" y="156" font-size="12" fill="#6b7280" text-anchor="middle">第 1 步</text>
<text x="464.0" y="156" font-size="12" fill="#6b7280" text-anchor="middle">第 2 步</text>
<text x="640.0" y="156" font-size="12" fill="#6b7280" text-anchor="middle">第 3 步</text>
<text x="816.0" y="156" font-size="12" fill="#6b7280" text-anchor="middle">第 4 步</text>
<text x="992.0" y="156" font-size="12" fill="#6b7280" text-anchor="middle">第 5 步</text>
<text x="30" y="183" font-size="13" fill="#111827" text-anchor="start" font-weight="700">GPU 计算流</text>
<rect x="204" y="164" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="288.0" y="183.32" font-size="12" fill="#111827" text-anchor="middle">A 的前 2048 token</text>
<rect x="380" y="164" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="464.0" y="183.32" font-size="12" fill="#111827" text-anchor="middle">A 的后 2048 token</text>
<rect x="556" y="164" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="640.0" y="183.32" font-size="12" fill="#111827" text-anchor="middle">A decode</text>
<rect x="732" y="164" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="816.0" y="183.32" font-size="12" fill="#111827" text-anchor="middle">A decode</text>
<rect x="908" y="164" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="992.0" y="183.32" font-size="12" fill="#111827" text-anchor="middle">A 最后一个 token</text>
<text x="30" y="221" font-size="13" fill="#111827" text-anchor="start" font-weight="700">拷贝流</text>
<text x="30" y="236" font-size="11" fill="#6b7280" text-anchor="start">GPU → CPU</text>
<rect x="380" y="208" width="112" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="436.0" y="227.32" font-size="12" fill="#111827" text-anchor="middle">写出 128 块</text>
<rect x="556" y="208" width="112" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="612.0" y="227.32" font-size="12" fill="#111827" text-anchor="middle">写出 128 块</text>
<text x="736" y="227.5" font-size="11" fill="#9ca3af" text-anchor="start">decode 的块默认不写</text>
<polyline points="372,194 372,223 379,223" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="548,194 548,223 555,223" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="271" font-size="13" fill="#111827" text-anchor="start" font-weight="700">CPU 层</text>
<rect x="380" y="252" width="112" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="436.0" y="270.96" font-size="11" fill="#6b7280" text-anchor="middle">写入中,查不到</text>
<rect x="496" y="252" width="52" height="30" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<text x="522.0" y="270.96" font-size="11" fill="#111827" text-anchor="middle">128 块</text>
<rect x="556" y="252" width="112" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="612.0" y="270.96" font-size="11" fill="#6b7280" text-anchor="middle">写入中,查不到</text>
<rect x="672" y="252" width="404" height="30" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<text x="874.0" y="271.32" font-size="12" fill="#111827" text-anchor="middle">256 块都可命中,按 LRU 等着被挤</text>
<text x="30" y="309" font-size="13" fill="#111827" text-anchor="start" font-weight="700">磁盘层</text>
<text x="30" y="324" font-size="11" fill="#6b7280" text-anchor="start">多层时才有</text>
<rect x="612" y="296" width="236" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="730.0" y="314.96" font-size="11" fill="#111827" text-anchor="middle">写线程把 CPU 里写好的块抄成文件</text>
<rect x="854" y="296" width="168" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="938.0" y="314.96" font-size="11" fill="#111827" text-anchor="middle">第二批 128 块</text>
<text x="30" y="372" font-size="11" fill="#9ca3af" text-anchor="start">A 在第 5 步结束:GPU 块照常还池,不等写完;要是还没拷完就被分给别人,下一步前向开始前先同步等拷完。</text>
<line x1="30" y1="390" x2="1090" y2="390" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="30" y="416" font-size="14" fill="#111827" text-anchor="start" font-weight="700">下:拉回。请求 B 带着同一段 4096 token 前缀进来,GPU 里这段早被挤掉</text>
<text x="30" y="434" font-size="11" fill="#6b7280" text-anchor="start">查找从 GPU 命中处往后逐块问 CPU;CPU 没有才问下层。别的请求每一步照常前向,图上不画。</text>
<line x1="200" y1="470" x2="200" y2="660" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="376" y1="470" x2="376" y2="660" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="552" y1="470" x2="552" y2="660" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="728" y1="470" x2="728" y2="660" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="904" y1="470" x2="904" y2="660" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="1080" y1="470" x2="1080" y2="660" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="288.0" y="462" font-size="12" fill="#6b7280" text-anchor="middle">第 M 步</text>
<text x="464.0" y="462" font-size="12" fill="#6b7280" text-anchor="middle">第 M+1 步</text>
<text x="640.0" y="462" font-size="12" fill="#6b7280" text-anchor="middle">第 M+2 步</text>
<text x="816.0" y="462" font-size="12" fill="#6b7280" text-anchor="middle">第 M+3 步</text>
<text x="992.0" y="462" font-size="12" fill="#6b7280" text-anchor="middle">第 M+4 步</text>
<text x="30" y="483" font-size="13" fill="#111827" text-anchor="start" font-weight="700">CPU 命中</text>
<text x="30" y="498" font-size="11" fill="#6b7280" text-anchor="start">B 在哪</text>
<rect x="204" y="470" width="168" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="288.0" y="488.96" font-size="11" fill="#111827" text-anchor="middle">命中 256 块,分好块</text>
<rect x="380" y="470" width="168" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="464.0" y="488.96" font-size="11" fill="#111827" text-anchor="middle">门外等拷完</text>
<rect x="556" y="470" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="640.0" y="488.96" font-size="11" fill="#111827" text-anchor="middle">进批,只算剩下的</text>
<text x="30" y="527" font-size="11" fill="#6b7280" text-anchor="start">搬运</text>
<rect x="380" y="508" width="168" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="464.0" y="526.96" font-size="11" fill="#111827" text-anchor="middle">CPU → GPU 256 块</text>
<polyline points="366,500 366,523 379,523" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="577" font-size="13" fill="#111827" text-anchor="start" font-weight="700">只在磁盘</text>
<text x="30" y="592" font-size="11" fill="#6b7280" text-anchor="start">B 在哪</text>
<rect x="204" y="564" width="168" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="288.0" y="582.96" font-size="11" fill="#111827" text-anchor="middle">在不在还没查完,排着</text>
<rect x="380" y="564" width="168" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="464.0" y="582.96" font-size="11" fill="#111827" text-anchor="middle">读回 CPU 中,排着</text>
<rect x="556" y="564" width="168" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="640.0" y="582.96" font-size="11" fill="#111827" text-anchor="middle">CPU 命中,分好块</text>
<rect x="732" y="564" width="168" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<text x="816.0" y="582.96" font-size="11" fill="#111827" text-anchor="middle">门外等拷完</text>
<rect x="908" y="564" width="168" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="992.0" y="582.96" font-size="11" fill="#111827" text-anchor="middle">进批,只算剩下的</text>
<text x="30" y="621" font-size="11" fill="#6b7280" text-anchor="start">搬运</text>
<rect x="204" y="602" width="168" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="288.0" y="620.96" font-size="11" fill="#111827" text-anchor="middle">后台线程查文件在不在</text>
<rect x="380" y="602" width="168" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="464.0" y="620.96" font-size="11" fill="#111827" text-anchor="middle">读线程读 256 个文件进 CPU</text>
<rect x="732" y="602" width="168" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="816.0" y="620.96" font-size="11" fill="#111827" text-anchor="middle">CPU → GPU 256 块</text>
<text x="30" y="682" font-size="11" fill="#9ca3af" text-anchor="start">画的是最快的情况:拷完的消息要回到调度器才生效,开着异步调度时每一环可能再晚 1 步。块大小与 128、256 这些数按默认 16 token 一块算。</text>
</svg>