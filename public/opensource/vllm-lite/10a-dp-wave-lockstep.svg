<text x="764" y="168" font-size="11" fill="#111827" text-anchor="start">④ 收到「波次结束」,转告各 API 进程</text>
<line x1="978" y1="152" x2="978" y2="128" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#arp)"/>
<text x="972" y="116" font-size="11" fill="#6b7280" text-anchor="end">此后新请求会再走 ①</text>
<text x="30" y="468" font-size="11" fill="#9ca3af" text-anchor="start">每一步前向之前,各副本还要在 CPU 上交换一次本步的 token 数,按最大值补齐 CUDA graph 形状;所以空转批虽只有 1 个 token,走图时会被补到和最忙的副本一样大。</text>
<text x="30" y="486" font-size="11" fill="#9ca3af" text-anchor="start">第 28 到 32 步所有请求都已结束,各副本仍要空转到下一个同步步才能停;同步间隔越大,尾巴越长,同步开销越小。</text>
<text x="30" y="504" font-size="11" fill="#9ca3af" text-anchor="start">稠密模型不走这一套:各副本的引擎按单副本启动、各跑各的,协调进程只汇总各副本负载供 API 进程挑选。</text>
</svg>