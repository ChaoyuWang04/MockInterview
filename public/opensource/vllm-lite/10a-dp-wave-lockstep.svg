<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">MoE 模型开 4 个数据并行副本:一个请求波次里,有活的跑真批,没活的陪跑空转批</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = 跑真批,灰 = 跑空转批,黄框 = 全组 all-reduce「谁还有活」的同步步,紫线 = 和协调进程之间的消息;</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">白色虚线框 = 暂停,引擎阻塞等消息、不占 GPU。每格是一步,步数是示意,同步间隔取默认的 16 步。</text>
