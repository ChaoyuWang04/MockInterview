<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker></defs>
<rect x="0" y="0" width="1120" height="590" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">vLLM 的三类进程,与一条流式请求走过的站</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = API 进程里的站,绿 = EngineCore 进程里的站,灰 = GPU worker 进程里的站,红虚线 = 判到停止串后反向叫停;虚线框 = 进程边界。</text>
<rect x="140" y="84" width="290" height="450" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="154" y="106" font-size="14" fill="#111827" text-anchor="start" font-weight="700">API 进程</text>
<text x="154" y="124" font-size="11" fill="#6b7280" text-anchor="start">vllm serve 本身;DP 时默认每个副本一个</text>
<rect x="500" y="84" width="290" height="450" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="514" y="106" font-size="14" fill="#111827" text-anchor="start" font-weight="700">EngineCore 进程</text>
<text x="514" y="124" font-size="11" fill="#6b7280" text-anchor="start">每个 DP 副本一个;没活时阻塞等消息</text>
<rect x="860" y="84" width="236" height="450" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="874" y="106" font-size="14" fill="#111827" text-anchor="start" font-weight="700">GPU worker 进程</text>
<text x="874" y="124" font-size="11" fill="#6b7280" text-anchor="start">每张卡一个,收同一份调度结果</text>
<rect x="160" y="136" width="250" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="172" y="158" font-size="14" fill="#111827" text-anchor="start" font-weight="700">① 收请求、套聊天模板</text>
<text x="172" y="177" font-size="11" fill="#6b7280" text-anchor="start">在 asyncio 事件循环上</text>
<rect x="160" y="212" width="250" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="172" y="234" font-size="14" fill="#111827" text-anchor="start" font-weight="700">② 切词</text>
<text x="172" y="253" font-size="11" fill="#6b7280" text-anchor="start">挪到线程池做,默认只有 1 个线程</text>
<rect x="160" y="380" width="250" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="172" y="402" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑧ 增量反切词、判停止串</text>
<text x="172" y="421" font-size="11" fill="#6b7280" text-anchor="start">每 128 条请求的输出让一次事件循环</text>
<rect x="160" y="456" width="250" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="172" y="478" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑨ 写 SSE 推给客户端</text>
<text x="172" y="497" font-size="11" fill="#6b7280" text-anchor="start">每条请求一个待取槽,新内容就地合并</text>
<rect x="520" y="136" width="250" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="532" y="158" font-size="14" fill="#111827" text-anchor="start" font-weight="700">③ 输入线程:收包、解包</text>
<text x="532" y="177" font-size="11" fill="#6b7280" text-anchor="start">msgpack;大张量走单独的帧,不拷贝</text>
<rect x="520" y="212" width="250" height="140" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="532" y="234" font-size="14" fill="#111827" text-anchor="start" font-weight="700">④ 主循环:调度一步</text>
<text x="532" y="253" font-size="11" fill="#6b7280" text-anchor="start">给这一步挑请求、定每条算几个 token</text>
<text x="532" y="269" font-size="11" fill="#6b7280" text-anchor="start">分配 KV 块,再把这一批交给 worker</text>
<text x="532" y="285" font-size="11" fill="#6b7280" text-anchor="start">收回新 token,判 EOS 与长度上限</text>
<text x="532" y="301" font-size="11" fill="#6b7280" text-anchor="start">主循环从不碰套接字</text>
<rect x="520" y="380" width="250" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="532" y="402" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑦ 输出线程:打包、发回</text>
<text x="532" y="421" font-size="11" fill="#6b7280" text-anchor="start">和下一步的 GPU 计算重叠</text>
<rect x="880" y="212" width="196" height="58" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="892" y="234" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑤ 前向 + 采样</text>
<text x="892" y="253" font-size="11" fill="#6b7280" text-anchor="start">每张卡算自己那一份</text>
<rect x="880" y="294" width="196" height="58" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="892" y="316" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑥ 只有一个 rank 交回</text>
<text x="892" y="335" font-size="11" fill="#6b7280" text-anchor="start">这一步各请求的新 token 编号</text>
<text x="880" y="390" font-size="11" fill="#9ca3af" text-anchor="start">单卡时没有这个进程:</text>
<text x="880" y="406" font-size="11" fill="#9ca3af" text-anchor="start">worker 就跑在 EngineCore 进程里,</text>
<text x="880" y="422" font-size="11" fill="#9ca3af" text-anchor="start">④ 到 ⑤ 变成进程内调用</text>
<rect x="24" y="143" width="92" height="44" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="70.0" y="169.68" font-size="13" fill="#111827" text-anchor="middle">客户端</text>
<line x1="116" y1="165" x2="160" y2="165" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="160,485 70,485 70,187" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="76" y="330" font-size="11" fill="#6b7280" text-anchor="start">SSE</text>
<line x1="285.0" y1="194" x2="285.0" y2="212" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="410,241 465,241 465,165 520,165" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="470" y="194" font-size="11" fill="#6b7280" text-anchor="start">ZMQ</text>
<line x1="645.0" y1="194" x2="645.0" y2="212" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="770" y1="241" x2="880" y2="241" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="825.0" y="233" font-size="11" fill="#6b7280" text-anchor="middle">共享内存</text>
<line x1="880" y1="323" x2="770" y2="323" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="645.0" y1="352" x2="645.0" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="520" y1="409" x2="410" y2="409" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="465" y="401" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ</text>
<polyline points="410,430 480,430 480,332 520,332" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<line x1="285.0" y1="438" x2="285.0" y2="456" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="562" font-size="11" fill="#9ca3af" text-anchor="start">decode 阶段 ④ 到 ⑧ 每步走一遍;默认开着异步调度,GPU 算这一步时 ④ 已经在调度下一步(07 章)。</text>
<text x="30" y="578" font-size="11" fill="#9ca3af" text-anchor="start">判到停止串的叫停送达之前,引擎照常往下算,多出的 token 在 API 进程丢掉。</text>
</svg>