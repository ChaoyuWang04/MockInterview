<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一层 MoE 在 4 卡专家并行下怎么走:路由 → 分发 → 专家计算 → 合并</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = token(字母是它出身的卡:a 在卡 0、b 在卡 1 …),绿 = 计算,黄 = 跨卡通信,红 = 热专家;虚线框 = 一张卡。</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">每卡放 2 个专家,每个 token 选 2 个(DeepSeek-V3 是 256 个里选 8 个)。路由是示意,E1 被故意做热。</text>
