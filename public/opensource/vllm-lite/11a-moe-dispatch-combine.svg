<text x="962" y="522" font-size="13" fill="#111827" text-anchor="start" font-weight="700">共享专家</text>
<text x="962" y="540" font-size="11" fill="#6b7280" text-anchor="start">本卡自己算,不过网</text>
<text x="30" y="608" font-size="11" fill="#9ca3af" text-anchor="start">卡 0 同时放着热专家 E1,这一层它要算 7 份活、卡 1 只有 2 份;两次 all-to-all 都是集合通信,整层要等卡 0 算完。EPLB 给 E1 在别的卡上多放一份副本。</text>
<text x="30" y="626" font-size="11" fill="#9ca3af" text-anchor="start">同一张卡上的两个专家都被选中时只发一份(a1 → 卡 0)。默认后端不这样发:分发换成 all-gather,每张卡收下全部 8 个 token,合并换成 reduce-scatter。</text>
<text x="30" y="644" font-size="11" fill="#9ca3af" text-anchor="start">共享专家不经过两次通信。DeepEP 两种模式、DeepEP v2、NIXL EP 这几个异步后端,在合并的通信还在网上时就开算共享专家,把 SM 空等的那段填上。</text>
