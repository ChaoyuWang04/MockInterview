<text x="308" y="350" font-size="12" fill="#6b7280" text-anchor="start">同步点很快到齐,所有 rank 的 decode 用户不受影响;新 prefill 下一步再说</text>
<line x1="30" y1="432" x2="1090" y2="432" stroke="#e5e7eb"/>
<text x="30" y="462" font-size="15" fill="#111827" text-anchor="start" font-weight="700">③ 再往前一步:同样的 prefill 量,散在各步会拉长每一步,集中到相同的步只拉长那几步</text>
