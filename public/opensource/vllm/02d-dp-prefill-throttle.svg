<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">DP 下的 prefill 节流与对齐:一个 rank 拉进大 prefill,其他 rank 只能陪等</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">专家并行时每一步所有 rank 要在专家层同步点会合,这一步的长度由最慢的 rank 决定。绿 = decode,黄 = prefill,灰 = 干等或被拉长的步。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 不节流:rank 2 拉进一个 2048 token 的新 prefill,其他三个 rank 陪等</text>
<text x="120" y="126.0" font-size="13" fill="#6b7280" text-anchor="end">rank 0</text>
<rect x="130" y="108" width="107" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="183.5" y="125.32" font-size="12" fill="#111827" text-anchor="middle">decode</text>
