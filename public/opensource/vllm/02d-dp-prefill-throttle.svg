<text x="120" y="194.0" font-size="13" fill="#6b7280" text-anchor="end">rank 2</text>
<rect x="130" y="176" width="487" height="26" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="373.5" y="193.32" font-size="12" fill="#111827" text-anchor="middle">decode + 新 prefill 2048</text>
<text x="120" y="228.0" font-size="13" fill="#6b7280" text-anchor="end">rank 3</text>
<rect x="130" y="210" width="107" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="183.5" y="227.32" font-size="12" fill="#111827" text-anchor="middle">decode</text>
