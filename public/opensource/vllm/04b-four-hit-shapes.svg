<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一个 prompt 的四种命中形状:绿色都从最左边开始,区别只是绿色在哪里停</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">竖线 = 物理块边界;绿 = 命中前缀,红 = 要算的,黄 = 前半共享、后半要写自己 token 的那一块。</text>
<text x="178" y="124" font-size="12" fill="#6b7280" text-anchor="end">全命中</text>
<rect x="190" y="100" width="853.6" height="40" rx="0" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="1043.6" y="100" width="26.4" height="40" rx="0" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<line x1="410.0" y1="96" x2="410.0" y2="144" stroke="#111827" stroke-width="1.5"/>
<line x1="630.0" y1="96" x2="630.0" y2="144" stroke="#111827" stroke-width="1.5"/>
<line x1="850.0" y1="96" x2="850.0" y2="144" stroke="#111827" stroke-width="1.5"/>
<text x="190" y="162" font-size="11" fill="#6b7280" text-anchor="start">从 0 到倒数第二个 token 全部匹配,只算最后一块里的尾巴(最后一个 token 永远命不中,1.6)</text>
<text x="178" y="220" font-size="12" fill="#6b7280" text-anchor="end">块对齐部分命中</text>
<rect x="190" y="196" width="440.0" height="40" rx="0" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="630.0" y="196" width="440.0" height="40" rx="0" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<line x1="410.0" y1="192" x2="410.0" y2="240" stroke="#111827" stroke-width="1.5"/>
<line x1="630.0" y1="192" x2="630.0" y2="240" stroke="#111827" stroke-width="1.5"/>
<line x1="850.0" y1="192" x2="850.0" y2="240" stroke="#111827" stroke-width="1.5"/>
<text x="190" y="258" font-size="11" fill="#6b7280" text-anchor="start">从 0 开始匹配,终点正好在第 2 块的末尾;后面整块整块地分配、prefill</text>
<text x="178" y="316" font-size="12" fill="#6b7280" text-anchor="end">sub-block 部分命中</text>
<rect x="190" y="292" width="539.0" height="40" rx="0" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="729.0" y="292" width="121.00000000000001" height="40" rx="0" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="850.0" y="292" width="220.0" height="40" rx="0" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<line x1="410.0" y1="288" x2="410.0" y2="336" stroke="#111827" stroke-width="1.5"/>
<line x1="630.0" y1="288" x2="630.0" y2="336" stroke="#111827" stroke-width="1.5"/>
<line x1="850.0" y1="288" x2="850.0" y2="336" stroke="#111827" stroke-width="1.5"/>
<text x="190" y="354" font-size="11" fill="#6b7280" text-anchor="start">还是从 0 开始匹配,但终点落在第 3 块的中间:第 3 块前半共享、后半(黄)要写自己的 token(2.2 讲为什么必须复制)</text>
<text x="178" y="412" font-size="12" fill="#6b7280" text-anchor="end">未命中</text>
<rect x="190" y="388" width="880.0" height="40" rx="0" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<line x1="410.0" y1="384" x2="410.0" y2="432" stroke="#111827" stroke-width="1.5"/>
<line x1="630.0" y1="384" x2="630.0" y2="432" stroke="#111827" stroke-width="1.5"/>
<line x1="850.0" y1="384" x2="850.0" y2="432" stroke="#111827" stroke-width="1.5"/>
<text x="190" y="450" font-size="11" fill="#6b7280" text-anchor="start">第 1 块的 hash 就对不上,链断在开头,全量 prefill</text>
<text x="30" y="496" font-size="12" fill="#6b7280" text-anchor="start">四种情况绿色都从最左边开始 —— 链式 hash 保证的(1.2);区别只是绿色在哪里停</text>
</svg>