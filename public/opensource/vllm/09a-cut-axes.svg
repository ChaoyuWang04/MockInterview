<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>六种并行各切哪一维:TP 沿 hidden 维竖切、SP 与 CP 沿 seq 维横切,两条切线互相垂直;EP 切的是专家集合而不是张量的某一维;PP 的切口在层与层之间;DP 把整张图复制若干份。切线的方向标记被切的轴,切口所在的框层级标记作用的尺度。</title>
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">六种并行,各切哪一维</text>
  <text x="40" y="62" font-size="13" fill="#64748b">切线的方向 = 被切的轴　　切口所在的框 = 作用的尺度</text>

  <!-- DP:外层复制 -->
  <rect x="58" y="92" width="1028" height="502" rx="8" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="49" y="101" width="1028" height="502" rx="8" fill="none" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="40" y="110" width="1028" height="502" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="58" y="134" font-size="13" font-weight="700" fill="#7c3aed">DP · 整张图复制 N 份</text>
  <text x="196" y="134" font-size="12" fill="#64748b">副本之间几乎不通信;切口在整个模型之外</text>

  <!-- 左:模型 = 层的栈,PP 横切 -->
  <rect x="72" y="158" width="352" height="430" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="88" y="182" font-size="13" font-weight="700" fill="#334155">模型 = 层的栈</text>

  <rect x="92" y="200" width="200" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="92" y="242" width="200" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="92" y="284" width="200" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="92" y="340" width="200" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="92" y="382" width="200" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="92" y="424" width="200" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>

  <text x="106" y="222" font-size="11" fill="#475569">layer 0</text>
  <text x="106" y="264" font-size="11" fill="#475569">layer 1</text>
  <text x="106" y="306" font-size="11" fill="#475569">layer 2</text>
  <text x="106" y="362" font-size="11" fill="#475569">layer k</text>
  <text x="106" y="404" font-size="11" fill="#475569">layer k+1</text>
  <text x="106" y="446" font-size="11" fill="#475569">layer k+2</text>

  <line x1="80" y1="329" x2="412" y2="329" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="304" y="321" font-size="12" font-weight="700" fill="#dc2626">PP</text>
  <text x="304" y="347" font-size="11" fill="#dc2626">在层之间切</text>

  <text x="92" y="492" font-size="11" fill="#64748b">段间传的是隐状态,点对点收发,</text>
  <text x="92" y="510" font-size="11" fill="#64748b">不是集合通信</text>

  <!-- 放大指引 -->
  <line x1="292" y1="357" x2="470" y2="244" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="292" y1="357" x2="470" y2="560" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="330" y="556" font-size="11" fill="#94a3b8">放大一层</text>

  <!-- 右:层内 -->
  <rect x="470" y="236" width="586" height="336" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="486" y="226" font-size="13" font-weight="700" fill="#334155">层内:同一层里,三种并行切三个不同的东西</text>

  <!-- 第一带:EP 切专家集合 -->
  <text x="486" y="268" font-size="11" fill="#475569">MoE 专家集合</text>
  <rect x="620" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="646" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="672" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="698" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="732" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="758" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="784" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="810" y="252" width="22" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <line x1="726" y1="244" x2="726" y2="280" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="866" y="258" font-size="12" font-weight="700" fill="#d97706">EP</text>
  <text x="866" y="275" font-size="11" fill="#d97706">按集合切,不切张量</text>

  <!-- 第二带:激活张量,TP 竖切 / SP·CP 横切 -->
  <text x="740" y="296" font-size="11" fill="#475569">一层的激活张量</text>
  <rect x="540" y="306" width="300" height="180" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>

  <line x1="615" y1="300" x2="615" y2="492" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="690" y1="300" x2="690" y2="492" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="765" y1="300" x2="765" y2="492" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 4"/>

  <line x1="534" y1="351" x2="846" y2="351" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="534" y1="396" x2="846" y2="396" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="534" y1="441" x2="846" y2="441" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 4"/>

  <text x="540" y="510" font-size="11" fill="#475569">hidden 维</text>
  <line x1="606" y1="506" x2="840" y2="506" stroke="#94a3b8" stroke-width="1"/>
  <text x="486" y="402" font-size="11" fill="#475569">seq</text>
  <text x="486" y="418" font-size="11" fill="#475569">维</text>
  <line x1="518" y1="312" x2="518" y2="480" stroke="#94a3b8" stroke-width="1"/>

  <text x="866" y="320" font-size="12" font-weight="700" fill="#2563eb">TP</text>
  <text x="866" y="337" font-size="11" fill="#2563eb">沿 hidden 维竖切</text>
  <text x="866" y="354" font-size="11" fill="#64748b">切的是权重矩阵</text>

  <text x="866" y="394" font-size="12" font-weight="700" fill="#059669">SP / CP</text>
  <text x="866" y="411" font-size="11" fill="#059669">沿 seq 维横切</text>
  <text x="866" y="428" font-size="11" fill="#64748b">切的是序列上的位置</text>

  <text x="540" y="542" font-size="12" font-weight="700" fill="#0f172a">两条切线互相垂直 —— 它们切的本来就是两个不同的轴</text>
  <text x="540" y="562" font-size="11" fill="#64748b">执行时 TP 区与 SP 区交替出现,不是同时切</text>

  <text x="40" y="628" font-size="11" fill="#64748b">同一根 seq 轴上有三个不同的张量:SP 切层间激活、PCP 切 prefill 的序列、DCP 切 KV cache 的 token 位置。EP 的规模不是独立旋钮,它等于 TP 乘 DP 乘 PCP。</text>
</svg>
