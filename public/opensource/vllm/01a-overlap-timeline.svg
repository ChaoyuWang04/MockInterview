<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一条请求:单进程串行约 60 ms,多进程把它的 CPU 段藏进别的 step 的前向背后</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">横轴是时间;数字是讲稿的量级参考(tokenize 约 10 ms、前向约 50 ms)。紫 = 这条请求的 CPU 段,绿 = GPU 前向,灰 = 空等或在忙别的请求。</text>
<line x1="200" y1="86" x2="200" y2="92" stroke="#9ca3af"/>
<text x="200" y="82" font-size="10" fill="#6b7280" text-anchor="middle">0 ms</text>
<line x1="310" y1="86" x2="310" y2="92" stroke="#9ca3af"/>
<text x="310" y="82" font-size="10" fill="#6b7280" text-anchor="middle">10 ms</text>
<line x1="420" y1="86" x2="420" y2="92" stroke="#9ca3af"/>
<text x="420" y="82" font-size="10" fill="#6b7280" text-anchor="middle">20 ms</text>
<line x1="530" y1="86" x2="530" y2="92" stroke="#9ca3af"/>
<text x="530" y="82" font-size="10" fill="#6b7280" text-anchor="middle">30 ms</text>
<line x1="640" y1="86" x2="640" y2="92" stroke="#9ca3af"/>
<text x="640" y="82" font-size="10" fill="#6b7280" text-anchor="middle">40 ms</text>
<line x1="750" y1="86" x2="750" y2="92" stroke="#9ca3af"/>
<text x="750" y="82" font-size="10" fill="#6b7280" text-anchor="middle">50 ms</text>
<line x1="860" y1="86" x2="860" y2="92" stroke="#9ca3af"/>
<text x="860" y="82" font-size="10" fill="#6b7280" text-anchor="middle">60 ms</text>
<line x1="200" y1="92" x2="915" y2="92" stroke="#9ca3af"/>
<text x="30" y="118" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 单进程串行</text>
<text x="190" y="147" font-size="13" fill="#6b7280" text-anchor="end">CPU</text>
<rect x="200" y="128" width="107" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="253.5" y="145.96" font-size="11" fill="#111827" text-anchor="middle">收包 + tokenize</text>
<rect x="310" y="128" width="547" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="583.5" y="146.32" font-size="12" fill="#6b7280" text-anchor="middle">GPU 在算,CPU 空等</text>
<rect x="860" y="128" width="30" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="904" y="146" font-size="11" fill="#6b7280" text-anchor="start">detokenize + 回包</text>
<text x="190" y="183" font-size="13" fill="#6b7280" text-anchor="end">GPU</text>
<rect x="200" y="164" width="107" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="253.5" y="182.32" font-size="12" fill="#6b7280" text-anchor="middle">空等</text>
<rect x="310" y="164" width="547" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="583.5" y="182.32" font-size="12" fill="#111827" text-anchor="middle">模型前向,约 50 ms</text>
<rect x="860" y="164" width="30" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="200" y="214" font-size="12" fill="#6b7280" text-anchor="start">CPU 和 GPU 互相等:tokenize 时 GPU 闲着,前向时 CPU 闲着。一条请求端到端约 60 ms,GPU 只忙了其中 50 ms。</text>
<line x1="30" y1="236" x2="1090" y2="236" stroke="#e5e7eb"/>
<text x="30" y="266" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 多进程:API 进程与 EngineCore 进程各转各的</text>
<text x="190" y="295" font-size="13" fill="#6b7280" text-anchor="end">API 进程(CPU)</text>
<rect x="200" y="276" width="107" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="253.5" y="293.96" font-size="11" fill="#111827" text-anchor="middle">收包 + tokenize</text>
<rect x="310" y="276" width="547" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="583.5" y="294.32" font-size="12" fill="#6b7280" text-anchor="middle">处理别的请求的收包与回包</text>
<rect x="860" y="276" width="30" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="904" y="294" font-size="11" fill="#6b7280" text-anchor="start">detokenize + 回包:本请求</text>
<text x="190" y="349" font-size="13" fill="#6b7280" text-anchor="end">EngineCore(GPU)</text>
<rect x="200" y="330" width="107" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="253.5" y="347.96" font-size="11" fill="#111827" text-anchor="middle">上一个 step</text>
<rect x="310" y="330" width="547" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="583.5" y="348.32" font-size="12" fill="#111827" text-anchor="middle">模型前向:本请求,约 50 ms</text>
<rect x="860" y="330" width="52" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="886.0" y="347.6" font-size="10" fill="#111827" text-anchor="middle">下一个</text>
<line x1="310" y1="304" x2="310" y2="328" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="318" y="308.65" width="66.64" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="351.32" y="319.65" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ 提交</text>
<line x1="860" y1="328" x2="860" y2="304" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="748.4" y="308.65" width="103.6" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="800.1999999999999" y="319.65" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ 回传 token</text>
<text x="200" y="388" font-size="12" fill="#6b7280" text-anchor="start">这条请求的 tokenize 藏在上一个 step 的前向背后,detokenize 藏在下一个 step 的前向背后:GPU 连续满载,没有空隙。</text>
<text x="200" y="406" font-size="12" fill="#6b7280" text-anchor="start">对这一条请求,端到端从约 60 ms 降到约 50 ms 加毫秒级;对整机,GPU 利用率从 50/60 变成接近满载。代价是两次 ZMQ 跨进程,每次亚毫秒级(1.3)。</text>
<text x="30" y="450" font-size="12" fill="#6b7280" text-anchor="start">紫 = 这条请求的 CPU 段(收包、tokenize、detokenize、回包),绿 = GPU 前向,灰 = 空等或在忙别的请求</text>
</svg>