<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">可观测性整条链路:vLLM 内部产数据,外部通用栈存和看</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = vLLM 自带,紫 = 外部开源组件、需要自己部署,灰 = 日志。</text>
<text x="60" y="100" font-size="13" fill="#111827" text-anchor="start" font-weight="700">vLLM 内部(产数据)</text>
<text x="640" y="100" font-size="13" fill="#111827" text-anchor="start" font-weight="700">外部通用栈(存和看)</text>
<rect x="60" y="112" width="240" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="180.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">EngineCore 进程</text><text x="180.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">每步打时间戳、计数</text>
<rect x="350" y="112" width="240" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="470.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">API 进程</text><text x="470.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">汇总,开 /metrics 接口</text>
<rect x="640" y="112" width="200" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="740.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Prometheus</text><text x="740.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">定时抓取、存</text>
<rect x="890" y="112" width="190" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="985.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Grafana</text><text x="985.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">看板、告警</text>
<line x1="302" y1="142" x2="348" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="592" y1="142" x2="638" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="842" y1="142" x2="888" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="640" y="208" width="440" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="860.0" y="229" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">OpenTelemetry → Jaeger / Tempo</text><text x="860.0" y="249" font-size="12" fill="#6b7280" text-anchor="middle">单个请求的完整时间线</text>
<rect x="640" y="300" width="440" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="860.0" y="321" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">日志</text><text x="860.0" y="341" font-size="12" fill="#6b7280" text-anchor="middle">每几秒打一行汇总,调试用</text>
<polyline points="470,174 470,238 638,238" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="470,238 470,330 638,330" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="60" y="300" font-size="12" fill="#6b7280" text-anchor="start">指标从 EngineCore 进程经 ZMQ 随输出一起带回 API 进程,由它汇总暴露;</text>
<text x="60" y="320" font-size="12" fill="#6b7280" text-anchor="start">追踪与日志各是一路,互不依赖。这一组开关默认全关,</text>
<text x="60" y="340" font-size="12" fill="#6b7280" text-anchor="start">要打请求日志得显式开(本节)。</text>
<text x="30" y="408" font-size="12" fill="#6b7280" text-anchor="start">绿 = vLLM 自带,紫 = 外部开源组件,灰 = 日志</text>
</svg>