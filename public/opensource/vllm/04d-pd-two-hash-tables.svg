<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">PD 分离下两边各有一张 hash 表:算法一样、表各存各的,D 只拉本地没有的块</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = 已有 / 命中,黄 = D 生成的,红 = P 白算的 / 刚算的,紫 = 真正需要传的。</text>
<rect x="40" y="90" width="500" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="56" y="110" font-size="13" fill="#6b7280" text-anchor="start">P 节点的显存</text>
<rect x="70" y="120" width="440" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="290.0" y="141" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">KV 块池 + 自己的 hash 表</text><text x="290.0" y="161" font-size="11" fill="#6b7280" text-anchor="middle">system prompt 的块常年命中</text>
<text x="290" y="198" font-size="12" fill="#6b7280" text-anchor="middle">请求来了:查本地表 → 命中的不算</text>
<text x="290" y="220" font-size="12" fill="#6b7280" text-anchor="middle">没命中的 prefill → 写满登记 hash</text>
<text x="290" y="242" font-size="12" fill="#6b7280" text-anchor="middle">把这个请求的块发给 D</text>
<text x="290" y="264" font-size="12" fill="#6b7280" text-anchor="middle">D 确认收到后,块回到缓存态</text>
<text x="290" y="286" font-size="12" fill="#6b7280" text-anchor="middle">P 的 KV 只活到「发完」,之后作为前缀缓存给下一个请求用</text>
<rect x="580" y="90" width="500" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="596" y="110" font-size="13" fill="#6b7280" text-anchor="start">D 节点的显存</text>
<rect x="610" y="120" width="440" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="830.0" y="141" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">KV 块池 + 自己的 hash 表</text><text x="830.0" y="161" font-size="11" fill="#6b7280" text-anchor="middle">上一轮对话的块可能还在</text>
<text x="830" y="198" font-size="12" fill="#6b7280" text-anchor="middle">请求来了:查本地表 → 已有的块不拉</text>
<text x="830" y="220" font-size="12" fill="#6b7280" text-anchor="middle">缺的块从 P 拉过来填进自己的池</text>
<text x="830" y="242" font-size="12" fill="#6b7280" text-anchor="middle">decode 每步读全部 KV、追加一格</text>
<text x="830" y="264" font-size="12" fill="#6b7280" text-anchor="middle">请求结束:块留在缓存里</text>
<text x="830" y="286" font-size="12" fill="#6b7280" text-anchor="middle">D 的 KV 活到生成结束,之后是下一轮同会话的前缀缓存</text>
<text x="60" y="362" font-size="12" fill="#6b7280" text-anchor="start">两边的 hash 算法一样(同一个 prompt 算出同一串 hash),但表是各存各的,谁也看不到谁。</text>
<line x1="30" y1="382" x2="1090" y2="382" stroke="#e5e7eb"/>
<text x="30" y="412" font-size="15" fill="#111827" text-anchor="start" font-weight="700">多轮对话:第二轮 prompt₂ = prompt₁ + response₁ + question₂</text>
<text x="150" y="442" font-size="12" fill="#111827" text-anchor="start" font-weight="700">第一轮</text>
<text x="230" y="470.0" font-size="13" fill="#6b7280" text-anchor="end">P 的缓存</text>
<rect x="240" y="452" width="297" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="388.5" y="469.32" font-size="12" fill="#111827" text-anchor="middle">prompt₁</text>
<text x="230" y="504.0" font-size="13" fill="#6b7280" text-anchor="end">D 的缓存</text>
<rect x="240" y="486" width="297" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="388.5" y="503.32" font-size="12" fill="#111827" text-anchor="middle">prompt₁(P 传来)</text>
<rect x="540" y="486" width="217" height="26" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="648.5" y="503.32" font-size="12" fill="#111827" text-anchor="middle">response₁(D 生成)</text>
<text x="150" y="538" font-size="12" fill="#111827" text-anchor="start" font-weight="700">第二轮</text>
<text x="230" y="566.0" font-size="13" fill="#6b7280" text-anchor="end">P 收到</text>
<rect x="240" y="548" width="297" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="388.5" y="565.32" font-size="12" fill="#111827" text-anchor="middle">命中,不算</text>
<rect x="540" y="548" width="217" height="26" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="648.5" y="565.32" font-size="12" fill="#111827" text-anchor="middle">没有,重算</text>
<rect x="760" y="548" width="147" height="26" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="833.5" y="565.32" font-size="12" fill="#111827" text-anchor="middle">算</text>
<text x="230" y="600.0" font-size="13" fill="#6b7280" text-anchor="end">D 收到</text>
<rect x="240" y="582" width="297" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="388.5" y="599.32" font-size="12" fill="#111827" text-anchor="middle">本地有</text>
<rect x="540" y="582" width="217" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="648.5" y="599.32" font-size="12" fill="#111827" text-anchor="middle">本地有</text>
<rect x="760" y="582" width="147" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="833.5" y="599.32" font-size="12" fill="#111827" text-anchor="middle">从 P 拉</text>
<text x="240" y="634" font-size="11" fill="#6b7280" text-anchor="start">红色那段 response₁:D 早就有它的 KV,P 却要从头算一遍,算完 D 还不需要 —— 纯浪费;把 D 的结果拼回 P 需要双向传输或全局仓库(6.5)。</text>
<line x1="30" y1="656" x2="1090" y2="656" stroke="#e5e7eb"/>
<text x="30" y="686" font-size="15" fill="#111827" text-anchor="start" font-weight="700">一个例子:system prompt 不传,只拉 query</text>
<text x="60" y="712" font-size="12" fill="#111827" text-anchor="start">P 的 KV 池(请求 2 prefill 完成后)</text>
<rect x="60" y="720" width="520" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="320.0" y="741" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">system_prompt 1000 token</text><text x="320.0" y="761" font-size="11" fill="#6b7280" text-anchor="middle">63 块,请求 1 时已算过</text>
<rect x="620" y="720" width="240" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="740.0" y="741" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">query_B 100 token</text><text x="740.0" y="761" font-size="11" fill="#6b7280" text-anchor="middle">7 块,刚算的</text>
<text x="60" y="796" font-size="12" fill="#111827" text-anchor="start">D 的 KV 池(请求 2 到达时)</text>
<rect x="60" y="804" width="520" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="320.0" y="825" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">system_prompt 已在本地</text><text x="320.0" y="845" font-size="11" fill="#6b7280" text-anchor="middle">请求 1 时收到,touch 复用</text>
<rect x="620" y="804" width="240" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="740.0" y="825" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">query_B 从 P 拉</text><text x="740.0" y="845" font-size="11" fill="#6b7280" text-anchor="middle">7 块,约 4.6 MB/rank</text>
<text x="320" y="790" font-size="11" fill="#6b7280" text-anchor="middle">不传:D 本地 hash 已命中</text>
<line x1="740" y1="770" x2="740" y2="802" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="60" y="862" width="230" height="30" rx="5" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="175" y="881" font-size="11" fill="#111827" text-anchor="middle">查本地:命中 63 块</text>
<line x1="292" y1="877" x2="318" y2="877" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="322" y="862" width="230" height="30" rx="5" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="437" y="881" font-size="11" fill="#111827" text-anchor="middle">等远端 KV:块已分配,不进 batch</text>
<line x1="554" y1="877" x2="580" y2="877" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="584" y="862" width="230" height="30" rx="5" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="699" y="881" font-size="11" fill="#111827" text-anchor="middle">回到 waiting:7 块注册进 cache</text>
<line x1="816" y1="877" x2="842" y2="877" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="846" y="862" width="230" height="30" rx="5" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="961" y="881" font-size="11" fill="#111827" text-anchor="middle">running:开始 decode</text>
<text x="880" y="796" font-size="11" fill="#6b7280" text-anchor="start">请求 2 在 D 上经历的状态 ↓</text>
</svg>