<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两个请求同一步算了同一个 prompt:一个 hash 挂两块,第三个请求随便拿一块</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 / 黄 = A、B 各自算的块,紫 = 命中。缓存表的值类型是「一个块,或者一个块的字典」:多数 hash 只挂一块,少数挂多块。</text>
<text x="30" y="100" font-size="15" fill="#111827" text-anchor="start" font-weight="700">第 N 步:A、B 同时到,prompt 一样,缓存里都没有</text>
<rect x="60" y="112" width="500" height="48" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="310.0" y="140.68" font-size="13" fill="#111827" text-anchor="middle">A 分到块 7,自己算 [你好, 世界]</text>
<rect x="580" y="112" width="500" height="48" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="830.0" y="140.68" font-size="13" fill="#111827" text-anchor="middle">B 分到块 12,自己算 [你好, 世界]</text>
<text x="30" y="196" font-size="15" fill="#111827" text-anchor="start" font-weight="700">第 N 步结束:两块都写满,各自登记 hash</text>
<rect x="60" y="208" width="1020" height="48" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><text x="570.0" y="236.68" font-size="13" fill="#111827" text-anchor="middle">缓存表:hash(你好, 世界) → { 块 7,块 12 }   两份内容一模一样</text>
<text x="30" y="292" font-size="15" fill="#111827" text-anchor="start" font-weight="700">第 N+5 步:C 到,prompt 也是 [你好, 世界]</text>
<rect x="60" y="304" width="1020" height="48" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="570.0" y="332.68" font-size="13" fill="#111827" text-anchor="middle">查到 hash,随便拿块 7 或块 12,引用计数加一,不用算</text>
<text x="60" y="384" font-size="12" fill="#6b7280" text-anchor="start">为什么不去重:合并两块要在同一步里比对、改块表、改引用,收益只有一块显存;而重复只在「同一步同时算」时才发生,极少。刻意不做(本节)。</text>
<text x="30" y="420" font-size="12" fill="#6b7280" text-anchor="start">绿 / 黄 = 各自算的块,紫 = 命中复用</text>
</svg>