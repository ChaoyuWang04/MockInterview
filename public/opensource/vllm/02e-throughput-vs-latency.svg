<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">吞吐和延迟是两把不同的尺:一个数窗口里的产出,一个量单条请求的长度</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">横轴 = 时间,每条 = 一个请求。灰 = 排队,绿 = prefill,黄 = decode;窗口里数的是黄色段在这 1 秒里产出的字。</text>
<rect x="60" y="96" width="77" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="140" y="96" width="97" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="240" y="96" width="477" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="180" y="136" width="57" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="240" y="136" width="177" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="420" y="136" width="237" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="300" y="176" width="137" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="440" y="176" width="77" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="520" y="176" width="597" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="500" y="216" width="37" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="540" y="216" width="117" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="660" y="216" width="397" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="740" y="256" width="97" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="840" y="256" width="77" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="920" y="256" width="217" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<line x1="600" y1="88" x2="600" y2="300" stroke="#6b5cd6" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="840" y1="88" x2="840" y2="300" stroke="#6b5cd6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="720" y="322" font-size="13" fill="#111827" text-anchor="middle">这 1 秒窗口内,所有请求一共吐出的 token 数 = 输出吞吐</text>
<line x1="300" y1="350" x2="1120" y2="350" stroke="#6b7280"/><line x1="300" y1="342" x2="300" y2="358" stroke="#6b7280"/><line x1="1117" y1="342" x2="1117" y2="358" stroke="#6b7280"/>
<text x="710" y="374" font-size="13" fill="#111827" text-anchor="middle">第 3 个请求从进来到结束的长度 = 它的端到端延迟;灰加绿是它的 TTFT,黄色段里相邻两个字的间隔是 TPOT</text>
<text x="30" y="418" font-size="12" fill="#6b7280" text-anchor="start">灰 = 排队,绿 = prefill,黄 = decode;调度器每个参数拧的都是这两把尺之间的交换(9.3)</text>
</svg>