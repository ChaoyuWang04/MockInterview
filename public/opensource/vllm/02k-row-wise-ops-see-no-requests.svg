<text x="278" y="208" font-size="11" fill="#6b7280" text-anchor="end">W_Q</text>
<text x="275" y="258" font-size="17" fill="#6b7280" text-anchor="middle">×</text>
<text x="475" y="258" font-size="17" fill="#6b7280" text-anchor="middle">=</text>
<text x="660" y="132" font-size="12" fill="#6b7280" text-anchor="start">每一行各算各的,互不相干</text>
<text x="660" y="176" font-size="12" fill="#6b7280" text-anchor="start">A 的 4 行是 prefill、B 与 C 各 1 行是 decode,</text>
<text x="660" y="198" font-size="12" fill="#6b7280" text-anchor="start">对这个矩阵乘来说它们完全一样,没有无效格子</text>
<text x="660" y="242" font-size="12" fill="#6b7280" text-anchor="start">W_Q 只从显存读 1 次,6 行共用</text>
<text x="660" y="264" font-size="12" fill="#6b7280" text-anchor="start">→ 行越多,读权重的成本摊得越薄</text>
<text x="660" y="298" font-size="12" fill="#6b7280" text-anchor="start">→ 算术强度约等于行数 M;H800 的拐点约 295(05 章 7.2),</text>
<text x="660" y="320" font-size="12" fill="#6b7280" text-anchor="start">   所以要几百行才开始吃满算力 —— 这正是 chunked prefill</text>
<text x="660" y="342" font-size="12" fill="#6b7280" text-anchor="start">   愿意把 decode 和 prefill 拼进同一步的本钱(1.4)</text>
<line x1="30" y1="400" x2="1090" y2="400" stroke="#e5e7eb"/>
<text x="30" y="430" font-size="12" fill="#6b7280" text-anchor="start">这一条对 7.2 那张表里除 attention 之外的每个算子都成立:embedding、RMSNorm、残差相加、o_proj、FFN、lm_head —— 它们只看到一个扁平的「总 token 数」维度。</text>
<text x="30" y="454" font-size="12" fill="#6b7280" text-anchor="start">唯一要把行和请求对上的是 attention,它靠的是 7.4 那四个数组。所以混合 batch 几乎没有额外开销:绝大多数算子根本不知道 batch 里混了 P 和 D。</text>
<text x="30" y="478" font-size="12" fill="#6b7280" text-anchor="start">顺带一句:logits 虽然算了全部 6 行,但采样只取每条请求的最后一行 —— 本例是第 3、4、5 行。</text>
</svg>