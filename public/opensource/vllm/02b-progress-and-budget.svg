<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">每个请求是一条进度条,一步的预算按 RUNNING 优先切给它们</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = KV 已在 cache,黄 = 这一步要算的 token,灰 = 以后再算,紫 = 草稿 / 新请求。数字是走读用的例子,不是默认值。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 每个请求 = 已算 | 这一步算 | 还欠着</text>
<text x="220" y="131.0" font-size="13" fill="#6b7280" text-anchor="end">A:prefill 中途</text>
<rect x="230" y="112" width="259" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="359.5" y="130.32" font-size="12" fill="#111827" text-anchor="middle">已算 300</text>
<rect x="492" y="112" width="172" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="578.0" y="130.32" font-size="12" fill="#111827" text-anchor="middle">这步 200</text>
<rect x="667" y="112" width="260" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="797.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">还欠 300</text>
<text x="940" y="131" font-size="12" fill="#6b7280" text-anchor="start">总 800</text>
<text x="220" y="179.0" font-size="13" fill="#6b7280" text-anchor="end">B:普通 decode</text>
<rect x="230" y="160" width="664" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="562.0" y="178.32" font-size="12" fill="#111827" text-anchor="middle">已算 20</text>
<rect x="897" y="160" width="30" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="912.0" y="178.32" font-size="12" fill="#111827" text-anchor="middle">1</text>
<text x="940" y="179" font-size="12" fill="#6b7280" text-anchor="start">总 21</text>
<text x="230" y="206" font-size="11" fill="#6b7280" text-anchor="start">这步 1:上一步刚采出来的那个词,它的 KV 还没算</text>
<text x="220" y="243.0" font-size="13" fill="#6b7280" text-anchor="end">C:推测解码 k=4</text>
<rect x="230" y="224" width="557" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="508.5" y="242.32" font-size="12" fill="#111827" text-anchor="middle">已算 20</text>
<rect x="790" y="224" width="25" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="802.5" y="242.32" font-size="12" fill="#111827" text-anchor="middle">1</text>
<rect x="818" y="224" width="109" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="872.5" y="242.32" font-size="12" fill="#111827" text-anchor="middle">草稿 4</text>
<text x="940" y="243" font-size="12" fill="#6b7280" text-anchor="start">总 25</text>
<text x="230" y="270" font-size="11" fill="#6b7280" text-anchor="start">这步 5:1 个真 token + 4 个草稿一起算,等于一次小 prefill(08 章)</text>
<line x1="30" y1="296" x2="1090" y2="296" stroke="#e5e7eb"/>
<text x="30" y="326" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 一步的预算 = 2048 个 token:先给 RUNNING 里的每个请求,剩下的按顺序给 WAITING</text>
<text x="150" y="365.0" font-size="13" fill="#6b7280" text-anchor="end">预算</text>
<rect x="160" y="344" width="86.84375" height="32" rx="4" fill="#eef7f2" stroke="#8fc4aa" stroke-width="1"/><text x="203.421875" y="364.32" font-size="12" fill="#111827" text-anchor="middle">decode 200</text>
<rect x="249.84375" y="344" width="227.0" height="32" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="363.34375" y="364.32" font-size="12" fill="#111827" text-anchor="middle">运行中 prefill 512</text>
<rect x="479.84375" y="344" width="446.21875" height="32" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="702.953125" y="364.32" font-size="12" fill="#111827" text-anchor="middle">waiting 队首 1000</text>
<rect x="929.0625" y="344" width="147.9375" height="32" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="1003.03125" y="364.32" font-size="12" fill="#111827" text-anchor="middle">第二个 336</text>
<line x1="479.84375" y1="340" x2="479.84375" y2="380" stroke="#111827" stroke-width="2"/>
<text x="204.921875" y="398" font-size="11" fill="#6b7280" text-anchor="middle">200 个 decode 请求各 1 个 = 200</text>
<text x="479.84375" y="418" font-size="12" fill="#111827" text-anchor="middle">第一轮到此为止:running 用掉 712</text>
<text x="779.921875" y="418" font-size="12" fill="#111827" text-anchor="middle">第二轮:剩 1336 给 waiting</text>
<text x="160" y="456" font-size="12" fill="#6b7280" text-anchor="start">第二个新请求本来欠 800,只拿到 336,剩下 464 下一步再算 —— chunked prefill 就是这么发生的(1.3);running 先拿是为了保住正在吐字的请求的 TPOT(2.5)。</text>
<text x="160" y="476" font-size="12" fill="#6b7280" text-anchor="start">预算之外还有两道闸门:并发数上限和 KV 块够不够,三道同时过才真的进 RUNNING(Part 3)。</text>
<text x="30" y="530" font-size="12" fill="#6b7280" text-anchor="start">绿 = KV 已在 cache / 老请求,黄 = 这一步要算,灰 = 以后再算,紫 = 草稿 / 新请求</text>
</svg>