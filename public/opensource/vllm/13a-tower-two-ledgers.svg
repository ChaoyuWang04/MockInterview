<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">同一个词,两条边界:代码里「tower」覆盖到哪,取决于你在问什么</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">括号的跨度就是这个词在该口径下覆盖的模块范围。两套登记彼此独立,分界只在连接层上不一样。</text>

  <!-- ===== 三个模块 ===== -->
  <rect x="220" y="286" width="200" height="66" rx="4" fill="#eef2f6" stroke="#9fb9cc" stroke-width="1.4"/>
  <text x="320" y="313" font-size="15" fill="#111827" text-anchor="middle">视觉编码器</text>
  <text x="320" y="334" font-size="11" fill="#6b7280" text-anchor="middle">塔本体</text>

  <rect x="440" y="286" width="160" height="66" rx="4" fill="#f7efe4" stroke="#d9a066" stroke-width="1.6"/>
  <text x="520" y="313" font-size="15" fill="#111827" text-anchor="middle">连接层</text>
  <text x="520" y="334" font-size="11" fill="#9a6b3f" text-anchor="middle">分歧点</text>

  <rect x="620" y="286" width="200" height="66" rx="4" fill="#eef2f6" stroke="#9fb9cc" stroke-width="1.4"/>
  <text x="720" y="313" font-size="15" fill="#111827" text-anchor="middle">语言模型</text>
  <text x="720" y="334" font-size="11" fill="#6b7280" text-anchor="middle">decoder</text>

  <!-- ===== 口径一:加载与显存(上方两道括号) ===== -->
  <text x="30" y="241" font-size="14" font-weight="700" fill="#2f6690">① 加载与显存</text>
  <text x="30" y="262" font-size="11" fill="#6b7280">构造期的上下文管理器</text>

  <path d="M220,272 L220,250 L600,250 L600,272" fill="none" stroke="#2f6690" stroke-width="2"/>
  <text x="410" y="240" font-size="12" fill="#2f6690" text-anchor="middle">塔:编码器加连接层</text>

  <path d="M620,272 L620,250 L820,250 L820,272" fill="none" stroke="#2f6690" stroke-width="2"/>
  <text x="720" y="240" font-size="12" fill="#2f6690" text-anchor="middle">语言模型</text>

  <text x="858" y="241" font-size="12" fill="#374151">整段跳过不加载</text>
  <text x="858" y="261" font-size="12" fill="#374151">并走 offload 路由</text>

  <!-- ===== 口径二:LoRA 过滤(下方三道括号) ===== -->
  <text x="30" y="415" font-size="14" font-weight="700" fill="#9a6b3f">② LoRA 模块过滤</text>
  <text x="30" y="436" font-size="11" fill="#6b7280">模型返回的前缀映射</text>

  <path d="M220,378 L220,400 L420,400 L420,378" fill="none" stroke="#9a6b3f" stroke-width="2"/>
  <text x="320" y="420" font-size="12" fill="#9a6b3f" text-anchor="middle">塔</text>

  <path d="M440,378 L440,400 L600,400 L600,378" fill="none" stroke="#9a6b3f" stroke-width="2"/>
  <text x="520" y="420" font-size="12" fill="#9a6b3f" text-anchor="middle">连接层</text>

  <path d="M620,378 L620,400 L820,400 L820,378" fill="none" stroke="#9a6b3f" stroke-width="2"/>
  <text x="720" y="420" font-size="12" fill="#9a6b3f" text-anchor="middle">语言模型</text>

  <text x="858" y="415" font-size="12" fill="#374151">按前缀过滤</text>
  <text x="858" y="435" font-size="12" fill="#374151">要挂 LoRA 的模块</text>

  <!-- ===== 分歧点竖线与标注 ===== -->
  <line x1="430" y1="228" x2="430" y2="448" stroke="#d9a066" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="430" y="470" font-size="13" font-weight="700" fill="#9a6b3f" text-anchor="middle">上面连着,下面断开</text>

  <!-- ===== 结论 ===== -->
  <text x="30" y="528" font-size="14" font-weight="700" fill="#111827">所以「tower」这个词有两个覆盖范围</text>
  <text x="30" y="554" font-size="13" fill="#374151">讨论加载与显存时,它指视觉侧整体 —— 编码器和连接层建在同一个上下文块里,一起跳过、一起走 offload 路由。</text>
  <text x="30" y="576" font-size="13" fill="#374151">讨论 LoRA 时,连接层单列成一类,和塔并列。</text>
  <text x="30" y="598" font-size="13" fill="#374151">读代码时看到两处结论不一致,先分清在问哪一件事。</text>

  <text x="30" y="624" font-size="10.5" fill="#9ca3af">两套登记服务于不同目的,谁也不是谁的简写。对应本章 1.9。</text>
</svg>
