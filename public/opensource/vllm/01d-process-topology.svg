<text x="30" y="740" font-size="12" fill="#6b7280" text-anchor="start">三类进程都是 CPU 上的 Python 进程,各坐在什么硬件上见下一张图;一条请求沿这些边走一遍的完整走读见 2.3。</text>
<text x="30" y="764" font-size="12" fill="#6b7280" text-anchor="start">紫 = API 进程组件,绿 = EngineCore 组件,黄 = ZMQ 端点(独立线程),灰 = GPU worker 进程与客户端</text>
