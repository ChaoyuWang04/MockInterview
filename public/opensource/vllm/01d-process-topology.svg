<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">进程与通信全景:三类进程各持有什么,四种边分别走什么</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = API 进程组件,绿 = EngineCore 组件,黄 = ZMQ 端点(各占一个线程),灰 = GPU worker 进程;实线 = 数据流,虚线 = 持有。</text>
