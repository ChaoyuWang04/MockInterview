<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 912" width="1120" height="912" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="912" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一条请求的四个阶段:每一跳落在哪个进程、哪个线程,各发生几次</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">接入和 prefill 整条请求只发生一次,decode 是循环,流式返回在 prefill 与 decode 的每一步都发生。实线 = 请求方向,虚线 = 结果返回;数字是讲稿的量级参考。</text>
<rect x="20" y="84" width="180" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="110.0" y="105" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">客户端</text><text x="110.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle">HTTP / SSE</text>
<rect x="230" y="84" width="180" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="320.0" y="105" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">API 进程</text><text x="320.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle">FastAPI + asyncio</text>
<rect x="440" y="84" width="180" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="530.0" y="105" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">IO 线程</text><text x="530.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle">EngineCore 进程 · ZMQ 收发</text>
<rect x="650" y="84" width="180" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="740.0" y="105" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主线程</text><text x="740.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle">EngineCore · busy loop</text>
<rect x="860" y="84" width="180" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="950.0" y="105" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">GPU Worker</text><text x="950.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle">每卡一个进程</text>
<line x1="110" y1="132" x2="110" y2="832" stroke="#d1d5db" stroke-dasharray="4 4"/>
<line x1="320" y1="132" x2="320" y2="832" stroke="#d1d5db" stroke-dasharray="4 4"/>
<line x1="530" y1="132" x2="530" y2="832" stroke="#d1d5db" stroke-dasharray="4 4"/>
<line x1="740" y1="132" x2="740" y2="832" stroke="#d1d5db" stroke-dasharray="4 4"/>
<line x1="950" y1="132" x2="950" y2="832" stroke="#d1d5db" stroke-dasharray="4 4"/>
<rect x="30" y="146" width="1060" height="154" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="164" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 A · 请求接入 —— 整条请求只发生一次,约 1 到 10 ms</text>
<line x1="110" y1="196" x2="320" y2="196" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="215.0" y="188" font-size="12" fill="#111827" text-anchor="middle">① POST /v1/chat/completions</text>
<line x1="320" y1="238" x2="530" y2="238" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="425.0" y="230" font-size="12" fill="#111827" text-anchor="middle">②③④ 套模板 → tokenize → ZMQ 发出</text>
<text x="425.0" y="254" font-size="11" fill="#6b7280" text-anchor="middle">chat template 由 renderer 套好,InputProcessor 只做 tokenize 与构造请求</text>
<line x1="530" y1="280" x2="740" y2="280" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="635.0" y="272" font-size="12" fill="#111827" text-anchor="middle">⑤⑥ 入队 → 建 Request → 进 waiting</text>
<text x="635.0" y="296" font-size="11" fill="#6b7280" text-anchor="middle">block hash 在这里算,不在 API 进程</text>
<rect x="30" y="312" width="1060" height="178" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="330" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 B · Prefill —— 整条请求一次;prompt 长则切块,切几块跑几次;约 50 到 500 ms</text>
<line x1="740" y1="362" x2="950" y2="362" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="845.0" y="354" font-size="12" fill="#111827" text-anchor="middle">⑦⑧ 分配 KV block → 下发前向</text>
<text x="845.0" y="378" font-size="11" fill="#6b7280" text-anchor="middle">命中 prefix cache 就省掉那段 prefill</text>
<rect x="840" y="392" width="220" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="950.0" y="410.32" font-size="12" fill="#111827" text-anchor="middle">前向整段 prompt,采样第 1 个 token</text>
<text x="950" y="436" font-size="11" fill="#6b7280" text-anchor="middle">注意力顺手写下这些 token 的 KV;采样在 Worker 跑</text>
<line x1="950" y1="470" x2="530" y2="470" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="740.0" y="462" font-size="12" fill="#111827" text-anchor="middle">⑨⑬ 采样结果回来:WAITING → RUNNING,推 output_queue</text>
<rect x="30" y="502" width="1060" height="170" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="520" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 C · Decode 循环 —— 每吐一个 token 走一遍,几十到几千次;约 5 到 50 ms 一次</text>
<line x1="740" y1="552" x2="950" y2="552" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="845.0" y="544" font-size="12" fill="#111827" text-anchor="middle">⑩⑪ 这步只要 1 个 token → 前向</text>
<text x="845.0" y="568" font-size="11" fill="#6b7280" text-anchor="middle">注意力按 block table 读回全部历史 KV</text>
<rect x="840" y="582" width="220" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="950.0" y="600.32" font-size="12" fill="#111827" text-anchor="middle">采样第 t 个 token</text>
<line x1="950" y1="640" x2="530" y2="640" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="740.0" y="632" font-size="12" fill="#111827" text-anchor="middle">⑫⑬ 判 EOS 与长度上限,推 output_queue</text>
<text x="740.0" y="656" font-size="11" fill="#6b7280" text-anchor="middle">没结束回到 ⑩;结束则释放 KV block</text>
<rect x="30" y="684" width="1060" height="158" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
<text x="44" y="702" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 D · 流式返回 —— B、C 每产出一个 token 就走一遍</text>
<line x1="530" y1="724" x2="320" y2="724" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="425.0" y="716" font-size="12" fill="#111827" text-anchor="middle">⑬ msgpack → ZMQ(PUSH → PULL)</text>
<line x1="320" y1="766" x2="110" y2="766" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="215.0" y="758" font-size="12" fill="#111827" text-anchor="middle">⑭⑮⑯ detokenize → 判 stop → SSE chunk</text>
<text x="215.0" y="782" font-size="11" fill="#6b7280" text-anchor="middle">stop string 要先把 token 变回文字才判得出来</text>
<line x1="320" y1="818" x2="110" y2="818" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="215.0" y="810" font-size="12" fill="#111827" text-anchor="middle">⑰ 结束才发 data: [DONE]</text>
<text x="30" y="868" font-size="12" fill="#6b7280" text-anchor="start">TTFT = ① 到第一次 ⑯ 的间隔,主要成本在 ⑦⑧ 的 prefill;TPOT = 相邻两次 ⑯ 的间隔,主要成本在 ⑪ 的 decode 前向;总耗时 = TTFT + (输出长度 − 1) × TPOT。</text>
<text x="30" y="888" font-size="12" fill="#6b7280" text-anchor="start">两个归属容易记反:block hash 在 EngineCore 算、不在 API 进程;采样在 GPU Worker 跑、主线程只发起。停止条件也分开:EOS 与长度上限在 EngineCore 判,stop string 在 API 进程判。</text>
</svg>