<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">EngineCore 进程内部:三个线程两条队列,主线程不碰 socket;输出侧靠 buffer 复用做零拷贝</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = 只做等待和打包拆包的线程,绿 = 干活的主线程,灰 = 进程内部的传送带,黄 = 正在被 ZMQ 后台发送、此时不能动的 buffer。</text>
<rect x="40" y="90" width="1040" height="190" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="56" y="110" font-size="13" fill="#6b7280" text-anchor="start">EngineCoreProc 子进程</text>
<rect x="70" y="120" width="240" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="190.0" y="141" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">输入线程</text><text x="190.0" y="161" font-size="12" fill="#6b7280" text-anchor="middle">等 ZMQ,收到就解包</text>
<rect x="70" y="196" width="240" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="190.0" y="220.32" font-size="12" fill="#6b7280" text-anchor="middle">input_queue(线程间队列)</text>
<line x1="190" y1="174" x2="190" y2="194" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="400" y="150" width="320" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="171" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主线程 busy loop</text><text x="560.0" y="191" font-size="11" fill="#6b7280" text-anchor="middle">取请求 → 跑一步 → 结果放进输出队列</text>
<line x1="312" y1="216" x2="398" y2="182" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="722" y1="182" x2="808" y2="216" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="810" y="120" width="240" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="930.0" y="141" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">输出线程</text><text x="930.0" y="161" font-size="12" fill="#6b7280" text-anchor="middle">打包,ZMQ 发出去</text>
<rect x="810" y="196" width="240" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="930.0" y="220.32" font-size="12" fill="#6b7280" text-anchor="middle">output_queue(线程间队列)</text>
<line x1="930" y1="194" x2="930" y2="174" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="70" y="262" font-size="12" fill="#6b7280" text-anchor="start">ZMQ 进:来自 API 进程</text>
<text x="560" y="262" font-size="12" fill="#111827" text-anchor="middle">主线程从不碰 socket,节奏由 GPU 决定</text>
<text x="810" y="262" font-size="12" fill="#6b7280" text-anchor="start">ZMQ 出:发回 API 进程</text>
<text x="30" y="318" font-size="15" fill="#111827" text-anchor="start" font-weight="700">输出侧零拷贝:buffer 复用池的一环</text>
<rect x="60" y="334" width="200" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="160.0" y="355" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">复用池</text><text x="160.0" y="375" font-size="12" fill="#6b7280" text-anchor="middle">空闲的 buffer</text>
<rect x="320" y="334" width="200" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="420.0" y="355" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">写入输出</text><text x="420.0" y="375" font-size="12" fill="#6b7280" text-anchor="middle">msgpack 直接写进去</text>
<rect x="580" y="334" width="200" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="680.0" y="355" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">交给 ZMQ</text><text x="680.0" y="375" font-size="12" fill="#6b7280" text-anchor="middle">不复制,只给指针</text>
<rect x="840" y="334" width="220" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="950.0" y="355" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">ZMQ 后台在发</text><text x="950.0" y="375" font-size="12" fill="#6b7280" text-anchor="middle">此时不能动 buffer</text>
<line x1="262" y1="364" x2="318" y2="364" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="522" y1="364" x2="578" y2="364" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="782" y1="364" x2="838" y2="364" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="950,396 950,430 160,430 160,398" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="425.98" y="420.65" width="258.03999999999996" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="555.0" y="431.65" font-size="11" fill="#6b7280" text-anchor="middle">tracker.done 变成 True 之后才走这条回收线</text>
<text x="60" y="470" font-size="12" fill="#6b7280" text-anchor="start">send() 一调用就返回,真正把字节推上网络的是 ZMQ 自己的线程,所以「发完」和「返回」不是一个时刻;buffer 要等 tracker 说发完了才能回池子重用。</text>
<text x="60" y="490" font-size="12" fill="#6b7280" text-anchor="start">输入侧同理:收到的消息直接在 buffer 上解包,不先拷一份(3.3)。</text>
<text x="30" y="520" font-size="12" fill="#6b7280" text-anchor="start">紫 = IO 线程 / ZMQ,绿 = 主线程 / 写入,灰 = 队列 / 池子,黄 = 后台发送中</text>
</svg>