<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="580" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一层里哪些张量在被量化:W 是所有大矩阵,A 是每个 Linear 的输入,C 是写进 KV cache 的</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">红 = W(权重),绿 = A(Linear 的输入),实线灰 = C(KV cache),虚线 = 不在这三笔账里。从左到右是一层的前向顺序。</text>
<rect x="40" y="100" width="1040" height="100" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="54" y="119" font-size="13" fill="#6b7280" text-anchor="start">attention 段</text>
<rect x="60" y="130" width="100" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="110.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输入 x</text><text x="110.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">A</text>
<rect x="168" y="130" width="130" height="58" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="233.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Wq Wk Wv</text><text x="233.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">W</text>
<rect x="306" y="130" width="140" height="58" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="376.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">K、V → cache</text><text x="376.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">C</text>
<rect x="454" y="130" width="160" height="58" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="534.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Q、softmax 输出</text><text x="534.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">C,可选</text>
<rect x="622" y="130" width="180" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="712.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">attn 输出</text><text x="712.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">A,可直接量化交出</text>
<rect x="810" y="130" width="80" height="58" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="850.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Wo</text><text x="850.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">W</text>
<rect x="898" y="130" width="160" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/><text x="978.0" y="155.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+ 残差 / norm</text><text x="978.0" y="173.0" font-size="11" fill="#6b7280" text-anchor="middle">不在三笔账里</text>
<rect x="40" y="216" width="1040" height="100" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="54" y="235" font-size="13" fill="#6b7280" text-anchor="start">MLP 段</text>
<rect x="60" y="246" width="100" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="110.0" y="271.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输入 x</text><text x="110.0" y="289.0" font-size="11" fill="#6b7280" text-anchor="middle">A</text>
<rect x="168" y="246" width="130" height="58" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="233.0" y="271.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">gate / up</text><text x="233.0" y="289.0" font-size="11" fill="#6b7280" text-anchor="middle">W</text>
<rect x="306" y="246" width="230" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="421.0" y="271.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">SwiGLU 输出</text><text x="421.0" y="289.0" font-size="11" fill="#6b7280" text-anchor="middle">A,也就是 down 的输入</text>
<rect x="544" y="246" width="110" height="58" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="599.0" y="271.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">down</text><text x="599.0" y="289.0" font-size="11" fill="#6b7280" text-anchor="middle">W</text>
<rect x="662" y="246" width="170" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/><text x="747.0" y="271.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+ 残差</text><text x="747.0" y="289.0" font-size="11" fill="#6b7280" text-anchor="middle">不在三笔账里</text>
<text x="846" y="266" font-size="12" fill="#6b7280" text-anchor="start">MoE 时 gate / up / down 每个专家一套,</text>
<text x="846" y="288" font-size="12" fill="#6b7280" text-anchor="start">权重多一维,scale 也多一维,同样是 W</text>
<rect x="40" y="332" width="1040" height="100" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="54" y="351" font-size="13" fill="#6b7280" text-anchor="start">block 外的几个点</text>
<rect x="60" y="362" width="245" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/><text x="182.5" y="387.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">embedding 表</text><text x="182.5" y="405.0" font-size="11" fill="#6b7280" text-anchor="middle">默认不量化,在忽略名单里</text>
<rect x="313" y="362" width="245" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/><text x="435.5" y="387.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">lm_head</text><text x="435.5" y="405.0" font-size="11" fill="#6b7280" text-anchor="middle">默认不量化,AWQ / GPTQ 有开关</text>
<rect x="566" y="362" width="245" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/><text x="688.5" y="387.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MoE 路由 gate</text><text x="688.5" y="405.0" font-size="11" fill="#6b7280" text-anchor="middle">很小但很敏感,一般不量化</text>
<rect x="819" y="362" width="245" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/><text x="941.5" y="387.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Hadamard 旋转</text><text x="941.5" y="405.0" font-size="11" fill="#6b7280" text-anchor="middle">不是量化,是量化前的等价变换</text>
<text x="30" y="470" font-size="12" fill="#6b7280" text-anchor="start">W 覆盖一层里所有的大矩阵乘:qkv_proj、o_proj、gate_up_proj、down_proj,以及 MoE 各专家的权重(1.2)。</text>
<text x="30" y="494" font-size="12" fill="#6b7280" text-anchor="start">A 的定义是「每个 Linear 的输入」—— 所以归一化的输出、SwiGLU 的输出都是 A;残差相加与归一化本身在高精度里做,它们只是产出下一个 A。</text>
<text x="30" y="518" font-size="12" fill="#6b7280" text-anchor="start">attention 内部那三处(query、softmax 输出、attn 输出)是同一套 scale 家族,不是三个孤立角落;attn 输出那个 scale 由算 attention 的 kernel 现场写出来(1.4)。</text>
<text x="30" y="556" font-size="12" fill="#6b7280" text-anchor="start">红 = W,绿 = A,实线灰 = C,虚线 = 不在 W / A / C 这三笔账里</text>
</svg>