<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 844" width="1120" height="844" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="844" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">为什么要拆成两个进程:GIL 让多线程救不了,单进程让 GPU 一半时间在等</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">三段从上往下读:一把锁为什么锁住了 Python 多线程 → 单进程里 CPU 和 GPU 只能轮流做 → 两个进程各持一把锁、各转各的。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 一个 Python 进程里不管开多少线程,同一时刻只有一个能拿到 GIL 跑 Python 代码</text>
<text x="150" y="131" font-size="13" fill="#6b7280" text-anchor="end">线程 1</text>
<rect x="160" y="112" width="216.79999999999998" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="268.4" y="130.32" font-size="12" fill="#111827" text-anchor="middle">持锁,执行</text>
<rect x="380.79999999999995" y="112" width="474.40000000000003" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="618.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">等锁</text>
<rect x="859.2" y="112" width="216.79999999999998" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="967.6" y="130.32" font-size="12" fill="#111827" text-anchor="middle">持锁,执行</text>
<text x="150" y="167" font-size="13" fill="#6b7280" text-anchor="end">线程 2</text>
<rect x="160" y="148" width="216.79999999999998" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="268.4" y="166.32" font-size="12" fill="#6b7280" text-anchor="middle">等锁</text>
<rect x="380.79999999999995" y="148" width="235.20000000000002" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="498.4" y="166.32" font-size="12" fill="#111827" text-anchor="middle">持锁,执行</text>
<rect x="620.0" y="148" width="456.0" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="848.0" y="166.32" font-size="12" fill="#6b7280" text-anchor="middle">等锁</text>
<text x="150" y="203" font-size="13" fill="#6b7280" text-anchor="end">线程 3</text>
<rect x="160" y="184" width="456.0" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="388.0" y="202.32" font-size="12" fill="#6b7280" text-anchor="middle">等锁</text>
<rect x="620.0" y="184" width="235.20000000000002" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="737.6" y="202.32" font-size="12" fill="#111827" text-anchor="middle">持锁,执行</text>
<rect x="859.2" y="184" width="216.79999999999998" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="967.6" y="202.32" font-size="12" fill="#111827" text-anchor="middle">等网络,放锁</text>
<text x="160" y="238" font-size="12" fill="#6b7280" text-anchor="start">黄 = 拿着锁在跑 Python,灰 = 干等锁,绿 = 在等外部事情(网络、硬盘、GPU 算完、numpy/torch 的 C 算子)时主动放锁让别人跑。</text>
<text x="160" y="256" font-size="12" fill="#6b7280" text-anchor="start">三个核的机器,任何时刻也只有一个核在跑 Python。tokenize 是纯 Python 循环,给 GPU 派活那段代码也大半是 Python:</text>
<text x="160" y="274" font-size="12" fill="#6b7280" text-anchor="start">两者抢同一把锁,谁也快不了,GPU 就在中间闲着。多线程只对「大量等待」的活有用,对「大量计算」的活没用。</text>
<line x1="30" y1="296" x2="1090" y2="296" stroke="#e5e7eb"/>
<text x="30" y="326" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 单进程一个循环:GPU 和 CPU 轮流做,GPU 每步之后都空一段(InprocClient)</text>
<text x="150" y="361" font-size="13" fill="#6b7280" text-anchor="end">GPU</text>
<rect x="160" y="342" width="198.4" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="259.2" y="360.32" font-size="12" fill="#111827" text-anchor="middle">第 N 步</text>
<rect x="362.4" y="342" width="97.2" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="411.0" y="360.32" font-size="12" fill="#6b7280" text-anchor="middle">空闲</text>
<rect x="463.59999999999997" y="342" width="198.4" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="562.8" y="360.32" font-size="12" fill="#111827" text-anchor="middle">第 N+1 步</text>
<rect x="666.0" y="342" width="97.2" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="714.6" y="360.32" font-size="12" fill="#6b7280" text-anchor="middle">空闲</text>
<rect x="767.2" y="342" width="198.4" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="866.4000000000001" y="360.32" font-size="12" fill="#111827" text-anchor="middle">第 N+2 步</text>
<rect x="969.6" y="342" width="106.39999999999999" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="1022.8000000000001" y="360.32" font-size="12" fill="#6b7280" text-anchor="middle">空闲</text>
<text x="150" y="397" font-size="13" fill="#6b7280" text-anchor="end">CPU</text>
<rect x="160" y="378" width="198.4" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="259.2" y="396.32" font-size="12" fill="#6b7280" text-anchor="middle">等 GPU</text>
<rect x="362.4" y="378" width="97.2" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="411.0" y="396.32" font-size="12" fill="#111827" text-anchor="middle">后处理</text>
<rect x="463.59999999999997" y="378" width="198.4" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="562.8" y="396.32" font-size="12" fill="#6b7280" text-anchor="middle">等 GPU</text>
<rect x="666.0" y="378" width="97.2" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="714.6" y="396.32" font-size="12" fill="#111827" text-anchor="middle">后处理</text>
<rect x="767.2" y="378" width="198.4" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="866.4000000000001" y="396.32" font-size="12" fill="#6b7280" text-anchor="middle">等 GPU</text>
<rect x="969.6" y="378" width="106.39999999999999" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="1022.8000000000001" y="396.32" font-size="12" fill="#111827" text-anchor="middle">后处理</text>
<text x="160" y="432" font-size="12" fill="#6b7280" text-anchor="start">紫 = detokenize、发回用户等后处理。后处理和下一步的派活都要拿 GIL,GPU 只能等它做完。</text>
<text x="160" y="450" font-size="12" fill="#6b7280" text-anchor="start">7B 模型在 H100 上一个 decode 步十几毫秒,后处理五六毫秒,串行就是三成 GPU 时间被浪费(讲稿量级)。</text>
<line x1="30" y1="472" x2="1090" y2="472" stroke="#e5e7eb"/>
<text x="30" y="520" font-size="15" fill="#111827" text-anchor="start" font-weight="700">③ 拆成两个进程:各持一把 GIL、各转各的,中间用 ZMQ 传消息,GPU 不再停(MPClient)</text>
<rect x="40" y="540" width="300" height="190" rx="10" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="190" y="564" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">API 进程(自己的 GIL)</text>
<rect x="60" y="578" width="260" height="34" rx="4" fill="#ffffff" stroke="#8f8bd8" stroke-width="1"/><text x="190.0" y="599.68" font-size="13" fill="#111827" text-anchor="middle">收 HTTP 请求</text>
<rect x="60" y="624" width="260" height="34" rx="4" fill="#ffffff" stroke="#8f8bd8" stroke-width="1"/><text x="190.0" y="645.68" font-size="13" fill="#111827" text-anchor="middle">tokenize:文字 → 数字</text>
<rect x="60" y="670" width="260" height="34" rx="4" fill="#ffffff" stroke="#8f8bd8" stroke-width="1"/><text x="190.0" y="691.68" font-size="13" fill="#111827" text-anchor="middle">detokenize:数字 → 文字</text>
<rect x="420" y="540" width="300" height="190" rx="10" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="570" y="564" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">EngineCore 进程(自己的 GIL)</text>
<rect x="440" y="578" width="260" height="34" rx="4" fill="#ffffff" stroke="#5fa886" stroke-width="1"/><text x="570.0" y="599.68" font-size="13" fill="#111827" text-anchor="middle">调度:这一步算谁</text>
<rect x="440" y="624" width="260" height="34" rx="4" fill="#ffffff" stroke="#5fa886" stroke-width="1"/><text x="570.0" y="645.68" font-size="13" fill="#111827" text-anchor="middle">启动 GPU 跑一步</text>
<rect x="440" y="670" width="260" height="34" rx="4" fill="#ffffff" stroke="#5fa886" stroke-width="1"/><text x="570.0" y="691.68" font-size="13" fill="#111827" text-anchor="middle">采样出新的数字</text>
<line x1="342" y1="610" x2="418" y2="610" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="350" y="584" width="60" height="20" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="380.0" y="597.96" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ 请求</text>
<line x1="418" y1="678" x2="342" y2="678" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="350" y="690" width="60" height="20" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="380.0" y="703.96" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ 输出</text>
<text x="760" y="552" font-size="13" fill="#111827" text-anchor="middle">同一时刻:</text>
<text x="790" y="593" font-size="12" fill="#6b7280" text-anchor="end">引擎进程 GPU</text>
<rect x="800.0" y="574" width="66.0" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="833.0" y="591.96" font-size="11" fill="#111827" text-anchor="middle">第 N 步</text>
<rect x="870.0" y="574" width="66.0" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="903.0" y="591.96" font-size="11" fill="#111827" text-anchor="middle">第 N+1 步</text>
<rect x="940.0" y="574" width="66.0" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="973.0" y="591.96" font-size="11" fill="#111827" text-anchor="middle">第 N+2 步</text>
<rect x="1010.0" y="574" width="66.0" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="1043.0" y="591.96" font-size="11" fill="#111827" text-anchor="middle">第 N+3 步</text>
<text x="790" y="633" font-size="12" fill="#6b7280" text-anchor="end">前端进程 CPU</text>
<rect x="800.0" y="614" width="66.0" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="833.0" y="631.96" font-size="11" fill="#111827" text-anchor="middle">N−1</text>
<rect x="870.0" y="614" width="66.0" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="903.0" y="631.96" font-size="11" fill="#111827" text-anchor="middle">N</text>
<rect x="940.0" y="614" width="66.0" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="973.0" y="631.96" font-size="11" fill="#111827" text-anchor="middle">N+1</text>
<rect x="1010.0" y="614" width="66.0" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="1043.0" y="631.96" font-size="11" fill="#111827" text-anchor="middle">N+2</text>
<text x="940" y="678" font-size="12" fill="#6b7280" text-anchor="middle">上面一行没有空隙:引擎循环里只剩</text>
<text x="940" y="696" font-size="12" fill="#6b7280" text-anchor="middle">调度、启动 GPU、采样,每步产出扔进</text>
<text x="940" y="714" font-size="12" fill="#6b7280" text-anchor="middle">ZMQ 就走;前端取上一步的结果做后处理。</text>
<text x="30" y="766" font-size="12" fill="#6b7280" text-anchor="start">每个进程是一个独立解释器、自己一把锁,互不相干,才能真正同时用多个核 —— 这是 vLLM 拆两个进程的根本原因,也是 V1 把多进程设成离线默认的原因。</text>
<text x="30" y="784" font-size="12" fill="#6b7280" text-anchor="start">代价是 IPC:请求与输出都要序列化后过 ZMQ;为什么选 ZMQ、每一跳走什么,见 1.3 与 Part 2。</text>
<text x="30" y="818" font-size="12" fill="#6b7280" text-anchor="start">黄 = 拿着 GIL 在跑 Python,灰 = 等,绿 = GPU 在算 / 引擎侧,紫 = CPU 后处理 / 用户侧</text>
</svg>