<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">混合模型:hash 边界取两组块大小的最大公约数,否则全命中会变成零命中</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">attention 组块 = 16,Mamba 组块 = 1024。绿 = 命中 / 复用,红 = 要算的,黄 = 重算加复制块。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 共同前缀在第 528 个 token 结束</text>
<text x="280" y="122" font-size="12" fill="#111827" text-anchor="start" font-weight="700">token 0</text>
<text x="1040" y="122" font-size="12" fill="#111827" text-anchor="end" font-weight="700">1024</text>
<line x1="330" y1="118" x2="1000" y2="118" stroke="#111827"/>
<text x="120" y="150" font-size="12" fill="#6b7280" text-anchor="end">attention 组,块 = 16</text>
<rect x="280" y="132" width="391.875" height="32" rx="2" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="671.875" y="132" width="368.125" height="32" rx="2" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
