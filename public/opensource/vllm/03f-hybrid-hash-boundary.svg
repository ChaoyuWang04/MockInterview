<line x1="398.75" y1="132" x2="398.75" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="410.625" y1="132" x2="410.625" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="422.5" y1="132" x2="422.5" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="434.375" y1="132" x2="434.375" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="446.25" y1="132" x2="446.25" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="458.125" y1="132" x2="458.125" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="470.0" y1="132" x2="470.0" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="481.875" y1="132" x2="481.875" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="493.75" y1="132" x2="493.75" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="505.625" y1="132" x2="505.625" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="517.5" y1="132" x2="517.5" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="529.375" y1="132" x2="529.375" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="541.25" y1="132" x2="541.25" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="553.125" y1="132" x2="553.125" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="565.0" y1="132" x2="565.0" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="576.875" y1="132" x2="576.875" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="588.75" y1="132" x2="588.75" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="600.625" y1="132" x2="600.625" y2="164" stroke="#5fa886" stroke-width="0.5"/>
