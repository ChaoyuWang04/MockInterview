<line x1="339.375" y1="132" x2="339.375" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="351.25" y1="132" x2="351.25" y2="164" stroke="#5fa886" stroke-width="0.5"/>
<line x1="363.125" y1="132" x2="363.125" y2="164" stroke="#5fa886" stroke-width="0.5"/>
