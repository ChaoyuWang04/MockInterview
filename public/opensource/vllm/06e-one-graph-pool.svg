<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="530" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">所有图共用一个显存池:任一时刻只有一张图在跑,所以池子按最大那张的峰值定</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">横条长度 = 这张图重放时中间激活的峰值。同一间会议室,不同时间开不同的会;会议室的大小按最大那场会定。</text>
<text x="50" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">graph pool(一块物理显存,大小 ≈ 最大那张图的峰值)</text>
<rect x="40" y="112" width="1040" height="232" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="60" y="130" width="980" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="550.0" y="154.68" font-size="13" fill="#111827" text-anchor="middle">桶 128:第一个录,一次把池子撑到峰值</text>
<rect x="60" y="182" width="640" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="380.0" y="206.68" font-size="13" fill="#111827" text-anchor="middle">桶 64:用前面一段,不扩</text>
<rect x="60" y="234" width="200" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="160.0" y="258.68" font-size="13" fill="#111827" text-anchor="middle">桶 8</text>
<rect x="60" y="286" width="60" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="134" y="311" font-size="12" fill="#6b7280" text-anchor="start">桶 1:只用最前面一小段</text>
<text x="1046" y="155" font-size="13" fill="#6b7280" text-anchor="middle">↑</text>
<text x="940" y="368" font-size="12" fill="#6b7280" text-anchor="start">池子的大小由这一条决定</text>
<text x="30" y="368" font-size="12" fill="#6b7280" text-anchor="start">它们的中间激活永远不会同时存在,所以可以叠在同一块物理显存上。</text>
<text x="30" y="406" font-size="15" fill="#111827" text-anchor="start" font-weight="700">于是录制顺序必须两层都先大后小(3.2):</text>
<rect x="40" y="424" width="124" height="34" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="102.0" y="445.32" font-size="12" fill="#111827" text-anchor="middle">分段图 128</text>
<line x1="168" y1="441" x2="186" y2="441" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="190" y="424" width="124" height="34" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="252.0" y="445.32" font-size="12" fill="#111827" text-anchor="middle">分段图 …</text>
<line x1="318" y1="441" x2="336" y2="441" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="340" y="424" width="124" height="34" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="402.0" y="445.32" font-size="12" fill="#111827" text-anchor="middle">分段图 1</text>
<line x1="468" y1="441" x2="486" y2="441" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="490" y="424" width="124" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="552.0" y="445.32" font-size="12" fill="#111827" text-anchor="middle">整图 128</text>
<line x1="618" y1="441" x2="636" y2="441" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="640" y="424" width="124" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="702.0" y="445.32" font-size="12" fill="#111827" text-anchor="middle">整图 1</text>
<text x="790" y="445" font-size="12" fill="#6b7280" text-anchor="start">第一张就把池子撑满,之后每张都落进已分配的 buffer</text>
<text x="30" y="486" font-size="12" fill="#6b7280" text-anchor="start">反过来从小到大录,池子要经历上百次逐步扩张,碎片多、效率低。分段图的中间激活更大,所以它排在整图前面。</text>
<text x="30" y="510" font-size="12" fill="#6b7280" text-anchor="start">池子之外另算的是图元数据(kernel 拓扑、参数布局、stream 同步信息),每张图几 MB,20 个桶也就几十到一两百 MB(3.4)。</text>
</svg>