<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">先把 CPU 对到你熟的 GPU 上:层级一一对应,差别在哲学 —— 少而精 vs 多而简</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">核 ↔ SM,L1/L2 ↔ 片上存储,L3 ↔ L2,DRAM ↔ HBM。数字是 H100 与常见服务器 CPU 的量级参考,不是本仓库实测。</text>
<rect x="40" y="90" width="500" height="380" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="290" y="116" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">CPU(服务器芯片)</text>
<rect x="70" y="136" width="100" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="120" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">核 1</text>
<text x="120" y="185" font-size="12" fill="#6b7280" text-anchor="middle">L1 L2</text>
<rect x="185" y="136" width="100" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="235" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">核 2</text>
<text x="235" y="185" font-size="12" fill="#6b7280" text-anchor="middle">L1 L2</text>
<rect x="300" y="136" width="100" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="350" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">核 3</text>
<text x="350" y="185" font-size="12" fill="#6b7280" text-anchor="middle">L1 L2</text>
<rect x="415" y="136" width="100" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="465" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">核 4</text>
<text x="465" y="185" font-size="12" fill="#6b7280" text-anchor="middle">L1 L2</text>
<text x="290" y="222" font-size="12" fill="#6b7280" text-anchor="middle">… 共 16 到 64 个,每个很聪明</text>
<rect x="70" y="244" width="440" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="290.0" y="270.68" font-size="13" fill="#111827" text-anchor="middle">L3 共享缓存,几十到上百 MB</text>
<rect x="70" y="306" width="440" height="44" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="290.0" y="332.68" font-size="13" fill="#111827" text-anchor="middle">DRAM 几百 GB,约 200 GB/s</text>
<text x="290" y="380" font-size="13" fill="#111827" text-anchor="middle">靠猜测(乱序、分支预测)和大缓存把延迟藏起来</text>
<rect x="580" y="90" width="500" height="380" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="830" y="116" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">GPU(H100)</text>
<rect x="610" y="136" width="100" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="660" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SM 1</text>
<text x="660" y="185" font-size="12" fill="#6b7280" text-anchor="middle">片上存储</text>
<rect x="725" y="136" width="100" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="775" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SM 2</text>
<text x="775" y="185" font-size="12" fill="#6b7280" text-anchor="middle">片上存储</text>
<rect x="840" y="136" width="100" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="890" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SM 3</text>
<text x="890" y="185" font-size="12" fill="#6b7280" text-anchor="middle">片上存储</text>
<rect x="955" y="136" width="100" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="1005" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SM 4</text>
<text x="1005" y="185" font-size="12" fill="#6b7280" text-anchor="middle">片上存储</text>
<text x="830" y="222" font-size="12" fill="#6b7280" text-anchor="middle">… 共 132 个,每个很简单</text>
<rect x="610" y="244" width="440" height="44" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="830.0" y="270.68" font-size="13" fill="#111827" text-anchor="middle">L2 共享缓存 50 MB</text>
<rect x="610" y="306" width="440" height="44" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="830.0" y="332.68" font-size="13" fill="#111827" text-anchor="middle">HBM 80 GB,3.3 TB/s</text>
<text x="830" y="380" font-size="13" fill="#111827" text-anchor="middle">靠成千上万线程轮换把延迟藏起来</text>
<text x="70" y="420" font-size="12" fill="#6b7280" text-anchor="start">一个核有乱序执行、分支预测、大缓存,</text>
<text x="70" y="438" font-size="12" fill="#6b7280" text-anchor="start">跑一条指令流极快:适合「一件复杂的事快速做完」。</text>
<text x="610" y="420" font-size="12" fill="#6b7280" text-anchor="start">一个 SM 靠上千线程轮换掩盖等待,</text>
<text x="610" y="438" font-size="12" fill="#6b7280" text-anchor="start">单线程慢,但一万件简单的事一起做。</text>
<text x="30" y="506" font-size="12" fill="#6b7280" text-anchor="start">两边怎么连:GPU 自己不会启动任何工作。CPU 上的一个 Python 进程持有这张卡的 CUDA 上下文,负责把 kernel 一个个发过去(kernel launch,每次几微秒)、收结果、参加 NCCL 通信组。</text>
<text x="30" y="524" font-size="12" fill="#6b7280" text-anchor="start">decode 一步要两千个 kernel,GPU 侧十几毫秒就算完,CPU 侧光是派活也要十几毫秒 —— 1.1 那笔账的两个主角就是这两台机器;执行层这一章的大半篇幅都在讲怎么让 CPU 追上 GPU。</text>
<text x="30" y="562" font-size="12" fill="#6b7280" text-anchor="start">紫 = CPU 侧,绿 = GPU 侧,灰 = 各自的主存</text>
</svg>