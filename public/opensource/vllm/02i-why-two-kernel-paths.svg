<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一个 kernel 入口,两条内部路径:prefill 的 tile 拿来跑 decode,会空着 127 行、闲下 100 个 SM</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">8 个 query 对 8 个 key 的小例子;绿 = 真的在算,灰 = 掩掉或白算。每 tile 128 行 query 是 FlashAttention 的一档常见配置,132 是 H100 的 SM 数 —— 第三格是量级账,不是本仓库实测。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 真正要算的格子:prefill 是个下三角,decode 只有一行</text>
