<text x="738" y="278" font-size="12" fill="#6b7280" text-anchor="middle">tile 硬凑出来的空行</text>
<text x="738" y="298" font-size="12" fill="#6b7280" text-anchor="middle">数学上不存在,不是 attention 的东西</text>
<text x="76" y="412" font-size="12" fill="#6b7280" text-anchor="start">绿 36 格:真的在算(每个 query 看自己和之前的 key)</text>
<text x="76" y="434" font-size="12" fill="#6b7280" text-anchor="start">灰 28 格:看未来,掩掉不算</text>
<text x="600" y="412" font-size="12" fill="#6b7280" text-anchor="start">绿 8 格:真的在算,全部有效</text>
<text x="600" y="434" font-size="12" fill="#6b7280" text-anchor="start">虚线框:tile 里剩下的行,填什么都是白算</text>
<line x1="30" y1="462" x2="1090" y2="462" stroke="#e5e7eb"/>
<text x="30" y="494" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 把 decode 塞进 prefill 的 tile 里:128 行只有 1 行是真的</text>
<rect x="60" y="508" width="470" height="86" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="295.0" y="538.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">prefill 的一个 tile:128 行 query</text><text x="295.0" y="556.0" font-size="12" fill="#6b7280" text-anchor="middle">128 行全是真的 query</text><text x="295.0" y="574.0" font-size="12" fill="#6b7280" text-anchor="middle">tensor core 吃满</text>
<rect x="580" y="508" width="500" height="86" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="830.0" y="538.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">decode 塞进同一个 tile:1 行真,127 行白算</text><text x="830.0" y="556.0" font-size="12" fill="#6b7280" text-anchor="middle">但此时瓶颈是带宽,这些算力本来就在等数据</text><text x="830.0" y="574.0" font-size="12" fill="#6b7280" text-anchor="middle">(05 章 7.2:MHA 的 decode 算力利用率天然只有 0.34%)</text>
<line x1="30" y1="624" x2="1090" y2="624" stroke="#e5e7eb"/>
<text x="30" y="656" font-size="15" fill="#111827" text-anchor="start" font-weight="700">③ SM 占用账:一份活 = 一个 tile × 一个头。132 个 SM 全占满才算把带宽拉满</text>
<text x="430" y="682" font-size="10" fill="#6b7280" text-anchor="middle">0</text>
<text x="990" y="682" font-size="10" fill="#6b7280" text-anchor="middle">132 个 SM</text>
<text x="420" y="709" font-size="12" fill="#6b7280" text-anchor="end">prefill 2000 token:16 个 tile × 8 个头 = 128 份活</text>
<rect x="430" y="692" width="560" height="24" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="430" y="692" width="543" height="24" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="1000" y="709" font-size="11" fill="#6b7280" text-anchor="start">基本占满</text>
<text x="420" y="741" font-size="12" fill="#6b7280" text-anchor="end">decode 4 条请求:1 个 tile × 8 个头 × 4 条 = 32 份活</text>
<rect x="430" y="724" width="560" height="24" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="430" y="724" width="136" height="24" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="1000" y="741" font-size="11" fill="#6b7280" text-anchor="start">闲着 100 个</text>
<text x="420" y="773" font-size="12" fill="#6b7280" text-anchor="end">split-KV:再把每份活的 KV 切 4 段 = 128 份活</text>
<rect x="430" y="756" width="560" height="24" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="430" y="756" width="543" height="24" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="1000" y="773" font-size="11" fill="#6b7280" text-anchor="start">带宽才拉得满</text>
<text x="30" y="796" font-size="12" fill="#6b7280" text-anchor="start">7.5 的两条内部路径就是这么分出来的:query 段长度等于 1 走 split-KV,大于 1 走标准 FA。tile 怎么切、KV 怎么分段见 05 章 2.1。</text>
