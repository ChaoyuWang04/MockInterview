<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="460" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">掩码藏在 forward 背后:GPU 几十毫秒,CPU 零点几毫秒,采样等两者都到</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = GPU 在算,紫 = CPU 在算掩码,灰 = 等,黄 = 采样。上半是一步内的分叉,下半是连续几步的重叠。</text>
<rect x="40" y="100" width="150" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="115.0" y="121" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">② 调度</text><text x="115.0" y="141" font-size="11" fill="#6b7280" text-anchor="middle">产出任务单</text>
<text x="240" y="96" font-size="12" fill="#6b7280" text-anchor="start">GPU</text>
<rect x="240" y="102" width="600" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="540.0" y="124.68" font-size="13" fill="#111827" text-anchor="middle">③ forward,5 到 50 ms</text>
<text x="240" y="158" font-size="12" fill="#6b7280" text-anchor="start">CPU 主线程</text>
<rect x="240" y="164" width="60" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="270.0" y="186.68" font-size="13" fill="#111827" text-anchor="middle">④</text>
<rect x="304" y="164" width="536" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="572.0" y="186.68" font-size="13" fill="#6b7280" text-anchor="middle">⑤ 拿凭证等 GPU,闲着</text>
<rect x="900" y="118" width="180" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="990.0" y="139" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">⑥ 采样</text><text x="990.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle">mask 后</text>
<line x1="192" y1="120" x2="238" y2="110" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="192" y1="140" x2="238" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="842" y1="120" x2="898" y2="136" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="842" y1="182" x2="898" y2="160" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="240" y="224" font-size="12" fill="#6b7280" text-anchor="start">④ 算 mask 只要 0.1 到 1 ms,藏在 forward 后面完全看不见;⑤ future.result() 才真正阻塞,这时 CPU 本来也没别的事。</text>
<line x1="30" y1="246" x2="1090" y2="246" stroke="#e5e7eb"/>
<text x="30" y="274" font-size="15" fill="#111827" text-anchor="start" font-weight="700">连着看几步:forward 提前跑,采样等 bitmask 到了再补</text>
<text x="100" y="305.0" font-size="13" fill="#6b7280" text-anchor="end">GPU</text>
<rect x="110" y="286" width="197" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="208.5" y="304.32" font-size="12" fill="#111827" text-anchor="middle">forward N</text>
<rect x="310" y="286" width="67" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="343.5" y="304.32" font-size="12" fill="#111827" text-anchor="middle">采 N</text>
<rect x="380" y="286" width="197" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="478.5" y="304.32" font-size="12" fill="#111827" text-anchor="middle">forward N+1</text>
<rect x="580" y="286" width="47" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="630" y="286" width="87" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="673.5" y="304.32" font-size="12" fill="#111827" text-anchor="middle">采 N+1</text>
<rect x="720" y="286" width="197" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="818.5" y="304.32" font-size="12" fill="#111827" text-anchor="middle">forward N+2</text>
<text x="100" y="351.0" font-size="13" fill="#6b7280" text-anchor="end">CPU</text>
<rect x="110" y="332" width="267" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="243.5" y="350.32" font-size="12" fill="#6b7280" text-anchor="middle">已提交 N+1 的 forward,等 N</text>
<rect x="380" y="332" width="127" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="443.5" y="350.32" font-size="12" fill="#111827" text-anchor="middle">写回 N 的 token</text>
<rect x="510" y="332" width="117" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="568.5" y="350.32" font-size="12" fill="#111827" text-anchor="middle">算 bitmask N+1</text>
<rect x="630" y="332" width="117" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="688.5" y="350.32" font-size="12" fill="#111827" text-anchor="middle">提交采样 N+1</text>
<line x1="680" y1="330" x2="680" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="110" y="388" font-size="12" fill="#6b7280" text-anchor="start">forward 只看 token 序列和 KV,不需要 bitmask,所以第 N 步的 token 还没出来它就能开跑;采样需要 bitmask,bitmask 需要第 N 步的真实 token,</text>
<text x="110" y="406" font-size="12" fill="#6b7280" text-anchor="start">所以采样被推迟到 CPU 补完才提交。bitmask 只要零点几毫秒,forward 要几十毫秒,所以 GPU 那点等待很短,重叠基本保住(5.7 讲什么时候会失效)。</text>
<text x="30" y="440" font-size="12" fill="#6b7280" text-anchor="start">绿 = GPU 前向,黄 = 采样,紫 = CPU 算掩码 / 写回,灰 = 等</text>
</svg>