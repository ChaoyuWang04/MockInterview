<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一卡一进程:一张 GPU 由 CPU 上的一个进程来管,它持有这张卡的 CUDA 上下文</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">一台机器(node)上,API 进程和 EngineCore 进程不碰 GPU;每张卡各有一个 GPU 进程往上发 kernel、收结果、参加 NCCL 通信组。</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">它们都是普通 Python 进程,由操作系统调度器放到核上跑。</text>
<rect x="40" y="90" width="1040" height="380" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="60" y="112" font-size="13" fill="#6b7280" text-anchor="start">一台机器(node)</text>
<rect x="60" y="128" width="1000" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="152.68" font-size="13" fill="#6b7280" text-anchor="middle">CPU 几十个核 + 操作系统调度器:把醒着的进程轮流放到空闲核上跑;进程不绑定核,在等 GPU 算完的进程不占核</text>
<rect x="60" y="196" width="150" height="60" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="135.0" y="231.04" font-size="14" fill="#111827" text-anchor="middle">API 进程</text>
<line x1="212" y1="226" x2="258" y2="226" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="260" y="196" width="190" height="60" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="355.0" y="231.04" font-size="14" fill="#111827" text-anchor="middle">EngineCore 进程</text>
<line x1="452" y1="226" x2="498" y2="226" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="500" y="196" width="150" height="60" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="575.0" y="231.04" font-size="14" fill="#111827" text-anchor="middle">GPU 进程 0</text>
<line x1="575" y1="258" x2="575" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="500" y="320" width="150" height="60" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="575.0" y="355.4" font-size="15" fill="#111827" text-anchor="middle">GPU 0</text>
<line x1="575" y1="380" x2="575" y2="400" stroke="#5fa886" stroke-width="1.4"/>
<rect x="690" y="196" width="150" height="60" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="765.0" y="231.04" font-size="14" fill="#111827" text-anchor="middle">GPU 进程 1</text>
<line x1="765" y1="258" x2="765" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="690" y="320" width="150" height="60" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="765.0" y="355.4" font-size="15" fill="#111827" text-anchor="middle">GPU 1</text>
<line x1="765" y1="380" x2="765" y2="400" stroke="#5fa886" stroke-width="1.4"/>
<rect x="880" y="196" width="150" height="60" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="955.0" y="231.04" font-size="14" fill="#111827" text-anchor="middle">GPU 进程 2</text>
<line x1="955" y1="258" x2="955" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="880" y="320" width="150" height="60" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="955.0" y="355.4" font-size="15" fill="#111827" text-anchor="middle">GPU 2</text>
<line x1="955" y1="380" x2="955" y2="400" stroke="#5fa886" stroke-width="1.4"/>
<rect x="500" y="400" width="530" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="765.0" y="424.68" font-size="13" fill="#111827" text-anchor="middle">NVLink:TP 的 all-reduce 直接在 GPU 之间走,不经过 CPU</text>
<text x="60" y="296" font-size="12" fill="#6b7280" text-anchor="start">左边两个进程不碰 GPU:一个收请求、切词、回包,</text>
<text x="60" y="314" font-size="12" fill="#6b7280" text-anchor="start">一个调度、派活、采样(单卡时 EngineCore 进程</text>
<text x="60" y="332" font-size="12" fill="#6b7280" text-anchor="start">自己就是那个 GPU 进程,不另起)。</text>
<text x="60" y="366" font-size="12" fill="#6b7280" text-anchor="start">右边每个进程持有一张卡的 CUDA 上下文:</text>
<text x="60" y="384" font-size="12" fill="#6b7280" text-anchor="start">往这张卡发 kernel、收结果、参加 NCCL 通信组。</text>
<text x="60" y="418" font-size="12" fill="#6b7280" text-anchor="start">进程与核没有固定对应:进程是操作系统里的一个数据</text>
<text x="60" y="436" font-size="12" fill="#6b7280" text-anchor="start">结构,核是硬件,中间靠调度器随时搭配。</text>
<text x="30" y="504" font-size="12" fill="#6b7280" text-anchor="start">进程数怎么数:单进程模式是 1;多进程模式是前端 1 个 + 引擎 1 个起步,模型切到多张卡时每张卡再加一个 GPU 进程,所以是「2 起」。</text>
<text x="30" y="522" font-size="12" fill="#6b7280" text-anchor="start">上一张进程拓扑图画的是这些进程之间传什么,这张画的是它们各自坐在什么硬件上。</text>
<text x="30" y="548" font-size="12" fill="#6b7280" text-anchor="start">紫 = CPU 上的进程,绿 = GPU 侧,箭头 = 谁指挥谁</text>
</svg>