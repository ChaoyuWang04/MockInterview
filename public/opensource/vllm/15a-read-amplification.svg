<title>同一份权重在三个层次上被放大了不同的倍数:磁盘只搬 141 GB,内存总线上流动 1128 GB,而真正被用上的仍然只有 141 GB</title>
<rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
<text x="60" y="46" font-size="21" font-weight="700" fill="#1a1a1a">同一份权重,在三个层次上被放大了不同的倍数</text>
<text x="60" y="74" font-size="14" fill="#666666">70B 模型 141 GB bf16,张量并行度 8。条带高度 = 该层实际搬运的字节数,全图同一把尺子;</text>
<text x="60" y="94" font-size="14" fill="#666666">每条 lane 切成 8 格 = 一个张量的 8 段,只有实心那一格是这个 rank 留下的。</text>
<text x="125" y="118" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">磁盘</text>
<text x="365" y="118" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">页缓存</text>
<text x="365" y="136" font-size="12" fill="#888888" text-anchor="middle">整机共享</text>
<text x="710" y="136" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">8 个 worker 进程各读一遍全部</text>
<text x="1035" y="118" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">真正用上</text>
