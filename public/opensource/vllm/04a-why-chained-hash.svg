<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">为什么钥匙必须包含前面:第三块 token 一模一样,K、V 却从第 2 层起就不一样</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">红 / 黄 = 不同内容,绿 = 相同内容,灰 = 排在分叉点之后、一律不命中。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 序列 A 和 B:前两块不同,第三块的 16 个 token 完全相同、位置也相同</text>
<text x="280" y="120" font-size="11" fill="#6b7280" text-anchor="middle">块 1</text>
<text x="496" y="120" font-size="11" fill="#6b7280" text-anchor="middle">块 2</text>
<text x="712" y="120" font-size="11" fill="#6b7280" text-anchor="middle">块 3(相同)</text>
<text x="160" y="152" font-size="12" fill="#6b7280" text-anchor="end">A 的 token</text>
<rect x="190" y="130" width="180" height="34" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="280.0" y="151.32" font-size="12" fill="#111827" text-anchor="middle">我 吃了 一个</text>
<rect x="406" y="130" width="180" height="34" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="496.0" y="151.32" font-size="12" fill="#111827" text-anchor="middle">很 甜 的</text>
<rect x="622" y="130" width="180" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="712.0" y="151.32" font-size="12" fill="#111827" text-anchor="middle">苹果 …</text>
<text x="160" y="196" font-size="12" fill="#6b7280" text-anchor="end">B 的 token</text>
<rect x="190" y="174" width="180" height="34" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="280.0" y="195.32" font-size="12" fill="#111827" text-anchor="middle">这家 公司</text>
<rect x="406" y="174" width="180" height="34" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="496.0" y="195.32" font-size="12" fill="#111827" text-anchor="middle">名字 叫</text>
<rect x="622" y="174" width="180" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="712.0" y="195.32" font-size="12" fill="#111827" text-anchor="middle">苹果 …</text>
<text x="30" y="246" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 块 3 里「苹果」的 K、V,A 和 B 一样吗?</text>
<text x="160" y="280" font-size="12" fill="#6b7280" text-anchor="end">第 1 层</text>
<rect x="190" y="258" width="540" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="460.0" y="279.32" font-size="12" fill="#111827" text-anchor="middle">一样:只看 embedding[苹果] + 位置,前面是什么无关</text>
<text x="160" y="320" font-size="12" fill="#6b7280" text-anchor="end">第 2 层</text>
<rect x="190" y="298" width="540" height="34" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="460.0" y="319.32" font-size="12" fill="#111827" text-anchor="middle">不一样:输入是第 1 层 attention 的输出</text>
<text x="160" y="360" font-size="12" fill="#6b7280" text-anchor="end">第 3 层…</text>
<rect x="190" y="338" width="540" height="34" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="460.0" y="359.32" font-size="12" fill="#111827" text-anchor="middle">不一样:越往上混得越多</text>
<text x="760" y="300" font-size="12" fill="#6b7280" text-anchor="start">第 1 层的 attention 让「苹果」看到了</text>
<text x="760" y="318" font-size="12" fill="#6b7280" text-anchor="start">「吃了 很甜的」或「公司 名字叫」</text>
<text x="760" y="336" font-size="12" fill="#6b7280" text-anchor="start">A 里它是水果,B 里它是公司</text>
<text x="60" y="400" font-size="12" fill="#6b7280" text-anchor="start">80 层里 79 层的 K、V 都不一样,只有第 1 层碰巧一样。块 3 整体不能复用。所以钥匙必须能区分「前面是什么」:</text>
<text x="60" y="420" font-size="12" fill="#6b7280" text-anchor="start">hash(块 3 的 token) 不够,要 hash(块 2 的 hash, 块 3 的 token),而块 2 的 hash 又包含块 1 的 —— 一处不同,后面所有块的钥匙全变。</text>
<line x1="30" y1="442" x2="1090" y2="442" stroke="#e5e7eb"/>
<text x="30" y="472" font-size="15" fill="#111827" text-anchor="start" font-weight="700">③ 同样的道理落到 RAG 上:文档 3 在两条 prompt 里一模一样,但排在分叉点后面,照样重算</text>
<text x="60" y="500" font-size="12" fill="#111827" text-anchor="start" font-weight="700">问题 A 的 prompt</text>
<rect x="60" y="508" width="190" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="155.0" y="530.68" font-size="13" fill="#111827" text-anchor="middle">系统提示</text>
<rect x="268" y="508" width="190" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="363.0" y="530.68" font-size="13" fill="#111827" text-anchor="middle">文档 5</text>
<rect x="476" y="508" width="190" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="571.0" y="530.68" font-size="13" fill="#111827" text-anchor="middle">文档 12</text>
<rect x="684" y="508" width="190" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="779.0" y="530.68" font-size="13" fill="#111827" text-anchor="middle">文档 3</text>
<rect x="892" y="508" width="190" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="987.0" y="530.68" font-size="13" fill="#111827" text-anchor="middle">问题 A</text>
<text x="60" y="570" font-size="12" fill="#111827" text-anchor="start" font-weight="700">问题 B 的 prompt</text>
<rect x="60" y="578" width="190" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="155.0" y="600.68" font-size="13" fill="#111827" text-anchor="middle">系统提示</text>
<rect x="268" y="578" width="190" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="363.0" y="600.68" font-size="13" fill="#111827" text-anchor="middle">文档 5</text>
<rect x="476" y="578" width="190" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="571.0" y="600.68" font-size="13" fill="#111827" text-anchor="middle">文档 7</text>
<rect x="684" y="578" width="190" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="779.0" y="600.68" font-size="13" fill="#111827" text-anchor="middle">文档 3</text>
<rect x="892" y="578" width="190" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="987.0" y="600.68" font-size="13" fill="#111827" text-anchor="middle">问题 B</text>
<text x="60" y="652" font-size="12" fill="#6b7280" text-anchor="start">绿 = 命中;红 = 第一个分叉点;灰 = 分叉点之后一律不命中。想让公共文档命中,得把它们排在变动内容前面,这是前缀缓存对 prompt 编排的唯一要求。</text>
</svg>