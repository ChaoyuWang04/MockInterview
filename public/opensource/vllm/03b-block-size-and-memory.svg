<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一个 block 有多大、一张卡能放多少块、TP 下 8 张卡各存一个头</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">Llama-3-70B,80 层,8 个 KV 头,head_dim 128,FP16,TP=8,单卡视角。数字是按公式算的量级,启动时的实测值以 3.4 的探测为准。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 1 个 block = 16 个 token 的位置</text>
<rect x="60" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="122" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="184" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="246" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="308" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="370" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="432" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="494" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="556" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="618" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="680" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="742" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="804" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="866" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="928" y="108" width="58" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="990" y="108" width="58" height="40" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="556" y="133" font-size="12" fill="#111827" text-anchor="middle">16 个位置,每个位置放 1 个 token 在这张卡上的全部 K、V</text>
<line x1="1049" y1="150" x2="1049" y2="168" stroke="#d4a24c" stroke-width="1.4"/>
<text x="60" y="186" font-size="13" fill="#111827" text-anchor="start" font-weight="700">放大其中一个位置:</text>
<rect x="60" y="196" width="1000" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="213.32" font-size="12" fill="#6b7280" text-anchor="middle">第 1 层:K 向量 128 个数 + V 向量 128 个数 = 256 × 2 字节 = 512 B</text>
<rect x="60" y="228" width="1000" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="245.32" font-size="12" fill="#6b7280" text-anchor="middle">第 2 层:同样 512 B</text>
<text x="560" y="274" font-size="12" fill="#111827" text-anchor="middle">… 一直到第 80 层,每层各自一份 → 一个位置 = 80 × 512 B = 40 KB;一个块 = 16 × 40 KB = 640 KB</text>
<text x="60" y="298" font-size="12" fill="#6b7280" text-anchor="start">128 = 1 个 KV 头 × head_dim 128。8 个 KV 头被 8 张卡分掉,这张卡只存 1 个头;8 张卡合起来一个块是 5 MB。</text>
<line x1="30" y1="318" x2="1090" y2="318" stroke="#e5e7eb"/>
<text x="30" y="348" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 每一层:8 个 KV 头 → 8 张卡各存 1 个;一个 token 的完整 KV 分散在 8 张卡上</text>
<rect x="60" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="117.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 0</text><text x="117.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 0</text>
<rect x="187" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="244.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 1</text><text x="244.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 1</text>
<rect x="314" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="371.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 2</text><text x="371.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 2</text>
<rect x="441" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="498.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 3</text><text x="498.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 3</text>
<rect x="568" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="625.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 4</text><text x="625.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 4</text>
<rect x="695" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="752.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 5</text><text x="752.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 5</text>
<rect x="822" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="879.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 6</text><text x="879.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 6</text>
<rect x="949" y="360" width="115" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="1006.5" y="381" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">卡 7</text><text x="1006.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">头 7</text>
<text x="60" y="436" font-size="12" fill="#6b7280" text-anchor="start">每张卡:80 层全有,每层只有自己那 1 个头的 Wk、Wv 切片,算出来的 k、v 只存在本卡。</text>
<rect x="60" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="185" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="310" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="435" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="560" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="685" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="810" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="935" y="452" width="122" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="560" y="472" font-size="12" fill="#111827" text-anchor="middle">一个 token 的完整 KV = 8 张卡 × 40 KB = 320 KB</text>
<text x="60" y="506" font-size="12" fill="#6b7280" text-anchor="start">所以单卡「能装 142 万 token」就是整个 8 卡组能装 142 万 token,不用再乘 8:每张卡装的是同一批 token 的不同头,不是不同批 token(09 章 2.13)。</text>
<line x1="30" y1="526" x2="1090" y2="526" stroke="#e5e7eb"/>
<text x="30" y="556" font-size="15" fill="#111827" text-anchor="start" font-weight="700">③ 单卡 80 GB,gpu_memory_utilization = 0.92:探测跑一遍,剩下的全切成块</text>
<text x="50" y="595.0" font-size="13" fill="#6b7280" text-anchor="end"></text>
<rect x="60" y="570" width="77.0" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="98.5" y="594.68" font-size="13" fill="#6b7280" text-anchor="middle">不碰 6.4</text>
<rect x="140.0" y="570" width="215.75" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="247.875" y="594.68" font-size="13" fill="#111827" text-anchor="middle">权重 17.5</text>
<rect x="358.75" y="570" width="34.5" height="40" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="376.0" y="594.68" font-size="13" fill="#111827" text-anchor="middle">激活</text>
<rect x="396.25" y="570" width="660.75" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="726.625" y="594.68" font-size="13" fill="#111827" text-anchor="middle">KV cache 53.1 GB → 约 8.7 万块</text>
<text x="60" y="640" font-size="12" fill="#6b7280" text-anchor="start">灰:0.08 × 80 留给 CUDA 上下文、别的进程和安全余量。紫 + 黄:探测跑一遍量出来的「非 KV 显存」20.5 GB,黄色随 max_num_batched_tokens 变大(06 章 Part 5)。</text>
<text x="60" y="660" font-size="12" fill="#6b7280" text-anchor="start">绿:requested 73.6 − 20.5 = 53.1 GB,全部切成 640 KB 的块,约 8.7 万块 × 16 = 约 142 万个 token 的位置;并发能开多大就从这里算(7.2)。</text>
<text x="30" y="740" font-size="12" fill="#6b7280" text-anchor="start">绿 = KV cache / 本卡存的头,黄 = 被放大的那个位置 / 激活,紫 = 权重,灰 = 留白与每层的字节数</text>
</svg>