<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一步的隐状态只是 1526 行数字:逐行算子看不见序列,只有 attention 要靠 cu_seqlens 分段</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">四条请求同一步:A、B 各 1 行(decode),C 500 行、D 1024 行(prefill)。绿 / 紫 = 真实的行,灰 = 填充。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">padding 方式:[4 × 1024],短的补零到最长</text>
<text x="70" y="124" font-size="12" fill="#6b7280" text-anchor="end">A</text>
<rect x="80.95703125" y="106" width="979.04296875" height="24" rx="2" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="70" y="154" font-size="12" fill="#6b7280" text-anchor="end">B</text>
<rect x="80.95703125" y="136" width="979.04296875" height="24" rx="2" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="70" y="184" font-size="12" fill="#6b7280" text-anchor="end">C</text>
<rect x="80" y="166" width="478.515625" height="24" rx="2" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="558.515625" y="166" width="501.484375" height="24" rx="2" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="70" y="214" font-size="12" fill="#6b7280" text-anchor="end">D</text>
<rect x="80" y="196" width="980.0" height="24" rx="2" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="570" y="244" font-size="12" fill="#6b7280" text-anchor="middle">4096 个格子里只有 1526 个是真的,63% 算的是填充</text>
<text x="30" y="282" font-size="15" fill="#111827" text-anchor="start" font-weight="700">varlen 方式:[1526],首尾相接,不补零</text>
<rect x="80" y="292" width="2" height="24" rx="1" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="83" y="292" width="2" height="24" rx="1" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="86" y="292" width="318.10091743119267" height="24" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="245.05045871559633" y="308.32" font-size="12" fill="#111827" text-anchor="middle">C 500</text>
<rect x="407.10091743119267" y="292" width="654.6146788990826" height="24" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="734.4082568807339" y="308.32" font-size="12" fill="#111827" text-anchor="middle">D 1024</text>
<text x="84" y="334" font-size="11" fill="#6b7280" text-anchor="middle">A B</text>
<text x="570" y="334" font-size="12" fill="#6b7280" text-anchor="middle">cu_seqlens_q = [0, 1, 2, 502, 1526]:第 i 段占的行是 [cu[i], cu[i+1]),这就是「分界线」的全部</text>
<line x1="30" y1="356" x2="1090" y2="356" stroke="#e5e7eb"/>
<text x="30" y="386" font-size="15" fill="#111827" text-anchor="start" font-weight="700">这一步的隐状态 [1526 × 8192]:矩阵本身没有分界线</text>
<rect x="60" y="400" width="180" height="16" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="248" y="412" font-size="11" fill="#6b7280" text-anchor="start">A 1 行</text>
<rect x="60" y="418" width="180" height="16" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="248" y="430" font-size="11" fill="#6b7280" text-anchor="start">B 1 行</text>
<rect x="60" y="436" width="180" height="80" rx="2" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="150" y="480" font-size="12" fill="#111827" text-anchor="middle">C 500 行</text>
<rect x="60" y="518" width="180" height="160" rx="2" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="150" y="602" font-size="12" fill="#111827" text-anchor="middle">D 1024 行</text>
<text x="150" y="700" font-size="11" fill="#6b7280" text-anchor="middle">只是 1526 行数字</text>
<line x1="242" y1="470" x2="398" y2="450" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="400" y="400" width="680" height="96" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="740.0" y="435.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">逐行算子:看不见序列,也不需要看见</text><text x="740.0" y="453.0" font-size="11" fill="#6b7280" text-anchor="middle">embedding、RMSNorm、残差加:每行自己算自己;QKV / O / FFN / lm_head:矩阵乘,行与行互不相干</text><text x="740.0" y="471.0" font-size="11" fill="#6b7280" text-anchor="middle">1526 行来自 4 个请求还是 1 个,算法一样,代价一样</text>
<line x1="242" y1="590" x2="398" y2="590" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="400" y="516" width="680" height="160" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="740.0" y="574.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">attention:唯一要把行和序列对上的算子</text><text x="740.0" y="592.0" font-size="11" fill="#6b7280" text-anchor="middle">额外拿三份元数据:cu_seqlens_q 行怎么分段;block_table 每个序列的 KV 在哪些块;seq_lens 每个序列有多少历史要看</text><text x="740.0" y="610.0" font-size="11" fill="#6b7280" text-anchor="middle">A 的 1 个 q 只对 A 的 KV 打分,D 的 1024 个 q 只对 D 的</text><text x="740.0" y="628.0" font-size="11" fill="#6b7280" text-anchor="middle">段长 1 走带宽瓶颈的路,段长 1024 走算力瓶颈的路 —— 同一次 kernel 调用,按段选路(7.5)</text>
<text x="30" y="730" font-size="12" fill="#6b7280" text-anchor="start">黄 / 绿 / 紫 = 各请求的真实行,灰 = 填充或看不见序列的算子;分段索引怎么建见 7.4</text>
</svg>