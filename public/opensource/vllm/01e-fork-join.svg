<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一个 step 内的分叉与合流:调度输出同时喂给 GPU 前向和 CPU 语法掩码,在采样处合流</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = EngineCore 主线程(CPU),灰 = GPU Worker,黄 = 合流点。两条路各自只看自己需要的输入,所以能并行;主线程直到 ⑤ 才第一次等 GPU。</text>
<rect x="410" y="90" width="300" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="111" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">② schedule()</text><text x="560.0" y="131" font-size="11" fill="#6b7280" text-anchor="middle">产出 SchedulerOutput:这一步算哪些请求、各算多少 token</text>
<polyline points="560,142 560,170 240,170 240,198" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="309.7" y="154.65" width="180.6" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="400.0" y="165.65" font-size="11" fill="#6b7280" text-anchor="middle">fork ③ · 非阻塞下发,立刻返回</text>
<polyline points="560,170 880,170 880,198" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="654.78" y="154.65" width="130.44" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="720.0" y="165.65" font-size="11" fill="#6b7280" text-anchor="middle">fork ④ · 同一份输入</text>
<rect x="60" y="200" width="360" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="240.0" y="221" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">③ 模型前向(GPU)</text><text x="240.0" y="241" font-size="11" fill="#6b7280" text-anchor="middle">只看 token_ids 与 KV;CUDA kernel 期间释放 GIL</text>
<rect x="700" y="200" width="360" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="880.0" y="221" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">④ 算 grammar bitmask(CPU)</text><text x="880.0" y="241" font-size="11" fill="#6b7280" text-anchor="middle">只看已生成的 token 序列;xgrammar C++,不碰 GPU</text>
<text x="240" y="290" font-size="11" fill="#6b7280" text-anchor="middle">十几毫秒,GPU 在算的时候主线程去做 ④</text>
<text x="880" y="290" font-size="11" fill="#6b7280" text-anchor="middle">没有结构化输出的请求这一步为空</text>
<polyline points="240,264 240,346 408,346" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="233.46" y="330.65" width="133.07999999999998" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="300.0" y="341.65" font-size="11" fill="#6b7280" text-anchor="middle">logits(留在 GPU 上)</text>
<polyline points="880,264 880,346 712,346" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="747.3" y="330.65" width="145.4" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="820.0" y="341.65" font-size="11" fill="#6b7280" text-anchor="middle">bitmask(numpy,跨进程)</text>
<rect x="410" y="320" width="300" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="560.0" y="341" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">⑤ 合流</text><text x="560.0" y="361" font-size="11" fill="#6b7280" text-anchor="middle">等前向的 future 返回,再带着 bitmask 发采样</text>
<line x1="560" y1="372" x2="560" y2="418" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="572" y="386.65" width="155.52" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="649.76" y="397.65" font-size="11" fill="#6b7280" text-anchor="middle">sample_tokens(bitmask)</text>
<rect x="410" y="420" width="300" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="441" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">⑥⑦ 压非法位 → 采样</text><text x="560.0" y="461" font-size="11" fill="#6b7280" text-anchor="middle">在 GPU Worker 上做:非法 token 置 −inf,再采样</text>
<text x="30" y="514" font-size="12" fill="#6b7280" text-anchor="start">为什么能分叉:④ 只依赖已生成的 token 序列,不看 logits 也不看 KV;③ 不看语法。两者唯一的交点就是采样那一步,所以掩码可以整段藏在前向背后。</text>
<text x="30" y="534" font-size="12" fill="#6b7280" text-anchor="start">主线程这一步的四个动作按顺序是:非阻塞下发前向 → 算掩码 → 等前向结果 → 带掩码发采样;掩码怎么算、大并发下怎么并行填,见 12 章。</text>
<text x="30" y="572" font-size="12" fill="#6b7280" text-anchor="start">绿 = EngineCore 主线程(CPU),灰 = GPU Worker,黄 = 合流点</text>
</svg>