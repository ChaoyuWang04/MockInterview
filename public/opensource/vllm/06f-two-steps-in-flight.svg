<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两步同时在飞时,CPU 这一侧和 GPU 那一条流各自在做什么</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = CPU 在干活,红 = GPU 在重放图,灰 = 拷贝或等待。两条道同一刻度。队列长度 2,所以最多两步同时在飞(7.4)。</text>
<text x="30" y="98" font-size="15" fill="#111827" text-anchor="start" font-weight="700">CPU(永远不等)</text>
<rect x="60" y="110" width="264" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="192.0" y="138.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">准备 N:填 pinned A</text><text x="192.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle">排 H2D(A)、排 replay 图 N</text>
<rect x="330" y="110" width="274" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="467.0" y="138.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">准备 N+1:填 pinned B</text><text x="467.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle">排 H2D(B)、排 replay 图 N+1</text>
<rect x="610" y="110" width="214" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="717.0" y="138.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">队列满了</text><text x="717.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle">等图 N 完成、拿结果</text>
<rect x="830" y="110" width="274" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="967.0" y="138.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">准备 N+2:填 pinned A</text><text x="967.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle">(A 已被 GPU 读走,安全)</text>
<text x="30" y="208" font-size="15" fill="#111827" text-anchor="start" font-weight="700">GPU stream(按排队顺序执行,不空)</text>
<rect x="60" y="220" width="74" height="46" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="97.0" y="247.32" font-size="12" fill="#6b7280" text-anchor="middle">H2D A</text>
<rect x="140" y="220" width="384" height="46" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="332.0" y="247.32" font-size="12" fill="#111827" text-anchor="middle">replay 图 N(几百个 kernel)</text>
<rect x="530" y="220" width="74" height="46" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="567.0" y="247.32" font-size="12" fill="#6b7280" text-anchor="middle">H2D B</text>
<rect x="610" y="220" width="384" height="46" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="802.0" y="247.32" font-size="12" fill="#111827" text-anchor="middle">replay 图 N+1</text>
<rect x="1000" y="220" width="104" height="46" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="1052.0" y="247.32" font-size="12" fill="#6b7280" text-anchor="middle">H2D A</text>
<line x1="60" y1="292" x2="1080" y2="292" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="296" font-size="11" fill="#6b7280" text-anchor="end">时间</text>
<text x="30" y="330" font-size="12" fill="#6b7280" text-anchor="start">图的 static buffer 只有一份也不会打架:H2D(B) 排在图 N 后面,GPU 执行到它时图 N 早就把输入读完了 —— 同一条流保证顺序。</text>
<text x="30" y="354" font-size="12" fill="#6b7280" text-anchor="start">pinned 那一侧才必须轮转两份:CPU 写的时候 DMA 可能还在读同一块内存,那是写后读竞争(8.3 那张图讲的就是这个)。</text>
<text x="30" y="378" font-size="12" fill="#6b7280" text-anchor="start">重放前没有额外的「把数据拷进静态缓冲」那一步:静态缓冲就是这批常驻的输入缓冲区,H2D 直接写进去(10.9 更正过这一点)。</text>
<text x="30" y="442" font-size="12" fill="#6b7280" text-anchor="start">绿 = CPU 在干活,红 = GPU 在重放图,灰 = 拷贝或等待</text>
</svg>