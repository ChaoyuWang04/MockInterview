<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一步 forward 的算子带:FULL 整条录成一张图,PIECEWISE 按 attention 切开各录一张</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">画 3 层。灰 = 非注意力算子,紫 = attention;绿框 = 一张 CUDA Graph 的范围。</text>
<text x="30" y="100" font-size="13" fill="#111827" text-anchor="start" font-weight="700">一步 forward 的算子带</text>
<rect x="60" y="108" width="96" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="108.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">嵌入</text>
<rect x="160" y="108" width="116" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="218.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">norm QKV</text>
<rect x="280" y="108" width="86" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="323.0" y="130.32" font-size="12" fill="#111827" text-anchor="middle">attn</text>
<rect x="370" y="108" width="116" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="428.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">FFN QKV</text>
<rect x="490" y="108" width="86" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="533.0" y="130.32" font-size="12" fill="#111827" text-anchor="middle">attn</text>
<rect x="580" y="108" width="116" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="638.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">FFN QKV</text>
<rect x="700" y="108" width="86" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="743.0" y="130.32" font-size="12" fill="#111827" text-anchor="middle">attn</text>
<rect x="790" y="108" width="116" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="848.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">FFN</text>
<rect x="910" y="108" width="106" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="963.0" y="130.32" font-size="12" fill="#6b7280" text-anchor="middle">lm_head</text>
<text x="30" y="182" font-size="15" fill="#111827" text-anchor="start" font-weight="700">FULL:整条录成 1 张图,attention 也在里面</text>
<rect x="60" y="192" width="956" height="44" rx="6" fill="#ffffff" stroke="#5fa886" stroke-width="1"/>
<rect x="61" y="193" width="954" height="42" rx="5" fill="#e3f4ec" stroke="none" stroke-width="1"/>
<text x="538" y="220" font-size="12" fill="#111827" text-anchor="middle">一张图,一次下发,CPU 开销最低</text>
<text x="60" y="258" font-size="12" fill="#6b7280" text-anchor="start">只能给「所有请求段长相同」的 batch 用,因为 attention 的 kernel 选择被冻在图里了(2.5、4.2)</text>
<text x="30" y="296" font-size="15" fill="#111827" text-anchor="start" font-weight="700">PIECEWISE:按 attention 切开,段与段各录一张,attention 现场发</text>
<rect x="60" y="306" width="216" height="44" rx="6" fill="#ffffff" stroke="#5fa886" stroke-width="1"/>
<rect x="280" y="306" width="86" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="323.0" y="332.32" font-size="12" fill="#111827" text-anchor="middle">eager</text>
<rect x="370" y="306" width="116" height="44" rx="6" fill="#ffffff" stroke="#5fa886" stroke-width="1"/>
<rect x="490" y="306" width="86" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="533.0" y="332.32" font-size="12" fill="#111827" text-anchor="middle">eager</text>
<rect x="580" y="306" width="116" height="44" rx="6" fill="#ffffff" stroke="#5fa886" stroke-width="1"/>
<rect x="700" y="306" width="86" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="743.0" y="332.32" font-size="12" fill="#111827" text-anchor="middle">eager</text>
<rect x="790" y="306" width="226" height="44" rx="6" fill="#ffffff" stroke="#5fa886" stroke-width="1"/>
<text x="60" y="372" font-size="12" fill="#6b7280" text-anchor="start">80 层就是 81 张小图 + 80 次现场发 attention;任何 batch 组成都能用,代价是多了 80 次启动(4.3 讲切图,4.5 讲怎么缝)</text>
<text x="30" y="412" font-size="12" fill="#6b7280" text-anchor="start">灰 = 非注意力算子,紫 = attention,绿框 = 一张图的范围</text>
</svg>