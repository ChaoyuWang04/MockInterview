<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="400" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">流水线并行:一次只跑一个 batch 两张卡轮流空转,同时跑两个 batch 交错后只剩开头一个空格</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">两张卡各持一半的层。绿 = batch A,紫 = batch B,灰 = 空转;A、B 是两批不同的请求。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">一次只跑一个 batch:两张卡轮流空转</text>
<text x="170" y="127.0" font-size="13" fill="#6b7280" text-anchor="end">GPU 1 前半层</text>
<rect x="180" y="108" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="266.5" y="126.32" font-size="12" fill="#111827" text-anchor="middle">A</text>
<rect x="356" y="108" width="173" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="442.5" y="126.32" font-size="12" fill="#6b7280" text-anchor="middle">空</text>
<rect x="532" y="108" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="618.5" y="126.32" font-size="12" fill="#111827" text-anchor="middle">B</text>
<rect x="708" y="108" width="173" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="794.5" y="126.32" font-size="12" fill="#6b7280" text-anchor="middle">空</text>
<rect x="884" y="108" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="970.5" y="126.32" font-size="12" fill="#111827" text-anchor="middle">A 下一步</text>
<text x="170" y="163.0" font-size="13" fill="#6b7280" text-anchor="end">GPU 2 后半层</text>
<rect x="180" y="144" width="173" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="266.5" y="162.32" font-size="12" fill="#6b7280" text-anchor="middle">空</text>
<rect x="356" y="144" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="442.5" y="162.32" font-size="12" fill="#111827" text-anchor="middle">A</text>
<rect x="532" y="144" width="173" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="618.5" y="162.32" font-size="12" fill="#6b7280" text-anchor="middle">空</text>
<rect x="708" y="144" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="794.5" y="162.32" font-size="12" fill="#111827" text-anchor="middle">B</text>
<rect x="884" y="144" width="173" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="970.5" y="162.32" font-size="12" fill="#6b7280" text-anchor="middle">空</text>
<text x="30" y="214" font-size="15" fill="#111827" text-anchor="start" font-weight="700">同时跑两个 batch 交错:只有开头一个空格</text>
<text x="170" y="245.0" font-size="13" fill="#6b7280" text-anchor="end">GPU 1 前半层</text>
<rect x="180" y="226" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="266.5" y="244.32" font-size="12" fill="#111827" text-anchor="middle">A</text>
<rect x="356" y="226" width="173" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="442.5" y="244.32" font-size="12" fill="#111827" text-anchor="middle">B</text>
<rect x="532" y="226" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="618.5" y="244.32" font-size="12" fill="#111827" text-anchor="middle">A 下一步</text>
<rect x="708" y="226" width="173" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="794.5" y="244.32" font-size="12" fill="#111827" text-anchor="middle">B 下一步</text>
<rect x="884" y="226" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="970.5" y="244.32" font-size="12" fill="#111827" text-anchor="middle">A …</text>
<text x="170" y="281.0" font-size="13" fill="#6b7280" text-anchor="end">GPU 2 后半层</text>
<rect x="180" y="262" width="173" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="266.5" y="280.32" font-size="12" fill="#6b7280" text-anchor="middle">空</text>
<rect x="356" y="262" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="442.5" y="280.32" font-size="12" fill="#111827" text-anchor="middle">A</text>
<rect x="532" y="262" width="173" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="618.5" y="280.32" font-size="12" fill="#111827" text-anchor="middle">B</text>
<rect x="708" y="262" width="173" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="794.5" y="280.32" font-size="12" fill="#111827" text-anchor="middle">A 下一步</text>
<rect x="884" y="262" width="173" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="970.5" y="280.32" font-size="12" fill="#111827" text-anchor="middle">B 下一步</text>
<text x="180" y="318" font-size="12" fill="#6b7280" text-anchor="start">几张卡就要几个 batch 同时在飞,这就是 batch queue 的长度 = PP 大小(3.7 讲它什么时候不等于);只有一条请求时没有第二个 batch,气泡填不上(3.5)。</text>
<text x="30" y="372" font-size="12" fill="#6b7280" text-anchor="start">绿 = batch A,紫 = batch B,灰 = 空转</text>
</svg>