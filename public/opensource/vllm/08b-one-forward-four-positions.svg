<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一次 forward 同时得到 4 个位置的分布:每个位置只用它前面的输入,所以互不依赖</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">沿用 1.3 的例子:上一步采出「只」,草稿模型接着猜了「猫、在、沙」。灰 = 已确定的 token,红 = 待验证的草稿。</text>
<text x="40" y="100" font-size="15" fill="#111827" text-anchor="start" font-weight="700">大模型这一步的输入:4 个 token,一次 forward</text>
<rect x="40" y="112" width="250" height="54" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="165.0" y="144.4" font-size="15" fill="#111827" text-anchor="middle">只(上步采出)</text>
<rect x="306" y="112" width="250" height="54" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="431.0" y="144.4" font-size="15" fill="#111827" text-anchor="middle">猫(草稿 1)</text>
<rect x="572" y="112" width="250" height="54" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="697.0" y="144.4" font-size="15" fill="#111827" text-anchor="middle">在(草稿 2)</text>
<rect x="838" y="112" width="250" height="54" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="963.0" y="144.4" font-size="15" fill="#111827" text-anchor="middle">沙(草稿 3)</text>
<rect x="40" y="246" width="250" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="165.0" y="274.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">p(「只」后面是什么)</text><text x="165.0" y="292.0" font-size="12" fill="#6b7280" text-anchor="middle">→ 验证「猫」</text>
<rect x="306" y="246" width="250" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="431.0" y="274.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">p(「只猫」后面)</text><text x="431.0" y="292.0" font-size="12" fill="#6b7280" text-anchor="middle">→ 验证「在」</text>
<rect x="572" y="246" width="250" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="697.0" y="274.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">p(「只猫在」后面)</text><text x="697.0" y="292.0" font-size="12" fill="#6b7280" text-anchor="middle">→ 验证「沙」</text>
<rect x="838" y="246" width="250" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="963.0" y="274.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">p(「只猫在沙」后面)</text><text x="963.0" y="292.0" font-size="12" fill="#6b7280" text-anchor="middle">→ 三个全对时白送一个</text>
<line x1="431" y1="170" x2="165" y2="242" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="697" y1="170" x2="431" y2="242" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="963" y1="170" x2="697" y2="242" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="218" font-size="12" fill="#6b7280" text-anchor="start">↓ 同一次 forward 的输出</text>
<text x="30" y="344" font-size="12" fill="#6b7280" text-anchor="start">每个位置的验证只用它前面的输入,所以 4 个分布互不依赖,能在同一次 forward 里出来。</text>
<text x="30" y="368" font-size="12" fill="#6b7280" text-anchor="start">这一步和一个 4 token 的 prefill 在计算上完全一样:token 维从 B 变成 B × (k+1),权重矩阵一份没变,块表一行没变(1.4)。</text>
<text x="30" y="392" font-size="12" fill="#6b7280" text-anchor="start">所以它和 02 章 7 的混合 batch 是同一件事的两种外观 —— 那边是 P 和 D 拼在一个 batch,这边是一条请求的草稿被摊平成多行。</text>
<text x="30" y="442" font-size="12" fill="#6b7280" text-anchor="start">灰 = 已确定的那一格与白送的那一个,红 = 待验证的草稿,绿 = 这一步真的在验的三个位置</text>
</svg>