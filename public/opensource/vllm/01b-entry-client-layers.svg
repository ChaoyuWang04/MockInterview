<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="830" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">入口与 client 的层级:三种入口各经过哪个 client 到达 EngineCore,哪一层开始跨进程</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">从上往下:用户面对的入口对象 → 引擎 → 插座(抽象基类,工厂在这里选实现)→ 三种 client → EngineCore → 执行器 → GPU worker。</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">紫 = 用户面对的对象,绿 = 引擎侧,黄 = 跨进程 client,灰 = GPU worker 进程,虚线框 = 进程边界。</text>
<rect x="60" y="100" width="300" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="210.0" y="121" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">LLM</text><text x="210.0" y="141" font-size="12" fill="#6b7280" text-anchor="middle">离线批量入口 · 用户代码 generate() / chat()</text>
<rect x="760" y="100" width="300" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="910.0" y="121" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">AsyncLLM</text><text x="910.0" y="141" font-size="12" fill="#6b7280" text-anchor="middle">在线服务异步入口 · 用户代码 generate()</text>
<rect x="60" y="190" width="300" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="210.0" y="211" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">LLMEngine</text><text x="210.0" y="231" font-size="12" fill="#6b7280" text-anchor="middle">同步引擎</text>
<line x1="210" y1="154" x2="210" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="222" y="162.65" width="75" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="259.5" y="173.65" font-size="11" fill="#6b7280" text-anchor="middle">持有并驱动</text>
<rect x="380" y="290" width="360" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="311" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">EngineCoreClient</text><text x="560.0" y="331" font-size="12" fill="#6b7280" text-anchor="middle">插座:抽象基类,工厂在这里选实现</text>
<polyline points="360,216 560,216 560,288" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="409.96" y="200.65" width="100.08" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="460.0" y="211.65" font-size="11" fill="#6b7280" text-anchor="middle">make_client()</text>
<polyline points="910,154 910,316 742,316" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="918" y="230.65" width="155.52" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="995.76" y="241.65" font-size="11" fill="#6b7280" text-anchor="middle">make_async_mp_client()</text>
<rect x="60" y="400" width="300" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="210.0" y="421" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">InprocClient</text><text x="210.0" y="441" font-size="12" fill="#6b7280" text-anchor="middle">同进程直接调用 · 关掉多进程时(调试)</text>
<rect x="410" y="400" width="300" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="560.0" y="421" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SyncMPClient</text><text x="560.0" y="441" font-size="12" fill="#6b7280" text-anchor="middle">子进程 · ZMQ · LLM 的默认路线</text>
<rect x="760" y="400" width="300" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="910.0" y="421" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">AsyncMPClient</text><text x="910.0" y="441" font-size="12" fill="#6b7280" text-anchor="middle">子进程 · ZMQ + asyncio · AsyncLLM 的唯一路线</text>
<polyline points="560,342 560,370 210,370 210,398" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="330.34000000000003" y="354.65" width="109.32" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="385.0" y="365.65" font-size="11" fill="#6b7280" text-anchor="middle">关掉多进程(调试)</text>
<line x1="560" y1="342" x2="560" y2="398" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="572" y="372.65" width="88.64" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="616.32" y="383.65" font-size="11" fill="#6b7280" text-anchor="middle">LLM 默认路线</text>
<polyline points="560,370 910,370 910,398" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="675.28" y="354.65" width="119.44" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="735.0" y="365.65" font-size="11" fill="#6b7280" text-anchor="middle">AsyncLLM 唯一路线</text>
<rect x="380" y="490" width="360" height="180" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="396" y="510" font-size="13" fill="#6b7280" text-anchor="start">EngineCore 所在的进程(多进程模式下是子进程)</text>
<rect x="410" y="516" width="300" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="537" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">EngineCore</text><text x="560.0" y="557" font-size="12" fill="#6b7280" text-anchor="middle">调度 + 执行</text>
<rect x="410" y="600" width="300" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="621" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">ModelExecutor</text><text x="560.0" y="641" font-size="12" fill="#6b7280" text-anchor="middle">下发一个 step</text>
<line x1="560" y1="570" x2="560" y2="598" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="210,454 210,542 408,542" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="251.5" y="526.65" width="97" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="300.0" y="537.65" font-size="11" fill="#6b7280" text-anchor="middle">同进程函数调用</text>
<line x1="560" y1="454" x2="560" y2="514" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="572" y="476.65" width="77.64" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="610.82" y="487.65" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ 跨进程</text>
<polyline points="910,454 910,542 712,542" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="781.18" y="526.65" width="77.64" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="820.0" y="537.65" font-size="11" fill="#6b7280" text-anchor="middle">ZMQ 跨进程</text>
<rect x="380" y="700" width="360" height="84" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="396" y="720" font-size="13" fill="#6b7280" text-anchor="start">Worker 进程</text>
<rect x="410" y="722" width="300" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="743" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">GPU Worker × N</text><text x="560.0" y="763" font-size="12" fill="#6b7280" text-anchor="middle">PP × TP × PCP 个进程,持有并驱动 GPU</text>
<line x1="560" y1="654" x2="560" y2="720" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="572" y="678.65" width="108" height="19" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="626.0" y="689.65" font-size="11" fill="#6b7280" text-anchor="middle">共享内存消息队列</text>
<text x="30" y="816" font-size="12" fill="#6b7280" text-anchor="start">紫 = 用户面对的入口对象,绿 = 引擎侧组件,黄 = 跨进程 client,灰 = GPU worker 进程,虚线框 = 进程边界;三种 client 怎么选见 4.2</text>
</svg>