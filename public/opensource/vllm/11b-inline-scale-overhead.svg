<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">那 8 个字节不随位宽缩:内联 scale 为什么让 INT4 只有 3.76 倍</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">四条都是 KV cache 末维上一个 (token, 头) 的字节布局,同一把字节尺,每头 128 维。浅色是数据,深色是内联的 FP32 scale。</text>
  <text x="30" y="78" font-size="13" fill="#6b7280">深色块在下面两条里宽度<tspan font-weight="700" fill="#111827">完全相同</tspan> —— 都是 K、V 各一个 4 字节。数据段随位宽缩短,它一动不动。</text>

  <!-- ===== 理想倍数标记,连到字节尺上同一个刻度 ===== -->
  <text x="400.04" y="106" font-size="11" font-weight="700" fill="#2f6690" text-anchor="middle">理想 4×</text>
  <line x1="400.04" y1="110" x2="400.04" y2="128" stroke="#2f6690" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="615.08" y="106" font-size="11" font-weight="700" fill="#2f6690" text-anchor="middle">理想 2×</text>
  <line x1="615.08" y1="110" x2="615.08" y2="128" stroke="#2f6690" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ===== 字节尺 ===== -->
  <line x1="185" y1="132" x2="1045.16" y2="132" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="185" y1="128" x2="185" y2="136" stroke="#cbd2d9" stroke-width="1"/>
  <text x="185" y="124" font-size="10.5" fill="#9ca3af" text-anchor="start">0</text>
  <line x1="400.04" y1="128" x2="400.04" y2="136" stroke="#cbd2d9" stroke-width="1"/>
  <text x="400.04" y="124" font-size="10.5" fill="#9ca3af" text-anchor="middle">128</text>
  <line x1="615.08" y1="128" x2="615.08" y2="136" stroke="#cbd2d9" stroke-width="1"/>
  <text x="615.08" y="124" font-size="10.5" fill="#9ca3af" text-anchor="middle">256</text>
  <line x1="830.12" y1="128" x2="830.12" y2="136" stroke="#cbd2d9" stroke-width="1"/>
  <text x="830.12" y="124" font-size="10.5" fill="#9ca3af" text-anchor="middle">384</text>
  <line x1="1045.16" y1="128" x2="1045.16" y2="136" stroke="#cbd2d9" stroke-width="1"/>
  <text x="1045.16" y="124" font-size="10.5" fill="#9ca3af" text-anchor="end">512 字节</text>

  <!-- ===== BF16 / FP16 ===== -->
  <text x="175" y="168" font-size="12.5" fill="#374151" text-anchor="end">BF16 / FP16</text>
  <text x="175" y="186" font-size="10.5" fill="#9ca3af" text-anchor="end">基准</text>
  <rect x="185" y="146" width="430.08" height="46" fill="#9fb9cc"/>
  <text x="400.04" y="174" font-size="12" fill="#111827" text-anchor="middle">K 数据 256 B</text>
  <rect x="615.08" y="146" width="430.08" height="46" fill="#9fb9cc"/>
  <text x="830.12" y="174" font-size="12" fill="#111827" text-anchor="middle">V 数据 256 B</text>
  <rect x="185" y="146" width="860.16" height="46" fill="none" stroke="#c9ced6" stroke-width="1"/>

  <!-- ===== FP8 per-tensor ===== -->
  <text x="175" y="240" font-size="12.5" fill="#374151" text-anchor="end">FP8 per-tensor</text>
  <text x="175" y="258" font-size="10.5" fill="#9ca3af" text-anchor="end">scale 是整张量一个参数</text>
  <rect x="185" y="218" width="215.04" height="46" fill="#9fb9cc"/>
  <text x="292.52" y="246" font-size="12" fill="#111827" text-anchor="middle">K 数据 128 B</text>
  <rect x="400.04" y="218" width="215.04" height="46" fill="#9fb9cc"/>
  <text x="507.56" y="246" font-size="12" fill="#111827" text-anchor="middle">V 数据 128 B</text>
  <rect x="185" y="218" width="430.08" height="46" fill="none" stroke="#c9ced6" stroke-width="1"/>

  <!-- ===== INT8 每 token 每头 ===== -->
  <text x="175" y="312" font-size="12.5" fill="#374151" text-anchor="end">INT8 每 token 每头</text>
  <text x="175" y="330" font-size="10.5" fill="#9ca3af" text-anchor="end">scale 内联进末维</text>
  <rect x="185" y="290" width="215.04" height="46" fill="#9fb9cc"/>
  <text x="292.52" y="318" font-size="12" fill="#111827" text-anchor="middle">K 数据 128 B</text>
  <rect x="400.04" y="290" width="6.72" height="46" fill="#2f6690"/>
  <rect x="406.76" y="290" width="215.04" height="46" fill="#9fb9cc"/>
  <text x="514.28" y="318" font-size="12" fill="#111827" text-anchor="middle">V 数据 128 B</text>
  <rect x="621.8" y="290" width="6.72" height="46" fill="#2f6690"/>
  <rect x="185" y="290" width="443.52" height="46" fill="none" stroke="#c9ced6" stroke-width="1"/>

  <!-- ===== INT4 每 token 每头 ===== -->
  <text x="175" y="384" font-size="12.5" fill="#374151" text-anchor="end">INT4 每 token 每头</text>
  <text x="175" y="402" font-size="10.5" fill="#9ca3af" text-anchor="end">scale 内联进末维</text>
  <rect x="185" y="362" width="107.52" height="46" fill="#9fb9cc"/>
  <text x="238.76" y="390" font-size="12" fill="#111827" text-anchor="middle">K 数据 64 B</text>
  <rect x="292.52" y="362" width="6.72" height="46" fill="#2f6690"/>
  <rect x="299.24" y="362" width="107.52" height="46" fill="#9fb9cc"/>
  <text x="353" y="390" font-size="12" fill="#111827" text-anchor="middle">V 数据 64 B</text>
  <rect x="406.76" y="362" width="6.72" height="46" fill="#2f6690"/>
  <rect x="185" y="362" width="228.48" height="46" fill="none" stroke="#c9ced6" stroke-width="1"/>

  <!-- ===== 理想线,压在条之上 ===== -->
  <line x1="400.04" y1="218" x2="400.04" y2="408" stroke="#a9b4c0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="615.08" y1="146" x2="615.08" y2="346" stroke="#a9b4c0" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- ===== 内联 scale 的引线 ===== -->
  <path d="M 403.4 336 L 403.4 341 L 382.4 345" fill="none" stroke="#2f6690" stroke-width="1.2"/>
  <text x="382.4" y="357" font-size="10.5" font-weight="700" fill="#2f6690" text-anchor="middle">4 B</text>
  <path d="M 625.16 336 L 625.16 341 L 642.16 345" fill="none" stroke="#2f6690" stroke-width="1.2"/>
  <text x="642.16" y="357" font-size="10.5" font-weight="700" fill="#2f6690" text-anchor="middle">4 B</text>
  <path d="M 295.88 408 L 295.88 413 L 295.88 417" fill="none" stroke="#2f6690" stroke-width="1.2"/>
  <text x="295.88" y="429" font-size="10.5" font-weight="700" fill="#2f6690" text-anchor="middle">4 B</text>
  <path d="M 410.12 408 L 410.12 413 L 410.12 417" fill="none" stroke="#2f6690" stroke-width="1.2"/>
  <text x="410.12" y="429" font-size="10.5" font-weight="700" fill="#2f6690" text-anchor="middle">4 B</text>

  <!-- ===== 右侧注解 ===== -->
  <text x="1053" y="168" font-size="17" font-weight="700" fill="#111827">1×</text>
  <text x="1053" y="186" font-size="10.5" fill="#9ca3af">512 B</text>
  <text x="627" y="240" font-size="17" font-weight="700" fill="#2f6690">2.00×</text>
  <text x="627" y="260" font-size="12" fill="#374151">256 B,正好落在理想线上 —— 一个字节都不内联,所以是精确的 2 倍</text>
  <text x="640" y="312" font-size="17" font-weight="700" fill="#111827">1.94×</text>
  <text x="726" y="312" font-size="12" fill="#9ca3af">理想 2.00×</text>
  <text x="640" y="332" font-size="12" fill="#374151">264 B —— 两块 4 B 的 scale 把它顶过了理想线;这 8 B 占整条的 3.0%</text>
  <text x="428" y="384" font-size="17" font-weight="700" fill="#111827">3.76×</text>
  <text x="514" y="384" font-size="12" fill="#9ca3af">理想 4.00×</text>
  <text x="428" y="404" font-size="12" fill="#374151">136 B —— 顶出去的还是同样两块 4 B;可整条只有 136 B,于是这 8 B 占到 5.9%</text>

  <!-- ===== 结论 ===== -->
  <line x1="30" y1="456" x2="1090" y2="456" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="486" font-size="14" font-weight="700" fill="#111827">两处越线的长度一模一样,可它们挂在长短差一倍的条上</text>
  <text x="30" y="512" font-size="13" fill="#374151">位宽从 8 降到 4,数据段从 256 B 缩到 128 B,而那两块 scale 还是 8 B —— <tspan font-weight="700" fill="#111827">位宽越低,这笔固定开销的相对占比越大</tspan>。</text>
  <text x="30" y="536" font-size="13" fill="#374151">这就是 INT4 拿不到理想的 4 倍、只有 3.76 倍的全部原因,也是它换来的东西:scale 是运行时就地算出来的,不用 checkpoint 提供。</text>
  <text x="30" y="560" font-size="13" fill="#374151">NVFP4 的 KV 走的是另一条路:块 scale 更密(每 16 个值一字节),压缩比略低到 3.56 倍,换更好的抗离群。</text>
  <text x="30" y="608" font-size="10.5" fill="#9ca3af">数字出处:3.12 与底稿 N2-16、N2-17。末维四段的排布顺序是「K 数据、K 的 scale 填充、V 数据、V 的 scale 填充」;公式里 scale 字节数恒为 4、K 与 V 各一个。</text>
</svg>
