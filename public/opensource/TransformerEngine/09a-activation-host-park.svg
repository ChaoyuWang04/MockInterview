<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect id="te09bg" x="0" y="0" width="1120" height="460" fill="#ffffff"/>
  <text id="te09title" x="40" y="40" font-size="19" font-weight="700" fill="#111827">当前层激活留在 GPU,已算完的前几层停在主机</text>
  <text id="te09sub" x="40" y="64" font-size="13" fill="#6b7280">绿 = 仍在 GPU 上的激活;紫 = 卸到主机停放;黄 = 反向前取回;灰旁注 = 卡上同时最多留下「总层数 − 卸走层数」份</text>

  <rect id="te09gpu" x="40" y="88" width="1040" height="140" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te09gpu-l" x="56" y="112" font-size="14" font-weight="700" fill="#5fa886">GPU:正在算的层,激活还在卡上</text>

  <rect id="te09l3" x="72" y="132" width="200" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text id="te09l3t" x="172" y="158" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">第 3 层前向</text>
  <text id="te09l3d" x="172" y="178" font-size="11" fill="#6b7280" text-anchor="middle">当前计算,激活不卸</text>

  <rect id="te09l4" x="336" y="132" width="200" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text id="te09l4t" x="436" y="158" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">第 4 层前向</text>
  <text id="te09l4d" x="436" y="178" font-size="11" fill="#6b7280" text-anchor="middle">同样留在 GPU</text>

  <rect id="te09cap" x="600" y="132" width="440" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <text id="te09capt" x="820" y="158" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">卡上名额有上限</text>
  <text id="te09capd" x="820" y="178" font-size="11" fill="#6b7280" text-anchor="middle">例:5 层卸 2 层,最多 3 份同时在 GPU</text>

  <rect id="te09host" x="40" y="248" width="1040" height="88" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te09host-l" x="56" y="272" font-size="14" font-weight="700" fill="#8f8bd8">主机:前几层激活停放,等反向</text>

  <rect id="te09l0" x="72" y="288" width="200" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text id="te09l0t" x="172" y="310" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">第 0 层 · 已卸走</text>

  <rect id="te09l1" x="336" y="288" width="200" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text id="te09l1t" x="436" y="310" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">第 1 层 · 已卸走</text>

  <text id="te09note" x="560" y="310" font-size="11" fill="#9ca3af">拷贝走另一条流,从张量刚被留下就开始,不必等该层前向结束</text>

  <rect id="te09bwd" x="40" y="356" width="1040" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text id="te09bwdt" x="560" y="384" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">反向到第 1 层之前:从主机取回,算完再放</text>
  <text id="te09bwdd" x="560" y="408" font-size="11" fill="#6b7280" text-anchor="middle">取回必须赶上该层反向;默认不卸最后一层,全卸会失败</text>

  <defs>
    <marker id="te09arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <line id="te09e1" x1="272" y1="164" x2="328" y2="164" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te09arr)"/>
  <line id="te09e3" x1="436" y1="320" x2="436" y2="356" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te09arr)"/>
</svg>
