<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#111827">一次训练步里,量化上下文只包住前向</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">紫虚线 = 量化上下文（进去才打开低精度）;绿 = 层内积木;黄 = 反向,在上下文外面;灰旁注 = delayed 配方在退出时才做的事,不是每条配方都走</text>

  <rect x="40" y="92" width="1040" height="210" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="56" y="116" font-size="14" font-weight="700" fill="#8f8bd8">量化上下文：前向</text>

  <rect x="72" y="140" width="160" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="152" y="164" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">进入</text>
  <text x="152" y="184" font-size="11" fill="#6b7280" text-anchor="middle">打开低精度开关</text>

  <rect x="296" y="140" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="396" y="164" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">自注意力</text>
  <text x="396" y="184" font-size="11" fill="#6b7280" text-anchor="middle">读开关,决定是否量化</text>

  <rect x="560" y="140" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="660" y="164" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">融合 MLP</text>
  <text x="660" y="184" font-size="11" fill="#6b7280" text-anchor="middle">同一开关,同一份配方</text>

  <rect x="824" y="140" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="924" y="164" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">退出</text>
  <text x="924" y="184" font-size="11" fill="#6b7280" text-anchor="middle">关掉开关,深度归零</text>

  <defs>
    <marker id="te01a-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <line x1="232" y1="168" x2="288" y2="168" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te01a-arr)"/>
  <line x1="496" y1="168" x2="552" y2="168" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te01a-arr)"/>
  <line x1="760" y1="168" x2="816" y2="168" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te01a-arr)"/>

  <text x="56" y="236" font-size="11" fill="#9ca3af">现成一层内部就是自注意力再接融合 MLP;残差加和画在积木里,不另占一格</text>
  <text x="56" y="260" font-size="11" fill="#9ca3af">delayed 配方在深度回到 0 且梯度开着时,退出这一跳才归约前向绝对值最大值;其他配方这里缓冲区是空的,什么也不做</text>
  <text x="56" y="284" font-size="11" fill="#9ca3af">同一份上下文实例不能重入;嵌套另一份可以,靠深度计数</text>

  <rect x="72" y="328" width="976" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="560" y="352" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">反向：在量化上下文外面</text>
  <text x="560" y="372" font-size="11" fill="#6b7280" text-anchor="middle">官方 Getting Started 写明：上下文必须在反向开始前退出</text>
</svg>
