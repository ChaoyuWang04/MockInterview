<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect id="te05bg" x="0" y="0" width="1120" height="430" fill="#ffffff"/>
  <text id="te05title" x="40" y="40" font-size="19" font-weight="700" fill="#111827">拆开归一化与线性：两次 launch，中间激活要落地</text>
  <text id="te05sub" x="40" y="64" font-size="13" fill="#6b7280">红 = 拆开的两次核加中间激活；绿 = 融合层一次 launch；黄 = 官方上手写明单卡收益有限、多卡 launch 更值钱；灰旁注 = 吐出归一化输出时量化核会拆开</text>

  <rect id="te05unfused" x="40" y="88" width="1040" height="148" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te05unfused-h" x="56" y="112" font-size="14" font-weight="700" fill="#d9877a">拆开：归一化模块再接线性模块</text>

  <rect id="te05ln" x="72" y="132" width="200" height="56" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.4"/>
  <text id="te05ln-t" x="172" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">归一化核</text>
  <text id="te05ln-s" x="172" y="176" font-size="11" fill="#6b7280" text-anchor="middle">第一次 launch</text>

  <rect id="te05act" x="336" y="132" width="240" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <text id="te05act-t" x="456" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">中间激活落地</text>
  <text id="te05act-s" x="456" y="176" font-size="11" fill="#6b7280" text-anchor="middle">高精度缓冲，占带宽</text>

  <rect id="te05lin" x="640" y="132" width="200" height="56" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.4"/>
  <text id="te05lin-t" x="740" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">线性核</text>
  <text id="te05lin-s" x="740" y="176" font-size="11" fill="#6b7280" text-anchor="middle">第二次 launch</text>

  <defs>
    <marker id="te05arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <line id="te05e1" x1="272" y1="160" x2="328" y2="160" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te05arr)"/>
  <line id="te05e2" x1="576" y1="160" x2="632" y2="160" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te05arr)"/>
  <text id="te05unfused-n" x="56" y="216" font-size="11" fill="#9ca3af">多卡时每次 launch 排队更贵，中间激活还要进出显存；吞吐打掉的是启动和带宽，不是归一化公式本身</text>

  <rect id="te05fused" x="40" y="252" width="700" height="148" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te05fused-h" x="56" y="276" font-size="14" font-weight="700" fill="#5fa886">融合：归一化加线性（或归一化加 MLP）</text>
  <rect id="te05one" x="72" y="296" width="632" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text id="te05one-t" x="388" y="320" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">一次 launch：归一化写进量化缓冲，紧接线性</text>
  <text id="te05one-s" x="388" y="340" font-size="11" fill="#6b7280" text-anchor="middle">默认不吐出归一化输出，中间激活不必单独落地</text>
  <text id="te05fused-n" x="56" y="380" font-size="11" fill="#9ca3af">若残差要归一化后的激活，打开吐出开关，量化核会拆开，中间激活又回来</text>

  <rect id="te05note" x="760" y="252" width="320" height="148" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text id="te05note-t" x="920" y="292" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">官方上手的边界</text>
  <text id="te05note-s1" x="920" y="318" font-size="11" fill="#6b7280" text-anchor="middle">单卡加速有限</text>
  <text id="te05note-s2" x="920" y="340" font-size="11" fill="#6b7280" text-anchor="middle">多卡时融合层更值钱</text>
  <text id="te05note-s3" x="920" y="362" font-size="11" fill="#6b7280" text-anchor="middle">通信重叠见 08 章</text>
</svg>
