<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="460" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#111827">JAX 必须在量化上下文里 init,PyTorch 建模块不必</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">灰 = PyTorch 先建再套;紫 = JAX 的量化上下文,init 才登记 collection;绿 = 已有量化 collection 的 apply;黄 = 切分资源随上下文进去</text>

  <rect id="te11-pt-col" x="40" y="88" width="500" height="248" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="56" y="114" font-size="14" font-weight="700" fill="#6b7280">PyTorch</text>

  <rect id="te11-pt-build" x="64" y="132" width="452" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <text x="290" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">建模块</text>
  <text x="290" y="176" font-size="11" fill="#6b7280" text-anchor="middle">不必包量化上下文</text>

  <rect id="te11-pt-fwd" x="64" y="220" width="452" height="80" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="290" y="252" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">前向再套上下文</text>
  <text x="290" y="274" font-size="11" fill="#6b7280" text-anchor="middle">积木读全局开关,这一跳才量化</text>

  <defs>
    <marker id="te11-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <line x1="290" y1="188" x2="290" y2="212" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te11-arr)"/>

  <rect id="te11-jax-col" x="580" y="88" width="500" height="248" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="596" y="114" font-size="14" font-weight="700" fill="#8f8bd8">JAX / Flax</text>

  <rect id="te11-jax-ctx" x="604" y="132" width="452" height="168" rx="6" fill="#ffffff" stroke="#8f8bd8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="620" y="156" font-size="14" font-weight="700" fill="#8f8bd8">打开的量化上下文</text>

  <rect id="te11-jax-init" x="628" y="172" width="404" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="830" y="194" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">init</text>
  <text x="830" y="212" font-size="11" fill="#6b7280" text-anchor="middle">登记量化 collection,空配方则没有</text>

  <rect id="te11-jax-apply" x="628" y="236" width="404" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="830" y="266" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">apply 读同一份 collection</text>

  <line x1="830" y1="224" x2="830" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te11-arr)"/>

  <rect id="te11-shard" x="40" y="360" width="1040" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="560" y="386" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">切分资源也随量化上下文进去</text>
  <text x="560" y="408" font-size="11" fill="#6b7280" text-anchor="middle">逻辑轴映射读这份资源;轴名对不上,或两套张量并行同时开,多卡直接错</text>
</svg>
