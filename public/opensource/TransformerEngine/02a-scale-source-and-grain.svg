<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#111827">配方两轴:scale 从哪来,切多细</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">黄 = 用上一步历史;紫 = 用本步当场峰值;绿格子数 = 一块里共用一个 scale 的元素(格子越密切得越细);灰 = 整张张量一个 scale</text>

  <rect x="40" y="88" width="200" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="140" y="114" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">延迟缩放</text>
  <text x="140" y="134" font-size="11" fill="#6b7280" text-anchor="middle">Hopper 上的默认回落</text>
  <rect x="56" y="150" width="168" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="140" y="180" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上一步窗口</text>
  <text x="140" y="202" font-size="11" fill="#6b7280" text-anchor="middle">本步只记峰值</text>
  <rect x="56" y="240" width="168" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <text x="140" y="278" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">整张一张</text>
  <text x="140" y="300" font-size="11" fill="#6b7280" text-anchor="middle">一个 FP32 scale</text>
  <text x="140" y="360" font-size="11" fill="#9ca3af" text-anchor="middle">少读一遍张量</text>
  <text x="140" y="380" font-size="11" fill="#9ca3af" text-anchor="middle">编译区直接报错</text>
  <text x="140" y="400" font-size="11" fill="#9ca3af" text-anchor="middle">激活跳变会跟不上</text>
  <text x="140" y="440" font-size="11" fill="#9ca3af" text-anchor="middle">切得最粗</text>

  <rect x="256" y="88" width="200" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="356" y="114" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">当前缩放</text>
  <text x="356" y="134" font-size="11" fill="#6b7280" text-anchor="middle">计算能力 12.0 时的默认</text>
  <rect x="272" y="150" width="168" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="356" y="180" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">本步当场</text>
  <text x="356" y="202" font-size="11" fill="#6b7280" text-anchor="middle">先扫峰值再量化</text>
  <rect x="272" y="240" width="168" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <text x="356" y="278" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">整张一张</text>
  <text x="356" y="300" font-size="11" fill="#6b7280" text-anchor="middle">一个 FP32 scale</text>
  <text x="356" y="360" font-size="11" fill="#9ca3af" text-anchor="middle">多读一遍张量</text>
  <text x="356" y="380" font-size="11" fill="#9ca3af" text-anchor="middle">跟得上本步分布</text>
  <text x="356" y="400" font-size="11" fill="#9ca3af" text-anchor="middle">MXFP8 盖不全布局时用它</text>
  <text x="356" y="440" font-size="11" fill="#9ca3af" text-anchor="middle">切得同样粗</text>

  <rect x="472" y="88" width="200" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="572" y="114" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">FP8 切块</text>
  <text x="572" y="134" font-size="11" fill="#6b7280" text-anchor="middle">Hopper+,CUDA 12.9</text>
  <rect x="488" y="150" width="168" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="572" y="180" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">本步当场</text>
  <text x="572" y="202" font-size="11" fill="#6b7280" text-anchor="middle">每块自己的峰值</text>
  <g>
    <rect x="488" y="240" width="80" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="576" y="240" width="80" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="488" y="288" width="80" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="576" y="288" width="80" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  </g>
  <text x="572" y="360" font-size="11" fill="#9ca3af" text-anchor="middle">默认 128 个值一块</text>
  <text x="572" y="380" font-size="11" fill="#9ca3af" text-anchor="middle">scale 是 FP32,默认为 2 的幂</text>
  <text x="572" y="400" font-size="11" fill="#9ca3af" text-anchor="middle">注意力量化不支持</text>
  <text x="572" y="440" font-size="11" fill="#9ca3af" text-anchor="middle">切中等细</text>

  <rect x="688" y="88" width="200" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="788" y="114" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">MXFP8</text>
  <text x="788" y="134" font-size="11" fill="#6b7280" text-anchor="middle">Blackwell 上能盖全时的默认</text>
  <rect x="704" y="150" width="168" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="788" y="180" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">本步当场</text>
  <text x="788" y="202" font-size="11" fill="#6b7280" text-anchor="middle">硬件微缩放</text>
  <g>
    <rect x="704" y="240" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="748" y="240" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="792" y="240" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="836" y="240" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="704" y="288" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="748" y="288" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="792" y="288" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="836" y="288" width="36" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  </g>
  <text x="788" y="360" font-size="11" fill="#9ca3af" text-anchor="middle">32 个值一块</text>
  <text x="788" y="380" font-size="11" fill="#9ca3af" text-anchor="middle">scale 是 E8M0,只能是 2 的幂</text>
  <text x="788" y="400" font-size="11" fill="#9ca3af" text-anchor="middle">12.0 上暂不当地默认</text>
  <text x="788" y="440" font-size="11" fill="#9ca3af" text-anchor="middle">切得更细</text>

  <rect x="904" y="88" width="176" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="992" y="114" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">NVFP4</text>
  <text x="992" y="134" font-size="11" fill="#6b7280" text-anchor="middle">Blackwell 四位,不是默认</text>
  <rect x="916" y="150" width="152" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="992" y="176" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">本步两级</text>
  <text x="992" y="198" font-size="11" fill="#6b7280" text-anchor="middle">块内 + 整张全局</text>
  <g>
    <rect x="916" y="240" width="22" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="942" y="240" width="22" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="968" y="240" width="22" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="994" y="240" width="22" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="1020" y="240" width="22" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="1046" y="240" width="22" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
    <rect x="916" y="288" width="152" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
    <text x="992" y="312" font-size="11" fill="#6b7280" text-anchor="middle">再乘全局 FP32</text>
  </g>
  <text x="992" y="360" font-size="11" fill="#9ca3af" text-anchor="middle">16 个值一块</text>
  <text x="992" y="380" font-size="11" fill="#9ca3af" text-anchor="middle">块 scale 是 E4M3</text>
  <text x="992" y="400" font-size="11" fill="#9ca3af" text-anchor="middle">权重默认可 16×16</text>
  <text x="992" y="440" font-size="11" fill="#9ca3af" text-anchor="middle">切得最细</text>

  <defs>
    <marker id="te02-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <text x="40" y="492" font-size="11" fill="#9ca3af">从左到右:历史→当场,整张→128→32→16。格子变多不是装饰,是一块里共用 scale 的元素变少。自定义配方不画,走工厂自己拼。</text>
</svg>
