<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect id="te07bg" x="0" y="0" width="1120" height="480" fill="#ffffff"/>
  <text id="te07title" x="40" y="40" font-size="19" font-weight="700" fill="#111827">专家侧：先打分融合，再把 token 按专家排成连续块，算完再合回去</text>
  <text id="te07sub" x="40" y="64" font-size="13" fill="#6b7280">紫 = 融合路由（打分、取前几名、辅助损失在核里做完）;绿 = 按专家重排后的连续块;黄 = 合回原序并按概率加权;灰虚线 = 跨卡专家并行时的分发与合并，不代替本卡重排</text>

  <rect id="te07router" x="40" y="92" width="1040" height="88" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te07router-cap" x="56" y="116" font-size="14" font-weight="700" fill="#8f8bd8">融合路由，一次核</text>
  <rect id="te07logits" x="72" y="132" width="200" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text id="te07logits-t" x="172" y="153" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">每个 token 的打分</text>
  <rect id="te07topk" x="336" y="132" width="240" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text id="te07topk-t" x="456" y="153" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">取前几名 + 路由图</text>
  <rect id="te07aux" x="640" y="132" width="200" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text id="te07aux-t" x="740" y="153" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">辅助损失（可选）</text>
  <rect id="te07map" x="904" y="132" width="140" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text id="te07map-t" x="974" y="153" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">路由图</text>
  <defs>
    <marker id="te07arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <line id="te07e1" x1="272" y1="148" x2="328" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te07arr)"/>
  <line id="te07e2" x1="576" y1="148" x2="632" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te07arr)"/>
  <line id="te07e3" x1="840" y1="148" x2="896" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te07arr)"/>

  <text id="te07perm-cap" x="40" y="212" font-size="14" font-weight="700" fill="#111827">本卡 permute：同一专家的 token 挤成连续行</text>
  <rect id="te07tok" x="40" y="228" width="200" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <text id="te07tok-t" x="140" y="258" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">原序 token</text>
  <text id="te07tok-s" x="140" y="278" font-size="11" fill="#6b7280" text-anchor="middle">行是序列，不是专家</text>
  <rect id="te07ex0" x="320" y="228" width="160" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text id="te07ex0-t" x="400" y="258" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">专家 0 连续块</text>
  <text id="te07ex0-s" x="400" y="278" font-size="11" fill="#6b7280" text-anchor="middle">后面一次分组乘</text>
  <rect id="te07ex1" x="508" y="228" width="160" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text id="te07ex1-t" x="588" y="258" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">专家 1 连续块</text>
  <text id="te07ex1-s" x="588" y="278" font-size="11" fill="#6b7280" text-anchor="middle">块与块首尾相接</text>
  <rect id="te07exn" x="696" y="228" width="160" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text id="te07exn-t" x="776" y="258" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">专家 N 连续块</text>
  <text id="te07exn-s" x="776" y="278" font-size="11" fill="#6b7280" text-anchor="middle">可按对齐补零</text>
  <rect id="te07ep" x="888" y="228" width="192" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te07ep-t" x="984" y="258" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">跨卡分发</text>
  <text id="te07ep-s" x="984" y="278" font-size="11" fill="#6b7280" text-anchor="middle">专家不在本卡才走</text>
  <line id="te07e4" x1="240" y1="264" x2="312" y2="264" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te07arr)"/>
  <line id="te07e5" x1="856" y1="264" x2="880" y2="264" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#te07arr)"/>

  <text id="te07un-cap" x="40" y="340" font-size="14" font-weight="700" fill="#111827">unpermute：按行号图合回原序，有概率则加权，丢掉的行标成负一</text>
  <rect id="te07un" x="40" y="356" width="680" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text id="te07un-t" x="380" y="386" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">合回原序 token</text>
  <text id="te07un-s" x="380" y="406" font-size="11" fill="#6b7280" text-anchor="middle">同一 token 的多名专家结果在这里相加</text>
  <rect id="te07comb" x="760" y="356" width="320" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text id="te07comb-t" x="920" y="386" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">跨卡合并</text>
  <text id="te07comb-s" x="920" y="406" font-size="11" fill="#6b7280" text-anchor="middle">调用方先乘好权重再合</text>
  <line id="te07e6" x1="776" y1="300" x2="380" y2="348" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te07arr)"/>
  <line id="te07e7" x1="984" y1="300" x2="920" y2="348" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#te07arr)"/>

  <text id="te07note" x="40" y="456" font-size="11" fill="#9ca3af">分组矩阵乘本身见 04 章；本图只画 token 怎么散开、怎么合。不 permute 时专家侧看到的是跳行，核启动和搬运会盖过计算。</text>
</svg>
