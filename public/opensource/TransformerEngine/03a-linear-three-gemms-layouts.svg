<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#111827">一层线性的三次矩阵乘,按行和按列不是同一份量化数据</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">绿 = 按行取;黄 = 按列取;紫 = 这一跳的 GEMM。前向两份都按行;反向才出现按列。Hopper 上按列要物理转置,Blackwell 上两份可共用布局</text>

  <defs>
    <marker id="te03a-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="40" y="100" font-size="14" font-weight="700" fill="#111827">前向　输出 = 输入 × 权重转置</text>
  <rect x="40" y="112" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="140" y="136" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">输入</text>
  <text x="140" y="156" font-size="11" fill="#6b7280" text-anchor="middle">按行</text>
  <rect x="280" y="112" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="380" y="136" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">GEMM</text>
  <text x="380" y="156" font-size="11" fill="#6b7280" text-anchor="middle">前向</text>
  <rect x="520" y="112" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="620" y="136" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">权重</text>
  <text x="620" y="156" font-size="11" fill="#6b7280" text-anchor="middle">按行</text>
  <line x1="240" y1="140" x2="272" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te03a-arr)"/>
  <line x1="480" y1="140" x2="512" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te03a-arr)"/>
  <text x="760" y="144" font-size="11" fill="#9ca3af">这一跳没有按列</text>

  <text x="40" y="204" font-size="14" font-weight="700" fill="#111827">权重梯度　wgrad = 输出梯度转置 × 输入</text>
  <rect x="40" y="216" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="140" y="240" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">输出梯度</text>
  <text x="140" y="260" font-size="11" fill="#6b7280" text-anchor="middle">按列</text>
  <rect x="280" y="216" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="380" y="240" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">GEMM</text>
  <text x="380" y="260" font-size="11" fill="#6b7280" text-anchor="middle">权重梯度</text>
  <rect x="520" y="216" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="620" y="240" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">输入</text>
  <text x="620" y="260" font-size="11" fill="#6b7280" text-anchor="middle">按列</text>
  <line x1="240" y1="244" x2="272" y2="244" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te03a-arr)"/>
  <line x1="480" y1="244" x2="512" y2="244" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te03a-arr)"/>
  <text x="760" y="248" font-size="11" fill="#9ca3af">两边都按列;前向那份输入不够用</text>

  <text x="40" y="308" font-size="14" font-weight="700" fill="#111827">输入梯度　dgrad = 输出梯度 × 权重</text>
  <rect x="40" y="320" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="140" y="344" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">输出梯度</text>
  <text x="140" y="364" font-size="11" fill="#6b7280" text-anchor="middle">按行</text>
  <rect x="280" y="320" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="380" y="344" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">GEMM</text>
  <text x="380" y="364" font-size="11" fill="#6b7280" text-anchor="middle">输入梯度</text>
  <rect x="520" y="320" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="620" y="344" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">权重</text>
  <text x="620" y="364" font-size="11" fill="#6b7280" text-anchor="middle">按列</text>
  <line x1="240" y1="348" x2="272" y2="348" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te03a-arr)"/>
  <line x1="480" y1="348" x2="512" y2="348" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#te03a-arr)"/>
  <text x="760" y="352" font-size="11" fill="#9ca3af">同一块权重,前向按行、这里按列</text>

  <rect x="40" y="408" width="1040" height="84" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="56" y="436" font-size="14" font-weight="700" fill="#111827">因此训练时输入、权重、输出梯度各自都要按行和按列各用一次</text>
  <text x="56" y="458" font-size="11" fill="#6b7280">量化器按开关只造需要的那一份;前向结束可丢掉按行、只留按列给反向</text>
  <text x="56" y="478" font-size="11" fill="#9ca3af">Hopper:按列那份物理转置。Blackwell:两份可共用同一块布局,不必为「按列」再拷一份</text>
</svg>
