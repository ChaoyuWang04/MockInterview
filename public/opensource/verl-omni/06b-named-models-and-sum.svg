<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="500" fill="#ffffff"/><rect x="48" y="162" width="84" height="20" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="48" y="188" width="84" height="20" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="48" y="214" width="84" height="20" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="48" y="240" width="84" height="20" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="250" y="110" width="420" height="170" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="268" y="168" width="180" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="464" y="168" width="186" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="250" y="300" width="420" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="268" y="358" width="180" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="700" y="110" width="390" height="200" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="718" y="168" width="330" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="718" y="196" width="330" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="718" y="224" width="330" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="718" y="252" width="330" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="700" y="330" width="390" height="120" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><polyline points="136,211 170,211 170,200 244,200" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="136,211 170,211 170,380 244,380" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><text x="30" y="34" font-size="19" fill="#111827" font-weight="700">命名 Reward Model:资源分配、样本分组与 Reward 合成</text><text x="30" y="58" font-size="13" fill="#6b7280">绿是走引擎后端的项,紫是走原生后端的项,黄是一格卡都不占的项(纯函数或外部服务);灰格子是一条样本。</text><text x="48" y="130" font-size="14" fill="#111827" font-weight="700">一批样本</text><text x="48" y="148" font-size="11" fill="#6b7280">生成完的那一批</text><text x="90" y="176" font-size="11" fill="#6b7280" text-anchor="middle">样本 1</text><text x="90" y="202" font-size="11" fill="#6b7280" text-anchor="middle">样本 2</text><text x="90" y="228" font-size="11" fill="#6b7280" text-anchor="middle">样本 3</text><text x="90" y="254" font-size="11" fill="#6b7280" text-anchor="middle">样本 4</text><text x="48" y="292" font-size="11" fill="#9ca3af">每个组都收到整批</text><text x="48" y="310" font-size="11" fill="#9ca3af">不是分给其中一个</text><text x="268" y="136" font-size="14" fill="#111827" font-weight="700">共享组:所有不走原生后端的项</text><text x="268" y="154" font-size="11" fill="#6b7280">worker 是 CPU actor,按 Ray 节点轮转着起</text><text x="278" y="186" font-size="11" fill="#111827">ocr —— 引擎后端</text><text x="278" y="202" font-size="11" fill="#6b7280">打分函数打服务,模型在别处</text><text x="474" y="186" font-size="11" fill="#111827">jpeg —— 纯函数或外部服务</text><text x="474" y="202" font-size="11" fill="#6b7280">自己算或打外网,不占父池</text><text x="268" y="240" font-size="11" fill="#9ca3af">组内先按权重乘加,合成这一组的一个数</text><text x="268" y="258" font-size="11" fill="#9ca3af">某一项失败又没标必需,它记 0 分,别的照常</text><text x="268" y="326" font-size="14" fill="#111827" font-weight="700">quality 组:一个原生模型一个组</text><text x="268" y="344" font-size="11" fill="#6b7280">worker 钉在写死的格子上,模型就在 worker 进程里</text><text x="278" y="376" font-size="11" fill="#111827">quality —— 原生后端</text><text x="278" y="392" font-size="11" fill="#6b7280">offload 开启:销毁后重建</text><text x="268" y="424" font-size="11" fill="#9ca3af">批在组内按 worker 数补齐再均分,没有动态均衡</text><text x="718" y="136" font-size="14" fill="#111827" font-weight="700">父池的 4 个格子</text><text x="718" y="154" font-size="11" fill="#6b7280">引擎的从池头连续切,原生的按写死的下标挑</text><text x="728" y="184" font-size="11" fill="#111827">0 号格 — ocr 的引擎服务,两路并行占两格</text><text x="728" y="212" font-size="11" fill="#111827">1 号格 — 同一个服务的另一路</text><text x="728" y="240" font-size="11" fill="#111827">2 号格 — quality 的一个完整副本</text><text x="728" y="268" font-size="11" fill="#111827">3 号格 — quality 的另一个完整副本</text><text x="718" y="292" font-size="11" fill="#9ca3af">黄的那一项一个格子也不占</text><text x="718" y="356" font-size="14" fill="#111827" font-weight="700">一条样本的账</text><text x="718" y="378" font-size="11" fill="#6b7280">共享组给一个数 = ocr 权重×分 + jpeg 权重×分</text><text x="718" y="396" font-size="11" fill="#6b7280">quality 组给一个数 = quality 权重×分</text><text x="718" y="418" font-size="11" fill="#111827">两个数直接相加 = 这条样本的奖励</text><text x="718" y="436" font-size="11" fill="#9ca3af">组间不再归一;量纲对不齐要在打分函数里自己解决</text><text x="30" y="478" font-size="11" fill="#9ca3af">引擎与原生可以在同一次训练里同时挂着,但它们的格子不能重叠;两个组报出同名的附加指标键会直接报错。</text></svg>