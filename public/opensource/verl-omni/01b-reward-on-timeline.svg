<text x="922" y="151" font-size="13" fill="#6b7280" text-anchor="middle">5</text>
<text x="990" y="151" font-size="13" fill="#6b7280" text-anchor="middle">6</text>
<text x="40" y="206" font-size="14" fill="#111827" text-anchor="start" font-weight="700">样本 A</text>
