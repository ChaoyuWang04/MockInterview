<rect x="962" y="260" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="374" font-size="14" fill="#111827" text-anchor="start" font-weight="700">样本 C</text>
<rect x="208" y="344" width="100" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="258" y="377" font-size="16" fill="#111827" text-anchor="middle">3</text>
<path d="M318,371 L383,371" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="344" width="132" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="461" y="377" font-size="16" fill="#111827" text-anchor="middle">+1</text>
<path d="M537,371 L610,371" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="622" y="344" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="690" y="344" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="758" y="344" width="56" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="786" y="377" font-size="16" fill="#111827" text-anchor="middle">+1</text>
<rect x="826" y="344" width="56" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="854" y="377" font-size="16" fill="#111827" text-anchor="middle">+1</text>
<rect x="894" y="344" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="962" y="344" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="456" font-size="13" fill="#6b7280" text-anchor="start">示例:组均值为 2,缩放标准差取 1;选中第 3、4 步,不是逐步重新评分。</text>
<text x="40" y="485" font-size="13" fill="#6b7280" text-anchor="start">默认先组内中心化,再以全批标准差缩放;文本 GRPO 也可以在一个回答内共享 Advantage。</text>
</svg>