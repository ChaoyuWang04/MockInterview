<text x="786" y="209" font-size="16" fill="#111827" text-anchor="middle">−1</text>
<rect x="826" y="176" width="56" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="854" y="209" font-size="16" fill="#111827" text-anchor="middle">−1</text>
<rect x="894" y="176" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="962" y="176" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
