<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect width="1120" height="520" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9ca3af"/></marker></defs>
<text x="30" y="36" font-size="19" fill="#111827" text-anchor="start" font-weight="700">FlowGRPO:样本之间比较,同一轨迹的选中步共享 Advantage</text>
<text x="30" y="63" font-size="13" fill="#6b7280" text-anchor="start">紫 = 样本 Reward　绿 = 参与更新的步　白色虚线 = 未选中;数字仅为示意</text>
<text x="40" y="118" font-size="14" fill="#111827" text-anchor="start" font-weight="700">同一提示词</text>
<text x="224" y="118" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Reward</text>
<text x="405" y="118" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Advantage</text>
<text x="620" y="118" font-size="14" fill="#111827" text-anchor="start" font-weight="700">这条轨迹的生成步(示意)</text>
<text x="650" y="151" font-size="13" fill="#6b7280" text-anchor="middle">1</text>
<text x="718" y="151" font-size="13" fill="#6b7280" text-anchor="middle">2</text>
<text x="786" y="151" font-size="13" fill="#6b7280" text-anchor="middle">3</text>
