<rect x="395" y="176" width="132" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="461" y="209" font-size="16" fill="#111827" text-anchor="middle">−1</text>
<path d="M537,203 L610,203" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="622" y="176" width="56" height="54" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
