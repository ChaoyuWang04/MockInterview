<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="652" fill="#ffffff"/>

  <text x="32" y="36" font-size="19" font-weight="700" fill="#111827">FlowGRPO 的三处 log-prob:跳过重算后分母来自哪里</text>
  <text x="32" y="62" font-size="13" fill="#6b7280">绿 = Rollout 栈算的 · 紫 = 训练栈算的(前向可混合精度) · 灰虚线 = 这一档在该模式下不做 · 黄 = 兜底动作;比值那条分母箭头按来源上色</text>

  <!-- ===================== 左:不跳过重算 ===================== -->
  <rect x="32" y="92" width="518" height="516" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="52" y="120" font-size="14" font-weight="700" fill="#111827">不跳过重算(默认)</text>
  <text x="530" y="120" font-size="11" fill="#9ca3af" text-anchor="end">三处都算</text>

  <rect x="52" y="136" width="238" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="66" y="162" font-size="14" font-weight="700" fill="#111827">① Rollout 侧log-prob</text>
  <text x="66" y="182" font-size="11" fill="#6b7280">Rollout 算子与并行方式</text>

  <rect x="52" y="222" width="238" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="66" y="246" font-size="14" font-weight="700" fill="#111827">② 旧策略重算</text>
  <text x="66" y="264" font-size="11" fill="#6b7280">训练栈,同一选中片段</text>
  <text x="66" y="280" font-size="11" fill="#6b7280">可省去的一趟旧策略前向</text>

  <rect x="52" y="308" width="238" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="66" y="334" font-size="14" font-weight="700" fill="#111827">③ 当前策略log-prob</text>
  <text x="66" y="354" font-size="11" fill="#6b7280">选中训练步各算一次</text>

  <rect x="52" y="400" width="238" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="66" y="424" font-size="14" font-weight="700" fill="#111827">比值</text>
  <text x="66" y="444" font-size="11" fill="#6b7280">分子分母同出一套栈</text>
  <text x="66" y="462" font-size="11" fill="#6b7280">两侧只差几次参数更新</text>

  <rect x="318" y="222" width="212" height="148" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="332" y="248" font-size="14" font-weight="700" fill="#111827">兜底 · 控制器里,每批一次</text>
  <text x="332" y="272" font-size="11" fill="#6b7280">拿 ② 与 ① 之差算修正权重</text>
  <text x="332" y="290" font-size="11" fill="#6b7280">超出区间的样本权重清零</text>
  <text x="332" y="308" font-size="11" fill="#6b7280">两者折成同一个乘数下发</text>
  <text x="332" y="326" font-size="11" fill="#6b7280">按选中训练步切开乘进损失</text>
  <text x="332" y="344" font-size="11" fill="#6b7280">指标落在顶层前缀下</text>

  <path d="M 171 370 L 171 393" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M 165 393 L 177 393 L 171 400 Z" fill="#9ca3af"/>
  <text x="180" y="388" font-size="11" fill="#6b7280">分子</text>

  <path d="M 290 253 L 304 253 L 304 435 L 298 435" fill="none" stroke="#8f8bd8" stroke-width="1.8"/>
  <path d="M 298 429 L 298 441 L 290 435 Z" fill="#8f8bd8"/>
  <rect x="291" y="384" width="26" height="14" fill="#ffffff"/>
  <text x="304" y="395" font-size="11" fill="#8f8bd8" text-anchor="middle">分母</text>

  <rect x="52" y="502" width="478" height="78" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="66" y="528" font-size="14" font-weight="700" fill="#111827">逐元素损失</text>
  <text x="66" y="550" font-size="11" fill="#6b7280">PPO 逐元素损失 × 修正乘数,按原元素总数平均</text>
  <text x="66" y="568" font-size="11" fill="#6b7280">被拒的样本权重是 0,但求平均时分母不减</text>

  <!-- ===================== 右:跳过重算 ===================== -->
  <rect x="570" y="92" width="518" height="516" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="590" y="120" font-size="14" font-weight="700" fill="#111827">跳过重算</text>
  <text x="1068" y="120" font-size="11" fill="#9ca3af" text-anchor="end">只算两处</text>

  <rect x="590" y="136" width="238" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="604" y="162" font-size="14" font-weight="700" fill="#111827">① Rollout 侧log-prob</text>
  <text x="604" y="182" font-size="11" fill="#6b7280">Rollout 算子与并行方式</text>

  <rect x="590" y="222" width="238" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="604" y="246" font-size="14" font-weight="700" fill="#9ca3af">② 旧策略重算 · 跳过</text>
  <text x="604" y="264" font-size="11" fill="#9ca3af">整趟不做,省下的就是这一段</text>
  <text x="604" y="280" font-size="11" fill="#9ca3af">旧策略直接取 ① 的数</text>

  <rect x="590" y="308" width="238" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="604" y="334" font-size="14" font-weight="700" fill="#111827">③ 当前策略log-prob</text>
  <text x="604" y="354" font-size="11" fill="#6b7280">选中训练步各算一次</text>

  <rect x="590" y="400" width="238" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="604" y="424" font-size="14" font-weight="700" fill="#111827">比值</text>
  <text x="604" y="444" font-size="11" fill="#6b7280">分母来自另一套栈</text>
  <text x="604" y="462" font-size="11" fill="#6b7280">系统差从第一步就在里面</text>

  <rect x="856" y="400" width="212" height="92" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="870" y="426" font-size="14" font-weight="700" fill="#111827">兜底 · 损失里,每步一次</text>
  <text x="870" y="448" font-size="11" fill="#6b7280">修正已由比值本身完成</text>
  <text x="870" y="466" font-size="11" fill="#6b7280">只有拒绝那一档进梯度</text>
  <text x="870" y="484" font-size="11" fill="#6b7280">指标落在Actor前缀下</text>

  <path d="M 709 370 L 709 393" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M 703 393 L 715 393 L 709 400 Z" fill="#9ca3af"/>
  <text x="718" y="388" font-size="11" fill="#6b7280">分子</text>

  <path d="M 828 167 L 842 167 L 842 435 L 836 435" fill="none" stroke="#5fa886" stroke-width="1.8"/>
  <path d="M 836 429 L 836 441 L 828 435 Z" fill="#5fa886"/>
  <rect x="829" y="384" width="26" height="14" fill="#ffffff"/>
  <text x="842" y="395" font-size="11" fill="#5fa886" text-anchor="middle">分母</text>

  <rect x="590" y="502" width="478" height="78" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="604" y="528" font-size="14" font-weight="700" fill="#111827">逐元素损失</text>
  <text x="604" y="550" font-size="11" fill="#6b7280">PPO 逐元素损失 × 修正乘数,按原元素总数平均</text>
  <text x="604" y="568" font-size="11" fill="#6b7280">被拒的样本权重是 0,但求平均时分母不减</text>

  <text x="32" y="634" font-size="11" fill="#9ca3af">仅描述 Policy Gradient 的策略损失;额外 KL / 蒸馏项另算。参数与指标键见第五节。</text>
</svg>
