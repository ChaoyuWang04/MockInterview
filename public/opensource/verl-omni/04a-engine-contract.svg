<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 766" width="1120" height="766" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="766" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" font-weight="700">适配契约:两条后端如何覆盖训练生命周期</text><text x="30" y="58" font-size="13" fill="#6b7280">整行上色,颜色说的是这一行两边差在哪一类:绿 = 同一份代码两边共用(画成横跨两列的一个方框) · 紫 = 各写一遍但行为与输出格式已对齐</text><text x="30" y="78" font-size="13" fill="#6b7280">黄 = 各用各的机制、能力并不相同 · 红 = 只有一边有,另一边直接拒绝 · 灰 = 契约本身与调用方,不属于任何一条后端</text><rect x="30" y="98" width="1060" height="46" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="120" font-size="14" fill="#111827" font-weight="700">Actor worker 与控制器</text><text x="42" y="138" font-size="11" fill="#6b7280">循环里出现的只有左列这几件事;并行布局也不是从配置里读的,是启动时问引擎要来的,所以换后端时这段代码一行不动</text><text x="30" y="174" font-size="14" fill="#111827" font-weight="700">契约上的一件事</text><text x="326" y="174" font-size="14" fill="#111827" font-weight="700">FSDP / FSDP2</text><text x="710" y="174" font-size="14" fill="#111827" font-weight="700">VeOmni(可选依赖)</text><rect x="30" y="190" width="280" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="212" font-size="14" fill="#111827" font-weight="700">报并行布局</text><text x="42" y="230" font-size="11" fill="#6b7280">启动时告诉调用方:我是第几个数据并行组、谁负责</text><text x="42" y="245" font-size="11" fill="#6b7280">把结果收上去</text><rect x="326" y="190" width="372" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="338" y="212" font-size="14" fill="#111827" font-weight="700">自己建设备网格</text><text x="338" y="230" font-size="11" fill="#6b7280">开序列并行时再叠一层三维网格;真正把序列切开的活交给模型库做</text><rect x="710" y="190" width="370" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="722" y="212" font-size="14" fill="#111827" font-weight="700">把并行状态交给外部库初始化</text><text x="722" y="230" font-size="11" fill="#6b7280">因此白得它那一维专家并行;序列并行设成非 1 直接抛不支持</text><rect x="30" y="262" width="280" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="284" font-size="14" fill="#111827" font-weight="700">建模型并摆上卡</text><text x="42" y="302" font-size="11" fill="#6b7280">参数怎么分片、用什么精度、要不要卸到主存</text><rect x="326" y="262" width="372" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="338" y="284" font-size="14" fill="#111827" font-weight="700">通用扩散库加载,其余自己拼</text><text x="338" y="302" font-size="11" fill="#6b7280">分片、混合精度、区块编译、梯度检查点逐项自己配;装不进来的架构也</text><text x="338" y="317" font-size="11" fill="#6b7280">能让模型适配器接管加载</text><rect x="710" y="262" width="370" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="722" y="284" font-size="14" fill="#111827" font-weight="700">借外部训练库的建模与并行化两步</text><text x="722" y="302" font-size="11" fill="#6b7280">绕过对方训练器的构造函数造一个空壳,再填一份根本用不上的训练参数</text><rect x="30" y="334" width="280" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="356" font-size="14" fill="#111827" font-weight="700">每一步喂什么、收什么</text><text x="42" y="374" font-size="11" fill="#6b7280">一个去噪步的模型输入与输出格式</text><rect x="326" y="334" width="754" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="338" y="356" font-size="14" fill="#111827" font-weight="700">同一个模型适配器,两条后端逐字复用</text><text x="338" y="374" font-size="11" fill="#6b7280">接一个新模型只写一次;这就是「换后端不用动模型代码」落在哪里</text><rect x="30" y="392" width="280" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="414" font-size="14" fill="#111827" font-weight="700">一次前向反向</text><text x="42" y="432" font-size="11" fill="#6b7280">按「微批 × 选中训练步」展开,累积次数是两者</text><text x="42" y="447" font-size="11" fill="#6b7280">的乘积</text><rect x="326" y="392" width="372" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="338" y="414" font-size="14" fill="#111827" font-weight="700">双层循环,外加两个优化开关</text><text x="338" y="432" font-size="11" fill="#6b7280">可以把输入留在主存逐步搬上卡、把梯度归约推到最后一次反向;训练时</text><text x="338" y="447" font-size="11" fill="#6b7280">每步的输出算完就丢</text><rect x="710" y="392" width="370" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="722" y="414" font-size="14" fill="#111827" font-weight="700">双层循环,没有那两个开关</text><text x="722" y="432" font-size="11" fill="#6b7280">每一步的输出一直留到整批做完</text><rect x="30" y="464" width="280" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="486" font-size="14" fill="#111827" font-weight="700">走一次优化器</text><text x="42" y="504" font-size="11" fill="#6b7280">裁剪梯度;范数非有限时跳过更新,保留指标并打印</text><text x="42" y="519" font-size="11" fill="#6b7280">警告</text><rect x="326" y="464" width="372" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="338" y="486" font-size="14" fill="#111827" font-weight="700">用分片器自带的裁剪</text><text x="338" y="504" font-size="11" fill="#6b7280">按分片实现的两代接口分两条路</text><rect x="710" y="464" width="370" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="722" y="486" font-size="14" fill="#111827" font-weight="700">用外部库模型自带的裁剪</text><text x="722" y="504" font-size="11" fill="#6b7280">模型上没有这个方法时退回逐参数裁剪</text><rect x="30" y="536" width="280" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="558" font-size="14" fill="#111827" font-weight="700">存档与续训</text><text x="42" y="576" font-size="11" fill="#6b7280">分片权重、优化器状态与附加状态一起存</text><rect x="326" y="536" width="754" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="338" y="558" font-size="14" fill="#111827" font-weight="700">同一个分片存档管理器,两边都是直接拿来用</text><text x="338" y="576" font-size="11" fill="#6b7280">各写各的只有一件:存之前把参数拉回卡上,存完再卸回去</text><rect x="30" y="594" width="280" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="616" font-size="14" fill="#111827" font-weight="700">把权重交给Rollout 侧</text><text x="42" y="634" font-size="11" fill="#6b7280">分片张量聚回整张,按Rollout 侧认得的名字流式交出</text><rect x="326" y="594" width="372" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="338" y="616" font-size="14" fill="#111827" font-weight="700">聚回整张,统一转成一种半精度</text><text x="338" y="634" font-size="11" fill="#6b7280">前缀和另一边一样;带 LoRA时另走三条分支</text><rect x="710" y="594" width="370" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="722" y="616" font-size="14" fill="#111827" font-weight="700">聚回整张,转成配置里写的那个精度</text><text x="722" y="634" font-size="11" fill="#6b7280">前缀和另一边一样;带 LoRA直接拒绝</text><rect x="30" y="652" width="280" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="42" y="674" font-size="14" fill="#111827" font-weight="700">LoRA</text><text x="42" y="692" font-size="11" fill="#6b7280">只训插进去的小矩阵,同步权重时只传这一部分</text><rect x="326" y="652" width="372" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="338" y="674" font-size="14" fill="#111827" font-weight="700">一个混入类加一份专门的收集导出工具</text><text x="338" y="692" font-size="11" fill="#6b7280">多个命名适配器、指数滑动平均、合并后导出都在这里</text><rect x="710" y="652" width="370" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="722" y="674" font-size="14" fill="#111827" font-weight="700">构造时直接拒绝</text><text x="722" y="692" font-size="11" fill="#6b7280">配了 LoRA就起不来,权重导出这一步也拒绝</text><text x="30" y="722" font-size="11" fill="#9ca3af">换后端真正要看的只有黄色那两行和红色那一行:并行方式能不能组合出你要的那套、模型装不装得进去、有没有LoRA;其余五行要么是同一份代码,要么行为已经对齐。</text><text x="30" y="742" font-size="11" fill="#9ca3af">双层循环指 Policy Gradient;DPO/NFT 的展开方式见下一图。具体配置在第五节。</text></svg>