<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790">
<rect width="1120" height="790" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ca3af"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Helvetica Neue, Microsoft YaHei, Arial, sans-serif">
<text x="24" y="32" font-size="19" font-weight="700" fill="#111827">整步墙钟、Actor 调用与 MFU：三个不同的统计范围</text>
<text x="24" y="57" font-size="13" font-weight="400" fill="#6b7280">灰＝阶段范围　紫＝Actor 内部计时　绿＝计算量估计　黄＝归一化依据</text>
<text x="24" y="80" font-size="11" font-weight="400" fill="#6b7280">以默认扩散 Policy Gradient 循环为例；宽度仅表达包含关系与顺序，不表示实测耗时。</text>
<rect x="24" y="101" width="864" height="193" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="128" font-size="14" font-weight="700" fill="#111827">step 计时范围</text>
<rect x="40" y="147" width="174" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="53" y="171" font-size="14" font-weight="700" fill="#111827">Rollout / Reward</text>
<text x="53" y="192" font-size="11" font-weight="400" fill="#6b7280">流式 Reward 可在生成内</text>
<rect x="232" y="147" width="180" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="245" y="171" font-size="14" font-weight="700" fill="#111827">训练准备</text>
<text x="245" y="192" font-size="11" font-weight="400" fill="#6b7280">log-prob / Advantage 等</text>
<rect x="430" y="147" width="218" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="443" y="171" font-size="14" font-weight="700" fill="#111827">Actor 更新</text>
<rect x="445" y="194" width="188" height="57" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="458" y="218" font-size="14" font-weight="700" fill="#111827">engine.train_batch</text>
<text x="458" y="239" font-size="11" font-weight="400" fill="#6b7280">内部调用耗时 t</text>
<rect x="666" y="147" width="206" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="679" y="171" font-size="14" font-weight="700" fill="#111827">权重交接等</text>
<text x="679" y="192" font-size="11" font-weight="400" fill="#6b7280">含按条件执行的 Checkpoint</text>
<path d="M214 176 H232" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M412 176 H430" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M648 176 H666" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="928" y="147" width="168" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="941" y="171" font-size="14" font-weight="700" fill="#111827">验证</text>
<text x="941" y="192" font-size="11" font-weight="400" fill="#6b7280">在 step 计时范围外</text>
<path d="M888 176 H928" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="40" y="278" font-size="11" font-weight="400" fill="#6b7280">外层 Actor 更新耗时还包含调度等开销，不能直接拿来替换内部 t。</text>
<path d="M539 251 V323" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="24" y="329" width="1072" height="425" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="357" font-size="14" font-weight="700" fill="#111827">Actor MFU 的组内统计口径</text>
<rect x="40" y="380" width="450" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="53" y="404" font-size="14" font-weight="700" fill="#111827">模型结构 + 本次调用的数据形状</text>
<text x="53" y="425" font-size="11" font-weight="400" fill="#6b7280">latent / prompt 长度、参与的时间步、CFG 前向次数</text>
<rect x="40" y="482" width="450" height="69" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="53" y="506" font-size="14" font-weight="700" fill="#111827">F：数据并行组内的估计计算量</text>
<text x="53" y="527" font-size="11" font-weight="400" fill="#6b7280">先汇总组内序列元数据，再使用架构公式；单位 TFLOP</text>
<path d="M265 456 V482" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="560" y="380" width="250" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="573" y="404" font-size="14" font-weight="700" fill="#111827">t：内部调用耗时</text>
<text x="573" y="425" font-size="11" font-weight="400" fill="#6b7280">只取 train_batch 计时；单位秒</text>
<rect x="840" y="380" width="232" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="853" y="404" font-size="14" font-weight="700" fill="#111827">P：单设备理论峰值</text>
<text x="853" y="425" font-size="11" font-weight="400" fill="#6b7280">BF16 稠密口径；单位 TFLOPS</text>
<rect x="700" y="482" width="372" height="69" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="713" y="506" font-size="14" font-weight="700" fill="#111827">D：数据并行组规模</text>
<text x="713" y="527" font-size="11" font-weight="400" fill="#6b7280">与汇总元数据使用同一组，不直接取全局 GPU 数</text>
<path d="M265 551 V587 H473 V617" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M685 456 V586 H602 V617" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M956 456 V469 H1082 V590 H775 V617" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M886 551 V590 H696 V617" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="363" y="617" width="462" height="66" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="376" y="641" font-size="14" font-weight="700" fill="#111827">MFU = F ÷ ( t × D × P )</text>
<text x="376" y="662" font-size="11" font-weight="400" fill="#6b7280">训练公式；仅前向调用的报告值再除以 3</text>
<text x="40" y="717" font-size="11" font-weight="400" fill="#6b7280">F 是模型估计，不是硬件采样。LoRA 仍使用完整反向估计；3 来自前向加反向的公式约定。</text>
<text x="40" y="739" font-size="11" font-weight="400" fill="#6b7280">整步 Rollout、Reward、验证与权重同步的耗时，不进入这里的内部调用分母。</text>
</g></svg>