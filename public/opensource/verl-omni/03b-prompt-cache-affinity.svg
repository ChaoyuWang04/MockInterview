<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="480" fill="#ffffff"/><rect x="30" y="90" width="516" height="350" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="180" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="244" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="308" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="372" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="92" y="212" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="186" y="216" width="56" height="26" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="92" y="258" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="250" y="262" width="56" height="26" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="92" y="304" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="314" y="308" width="56" height="26" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="92" y="350" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="378" y="354" width="56" height="26" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><path d="M208,180 L214,213" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><path d="M272,180 L278,259" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><path d="M336,180 L342,305" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><path d="M400,180 L406,351" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><rect x="574" y="90" width="516" height="350" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="724" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="788" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="852" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="916" y="154" width="56" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="636" y="212" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="730" y="216" width="56" height="26" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="794" y="216" width="56" height="26" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="858" y="216" width="56" height="26" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="922" y="216" width="56" height="26" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="636" y="258" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="730" y="262" width="56" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="636" y="304" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="730" y="308" width="56" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="636" y="350" width="78" height="34" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="730" y="354" width="56" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><path d="M752,180 L758,213" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><path d="M816,180 L822,213" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><path d="M880,180 L886,213" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><path d="M944,180 L950,213" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><text x="30" y="34" font-size="19" fill="#111827" font-weight="700">路由亲和提高缓存复用机会:空缓存、相同编码入参的理想示例</text><text x="30" y="58" font-size="13" fill="#6b7280">一行是一个副本,每个副本自带一份只给自己用的提示词编码缓存;紫 = 还没派出去的样本,黄 = 得自己跑一遍文本编码器,绿 = 直接从本副本缓存里取,灰 = 别的提示词组。</text><text x="48" y="118" font-size="14" fill="#111827" font-weight="700">关掉亲和,这是默认:每条样本一个新请求号</text><text x="48" y="138" font-size="11" fill="#6b7280">负载均衡按样本做,4 条样本各自被分给当时最空的那个副本</text><text x="48" y="166" font-size="11" fill="#6b7280">同一个提示词</text><text x="48" y="182" font-size="11" fill="#6b7280">展开成 4 条样本</text><text x="208" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 1</text><text x="272" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 2</text><text x="336" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 3</text><text x="400" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 4</text><text x="48" y="233" font-size="11" fill="#6b7280">副本 1</text><text x="131" y="233" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="214" y="233" font-size="11" fill="#6b7280" text-anchor="middle">未命中</text><text x="48" y="279" font-size="11" fill="#6b7280">副本 2</text><text x="131" y="279" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="278" y="279" font-size="11" fill="#6b7280" text-anchor="middle">未命中</text><text x="48" y="325" font-size="11" fill="#6b7280">副本 3</text><text x="131" y="325" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="342" y="325" font-size="11" fill="#6b7280" text-anchor="middle">未命中</text><text x="48" y="371" font-size="11" fill="#6b7280">副本 4</text><text x="131" y="371" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="406" y="371" font-size="11" fill="#6b7280" text-anchor="middle">未命中</text><text x="48" y="406" font-size="11" fill="#9ca3af">4 条样本落在 4 个副本上,同一段文字被编码 4 遍</text><text x="48" y="424" font-size="11" fill="#9ca3af">图示四条各落一个副本;实际分配和命中次数随负载、缓存状态变化</text><text x="592" y="118" font-size="14" fill="#111827" font-weight="700">打开亲和:同组样本共用一个稳定标识当请求号</text><text x="592" y="138" font-size="11" fill="#6b7280">组里第一条仍挑最空的副本,均衡器记下这一组归谁,其余 3 条跟着回去</text><text x="592" y="166" font-size="11" fill="#6b7280">同一个提示词</text><text x="592" y="182" font-size="11" fill="#6b7280">展开成 4 条样本</text><text x="752" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 1</text><text x="816" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 2</text><text x="880" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 3</text><text x="944" y="174" font-size="11" fill="#6b7280" text-anchor="middle">样本 4</text><text x="592" y="233" font-size="11" fill="#6b7280">副本 1</text><text x="675" y="233" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="758" y="233" font-size="11" fill="#6b7280" text-anchor="middle">未命中</text><text x="822" y="233" font-size="11" fill="#6b7280" text-anchor="middle">命中</text><text x="886" y="233" font-size="11" fill="#6b7280" text-anchor="middle">命中</text><text x="950" y="233" font-size="11" fill="#6b7280" text-anchor="middle">命中</text><text x="592" y="279" font-size="11" fill="#6b7280">副本 2</text><text x="675" y="279" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="758" y="279" font-size="11" fill="#6b7280" text-anchor="middle">别的组</text><text x="592" y="325" font-size="11" fill="#6b7280">副本 3</text><text x="675" y="325" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="758" y="325" font-size="11" fill="#6b7280" text-anchor="middle">别的组</text><text x="592" y="371" font-size="11" fill="#6b7280">副本 4</text><text x="675" y="371" font-size="11" fill="#6b7280" text-anchor="middle">本地缓存</text><text x="758" y="371" font-size="11" fill="#6b7280" text-anchor="middle">别的组</text><text x="592" y="406" font-size="11" fill="#9ca3af">理想情况下编码 1 遍、复用 3 次;亲和不保证每组都恰好命中 3 次</text><text x="592" y="424" font-size="11" fill="#9ca3af">代价是均衡从按样本变成按组:一整组压在一个副本上,组大或代价不均时它就是长尾</text><text x="30" y="462" font-size="11" fill="#9ca3af">亲和只改请求往哪走,不改 token、不改编码结果、不改采样参数;缓存没打开时它什么也不做。</text></svg>