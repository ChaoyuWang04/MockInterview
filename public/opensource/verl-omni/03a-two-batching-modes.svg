h="1"/><rect x="430" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="574" y="90" width="516" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="650" y="180" width="48" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="704" y="180" width="48" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="758" y="180" width="48" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="812" y="180" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="866" y="180" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="920" y="180" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="974" y="180" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="650" y="218" width="48" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="704" y="218" width="48" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="758" y="218" width="48" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="812" y="218" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="866" y="218" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="920" y="218" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="974" y="218" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="650" y="256" width="48" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="704" y="256" width="48" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="758" y="256" width="48" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="812" y="256" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="866" y="256" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="920" y="256" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="974" y="256" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="650" y="294" width="48" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="704" y="294" width="48" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="758" y="294" width="48" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="812" y="294" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="866" y="294" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="920" y="294" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="974" y="294" width="48" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="650" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="704" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="758" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="812" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="866" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="920" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="974" y="332" width="48" height="30" rx="6" fill="#eeeeee" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="4 3"/><text x="30" y="34" font-size="19" fill="#111827" font-weight="700">两种批处理:兼容请求各走一步,还是整组一起走</text><text x="30" y="58" font-size="13" fill="#6b7280">一行是一条请求,一列是它的第几个去噪步;紫、绿、黄各是一次前向吃掉的格子,灰是这三次前向没碰的步,红框是晚到的那条请求。</text><text x="48" y="118" font-size="14" fill="#111827" font-weight="700">Stepwise Continuous Batching:兼容请求各取一步</text><text x="48" y="138" font-size="11" fill="#6b7280">开关打开;适配器要把一次生成拆成准备、去噪、走调度器、收尾四段</text><text x="130" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步1</text><text x="184" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步2</text><text x="238" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步3</text><text x="292" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步4</text><text x="346" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步5</text><text x="400" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步6</text><text x="454" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步7</text><text x="48" y="200" font-size="11" fill="#6b7280">请求 A</text><text x="48" y="238" font-size="11" fill="#6b7280">请求 B</text><text x="48" y="276" font-size="11" fill="#6b7280">请求 C</text><text x="48" y="314" font-size="11" fill="#6b7280">请求 D</text><text x="48" y="352" font-size="11" fill="#6b7280">请求 E</text><text x="48" y="386" font-size="11" fill="#9ca3af">同色的格子是同一次前向;各请求各走各的进度,谁先走完谁先交付</text><text x="48" y="404" font-size="11" fill="#9ca3af">空出来的位置新请求立刻补上——晚到的 E 在第三次前向就挤了进来</text><text x="48" y="422" font-size="11" fill="#9ca3af">一次前向只算一步,激活显存按在飞的请求数算</text><text x="592" y="118" font-size="14" fill="#111827" font-weight="700">Request-level Batching:整组一起走完整个循环</text><text x="592" y="138" font-size="11" fill="#6b7280">开关关着,是默认;适配器要声明自己支持打包,并让生成函数认得一批请求</text><text x="674" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步1</text><text x="728" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步2</text><text x="782" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步3</text><text x="836" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步4</text><text x="890" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步5</text><text x="944" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步6</text><text x="998" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">步7</text><text x="592" y="200" font-size="11" fill="#6b7280">请求 A</text><text x="592" y="238" font-size="11" fill="#6b7280">请求 B</text><text x="592" y="276" font-size="11" fill="#6b7280">请求 C</text><text x="592" y="314" font-size="11" fill="#6b7280">请求 D</text><text x="592" y="352" font-size="11" fill="#6b7280">请求 E</text><text x="592" y="386" font-size="11" fill="#9ca3af">一波里的四条从头到尾一起走,每一列是一次打包的大前向</text><text x="592" y="404" font-size="11" fill="#9ca3af">走完再按请求拆开;晚到的 E 只能等下一波,或赶在开算前那几毫秒挤进来</text><text x="592" y="422" font-size="11" fill="#9ca3af">一次前向的激活显存按一波里的条数涨</text><text x="30" y="452" font-size="11" fill="#9ca3af">整请求模式不支持打包时:并发压回 1,每个去噪步只给一条请求做前向;完整生成仍需走完多个去噪步。</text></svg>