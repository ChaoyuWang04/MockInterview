<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 604" width="1120" height="604" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="604" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" font-weight="700">加一个新算法,要动的落在哪几处</text><text x="30" y="58" font-size="13" fill="#6b7280">颜色只说三件事:绿 = 一个算法名就能自动到达的地方 · 红 = 需要检查的注册与校验 · 黄 = 级联到不了、必须自己动手的地方</text><text x="30" y="78" font-size="13" fill="#6b7280">上下两排都是四格,但上排是「名字默认传到」,下排是「一格一格自己填」;两排之间那条虚线就是级联的边界</text><path d="M 560 152 L 560 172" stroke="#9ca3af" stroke-width="1.4" fill="none"/><path d="M 155 172 L 965 172" stroke="#9ca3af" stroke-width="1.4" fill="none"/><path d="M 155 172 L 155 250" stroke="#9ca3af" stroke-width="1.4" fill="none"/><path d="M 425 172 L 425 250" stroke="#9ca3af" stroke-width="1.4" fill="none"/><polygon points="150,241 160,241 155,250" fill="#9ca3af"/><polygon points="420,241 430,241 425,250" fill="#9ca3af"/><path d="M 695 172 L 695 190" stroke="#9ca3af" stroke-width="1.4" fill="none"/><path d="M 695 230 L 695 250" stroke="#9ca3af" stroke-width="1.4" fill="none"/><polygon points="690,181 700,181 695,190" fill="#9ca3af"/><polygon points="690,241 700,241 695,250" fill="#9ca3af"/><path d="M 965 172 L 965 190" stroke="#9ca3af" stroke-width="1.4" fill="none"/><path d="M 965 230 L 965 250" stroke="#9ca3af" stroke-width="1.4" fill="none"/><polygon points="960,181 970,181 965,190" fill="#9ca3af"/><polygon points="960,241 970,241 965,250" fill="#9ca3af"/><path d="M 30 378 L 1090 378" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/><rect x="385" y="96" width="350" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="572" y="190" width="246" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><rect x="842" y="190" width="246" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><rect x="32" y="250" width="246" height="82" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="302" y="250" width="246" height="82" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="572" y="250" width="246" height="82" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="842" y="250" width="246" height="82" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="32" y="420" width="246" height="82" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="302" y="420" width="246" height="82" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="572" y="420" width="246" height="82" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="842" y="420" width="246" height="82" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="399" y="120" font-size="14" fill="#111827" font-weight="700">模型配置里的那一个算法名</text><text x="399" y="140" font-size="11" fill="#6b7280">配置模板把名字传给下面四处;实现、注册与配置校验仍需分别完成</text><text x="584" y="207" font-size="11" fill="#111827" font-weight="700">检查:Advantage 名字已注册</text><text x="584" y="222" font-size="11" fill="#6b7280">支持字符串扩展;缺注册才查不到</text><text x="854" y="207" font-size="11" fill="#111827" font-weight="700">闸门:配置类里的取值白名单</text><text x="854" y="222" font-size="11" fill="#6b7280">当前只认九个取值</text><text x="44" y="274" font-size="14" fill="#111827" font-weight="700">训练侧适配器表</text><text x="44" y="296" font-size="11" fill="#6b7280">按架构名加算法名这个两元组查;查不到直接抛</text><text x="44" y="312" font-size="11" fill="#6b7280">异常,并把全部已注册的两元组列出来</text><text x="314" y="274" font-size="14" fill="#111827" font-weight="700">Rollout 适配器表</text><text x="314" y="296" font-size="11" fill="#6b7280">同一个两元组;查不到只返回空,Rollout 侧于是</text><text x="314" y="312" font-size="11" fill="#6b7280">不替换流水线,静默用上游原版</text><text x="584" y="274" font-size="14" fill="#111827" font-weight="700">Advantage 注册表</text><text x="584" y="296" font-size="11" fill="#6b7280">只有Policy Gradient那条线会查它;表里今天只有一</text><text x="584" y="312" font-size="11" fill="#6b7280">个函数,挂着两个名字</text><text x="854" y="274" font-size="14" fill="#111827" font-weight="700">损失表</text><text x="854" y="296" font-size="11" fill="#6b7280">在 worker 里查;主损失取一次,约束与蒸馏</text><text x="854" y="312" font-size="11" fill="#6b7280">两个加项各再取一次,加起来才是最终损失</text><text x="30" y="406" font-size="14" fill="#111827" font-weight="700">级联到不了的四处:要么另外填一个字段,要么另外写一段代码</text><text x="44" y="444" font-size="14" fill="#111827" font-weight="700">训练器族名与数据来源</text><text x="44" y="466" font-size="11" fill="#6b7280">两个字段,决定走哪一份顺序流,以及集群上</text><text x="44" y="482" font-size="11" fill="#6b7280">起哪几组角色</text><text x="314" y="444" font-size="14" fill="#111827" font-weight="700">引擎注册键</text><text x="314" y="466" font-size="11" fill="#6b7280">按算法族分出来的模型类型,是另一张表上的</text><text x="314" y="482" font-size="11" fill="#6b7280">键,不跟着算法名走,见 04 章</text><text x="584" y="444" font-size="14" fill="#111827" font-weight="700">采样步的公式</text><text x="584" y="466" font-size="11" fill="#6b7280">给调度器加一个分支,或者另写一个调度器;</text><text x="584" y="482" font-size="11" fill="#6b7280">Rollout 侧与训练侧必须用同一个公式</text><text x="854" y="444" font-size="14" fill="#111827" font-weight="700">包初始化里的一行导入</text><text x="854" y="466" font-size="11" fill="#6b7280">装饰器只有在模块被导入时才执行,漏掉相关</text><text x="854" y="482" font-size="11" fill="#6b7280">导入,对应的注册装饰器就不会执行</text><text x="30" y="530" font-size="11" fill="#9ca3af">复用型变体的实际写法:算法名填新的,复用已有实现的两处在启动命令里钉回旧名字——仓库里的滑窗配方就是一个启动脚本里三个算法名,两个是旧的。</text><text x="30" y="550" font-size="11" fill="#9ca3af">绿色四格是各自维护的,没有人对账:当前就有一个算法名只注册了Rollout 侧那一格,训练侧那一格是空的,这个名字今天配不通。</text><text x="30" y="570" font-size="11" fill="#9ca3af">图上这四个字段的完整名字、默认值与可选取值都在第五节。</text></svg>