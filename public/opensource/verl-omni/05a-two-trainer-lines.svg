<rect x="220" y="412" width="207" height="76" rx="5" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="230" y="441" font-size="12" fill="#111827">默认重算</text>
<text x="230" y="465" font-size="12" fill="#111827">bypass 时复用 Rollout</text>
<rect x="438" y="412" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="448" y="441" font-size="12" fill="#6b7280">不需要</text>
<rect x="656" y="412" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="666" y="441" font-size="12" fill="#6b7280">不需要</text>
<rect x="874" y="412" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="884" y="441" font-size="12" fill="#6b7280">不需要</text>
<text x="28" y="532" font-size="14" fill="#111827" font-weight="700">准备损失输入</text>
<rect x="220" y="500" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="230" y="529" font-size="12" fill="#111827">计算样本间 Advantage</text>
<text x="230" y="553" font-size="12" fill="#111827">选中训练步共享</text>
<rect x="438" y="500" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="529" font-size="12" fill="#111827">批准备钩子</text>
<text x="448" y="553" font-size="12" fill="#111827">挑 chosen / rejected</text>
<rect x="656" y="500" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="529" font-size="12" fill="#111827">批准备钩子</text>
<text x="666" y="553" font-size="12" fill="#111827">构造权重与训练时间步</text>
<rect x="874" y="500" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="884" y="529" font-size="12" fill="#111827">使用已备好的样本对</text>
<text x="28" y="620" font-size="14" fill="#111827" font-weight="700">Reference Model</text>
<rect x="220" y="588" width="207" height="76" rx="5" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="230" y="617" font-size="12" fill="#111827">参考约束启用时</text>
<text x="230" y="641" font-size="12" fill="#111827">Teacher 蒸馏另按配置</text>
<rect x="438" y="588" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="617" font-size="12" fill="#111827">单点噪声预测</text>
<text x="448" y="641" font-size="12" fill="#111827">DPO 目标需要</text>
<rect x="656" y="588" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="617" font-size="12" fill="#111827">在 Actor 内取参考预测</text>
<text x="666" y="641" font-size="12" fill="#111827">是否加入损失由系数决定</text>
<rect x="874" y="588" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="884" y="617" font-size="12" fill="#111827">单点噪声预测</text>
<text x="884" y="641" font-size="12" fill="#111827">DPO 目标需要</text>
<text x="28" y="708" font-size="14" fill="#111827" font-weight="700">Actor 更新</text>
<rect x="220" y="676" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="230" y="705" font-size="12" fill="#111827">微批 × 选中训练步</text>
<rect x="438" y="676" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="705" font-size="12" fill="#111827">按微批单次计算</text>
<text x="448" y="729" font-size="12" fill="#111827">成对数据保持配对</text>
<rect x="656" y="676" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="705" font-size="12" fill="#111827">微批 × 选中训练步</text>
