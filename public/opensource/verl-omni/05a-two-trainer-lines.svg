<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect width="1120" height="1040" fill="#fff"/>
<text x="28" y="36" font-size="19" fill="#111827" font-weight="700">两条训练器线,四种代表性路径</text>
<text x="28" y="65" font-size="13" fill="#6b7280">紫 = 本路径会执行　黄 = 依算法 / 配置出现　白色虚线 = 不执行;颜色不表示代码是否复用</text>
<text x="28" y="90" font-size="13" fill="#6b7280">Direct Preference 内部也不同:DPO 用样本对,NFT 默认用逐样本权重。</text>
<text x="232" y="126" font-size="15" fill="#111827" font-weight="700">FlowGRPO · 在线</text>
<text x="450" y="126" font-size="15" fill="#111827" font-weight="700">DPO · 在线</text>
<text x="668" y="126" font-size="15" fill="#111827" font-weight="700">NFT · 在线</text>
<text x="886" y="126" font-size="15" fill="#111827" font-weight="700">DPO · 离线</text>
<text x="28" y="180" font-size="14" fill="#111827" font-weight="700">输入</text>
<rect x="220" y="148" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="230" y="177" font-size="12" fill="#111827">提示词</text>
<text x="230" y="201" font-size="12" fill="#111827">按组展开</text>
<rect x="438" y="148" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="177" font-size="12" fill="#111827">提示词</text>
<text x="448" y="201" font-size="12" fill="#111827">按组展开</text>
<rect x="656" y="148" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="177" font-size="12" fill="#111827">提示词</text>
<text x="666" y="201" font-size="12" fill="#111827">按组展开</text>
<rect x="874" y="148" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="884" y="177" font-size="12" fill="#111827">离线偏好样本对</text>
<text x="884" y="201" font-size="12" fill="#111827">含现成评分</text>
<text x="28" y="268" font-size="14" fill="#111827" font-weight="700">Rollout</text>
<rect x="220" y="236" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="230" y="265" font-size="12" fill="#111827">成品 + 选中训练片段</text>
<text x="230" y="289" font-size="12" fill="#111827">log-prob 按配置返回</text>
<rect x="438" y="236" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="265" font-size="12" fill="#111827">最终隐变量</text>
<text x="448" y="289" font-size="12" fill="#111827">不保存整条去噪链</text>
<rect x="656" y="236" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="265" font-size="12" fill="#111827">最终隐变量</text>
<text x="666" y="289" font-size="12" fill="#111827">不保存整条去噪链</text>
<rect x="874" y="236" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="884" y="265" font-size="12" fill="#6b7280">不创建 Rollout 角色</text>
<text x="28" y="356" font-size="14" fill="#111827" font-weight="700">Reward</text>
<rect x="220" y="324" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="230" y="353" font-size="12" fill="#111827">给成品打分</text>
<text x="230" y="377" font-size="12" fill="#111827">满足条件时流式</text>
<rect x="438" y="324" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="353" font-size="12" fill="#111827">给成品打分</text>
<text x="448" y="377" font-size="12" fill="#111827">用于选出样本对</text>
<rect x="656" y="324" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="353" font-size="12" fill="#111827">给成品打分</text>
<text x="666" y="377" font-size="12" fill="#111827">用于逐样本权重</text>
<rect x="874" y="324" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
