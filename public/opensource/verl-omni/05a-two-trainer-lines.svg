<text x="448" y="817" font-size="12" fill="#111827">按间隔及衰减策略刷新</text>
<rect x="656" y="764" width="207" height="76" rx="5" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="666" y="793" font-size="12" fill="#111827">配置 old adapter 时刷新</text>
<text x="666" y="817" font-size="12" fill="#111827">官方配方使用该路径</text>
<rect x="874" y="764" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="884" y="793" font-size="12" fill="#6b7280">离线循环不做这项刷新</text>
<text x="28" y="884" font-size="14" fill="#111827" font-weight="700">同步至 Rollout</text>
<rect x="220" y="852" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="230" y="881" font-size="12" fill="#111827">更新后同步权重</text>
<rect x="438" y="852" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="448" y="881" font-size="12" fill="#111827">更新后同步权重</text>
<rect x="656" y="852" width="207" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="666" y="881" font-size="12" fill="#111827">更新后同步权重</text>
<rect x="874" y="852" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="884" y="881" font-size="12" fill="#6b7280">无在线 Rollout</text>
<text x="28" y="978" font-size="13" fill="#6b7280">矩阵比较典型路径,不靠亮格数量推断固定阶段数;验证、存档等生命周期工作未展开。</text>
<text x="28" y="1007" font-size="13" fill="#6b7280">在线旧适配器刷新取决于是否配置旧适配器;后端与模型仍须支持所选算法。</text>
</svg>