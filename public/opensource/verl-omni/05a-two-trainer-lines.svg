<text x="884" y="705" font-size="12" fill="#111827">按微批单次计算</text>
<text x="28" y="796" font-size="14" fill="#111827" font-weight="700">刷新旧适配器</text>
<rect x="220" y="764" width="207" height="76" rx="5" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
