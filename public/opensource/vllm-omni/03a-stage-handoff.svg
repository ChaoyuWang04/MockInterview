<rect x="554" y="126" width="185" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="570" y="150" font-size="14" font-weight="700" fill="#111827">提交下游请求</text><text x="570" y="172" font-size="11" fill="#6b7280">Scheduler 预留位置</text>
<rect x="554" y="204" width="185" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="570" y="229" font-size="14" font-weight="700" fill="#111827">OmniConnector</text><text x="570" y="251" font-size="11" fill="#6b7280">交付真正 conditioning</text>
