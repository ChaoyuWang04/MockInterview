<rect x="232" y="419" width="286" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="248" y="445" font-size="14" font-weight="700" fill="#111827">过滤 → 积累 → 切块并调整排列</text><text x="248" y="470" font-size="11" fill="#6b7280">不足块长可暂不交付；结束时处理尾部</text>
