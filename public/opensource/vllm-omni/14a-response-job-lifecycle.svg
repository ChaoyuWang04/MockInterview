<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650">
<rect width="1120" height="650" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9ca3af"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="32" y="34" font-size="19" font-weight="700" fill="#111827">生成结束、请求返回和文件保留，不是同一个边界</text>
<text x="32" y="59" font-size="13" fill="#6b7280">绿：生成与编码　紫：API 进程内状态　黄：磁盘文件　灰：客户端与响应交付</text>
<text x="32" y="98" font-size="14" font-weight="700" fill="#111827">沿原请求交付：以非流式图像为例</text>
<rect x="32" y="117" width="180" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="48" y="145" font-size="14" font-weight="700" fill="#111827">客户端提交图片请求</text><text x="48" y="168" font-size="11" fill="#6b7280">等待原 HTTP 响应</text>
<rect x="290" y="117" width="430" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="310" y="145" font-size="14" font-weight="700" fill="#111827">生成完整图片 → 编码</text><text x="310" y="168" font-size="11" fill="#6b7280">模型输出先变成图片，再准备 base64 或文件内容</text>
<rect x="815" y="117" width="273" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="833" y="145" font-size="14" font-weight="700" fill="#111827">本次请求返回 JSON / 文件</text><text x="833" y="168" font-size="11" fill="#6b7280">文件分块传输不代表逐步生成</text>
<text x="32" y="234" font-size="14" font-weight="700" fill="#111827">跨请求交付：异步视频</text>
<rect x="264" y="254" width="500" height="142" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="282" y="279" font-size="13" fill="#6b7280">同一个 API 进程：任务记录与后台 task 不跨 worker 共享</text>
<rect x="32" y="302" width="180" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="48" y="330" font-size="14" font-weight="700" fill="#111827">创建视频任务</text><text x="48" y="354" font-size="11" fill="#6b7280">先收到 id 与 queued 记录</text>
<rect x="290" y="302" width="208" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="308" y="330" font-size="14" font-weight="700" fill="#111827">内存 job 记录</text><text x="308" y="354" font-size="11" fill="#6b7280">状态、错误、文件信息</text>
<rect x="548" y="302" width="192" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="565" y="330" font-size="14" font-weight="700" fill="#111827">后台 task</text><text x="565" y="354" font-size="11" fill="#6b7280">驱动生成并更新记录</text>
<rect x="548" y="430" width="192" height="83" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="565" y="458" font-size="14" font-weight="700" fill="#111827">引擎生成 → 编码</text><text x="565" y="482" font-size="11" fill="#6b7280">开始通知更新 in_progress</text><text x="565" y="501" font-size="11" fill="#6b7280">完成文件后才能保存</text>
<rect x="858" y="430" width="230" height="83" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="876" y="458" font-size="14" font-weight="700" fill="#111827">独立的本地文件</text><text x="876" y="482" font-size="11" fill="#6b7280">保存成功后写回 completed</text><text x="876" y="501" font-size="11" fill="#6b7280">可选 TTL 仅清理文件</text>
<rect x="32" y="437" width="180" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="48" y="465" font-size="14" font-weight="700" fill="#111827">后续查询 / 下载</text><text x="48" y="489" font-size="11" fill="#6b7280">使用之前返回的 id</text>
<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)">
<path d="M212 152H290"/><path d="M720 152H815"/>
<path d="M212 320H290"/><path d="M290 365H212"/><path d="M498 326H548"/>
<path d="M644 378V430"/><path d="M740 471H858"/>
<path d="M972 430V404H394V378"/><path d="M212 462H250V340H290"/>
<path d="M122 513V569H972V513"/>
</g>
<text x="793" y="391" font-size="11" fill="#6b7280">保存后更新记录</text>
<text x="286" y="555" font-size="11" fill="#6b7280">下载先查 job，再读取文件；两者缺一不可</text>
<text x="32" y="611" font-size="13" fill="#6b7280">重启不恢复内存 job；文件 TTL 不删除 job。状态完成与文件仍可下载需要分别判断。</text>
</g></svg>
