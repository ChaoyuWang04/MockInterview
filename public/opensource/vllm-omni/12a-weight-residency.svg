<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9ca3af"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="28" y="34" font-size="19" font-weight="700" fill="#111827">权重驻留与主机复用，控制两个不同的边界</text>
<text x="28" y="59" font-size="13" fill="#6b7280">绿：GPU 权重　紫：共享主机表示　黄：传输暂存　灰：来源与其他占用</text>
<rect x="28" y="82" width="1064" height="207" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="109" font-size="14" font-weight="700" fill="#111827">执行期间：DLO 交替复用 2 个流式设备槽</text>
<text x="49" y="158" font-size="13" fill="#6b7280">当前时刻</text>
<text x="49" y="219" font-size="13" fill="#6b7280">下个时刻</text>
<rect x="167" y="132" width="229" height="43" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="185" y="159" font-size="14" font-weight="700" fill="#111827">槽 A：计算 block i</text>
<rect x="427" y="132" width="229" height="43" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="445" y="159" font-size="14" font-weight="700" fill="#111827">槽 B：预取 block i+1</text>
<rect x="167" y="194" width="229" height="43" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="185" y="221" font-size="14" font-weight="700" fill="#111827">槽 A：预取后续 block</text>
<rect x="427" y="194" width="229" height="43" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="445" y="221" font-size="14" font-weight="700" fill="#111827">槽 B：计算 block i+1</text>
<path d="M282 177V191M542 177V191" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="703" y="132" width="366" height="105" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="723" y="160" font-size="14" font-weight="700" fill="#111827">设备槽之外仍有显存开销</text>
<text x="723" y="185" font-size="11" fill="#6b7280">常驻层、非 block 模块、activation、VAE</text>
<text x="723" y="208" font-size="11" fill="#6b7280">AllGather 分支还需要 shard buffer</text>
<text x="167" y="264" font-size="11" fill="#6b7280">每槽按最大 block 配置容量；可由 rank-local H2D 或 H2D + AllGather 填充</text>
<rect x="28" y="306" width="1064" height="228" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="334" font-size="14" font-weight="700" fill="#111827">启动与主机侧：HWR 精确匹配最终布局，随后仍各自搬往 GPU</text>
<rect x="48" y="382" width="164" height="66" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="65" y="408" font-size="14" font-weight="700" fill="#111827">checkpoint</text>
<text x="65" y="430" font-size="11" fill="#6b7280">正常加载与转换</text>
<rect x="298" y="374" width="258" height="82" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="318" y="402" font-size="14" font-weight="700" fill="#111827">共享的最终布局 artifact</text>
<text x="318" y="426" font-size="11" fill="#6b7280">同一精确身份，分别取得映射 lease</text>
<path d="M212 415H294" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="226" y="394" font-size="11" fill="#6b7280">加载后发布</text>
<rect x="682" y="355" width="182" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="698" y="379" font-size="14" font-weight="700" fill="#111827">worker A 搬运</text>
<text x="698" y="399" font-size="11" fill="#6b7280">注册映射或有界 staging</text>
<rect x="682" y="435" width="182" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="698" y="459" font-size="14" font-weight="700" fill="#111827">worker B 搬运</text>
<text x="698" y="479" font-size="11" fill="#6b7280">各自的传输与执行资源</text>
<rect x="922" y="355" width="147" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="939" y="389" font-size="14" font-weight="700" fill="#111827">A 的设备槽</text>
<rect x="922" y="435" width="147" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="939" y="469" font-size="14" font-weight="700" fill="#111827">B 的设备槽</text>
<path d="M556 404H611V384H678M556 426H611V464H678M864 384H918M864 464H918" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="48" y="514" font-size="11" fill="#9ca3af">下半图仅示 HWR 已接入的 rank-local DLO；共享主机 backing 不会合并 GPU 执行副本。</text>
</g></svg>
