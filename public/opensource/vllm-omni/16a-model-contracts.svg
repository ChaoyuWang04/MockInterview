<text x="64" y="492" font-size="14" font-weight="bold">Diffusion Model Registry</text><text x="64" y="514" font-size="11" fill="#6b7280">解析 QwenImage Pipeline 类</text>
<rect x="344" y="468" width="264" height="61" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="360" y="492" font-size="14" font-weight="bold">自动生成单 stage 拓扑</text><text x="360" y="514" font-size="11" fill="#6b7280">无需手写段间 Processor</text>
<rect x="662" y="468" width="394" height="61" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="678" y="492" font-size="14" font-weight="bold">QwenImage Pipeline</text><text x="678" y="514" font-size="11" fill="#6b7280">组件装载 + request batch / step execution 契约</text>
