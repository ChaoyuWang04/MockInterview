<text x="48" y="560" font-size="11" fill="#6b7280">注册只负责发现；batch、step execution、Parallel、Cache、Offload 各自需要实现与验证</text>
<text x="32" y="608" font-size="11" fill="#6b7280">图示为源码契约关系，方框大小不表示参数量、显存或耗时。</text>
