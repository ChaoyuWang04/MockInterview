<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530">
<rect width="1120" height="530" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9ca3af"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="32" y="34" font-size="19" font-weight="700" fill="#111827">少算发生在不同位置：以 TeaCache 的 residual 复用为例</text>
<text x="32" y="59" font-size="13" fill="#6b7280">绿：真实计算　紫：缓存状态与复用　黄：复用判据　灰：每步仍要推进的计算</text>
<rect x="32" y="106" width="190" height="86" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="48" y="134" font-size="14" font-weight="700" fill="#111827">当前 denoise 输入</text><text x="48" y="158" font-size="11" fill="#6b7280">模型适配器准备 hidden states</text><text x="48" y="177" font-size="11" fill="#6b7280">提取 modulated input</text>
<rect x="270" y="106" width="200" height="86" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="286" y="134" font-size="14" font-weight="700" fill="#111827">累计输入变化</text><text x="286" y="158" font-size="11" fill="#6b7280">首步必须真实计算</text><text x="286" y="177" font-size="11" fill="#6b7280">其余步骤判断是否复用</text>
<rect x="520" y="100" width="310" height="174" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="540" y="127" font-size="14" font-weight="700" fill="#111827">真实执行 transformer blocks</text>
<rect x="540" y="146" width="126" height="65" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="554" y="171" font-size="14" font-weight="700" fill="#111827">attention</text><text x="554" y="192" font-size="11" fill="#6b7280">此处使用所选后端</text>
<rect x="688" y="146" width="120" height="65" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="701" y="171" font-size="14" font-weight="700" fill="#111827">其余 block 计算</text><text x="701" y="192" font-size="11" fill="#6b7280">仍需运行</text>
<text x="540" y="246" font-size="11" fill="#6b7280">输出减输入，保存本次 residual</text>
<rect x="520" y="332" width="310" height="77" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="540" y="361" font-size="14" font-weight="700" fill="#111827">当前 hidden + 上次 residual</text><text x="540" y="385" font-size="11" fill="#6b7280">绕过 blocks；更新判据输入与计数</text>
<rect x="895" y="218" width="193" height="104" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="910" y="246" font-size="14" font-weight="700" fill="#111827">当前步骤后处理</text><text x="910" y="271" font-size="11" fill="#6b7280">恢复模型输出</text><text x="910" y="293" font-size="11" fill="#6b7280">采样器继续更新 latent</text>
<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"><path d="M222 149H270"/><path d="M470 149H520"/><path d="M370 192V370H520"/><path d="M830 183H865V245H895"/><path d="M830 370H865V294H895"/><path d="M675 274V332"/></g>
<text x="477" y="136" font-size="11" fill="#6b7280">重算</text><text x="386" y="354" font-size="11" fill="#6b7280">变化小且有缓存</text><text x="689" y="308" font-size="11" fill="#8f8bd8">供后续步骤复用</text>
<text x="32" y="464" font-size="13" fill="#6b7280">真实分支内可另启 Skip-Softmax：QK 始终执行，只省去部分 tile 的 Softmax 与 PV。</text>
<text x="32" y="493" font-size="13" fill="#6b7280">新生成要刷新缓存；图中分支表示计算位置，不表示固定的命中比例或实测加速。</text>
</g></svg>
