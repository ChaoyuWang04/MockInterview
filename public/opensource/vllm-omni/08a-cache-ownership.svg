<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9ca3af"/></marker></defs>
<rect width="1120" height="690" fill="#fff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="28" y="33" font-size="19" font-weight="700" fill="#111827">命中要补齐输出,预算要分清所有者</text>
<text x="28" y="58" font-size="13" fill="#6b7280">绿：引擎分页 KV　紫：阶段输出　黄：模型自带 KV　灰：预算与报告　格数仅示意,不代表容量比例</text>
<rect x="20" y="79" width="1080" height="281" rx="8" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="38" y="105" font-size="14" font-weight="700" fill="#111827">适用的 AR stage：KV 命中省计算,CPU 镜像补齐被跳过的输出行</text>
<text x="43" y="138" font-size="13" fill="#6b7280">GPU · vLLM KV pool</text>
<rect x="42" y="151" width="84" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/><rect x="132" y="151" width="84" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/><rect x="222" y="151" width="84" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="60" y="178" font-size="11" fill="#6b7280">前缀 block</text><text x="150" y="178" font-size="11" fill="#6b7280">前缀 block</text><text x="246" y="178" font-size="11" fill="#6b7280">新尾部</text>
<text x="42" y="237" font-size="11" fill="#6b7280">共用 slot 编号；不是把 KV 复制到 CPU</text>
<text x="43" y="274" font-size="13" fill="#6b7280">CPU · PrefixBlockPool</text>
<rect x="42" y="286" width="84" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><rect x="132" y="286" width="84" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><rect x="222" y="286" width="84" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="58" y="313" font-size="11" fill="#6b7280">前缀输出行</text><text x="148" y="313" font-size="11" fill="#6b7280">前缀输出行</text><text x="240" y="313" font-size="11" fill="#6b7280">尾部输出行</text>
<g stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"><path d="M84 195V215M84 243V259"/><path d="M174 195V215M174 243V259"/><path d="M264 195V215M264 243V259"/></g>
<rect x="393" y="151" width="266" height="73" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="410" y="178" font-size="14" font-weight="700" fill="#111827">本轮只算新 token</text><text x="410" y="202" font-size="11" fill="#6b7280">得到新的 hidden states / 多模态输出</text>
<rect x="393" y="274" width="266" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="410" y="299" font-size="14" font-weight="700" fill="#111827">取回已命中的前缀输出</text><text x="410" y="319" font-size="11" fill="#6b7280">镜像行必须与 KV 命中一致</text>
<rect x="779" y="215" width="278" height="77" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="797" y="244" font-size="14" font-weight="700" fill="#111827">前缀输出 + 新尾部 → 下游条件</text><text x="797" y="271" font-size="11" fill="#6b7280">下游拿到完整内容,而非只有本轮增量</text>
<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"><path d="M306 173H393"/><path d="M306 308H393"/><path d="M659 187H720V237H779"/><path d="M659 302H720V270H779"/></g>
<rect x="20" y="380" width="530" height="184" rx="8" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="38" y="408" font-size="14" font-weight="700" fill="#111827">Diffusion 分页路径 · 独立池</text>
<rect x="40" y="429" width="212" height="73" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="55" y="454" font-size="14" font-weight="700" fill="#111827">Scheduler 预留 CFG 行</text><text x="55" y="478" font-size="11" fill="#6b7280">包装 vLLM KVCacheManager</text>
<rect x="297" y="429" width="231" height="73" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="312" y="454" font-size="14" font-weight="700" fill="#111827">Worker 分配 KV Tensor</text><text x="312" y="478" font-size="11" fill="#6b7280">按 block metadata 安装映射</text>
<path d="M252 465H297" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="40" y="538" font-size="11" fill="#6b7280">共享分页组件 ≠ 与 AR 共享物理池；当前关闭跨请求前缀复用</text>
<rect x="570" y="380" width="530" height="184" rx="8" fill="#fff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="588" y="408" font-size="14" font-weight="700" fill="#111827">模型内部 KV · 不归分页池分配</text>
<rect x="590" y="429" width="230" height="73" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="606" y="454" font-size="14" font-weight="700" fill="#111827">模型持有 Transformers cache</text><text x="606" y="478" font-size="11" fill="#6b7280">逐请求状态 / 工作副本 / graph 常驻</text>
<rect x="870" y="429" width="208" height="73" rx="6" fill="#eeeeee" stroke="#b9b9b9"/><text x="886" y="454" font-size="14" font-weight="700" fill="#111827">申报 → 加载后报告</text><text x="886" y="478" font-size="11" fill="#6b7280">每行总字节 × row 数</text>
<path d="M820 465H870" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="590" y="538" font-size="11" fill="#6b7280">报告不分配、不自动再扣预算；动态增长仍需运行时留余量</text>
<rect x="20" y="590" width="1080" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9"/><text x="38" y="618" font-size="14" font-weight="700" fill="#111827">GPU 预算来自 profiling：请求预算减去已测权重、激活峰值与其他占用</text><text x="38" y="645" font-size="11" fill="#6b7280">已常驻的 graph 状态不能重复扣除；profiling 后才随请求增长的状态不能只靠启动预算保证。CPU 输出镜像另占主机内存。</text>
</g></svg>
