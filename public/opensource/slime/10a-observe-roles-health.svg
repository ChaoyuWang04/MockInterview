<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="ar10r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">三类角色各看什么:探活跟睡醒绑在一起</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 提交作业的进程;灰 = 生成管理器;黄 = 推理服务;绿 = 训练组;红 = 必须先暂停的健康检查</text>

  <rect x="200" y="78" width="720" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="560" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">提交作业的进程</text>
  <text x="560" y="128" font-size="11" fill="#6b7280" text-anchor="middle">看循环卡在生成、训练还是推权重 · 自己几乎不占 GPU</text>

  <rect x="30" y="178" width="500" height="400" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="50" y="206" font-size="13" fill="#6b7280">生成侧</text>

  <rect x="60" y="224" width="440" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="280" y="250" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成管理器</text>
  <text x="280" y="272" font-size="11" fill="#6b7280" text-anchor="middle">样本数、耗时、落盘路径 · 申请的是 CPU</text>

  <rect x="60" y="308" width="440" height="72" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
  <text x="280" y="336" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">健康监视器</text>
  <text x="280" y="358" font-size="11" fill="#6b7280" text-anchor="middle">生成 / 评测才恢复 · 让出显存前必须暂停</text>

  <rect x="60" y="400" width="200" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="160" y="426" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理服务</text>
  <text x="160" y="446" font-size="11" fill="#6b7280" text-anchor="middle">探活打这里</text>

  <rect x="300" y="400" width="200" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="400" y="426" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理服务</text>
  <text x="400" y="446" font-size="11" fill="#6b7280" text-anchor="middle">超时则整组杀掉</text>

  <rect x="60" y="484" width="440" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="280" y="510" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成落盘</text>
  <text x="280" y="532" font-size="11" fill="#6b7280" text-anchor="middle">带时间线的样本 · 回放时关掉推理服务</text>

  <rect x="590" y="178" width="500" height="400" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="610" y="206" font-size="13" fill="#6b7280">训练侧</text>

  <rect x="620" y="240" width="440" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="840" y="272" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练组</text>
  <text x="840" y="294" font-size="11" fill="#6b7280" text-anchor="middle">等待时长与训练本体拆开记</text>

  <rect x="620" y="348" width="440" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="840" y="380" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练落盘</text>
  <text x="840" y="402" font-size="11" fill="#6b7280" text-anchor="middle">按样本编号对上生成落盘</text>

  <rect x="620" y="456" width="440" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="840" y="488" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">看板只收按步聚合的字段</text>
  <text x="840" y="510" font-size="11" fill="#6b7280" text-anchor="middle">推理服务高频刮取不往这里倒</text>

  <line x1="560" y1="148" x2="280" y2="224" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <line x1="560" y1="148" x2="840" y2="240" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <line x1="280" y1="288" x2="280" y2="308" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ar10r)"/>
  <line x1="280" y1="380" x2="160" y2="400" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ar10r)"/>
  <line x1="280" y1="380" x2="400" y2="400" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ar10r)"/>
  <line x1="280" y1="464" x2="280" y2="484" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <text x="560" y="608" font-size="11" fill="#9ca3af" text-anchor="middle">紫进程发调用;红线只在引擎醒着时探活;让出显存前红线必须先停</text>
</svg>
