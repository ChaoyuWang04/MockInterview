<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar09" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">同一段文字:生成侧出概率并记下专家,训练侧重算或按记录重放</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">黄 = 生成侧;绿 = 训练侧;紫 = 样本上带着的专家选择;红 = 推完后的核对;箭头是控制流断言</text>

  <rect x="40" y="80" width="500" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="60" y="108" font-size="13" fill="#6b7280">生成侧</text>

  <rect x="70" y="128" width="440" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="290" y="154" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理服务前向</text>
  <text x="290" y="176" font-size="11" fill="#6b7280" text-anchor="middle">写出 token,顺带一份 logprob</text>

  <rect x="70" y="214" width="200" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="170" y="240" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">默认不带专家</text>
  <text x="170" y="262" font-size="11" fill="#6b7280" text-anchor="middle">稠密或未打开回放</text>

  <rect x="310" y="214" width="200" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="410" y="240" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">记下专家选择</text>
  <text x="410" y="262" font-size="11" fill="#6b7280" text-anchor="middle">行 × 层 × 每层几个</text>

  <rect x="70" y="300" width="440" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="290" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">样本交给训练侧</text>
  <text x="290" y="344" font-size="11" fill="#6b7280" text-anchor="middle">可选落盘,中止样本路由不进将删的目录</text>

  <rect x="580" y="80" width="500" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="600" y="108" font-size="13" fill="#6b7280">训练侧</text>

  <rect x="610" y="128" width="440" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="830" y="154" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">默认:自己再前向一次</text>
  <text x="830" y="176" font-size="11" fill="#6b7280" text-anchor="middle">旧策略概率在这里重算,不吃生成侧那份</text>

  <rect x="610" y="214" width="200" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="710" y="240" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练侧自录自放</text>
  <text x="710" y="262" font-size="11" fill="#6b7280" text-anchor="middle">正向录,反向按列取分</text>

  <rect x="850" y="214" width="200" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="950" y="240" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">按带来的列重放</text>
  <text x="950" y="262" font-size="11" fill="#6b7280" text-anchor="middle">弹完必须刚好用光</text>

  <rect x="610" y="300" width="440" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="830" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">参考 / 教师前向穿过去</text>
  <text x="830" y="344" font-size="11" fill="#6b7280" text-anchor="middle">不消耗这份专家记录;价值网络组不开回放</text>

  <rect x="40" y="410" width="1040" height="170" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="60" y="438" font-size="13" fill="#6b7280">作业开头那一次核对,不是每步选路</text>

  <rect x="70" y="458" width="280" height="96" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="210" y="492" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">管理器刚起来</text>
  <text x="210" y="516" font-size="11" fill="#6b7280" text-anchor="middle">对每台引擎拍快照</text>
  <text x="210" y="534" font-size="11" fill="#6b7280" text-anchor="middle">再清空对照张量</text>

  <rect x="420" y="458" width="280" height="96" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="560" y="492" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">循环第一次推权重</text>
  <text x="560" y="516" font-size="11" fill="#6b7280" text-anchor="middle">训练切法变成生成切法</text>
  <text x="560" y="534" font-size="11" fill="#6b7280" text-anchor="middle">量化配置在这一趟生效</text>

  <rect x="770" y="458" width="280" height="96" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
  <text x="910" y="492" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">再比一次</text>
  <text x="910" y="516" font-size="11" fill="#6b7280" text-anchor="middle">问的是两边一不一样</text>
  <text x="910" y="534" font-size="11" fill="#6b7280" text-anchor="middle">不问走张量还是走盘</text>

  <line x1="290" y1="192" x2="170" y2="214" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="290" y1="192" x2="410" y2="214" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="170" y1="278" x2="200" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="410" y1="278" x2="380" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="510" y1="328" x2="610" y2="160" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="510" y1="328" x2="950" y2="214" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="830" y1="192" x2="710" y2="214" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="350" y1="554" x2="420" y2="506" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <line x1="700" y1="506" x2="770" y2="506" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar09)"/>
  <text x="560" y="604" font-size="11" fill="#9ca3af" text-anchor="middle">紫箭头把专家选择送进绿侧重放框;红框只接第一次推完,不从选路工厂长出来</text>
</svg>
