<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">训练步就是 Megatron actor:钩子挂在这一步上,不另起引擎</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">灰 = 切好的样本;黄 = 可选的参考 / 教师前向;绿 = Megatron 训练步本身;紫 = 挂在这一步上的钩子</text>

  <rect x="40" y="84" width="200" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="140" y="118" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">样本引用</text>
  <text x="140" y="142" font-size="11" fill="#6b7280" text-anchor="middle">按数据并行切好</text>
  <text x="140" y="158" font-size="11" fill="#6b7280" text-anchor="middle">训练卡各取一份</text>

  <rect x="300" y="84" width="500" height="88" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="320" y="108" font-size="13" fill="#6b7280">需要时才走</text>
  <rect x="330" y="120" width="200" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="430" y="145" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">参考模型前向</text>
  <rect x="560" y="120" width="210" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="665" y="145" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">教师权重前向</text>

  <rect x="860" y="84" width="220" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="970" y="118" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">切回 actor</text>
  <text x="970" y="142" font-size="11" fill="#6b7280" text-anchor="middle">始终用策略权重</text>
  <text x="970" y="158" font-size="11" fill="#6b7280" text-anchor="middle">做后面的更新</text>

  <rect x="40" y="220" width="1040" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="60" y="248" font-size="13" fill="#6b7280">Megatron actor 上的这一步</text>

  <rect x="70" y="268" width="230" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="185" y="296" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">优势估计</text>
  <text x="185" y="318" font-size="11" fill="#6b7280" text-anchor="middle">默认可替换 · 蒸馏叠在上面</text>

  <rect x="330" y="268" width="230" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="445" y="296" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">损失分发</text>
  <text x="445" y="318" font-size="11" fill="#6b7280" text-anchor="middle">策略 / 监督 / 自定义路径</text>

  <rect x="590" y="268" width="230" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="705" y="296" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">前向反向更新</text>
  <text x="705" y="318" font-size="11" fill="#6b7280" text-anchor="middle">Megatron 自己的训练循环</text>

  <rect x="850" y="268" width="200" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="950" y="296" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">价值网络步</text>
  <text x="950" y="318" font-size="11" fill="#6b7280" text-anchor="middle">先算价值,损失类型就地改</text>

  <rect x="70" y="372" width="490" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="315" y="400" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">在线蒸馏</text>
  <text x="315" y="422" font-size="11" fill="#6b7280" text-anchor="middle">教师 logprob 来自生成侧或这一步前向,惩罚加在优势上</text>

  <rect x="590" y="372" width="460" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="820" y="400" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">没有第二套训练后端</text>
  <text x="820" y="422" font-size="11" fill="#6b7280" text-anchor="middle">换框架等于重写这一步,不换 worker</text>

  <line x1="240" y1="128" x2="300" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="800" y1="128" x2="860" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="970" y1="172" x2="705" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="185" y1="340" x2="185" y2="372" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="445" y1="340" x2="705" y2="340" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar3)"/>

  <text x="560" y="502" font-size="11" fill="#9ca3af" text-anchor="middle">灰样本进黄可选前向,再进绿更新;紫钩子全部挂在绿框这一步,不画 Megatron 内部并行网</text>
</svg>
