  <text x="30" y="298" font-size="14" fill="#111827" font-weight="700">分卡 · 总卡数相加 · 生成从训练槽之后开始</text>
  <rect x="30" y="314" width="1060" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>

  <rect x="50" y="334" width="230" height="110" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="165" y="378" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练 · 卡 0</text>
