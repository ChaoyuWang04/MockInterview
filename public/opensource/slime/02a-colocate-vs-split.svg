  <rect x="312" y="164" width="206" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="415" y="185" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练</text>
  <rect x="312" y="200" width="206" height="32" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="415" y="221" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成</text>

  <rect x="550" y="132" width="230" height="110" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
