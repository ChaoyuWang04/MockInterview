<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar07" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="ar07r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">同步一步等最慢那条,完全异步靠后台工人跨步保温</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">黄 = 生成;绿 = 训练;红 = 中止回缓冲;灰 = 队列或缓冲;虚线框 = 同步一步 / 完全异步。不是第二套训练循环。</text>

  <rect x="24" y="78" width="526" height="442" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="44" y="104" font-size="13" fill="#6b7280">默认同步:这一步收口才开训</text>

  <rect x="48" y="122" width="478" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="287" y="144" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">短回答已经写完</text>
  <text x="287" y="164" font-size="11" fill="#6b7280" text-anchor="middle">多数组早早交差,卡上并行度开始塌</text>

  <rect x="48" y="196" width="478" height="72" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
  <text x="287" y="224" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">长尾还在写</text>
  <text x="287" y="246" font-size="11" fill="#6b7280" text-anchor="middle">整步墙钟由最慢那条说了算,训练侧干等</text>

  <rect x="48" y="292" width="478" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="287" y="314" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">够数之后才训练</text>
  <text x="287" y="334" font-size="11" fill="#6b7280" text-anchor="middle">循环仍是生成一批、再训练一批</text>

  <rect x="48" y="368" width="478" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="287" y="390" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">下一步从零再起一批</text>
  <text x="287" y="410" font-size="11" fill="#6b7280" text-anchor="middle">在飞轨迹不跨步,长尾每步付一次</text>

  <text x="287" y="492" font-size="11" fill="#9ca3af" text-anchor="middle">空转发生在红段:卡占着,产出却只剩尾巴</text>

  <rect x="570" y="78" width="526" height="442" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="590" y="104" font-size="13" fill="#6b7280">完全异步:工人跨步,循环只舀完成队列</text>

  <rect x="594" y="122" width="478" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="833" y="144" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">后台工人常驻</text>
  <text x="833" y="164" font-size="11" fill="#6b7280" text-anchor="middle">在飞组跨步保温,每组仍走默认生成再打分</text>

  <rect x="594" y="196" width="220" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="704" y="228" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">完成队列</text>
  <text x="704" y="250" font-size="11" fill="#6b7280" text-anchor="middle">热的,无界</text>
  <text x="704" y="268" font-size="11" fill="#6b7280" text-anchor="middle">池满先不取新题</text>

  <rect x="852" y="196" width="220" height="88" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
  <text x="962" y="228" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">中止组</text>
  <text x="962" y="250" font-size="11" fill="#6b7280" text-anchor="middle">退回数据缓冲</text>
  <text x="962" y="268" font-size="11" fill="#6b7280" text-anchor="middle">不进训练,当前重开</text>

  <rect x="594" y="308" width="478" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="833" y="330" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">循环舀够本步组数就训</text>
  <text x="833" y="350" font-size="11" fill="#6b7280" text-anchor="middle">多出来的留给下一步,不是随到随训</text>

  <rect x="594" y="388" width="478" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="833" y="410" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">数据缓冲</text>
  <text x="833" y="430" font-size="11" fill="#6b7280" text-anchor="middle">中止组和下一步新题从这里再进工人</text>

  <line x1="833" y1="178" x2="962" y2="196" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ar07r)"/>
  <line x1="833" y1="284" x2="833" y2="308" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar07)"/>
  <line x1="962" y1="284" x2="900" y2="388" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ar07r)"/>
  <text x="833" y="492" font-size="11" fill="#9ca3af" text-anchor="middle">红箭头只回缓冲;绿框仍等整批,循环没被换成另一套</text>
</svg>
