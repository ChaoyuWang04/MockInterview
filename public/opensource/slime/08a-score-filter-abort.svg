<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar08" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">生成之后、训练之前的闸门：打分、组过滤、过采样靠中止回收槽位</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">黄 = 生成；绿 = 打分；紫 = 组过滤通过、进训练；红 = 组内无信号丢掉；灰 = 多取出来的组被中止、槽位腾出来</text>

  <rect x="30" y="88" width="180" height="80" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="120" y="120" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成完一组</text>
  <text x="120" y="144" font-size="11" fill="#6b7280" text-anchor="middle">字已经写完</text>

  <rect x="260" y="88" width="180" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="350" y="120" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">打分</text>
  <text x="350" y="144" font-size="11" fill="#6b7280" text-anchor="middle">规则、远端或用户函数</text>

  <rect x="490" y="88" width="200" height="80" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="590" y="120" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">组过滤</text>
  <text x="590" y="144" font-size="11" fill="#6b7280" text-anchor="middle">组内分数有没有差别</text>

  <rect x="760" y="88" width="180" height="80" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="850" y="120" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">进训练</text>
  <text x="850" y="144" font-size="11" fill="#6b7280" text-anchor="middle">凑够这一步题数才交</text>

  <line x1="210" y1="128" x2="260" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>
  <line x1="440" y1="128" x2="490" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>
  <line x1="690" y1="128" x2="760" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>

  <rect x="490" y="220" width="200" height="80" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
  <text x="590" y="252" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">丢掉这一组</text>
  <text x="590" y="276" font-size="11" fill="#6b7280" text-anchor="middle">全对或全错，无训练信号</text>
  <line x1="590" y1="168" x2="590" y2="220" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>

  <rect x="30" y="340" width="1060" height="140" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="50" y="368" font-size="13" fill="#6b7280">过采样：一次多取几组，够数就停</text>

  <rect x="50" y="388" width="220" height="68" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="160" y="416" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">一次多取出若干组</text>
  <text x="160" y="438" font-size="11" fill="#6b7280" text-anchor="middle">粒度大于这一步要的题数</text>

  <rect x="340" y="388" width="280" height="68" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="480" y="416" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">还在飞的组被中止</text>
  <text x="480" y="438" font-size="11" fill="#6b7280" text-anchor="middle">槽位腾给下一步，不进训练</text>

  <rect x="690" y="388" width="360" height="68" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="870" y="416" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">半截可退回缓冲</text>
  <text x="870" y="438" font-size="11" fill="#6b7280" text-anchor="middle">要打开部分回收；否则只腾槽、不续写</text>

  <line x1="270" y1="422" x2="340" y2="422" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>
  <line x1="620" y1="422" x2="690" y2="422" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>
  <line x1="850" y1="168" x2="480" y2="388" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar08)"/>
  <text x="720" y="268" font-size="11" fill="#9ca3af">够数之后才中止还在飞的</text>
</svg>
