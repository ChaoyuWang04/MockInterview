<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">一步循环的时序:生成、训练、推权重串在一起</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">黄 = 生成侧在忙;绿 = 训练侧在忙;紫 = 提交作业的进程在等或在发调用;虚线框 = 按配置才出现的段</text>

  <rect x="30" y="88" width="200" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="130" y="122" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">1 生成</text>
  <text x="130" y="144" font-size="11" fill="#6b7280" text-anchor="middle">管理器调生成函数</text>
  <text x="130" y="162" font-size="11" fill="#6b7280" text-anchor="middle">切好引用再交出来</text>

  <rect x="250" y="88" width="200" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="350" y="122" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">2 生成侧让出</text>
  <text x="350" y="144" font-size="11" fill="#6b7280" text-anchor="middle">同卡时卸掉服务显存</text>
  <text x="350" y="162" font-size="11" fill="#6b7280" text-anchor="middle">分卡时可跳过</text>

  <rect x="470" y="88" width="200" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="570" y="122" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">3 训练</text>
  <text x="570" y="144" font-size="11" fill="#6b7280" text-anchor="middle">醒过来,取自己那份引用</text>
  <text x="570" y="162" font-size="11" fill="#6b7280" text-anchor="middle">训完睡下去</text>

  <rect x="690" y="88" width="200" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="790" y="122" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">4 推新权重</text>
  <text x="790" y="144" font-size="11" fill="#6b7280" text-anchor="middle">训练切法变成生成切法</text>
  <text x="790" y="162" font-size="11" fill="#6b7280" text-anchor="middle">下一步必须用新权重</text>

  <rect x="910" y="88" width="180" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="1000" y="122" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">5 拿回缓存</text>
  <text x="1000" y="144" font-size="11" fill="#6b7280" text-anchor="middle">生成侧重新加载</text>
  <text x="1000" y="162" font-size="11" fill="#6b7280" text-anchor="middle">才能接着生成</text>

  <text x="30" y="220" font-size="13" fill="#6b7280">按配置才插入的三段,不是每一步都有</text>

  <rect x="30" y="240" width="340" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="200" y="270" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">开训前 / 间隔评测</text>
  <text x="200" y="292" font-size="11" fill="#6b7280" text-anchor="middle">插在第 0 步之前或步末</text>

  <rect x="390" y="240" width="340" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="560" y="270" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">价值网络先训</text>
  <text x="560" y="292" font-size="11" fill="#6b7280" text-anchor="middle">需要时插在策略更新之前</text>

  <rect x="750" y="240" width="340" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="920" y="270" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">杀掉再拉起训练进程</text>
  <text x="920" y="292" font-size="11" fill="#6b7280" text-anchor="middle">推完权重之后、下一步生成之前</text>

  <text x="30" y="360" font-size="11" fill="#9ca3af">横轴只表示先后,不表示时长。2 和 5 在分卡、不让显存时可以是空步。</text>
  <text x="30" y="382" font-size="11" fill="#9ca3af">默认优势估计不会走到中间那一段虚线;杀掉训练进程要求权重走盘,也不能和价值网络一起开。</text>
</svg>
