<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">slime 的进程拓扑:循环在提交作业的进程里,生成和训练是两组远端角色</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 提交作业的进程;灰 = 不占 GPU 的生成管理器;黄 = 推理服务;绿 = 持有模型分片的训练进程;虚线框 = 生成侧 / 训练侧</text>

  <rect x="200" y="84" width="720" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="560" y="112" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">提交作业的进程</text>
  <text x="560" y="134" font-size="11" fill="#6b7280" text-anchor="middle">顺序写完一步循环 · 自己几乎不占 GPU</text>

  <rect x="40" y="190" width="500" height="330" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="60" y="218" font-size="13" fill="#6b7280">生成侧</text>

  <rect x="70" y="238" width="440" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="290" y="266" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成管理器</text>
  <text x="290" y="288" font-size="11" fill="#6b7280" text-anchor="middle">持有数据源和生成函数 · 申请的是 CPU</text>

  <rect x="70" y="336" width="130" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="135" y="362" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理服务</text>
  <text x="135" y="382" font-size="11" fill="#6b7280" text-anchor="middle">引擎 0</text>

  <rect x="225" y="336" width="130" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="290" y="362" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理服务</text>
  <text x="290" y="382" font-size="11" fill="#6b7280" text-anchor="middle">引擎 1</text>

  <rect x="380" y="336" width="130" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="445" y="362" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理服务</text>
  <text x="445" y="382" font-size="11" fill="#6b7280" text-anchor="middle">引擎 N</text>

  <rect x="70" y="428" width="440" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="290" y="456" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">对象存储里的引用</text>
  <text x="290" y="478" font-size="11" fill="#6b7280" text-anchor="middle">按数据并行切好,每张训练卡一份</text>

  <rect x="580" y="190" width="500" height="330" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="600" y="218" font-size="13" fill="#6b7280">训练侧</text>

  <rect x="620" y="250" width="180" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="710" y="280" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练进程</text>
  <text x="710" y="302" font-size="11" fill="#6b7280" text-anchor="middle">rank 0 · 一份分片</text>

  <rect x="860" y="250" width="180" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="950" y="280" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练进程</text>
  <text x="950" y="302" font-size="11" fill="#6b7280" text-anchor="middle">rank N · 一份分片</text>

  <rect x="620" y="380" width="420" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="830" y="412" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">需要时才有的价值网络组</text>
  <text x="830" y="436" font-size="11" fill="#6b7280" text-anchor="middle">默认优势估计不会起这一组</text>

  <line x1="560" y1="154" x2="290" y2="238" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="560" y1="154" x2="830" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="290" y1="310" x2="290" y2="336" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="510" y1="460" x2="620" y2="420" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="560" y="548" font-size="11" fill="#9ca3af" text-anchor="middle">紫进程发调用;黄服务出样本;绿进程更新;引用从左下送到右</text>
</svg>
