<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar06" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">可插拔生成:循环只调函数,默认管并发,每一条是用户代码</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 循环只调生成函数;灰 = 默认函数的并发与回收;黄 = 每一条上的用户函数;绿 = agent 适配器便利层</text>

  <rect x="80" y="84" width="960" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="560" y="110" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">提交作业的循环</text>
  <text x="560" y="132" font-size="11" fill="#6b7280" text-anchor="middle">每步只调生成函数 · 不为任务再开一套入口</text>

  <rect x="80" y="184" width="960" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="560" y="218" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">默认生成函数</text>
  <text x="560" y="242" font-size="11" fill="#6b7280" text-anchor="middle">从数据源取组 · 信号量卡住在飞条数 · 凑够就中止 · 半截可送回缓冲</text>

  <rect x="80" y="318" width="280" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="220" y="352" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">用户函数 · 单轮</text>
  <text x="220" y="376" font-size="11" fill="#6b7280" text-anchor="middle">发一次请求,接上 token</text>

  <rect x="420" y="318" width="280" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="560" y="352" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">用户函数 · 多轮 / 工具</text>
  <text x="560" y="376" font-size="11" fill="#6b7280" text-anchor="middle">循环写在你这份代码里</text>

  <rect x="760" y="318" width="280" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="900" y="352" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">用户函数 · 沙箱 harness</text>
  <text x="900" y="376" font-size="11" fill="#6b7280" text-anchor="middle">外面的 agent 原样跑</text>

  <rect x="420" y="448" width="280" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="560" y="476" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">agent 适配器</text>
  <text x="560" y="498" font-size="11" fill="#6b7280" text-anchor="middle">便利层 · 不是独立框架</text>

  <line x1="560" y1="148" x2="560" y2="184" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar06)"/>
  <line x1="220" y1="272" x2="220" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar06)"/>
  <line x1="560" y1="272" x2="560" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar06)"/>
  <line x1="900" y1="272" x2="900" y2="318" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar06)"/>
  <line x1="560" y1="448" x2="560" y2="406" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar06)"/>
  <text x="560" y="548" font-size="11" fill="#9ca3af" text-anchor="middle">紫只调灰;灰对每条调黄;绿向上并进黄,不另开循环</text>
</svg>
