<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="840" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">自回归段的Scheduler:入口出口自己写,中间那条方法链是借的</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">绿 = 本地入口与适配;紫 = 委托给上游的核心逻辑,可由本地包装显式调用,也可动态绑定</text>
  <text x="24" y="72" font-size="13" fill="#6b7280">黄 = 为了让紫色那些方法跑得起来、本实例必须先摆好的那一片字段;红 = 这种借法自带的风险</text>

  <rect x="470" y="96" width="180" height="32" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="560" y="117" font-size="11" fill="#6b7280" text-anchor="middle">调用与委托</text>

  <rect x="360" y="144" width="400" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="376" y="166" font-size="11" fill="#9ca3af">本地适配与上游逻辑共同完成一次调用</text>
  <text x="376" y="184" font-size="11" fill="#9ca3af">有本地方法先走本地;包装可显式调用上游,未定义的方法由 __getattr__ 绑定</text>

  <path d="M450 206 L262 234" stroke="#9ca3af" stroke-width="1.4" fill="none"/>
  <polygon points="262,234 274,226 272,238" fill="#9ca3af"/>
  <path d="M670 206 L858 234" stroke="#9ca3af" stroke-width="1.4" fill="none"/>
  <polygon points="858,234 846,226 848,238" fill="#9ca3af"/>

  <text x="24" y="232" font-size="14" font-weight="700" fill="#111827">本地:入口、出口与状态适配</text>
  <text x="636" y="232" font-size="14" font-weight="700" fill="#111827">上游:核心选择、分配与结果逻辑</text>

  <rect x="24" y="244" width="460" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="24" y="314" width="460" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="24" y="384" width="460" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="24" y="454" width="460" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="24" y="524" width="460" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="636" y="244" width="460" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="636" y="314" width="460" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="636" y="384" width="460" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="636" y="454" width="460" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="636" y="524" width="460" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>

  <text x="38" y="268" font-size="14" font-weight="700" fill="#111827">从Mailbox收请求</text>
  <text x="38" y="290" font-size="11" fill="#6b7280">不是从进程间通道收;张量并行时 0 号 rank 收了再广播给同伴</text>
  <text x="38" y="338" font-size="14" font-weight="700" fill="#111827">把阶段载荷变成一条上游请求</text>
  <text x="38" y="360" font-size="11" fill="#6b7280">用模型给的构造函数;并发高时可以丢进一个线程池</text>
  <text x="38" y="408" font-size="14" font-weight="700" fill="#111827">攒批放行的那道闸</text>
  <text x="38" y="430" font-size="11" fill="#6b7280">攒够条数、最老那条等够了、或解码空闲,才放这一批 prefill</text>
  <text x="38" y="478" font-size="14" font-weight="700" fill="#111827">跑一批</text>
  <text x="38" y="500" font-size="11" fill="#6b7280">把批交给本段的ModelRunner,再把结果翻回上游要的形状</text>
  <text x="38" y="548" font-size="14" font-weight="700" fill="#111827">结果进发件箱,批状态由自己的循环攥着</text>
  <text x="38" y="570" font-size="11" fill="#6b7280">两条事件循环能跑,第三条(重叠)直接拒绝运行</text>

  <text x="650" y="268" font-size="14" font-weight="700" fill="#111827">选下一批:本地包装 → 上游</text>
  <text x="650" y="290" font-size="11" fill="#6b7280">运行中的批与等待队列一起看</text>
  <text x="650" y="338" font-size="14" font-weight="700" fill="#111827">prefill 建批:本地包装 → 上游</text>
  <text x="650" y="360" font-size="11" fill="#6b7280">按 token 预算与 KV 余量收人</text>
  <text x="650" y="408" font-size="14" font-weight="700" fill="#111827">前缀匹配与 KV 分配</text>
  <text x="650" y="430" font-size="11" fill="#6b7280">前缀树、token 池、请求槽</text>
  <text x="650" y="478" font-size="14" font-weight="700" fill="#111827">结果处理:本地包装 → 上游</text>
  <text x="650" y="500" font-size="11" fill="#6b7280">采样结果落到每条请求上,结束了就放 KV</text>
  <text x="650" y="548" font-size="14" font-weight="700" fill="#111827">空闲判定、清缓存、负载与内存统计</text>
  <text x="650" y="570" font-size="11" fill="#6b7280">上游那套观测与自检原样可用</text>

  <rect x="24" y="604" width="1072" height="74" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="38" y="628" font-size="14" font-weight="700" fill="#111827">代价:紫色那些方法读的是本实例上的字段,所以上游构造函数会设的那一片,这边必须自己先摆一遍</text>
  <text x="38" y="650" font-size="11" fill="#6b7280">并行度与 rank、token 与显存上限、调度策略与等待队列、批状态、一长串特性开关——借来的方法要读什么,这边就得先有什么</text>
  <text x="38" y="668" font-size="11" fill="#6b7280">上游加一个字段,这边就可能在某条冷路径上抛属性错;源码注释把这条写成了纪律</text>

  <rect x="24" y="692" width="1072" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="38" y="717" font-size="11" fill="#6b7280">其中几个纯粹是桩:会话控制器、n-gram 嵌入表、KV 事件发布器。这套运行时里根本没有这些东西,但上游的热路径会去读它们,少一个就直接崩在热路径上</text>

  <text x="24" y="764" font-size="14" font-weight="700" fill="#111827">怎么读这张图</text>
  <text x="24" y="788" font-size="11" fill="#6b7280">两列按职责划分。本地既有入口与出口,也有批状态适配;选批、prefill 建批和结果处理均有本地包装,再调用上游核心逻辑。</text>
  <text x="24" y="805" font-size="11" fill="#6b7280">不能把紫色列理解为“本地完全没写”。只有本地未定义的方法才通过 __getattr__ 动态绑定;两种委托都读取本实例的状态。</text>
  <text x="24" y="822" font-size="11" fill="#6b7280">不继承就没有人替你初始化,上游构造函数设过的字段得在这边补齐,连那几个这里根本不存在的组件也得摆个空壳上去。</text>
</svg>
