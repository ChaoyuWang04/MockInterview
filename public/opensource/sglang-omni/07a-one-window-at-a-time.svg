  <text x="24" y="34" font-size="19" font-weight="700" fill="#111827">Vocoder这一端:攒多少解一次、回看多少、尾巴怎么收</text>
  <text x="24" y="60" font-size="13" fill="#6b7280">同一条码帧轴上的五次解码。绿 = 这一次新出声的帧,灰 = 重新喂一遍的上文,紫 = 真正发出去的那一块波形,黄 = 结束标记和它触发的最后一次</text>
  <text x="24" y="80" font-size="13" fill="#6b7280">Qwen3-Omni 默认步长 10、回看 25;假设每次累积 10 帧,最后余 5 帧。按帧数等比,不是时间轴</text>
  <text x="24" y="119" font-size="11" fill="#6b7280">码帧到手</text>
  <text x="884" y="119" font-size="11" fill="#9ca3af">结束标记</text>
  <text x="24" y="166" font-size="11" fill="#6b7280">第 1 次</text>
  <text x="24" y="183" font-size="11" fill="#9ca3af">攒够 10 帧</text>
  <text x="952" y="166" font-size="11" fill="#111827">窗口 10 帧</text>
  <text x="952" y="183" font-size="11" fill="#6b7280">出声 10 帧</text>
  <text x="24" y="228" font-size="11" fill="#6b7280">第 2 次</text>
  <text x="24" y="245" font-size="11" fill="#9ca3af">又攒够 10 帧</text>
  <text x="952" y="228" font-size="11" fill="#111827">窗口 20 帧</text>
  <text x="952" y="245" font-size="11" fill="#6b7280">出声 10 帧</text>
  <text x="24" y="290" font-size="11" fill="#6b7280">第 3 次</text>
  <text x="24" y="307" font-size="11" fill="#9ca3af">又攒够 10 帧</text>
  <text x="952" y="290" font-size="11" fill="#111827">窗口 30 帧</text>
  <text x="952" y="307" font-size="11" fill="#6b7280">出声 10 帧</text>
  <text x="24" y="352" font-size="11" fill="#6b7280">第 4 次起</text>
  <text x="24" y="369" font-size="11" fill="#9ca3af">上文封顶 25 帧</text>
  <text x="952" y="352" font-size="11" fill="#111827">窗口 35 帧,稳态</text>
  <text x="952" y="369" font-size="11" fill="#6b7280">出声 10 帧</text>
  <text x="24" y="414" font-size="11" fill="#6b7280">冲刷</text>
  <text x="24" y="431" font-size="11" fill="#9ca3af">结束标记触发</text>
  <text x="952" y="414" font-size="11" fill="#111827">窗口 30 帧</text>
  <text x="952" y="431" font-size="11" fill="#6b7280">出声 5 帧</text>
  <text x="140" y="472" font-size="11" fill="#9ca3af">每一次只把新帧那一段波形发出去;重喂的上文算完就丢,不会在音频里出现第二遍</text>
  <text x="140" y="490" font-size="11" fill="#9ca3af">冲刷之后还有一条终端结果消息:流式请求里它只带采样率这类元数据,非流式请求里才装整段波形</text>
</svg>
