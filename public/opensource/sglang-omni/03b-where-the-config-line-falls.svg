<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">同样冻结拓扑,分界线画在不同的地方</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">行 = 两边都必须做的 5 件事;方框 = 一份配置或一套规则,高度 = 盖住几行;颜色:绿 = 模型,紫 = 用户可写,黄与灰 = 那道界。两边的参数名都在第五节</text>

  <text x="480" y="90" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">SGLang-Omni</text>
  <text x="900" y="90" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">vLLM-Omni</text>
  <text x="383" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">模型拥有</text>
  <text x="577" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">用户可写</text>
  <text x="803" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">模型拥有</text>
  <text x="997" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">用户可写</text>

  <line x1="24" y1="136" x2="1096" y2="136" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="210" x2="1096" y2="210" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="284" x2="1096" y2="284" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="358" x2="1096" y2="358" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="432" x2="1096" y2="432" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="498" x2="1096" y2="498" stroke="#e5e7eb" stroke-width="1"/>

  <rect x="290" y="140" width="186" height="288" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="306" y="164" font-size="14" font-weight="700" fill="#111827">模型的管线配置类</text>
  <text x="306" y="184" font-size="11" fill="#6b7280">一份 Python,不是数据</text>
  <text x="306" y="208" font-size="11" fill="#6b7280">同一张阶段表:</text>
  <text x="306" y="225" font-size="11" fill="#6b7280">身份、路由、扇入、</text>
  <text x="306" y="242" font-size="11" fill="#6b7280">流边、落哪张卡、</text>
  <text x="306" y="259" font-size="11" fill="#6b7280">进程归属、显存配额、</text>
  <text x="306" y="276" font-size="11" fill="#6b7280">构造与引擎参数,</text>
  <text x="306" y="293" font-size="11" fill="#6b7280">全在同一行上</text>
  <text x="306" y="317" font-size="11" fill="#6b7280">平台差异是表里的</text>
  <text x="306" y="334" font-size="11" fill="#6b7280">一个条件分支</text>
  <text x="306" y="358" font-size="11" fill="#6b7280">想换拓扑就换一个</text>
  <text x="306" y="375" font-size="11" fill="#6b7280">配置类,Qwen 自带</text>
  <text x="306" y="392" font-size="11" fill="#6b7280">纯文本、语音、单卡</text>
  <text x="306" y="409" font-size="11" fill="#6b7280">共置三个</text>

  <rect x="484" y="140" width="186" height="66" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="500" y="166" font-size="14" font-weight="700" fill="#9ca3af">写不了</text>
  <text x="500" y="186" font-size="11" fill="#9ca3af">路由与扇入是内部路径</text>

  <rect x="484" y="214" width="186" height="140" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="500" y="238" font-size="14" font-weight="700" fill="#111827">用户的两个入口</text>
  <text x="500" y="258" font-size="11" fill="#6b7280">配置文件与命令行</text>
  <text x="500" y="275" font-size="11" fill="#6b7280">点号覆写,同一条</text>
  <text x="500" y="292" font-size="11" fill="#6b7280">路径语言的两种拼写</text>
  <text x="500" y="316" font-size="11" fill="#6b7280">只能覆写已有的格子</text>
  <text x="500" y="333" font-size="11" fill="#6b7280">不能增删</text>

  <rect x="484" y="362" width="186" height="66" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="500" y="390" font-size="14" font-weight="700" fill="#9ca3af">没有这一维</text>
  <text x="500" y="410" font-size="11" fill="#9ca3af">配置文件不分平台</text>

  <rect x="290" y="436" width="380" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="306" y="460" font-size="14" font-weight="700" fill="#111827">逐字段的可见性规则</text>
  <text x="306" y="480" font-size="11" fill="#6b7280">14 条,同一行上:发给谁归模型,落哪张卡归用户</text>

  <rect x="710" y="140" width="186" height="66" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="726" y="164" font-size="14" font-weight="700" fill="#111827">模型的拓扑文件</text>
  <text x="726" y="184" font-size="11" fill="#6b7280">冻结的阶段元组</text>

  <rect x="710" y="214" width="186" height="214" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="726" y="242" font-size="14" font-weight="700" fill="#9ca3af">不在这里</text>
  <text x="726" y="262" font-size="11" fill="#9ca3af">放置、资源、平台</text>
  <text x="726" y="279" font-size="11" fill="#9ca3af">三行都在另一份</text>
  <text x="726" y="296" font-size="11" fill="#9ca3af">文件里</text>

  <rect x="904" y="214" width="186" height="214" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="920" y="238" font-size="14" font-weight="700" fill="#111827">部署文件</text>
  <text x="920" y="258" font-size="11" fill="#6b7280">每个模型一份,仓库</text>
  <text x="920" y="275" font-size="11" fill="#6b7280">里带着 96 份</text>
  <text x="920" y="299" font-size="11" fill="#6b7280">落哪张卡、几个副本、</text>
  <text x="920" y="316" font-size="11" fill="#6b7280">显存比例、引擎参数</text>
  <text x="920" y="340" font-size="11" fill="#6b7280">另有一个平台段,按</text>
  <text x="920" y="357" font-size="11" fill="#6b7280">平台名再盖一层</text>

  <rect x="710" y="436" width="380" height="58" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="726" y="460" font-size="14" font-weight="700" fill="#111827">分界线在文件之间</text>
  <text x="726" y="480" font-size="11" fill="#6b7280">拓扑那一份是冻结数据类,部署那一份没有路由字段</text>

  <text x="24" y="177" font-size="11" fill="#6b7280">说清这条管线有哪些段、谁连谁</text>
  <text x="24" y="241" font-size="11" fill="#6b7280">说清每段落在哪张卡、几个副本、</text>
  <text x="24" y="258" font-size="11" fill="#6b7280">占多少显存</text>
  <text x="24" y="325" font-size="11" fill="#6b7280">说清每段的引擎参数与批参数</text>
  <text x="24" y="399" font-size="11" fill="#6b7280">安顿平台之间的差异</text>
  <text x="24" y="469" font-size="11" fill="#6b7280">挡住用户去改拓扑</text>

  <text x="24" y="534" font-size="14" font-weight="700" fill="#111827">怎么读这张图</text>
  <text x="24" y="558" font-size="11" fill="#6b7280">两边都做同样的 5 件事,也都不让用户碰拓扑。差别在方框怎么摆:左边模型那一列是一个从上盖到下的高盒子,它同时拥有拓扑和全部默认值,</text>
  <text x="24" y="575" font-size="11" fill="#6b7280">用户那一列只在中间两行有东西——同一份表、甚至同一行上,有的格子归模型、有的格子归用户,界是逐字段划的。</text>
  <text x="24" y="598" font-size="11" fill="#6b7280">右边模型那一列只盖住最上面一行,中间三行整个空着;用户那一列盖住下面三行。界是按文件划的:拓扑一份,部署一份,平台差异跟着部署那一份走。</text>
  <text x="24" y="615" font-size="11" fill="#6b7280">两种画法都做到了「只能覆写不能增删」,代价不同:按文件划,一眼就知道哪份能改;按字段划,少一份要维护的文件,但得有一套规则把线画在表上。</text>
</svg>
