<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d4a24c"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8f8bd8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>

  <rect x="190" y="104" width="906" height="262" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

  <rect x="24" y="140" width="140" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="200" y="140" width="872" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="200" y="270" width="300" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="720" y="270" width="300" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="560" y="278" width="120" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <rect x="380" y="424" width="640" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>

  <line x1="300" y1="270" x2="300" y2="330" stroke="#5fa886" stroke-width="1"/>
  <line x1="400" y1="270" x2="400" y2="330" stroke="#5fa886" stroke-width="1"/>
  <line x1="820" y1="270" x2="820" y2="330" stroke="#5fa886" stroke-width="1"/>
  <line x1="920" y1="270" x2="920" y2="330" stroke="#5fa886" stroke-width="1"/>

  <path d="M 200 86 L 1052 86" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M 164 166 L 194 166" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M 270 196 L 270 264" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M 790 196 L 790 264" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M 504 300 L 554 300" fill="none" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ay)"/>
  <path d="M 684 300 L 714 300" fill="none" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ay)"/>
  <path d="M 450 334 L 450 418" fill="none" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
  <path d="M 970 334 L 970 418" fill="none" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">Qwen Talker:上一步的产物怎样反馈到下一步</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">一步解码分三格,从左到右就是时间。颜色 = 这条线上流的是什么:灰 = 上游来的文本嵌入,黄 = 自己上一步产的反馈嵌入,紫 = 这一帧的码本;绿 = 这一步自己的计算</text>

  <text x="964" y="78" font-size="11" fill="#9ca3af">时间(无刻度)</text>
  <text x="206" y="124" font-size="11" fill="#9ca3af">这一段自己的进程</text>

  <text x="36" y="164" font-size="14" font-weight="700" fill="#111827">上游Thinker</text>
  <text x="36" y="182" font-size="11" fill="#6b7280">另一个进程</text>

  <text x="216" y="163" font-size="14" font-weight="700" fill="#111827">text queue</text>
  <text x="216" y="182" font-size="11" fill="#6b7280">上游的隐藏态沿流边一块一块过来,Scheduler按到达顺序排进这条请求的队列</text>

  <text x="200" y="262" font-size="11" fill="#9ca3af">第 N-1 步</text>
  <text x="250" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">写缓冲</text>
  <text x="350" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">跑前向</text>
  <text x="450" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">取产物</text>

  <text x="720" y="262" font-size="11" fill="#9ca3af">第 N 步</text>
  <text x="770" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">写缓冲</text>
  <text x="870" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">跑前向</text>
  <text x="970" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">取产物</text>

  <text x="576" y="299" font-size="13" font-weight="700" fill="#111827">feedback queue</text>
  <text x="576" y="315" font-size="11" fill="#6b7280">不出这个进程</text>

  <text x="396" y="449" font-size="14" font-weight="700" fill="#111827">Vocoder段</text>
  <text x="396" y="468" font-size="11" fill="#6b7280">另一个进程;这条边按位置关系怎么搬见 04 章</text>

  <text x="458" y="392" font-size="11" fill="#8f8bd8">这一帧的码本</text>
  <text x="978" y="392" font-size="11" fill="#8f8bd8">按直发或攒帧策略发出</text>

  <text x="24" y="512" font-size="11" fill="#9ca3af">写缓冲 = 队首反馈嵌入 + 队首文本嵌入,写进模型上一块按行号索引的固定缓冲区,并置上这一行的标记位;跑前向读一次就把标记位清掉;取产物 = 从两块固定缓冲区各整批克隆一份。</text>
  <text x="24" y="530" font-size="11" fill="#9ca3af">两条队列任一个队首是空的,这一步就不开跑,整批一起往后推——空转是这类段的常态。ModelRunner手里的请求顺序必须和前向批的行顺序对齐,没有东西替你检查。</text>
</svg>
