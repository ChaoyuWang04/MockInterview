<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="740" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">一个阶段里,哪些是框架的,哪些是模型插进来的</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">绿 = 框架自己做的事,每个阶段都一样;紫 = 模型用点号路径插进来的钩子;灰 = Coordinator。虚线框 = 一个阶段</text>

  <rect x="24" y="80" width="640" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="40" y="106" font-size="14" font-weight="700" fill="#111827">Coordinator · 主进程</text>
  <text x="40" y="126" font-size="11" fill="#6b7280">只存入口段名、终端段集合、各段端点;中间每一跳都不经过它</text>

  <rect x="688" y="80" width="408" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="704" y="106" font-size="14" font-weight="700" fill="#111827">终端解析函数 · 管线级</text>
  <text x="704" y="126" font-size="11" fill="#6b7280">这条请求的终端段是哪几个;返回值必须是静态终端集合的子集</text>

  <line x1="664" y1="111" x2="688" y2="111" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>

  <rect x="230" y="210" width="680" height="480" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="250" y="234" font-size="14" font-weight="700" fill="#111827">一个阶段 = 一层 IO 壳</text>
  <text x="250" y="252" font-size="11" fill="#6b7280">23 个家族、从 1 段到 7 段的管线,用的都是这一层,壳里没有一处按模型分岔</text>

  <text x="250" y="278" font-size="11" fill="#9ca3af">框架做的</text>
  <text x="550" y="278" font-size="11" fill="#9ca3af">模型插进来的,全是点号路径</text>

  <rect x="250" y="288" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="288" width="340" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <line x1="530" y1="310" x2="550" y2="310" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="266" y="309" font-size="14" font-weight="700" fill="#111827">造这一段的执行体</text>
  <text x="266" y="326" font-size="11" fill="#6b7280">壳不知道造出来的是哪种Scheduler</text>
  <text x="566" y="309" font-size="14" font-weight="700" fill="#111827">工厂路径</text>
  <text x="566" y="326" font-size="11" fill="#6b7280">阶段自己起进程时才导进来</text>

  <rect x="250" y="344" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="344" width="340" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <line x1="530" y1="366" x2="550" y2="366" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="266" y="365" font-size="14" font-weight="700" fill="#111827">等齐该等的上游</text>
  <text x="266" y="382" font-size="11" fill="#6b7280">没齐就先攒着,不叫执行体</text>
  <text x="566" y="365" font-size="14" font-weight="700" fill="#111827">等待解析函数</text>
  <text x="566" y="382" font-size="11" fill="#6b7280">这次等谁;返回值是声明的等待清单的子集</text>

  <rect x="250" y="400" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="400" width="340" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <line x1="530" y1="422" x2="550" y2="422" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="266" y="421" font-size="14" font-weight="700" fill="#111827">把等齐的几份并成一份</text>
  <text x="266" y="438" font-size="11" fill="#6b7280">并完才派发下去</text>
  <text x="566" y="421" font-size="14" font-weight="700" fill="#111827">合并函数</text>
  <text x="566" y="438" font-size="11" fill="#6b7280">怎么并是模型的事,框架不看里面是什么</text>

  <rect x="250" y="456" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="456" width="340" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <line x1="530" y1="478" x2="550" y2="478" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="266" y="477" font-size="14" font-weight="700" fill="#111827">算下一跳是谁</text>
  <text x="266" y="494" font-size="11" fill="#6b7280">声明的 Terminal Stage 报给 Coordinator</text>
  <text x="566" y="477" font-size="14" font-weight="700" fill="#111827">路由函数</text>
  <text x="566" y="494" font-size="11" fill="#6b7280">按请求挑选;动态结果非空且不越出声明集合</text>

  <rect x="250" y="512" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="512" width="340" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <line x1="530" y1="534" x2="550" y2="534" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="266" y="533" font-size="14" font-weight="700" fill="#111827">按下游改写载荷</text>
  <text x="266" y="550" font-size="11" fill="#6b7280">按下游投影;仍需遵守共享对象只读约定</text>
  <text x="566" y="533" font-size="14" font-weight="700" fill="#111827">投影函数</text>
  <text x="566" y="550" font-size="11" fill="#6b7280">按目标段登记,一个下游一个</text>

  <rect x="250" y="568" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="568" width="340" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <line x1="530" y1="590" x2="550" y2="590" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="266" y="589" font-size="14" font-weight="700" fill="#111827">流式块按边转出去</text>
  <text x="266" y="606" font-size="11" fill="#6b7280">顺带告诉下游这条流结束了</text>
  <text x="566" y="589" font-size="14" font-weight="700" fill="#111827">流结束目标函数</text>
  <text x="566" y="606" font-size="11" fill="#6b7280">通知谁;返回值是声明的流边的子集</text>

  <rect x="250" y="624" width="280" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="550" y="624" width="340" height="44" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="266" y="645" font-size="14" font-weight="700" fill="#111827">Mailbox:3 种进,5 种出</text>
  <text x="266" y="662" font-size="11" fill="#6b7280">按消息种类做事,不问对面是谁</text>
  <text x="566" y="645" font-size="11" fill="#9ca3af">这一行没有钩子</text>
  <text x="566" y="662" font-size="11" fill="#9ca3af">模型改不了它,也不需要改</text>

  <polyline points="150,420 222,420" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M222,420 L214,416 L214,424 Z" fill="#9ca3af"/>
  <text x="24" y="444" font-size="11" fill="#6b7280">Coordinator投给入口段的新请求</text>
  <text x="24" y="461" font-size="11" fill="#6b7280">或上游 Stage发来的载荷与流式块</text>

  <polyline points="918,420 990,420" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M990,420 L982,416 L982,424 Z" fill="#9ca3af"/>
  <text x="918" y="444" font-size="11" fill="#6b7280">发给下一跳的阶段</text>
  <text x="918" y="461" font-size="11" fill="#6b7280">终端段则报给Coordinator</text>

  <text x="24" y="714" font-size="11" fill="#9ca3af">紫色的 7 处就是模型能塞进框架的全部。其中 4 处返回段名,返回值必须落在阶段表已经声明的集合里;另外 3 处在算数据,框架不看里面是什么</text>
</svg>
