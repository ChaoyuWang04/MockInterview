<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530">
<rect width="1120" height="530" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="30" y="32" font-size="19" font-weight="700" fill="#111827">同卡不合并进程,共享权重不合并状态</text>
<text x="30" y="56" font-size="13" fill="#6b7280">绿色:组内 Stage · 紫色:各副本私有资源 · 黄色:同一份引擎权重 · 灰色:MPS · 布局示意,面积不表示显存</text>
<rect x="30" y="80" width="1060" height="410" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="105" font-size="14" font-weight="700" fill="#111827">同一物理 GPU 上的资源与使用它的进程</text>
<rect x="52" y="125" width="466" height="265" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="602" y="125" width="466" height="265" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="70" y="151" font-size="14" font-weight="700" fill="#111827">进程 Replica 0 · 主副本</text>
<text x="620" y="151" font-size="14" font-weight="700" fill="#111827">进程 Replica 1 · 从副本</text>
<rect x="70" y="170" width="180" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="270" y="170" width="230" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="620" y="170" width="180" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="820" y="170" width="230" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<g font-size="14" font-weight="700" fill="#111827"><text x="88" y="199">预处理 Stage</text><text x="288" y="199">引擎 Stage</text><text x="638" y="199">预处理 Stage</text><text x="838" y="199">引擎 Stage</text></g>
<rect x="70" y="235" width="430" height="53" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="620" y="235" width="430" height="53" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<g font-size="14" font-weight="700" fill="#111827"><text x="88" y="257">私有 KV / CUDA graph / 请求状态</text><text x="638" y="257">私有 KV / CUDA graph / 请求状态</text></g>
<g font-size="11" fill="#6b7280"><text x="88" y="276">模型策略指定的私有张量也各留一份</text><text x="638" y="276">这些资源不会因为挂接权重而合并</text></g>
<rect x="70" y="311" width="430" height="57" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="88" y="334" font-size="14" font-weight="700" fill="#111827">主副本持有的引擎可共享权重</text>
<text x="88" y="354" font-size="11" fill="#6b7280">先加载并发布 CUDA IPC 句柄</text>
<path d="M 830 333 H 513" stroke="#9ca3af" stroke-width="1.4" fill="none"/>
<path d="M 513 333 l 9 -5 v 10 z" fill="#9ca3af"/>
<text x="650" y="322" font-size="11" fill="#6b7280">从副本引用同一存储</text>
<text x="638" y="359" font-size="11" fill="#6b7280">先等主副本就绪;退出时从副本先走</text>
<rect x="70" y="418" width="980" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="88" y="439" font-size="14" font-weight="700" fill="#111827">CUDA MPS:协调两个进程的 GPU 执行机会</text>
<text x="88" y="458" font-size="11" fill="#6b7280">不决定 Stage 归组、Replica 数量或权重归属;可以与权重共享分别开关</text>
<path d="M 285 390 V 418 M 835 390 V 418" stroke="#9ca3af" stroke-width="1.4" fill="none"/>
<text x="30" y="514" font-size="11" fill="#9ca3af">只画一个含预处理与引擎的复制组;其他 Stage 省略。Replica 编号为示意,每组同卡编号最小者担任主副本。</text>
</g></svg>
