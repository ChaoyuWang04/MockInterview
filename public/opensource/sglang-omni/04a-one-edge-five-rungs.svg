<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">同一条边,按两端的位置关系挑一档走法</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">行 = 一种传输路径,不是成本测量。灰 = Stage;绿 = 显存,黄 = 主机内存,红 = 网络;虚线框 = 同进程</text>
  <text x="24" y="74" font-size="13" fill="#6b7280">这里画中间交接;入口、终端与小块内联可在控制消息中带内容。同进程直传不发控制消息</text>

  <text x="24" y="114" font-size="14" font-weight="700" fill="#111827">两端的位置关系</text>
  <text x="474" y="114" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">数据面:数据落在哪里</text>
  <text x="756" y="114" font-size="14" font-weight="700" fill="#111827">控制面上发生什么,代价是什么</text>

  <rect x="206" y="134" width="536" height="64" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="216" y="142" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="614" y="142" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <line x1="342" y1="166" x2="606" y2="166" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="24" y="164" font-size="11" fill="#6b7280">同一个进程里的两段</text>
  <text x="275" y="171" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上游 Stage</text>
  <text x="673" y="171" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">下游 Stage</text>
  <text x="474" y="212" font-size="11" fill="#9ca3af" text-anchor="middle">数据一次都没离开原地:递过去的是同一个 Python 对象的引用</text>
  <text x="756" y="160" font-size="11" fill="#6b7280">不发控制消息,直接调对面的接收函数</text>
  <text x="756" y="180" font-size="11" fill="#9ca3af">代价:接收端必须当只读用,改一下就踩到上游</text>

  <rect x="216" y="238" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="386" y="238" width="176" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="614" y="238" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <line x1="342" y1="262" x2="378" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="262" x2="606" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="24" y="260" font-size="11" fill="#6b7280">同一张卡,不同进程</text>
  <text x="275" y="267" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上游 Stage</text>
  <text x="673" y="267" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">下游 Stage</text>
  <text x="474" y="258" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">发送端原来那块显存</text>
  <text x="474" y="276" font-size="11" fill="#6b7280" text-anchor="middle">就地读,不拷到别处</text>
  <text x="474" y="308" font-size="11" fill="#9ca3af" text-anchor="middle">显存句柄搭着控制消息过去,对面映射过来直接读那块显存</text>
  <text x="756" y="256" font-size="11" fill="#6b7280">一条就绪消息带上句柄,不回确认</text>
  <text x="756" y="276" font-size="11" fill="#9ca3af">条件:同卡异进程、目标单卡、卡号未重映射且直连可用</text>

  <rect x="216" y="334" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="386" y="334" width="176" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="614" y="334" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <line x1="342" y1="358" x2="378" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="358" x2="606" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="24" y="356" font-size="11" fill="#6b7280">同节点的两张卡,</text>
  <text x="24" y="374" font-size="11" fill="#6b7280">且两卡能互相访问</text>
  <text x="275" y="363" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上游 Stage</text>
  <text x="673" y="363" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">下游 Stage</text>
  <text x="474" y="354" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">发送端显存上的常驻池</text>
  <text x="474" y="372" font-size="11" fill="#6b7280" text-anchor="middle">默认 1 GB,64 KiB 一格</text>
  <text x="474" y="404" font-size="11" fill="#9ca3af" text-anchor="middle">先拷进池子,对面再从池子拷走:一次传输两次拷贝</text>
  <text x="756" y="352" font-size="11" fill="#6b7280">一条就绪消息,再等对面回一条确认</text>
  <text x="756" y="372" font-size="11" fill="#9ca3af">代价:占住的格子要押到确认回来才放</text>

  <rect x="216" y="430" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="386" y="430" width="176" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <rect x="614" y="430" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <line x1="342" y1="454" x2="378" y2="454" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="454" x2="606" y2="454" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="24" y="452" font-size="11" fill="#6b7280">一端不在显存上,</text>
  <text x="24" y="470" font-size="11" fill="#6b7280">或者两卡互访不了</text>
  <text x="275" y="459" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上游 Stage</text>
  <text x="673" y="459" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">下游 Stage</text>
  <text x="474" y="450" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">主机上的一块共享内存</text>
  <text x="474" y="468" font-size="11" fill="#6b7280" text-anchor="middle">一块内存一份数据,读完释放</text>
  <text x="474" y="500" font-size="11" fill="#9ca3af" text-anchor="middle">GPU→GPU 回退增加 D2H 与 H2D;若一端在 CPU,不必两趟都走</text>
  <text x="756" y="448" font-size="11" fill="#6b7280">一条就绪消息,再等对面回一条确认</text>
  <text x="756" y="468" font-size="11" fill="#9ca3af">代价:两卡互访不了时是自动降级,只警告一次</text>

  <rect x="216" y="526" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="386" y="526" width="176" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <rect x="614" y="526" width="118" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <line x1="342" y1="550" x2="378" y2="550" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="550" x2="606" y2="550" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="24" y="548" font-size="11" fill="#6b7280">两端被标成不在</text>
  <text x="24" y="566" font-size="11" fill="#6b7280">同一个节点上</text>
  <text x="275" y="555" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上游 Stage</text>
  <text x="673" y="555" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">下游 Stage</text>
  <text x="474" y="546" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">跨节点后端的缓冲池</text>
  <text x="474" y="564" font-size="11" fill="#6b7280" text-anchor="middle">走哪种协议由它自己选</text>
  <text x="474" y="596" font-size="11" fill="#9ca3af" text-anchor="middle">落进它自己注册好的那块内存,再发到对面节点</text>
  <text x="756" y="544" font-size="11" fill="#6b7280">一条就绪消息,再等对面回一条确认</text>
  <text x="756" y="564" font-size="11" fill="#9ca3af">代价:基准上没有任何一条边会被判成跨节点</text>

  <text x="24" y="626" font-size="11" fill="#9ca3af">主要按位置与 Tensor 设备选路,还受互访能力和直连开关影响;不能任意点名后端</text>
</svg>
