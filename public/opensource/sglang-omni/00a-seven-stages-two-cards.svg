<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">Qwen3-Omni 语音管线:默认语音配置:七个阶段进程、两张卡(另有主进程)</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">颜色 = 这一段在哪跑(灰 = CPU 进程,绿 = GPU 0,紫 = GPU 1,黄 = 主进程);实线 = 正常结果路由,虚线 = 流式边</text>

  <rect x="24" y="74" width="1072" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="42" y="98" font-size="14" font-weight="700" fill="#111827">主进程:HTTP / WebSocket → Client → Coordinator</text>
  <text x="42" y="117" font-size="11" fill="#6b7280">路由到入口段 · 收两个终端的流式块与最终结果 · 广播中止</text>

  <text x="24" y="200" font-size="11" fill="#9ca3af">CPU 进程</text>
  <text x="24" y="336" font-size="11" fill="#9ca3af">GPU 0</text>
  <text x="24" y="486" font-size="11" fill="#9ca3af">GPU 1</text>

  <rect x="120" y="170" width="170" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="136" y="196" font-size="14" font-weight="700" fill="#111827">preprocessing</text>
  <text x="136" y="216" font-size="11" fill="#6b7280">tokenization、媒体处理</text>
  <text x="136" y="233" font-size="11" fill="#6b7280">解帧、重采样;无 KV cache</text>

  <rect x="744" y="170" width="160" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="760" y="196" font-size="14" font-weight="700" fill="#111827">decode</text>
  <text x="760" y="216" font-size="11" fill="#6b7280">token 变回文本</text>
  <text x="760" y="233" font-size="11" fill="#6b7280">终端段,跑在 CPU 上</text>

  <rect x="330" y="280" width="160" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="346" y="306" font-size="14" font-weight="700" fill="#111827">image_encoder</text>
  <text x="346" y="326" font-size="11" fill="#6b7280">图像与视频嵌入</text>

  <rect x="330" y="366" width="160" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="346" y="392" font-size="14" font-weight="700" fill="#111827">audio_encoder</text>
  <text x="346" y="412" font-size="11" fill="#6b7280">音频嵌入</text>

  <rect x="530" y="280" width="180" height="150" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="546" y="306" font-size="14" font-weight="700" fill="#111827">thinker</text>
  <text x="546" y="326" font-size="11" fill="#6b7280">自回归主干,复用上游</text>
  <text x="546" y="343" font-size="11" fill="#6b7280">Scheduler 的批选择与 KV</text>
  <text x="546" y="368" font-size="11" fill="#6b7280">正常结果:文本 token</text>
  <text x="546" y="385" font-size="11" fill="#6b7280">流边:隐藏态与 token</text>

  <rect x="944" y="330" width="150" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="960" y="356" font-size="14" font-weight="700" fill="#111827">code2wav</text>
  <text x="960" y="376" font-size="11" fill="#6b7280">音频码变波形</text>
  <text x="960" y="393" font-size="11" fill="#6b7280">终端段:Vocoder</text>

  <rect x="744" y="456" width="170" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="760" y="482" font-size="14" font-weight="700" fill="#111827">talker_ar</text>
  <text x="760" y="502" font-size="11" fill="#6b7280">自回归出音频码</text>
  <text x="760" y="519" font-size="11" fill="#6b7280">落在另一张卡上</text>

  <path d="M 205 128 L 205 170" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="211" y="152" font-size="11" fill="#9ca3af">入口段</text>

  <path d="M 290 200 L 304 200 L 304 312 L 330 312" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 290 220 L 316 220 L 316 398 L 330 398" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 490 312 L 510 312 L 510 330 L 530 330" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 490 398 L 510 398 L 510 380 L 530 380" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>

  <path d="M 710 300 L 727 300 L 727 208 L 744 208" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="733" y="262" font-size="11" fill="#9ca3af">文本结果</text>

  <path d="M 620 430 L 620 470 L 744 470" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="630" y="462" font-size="11" fill="#9ca3af">流:隐藏态</text>

  <path d="M 914 494 L 1019 494 L 1019 406" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="922" y="486" font-size="11" fill="#9ca3af">流:音频码</text>

  <path d="M 824 170 L 824 128" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="832" y="152" font-size="11" fill="#9ca3af">终端</text>

  <path d="M 1060 330 L 1060 128" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1068" y="248" font-size="11" fill="#9ca3af">终端</text>

  <text x="24" y="562" font-size="11" fill="#9ca3af">主链路示意,省略 fan-in 支线:preprocessing 也直接输入 thinker 与 talker_ar;按请求模态选择 Encoder,需要音频输出时其载荷也输入 talker_ar。</text>
  <text x="24" y="579" font-size="11" fill="#9ca3af">另省略 thinker → decode 的流式块、talker_ar → code2wav 的最终完成信号。文本专用配置为另一套六阶段管线,没有 Talker 与 Vocoder。</text>
</svg>
