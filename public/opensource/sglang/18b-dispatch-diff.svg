<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 496" width="1120" height="496" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="496" fill="#ffffff"/><rect x="286" y="86" width="400" height="34" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><rect x="702" y="86" width="388" height="34" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><rect x="286" y="132" width="400" height="78" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="702" y="132" width="388" height="78" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="286" y="220" width="400" height="78" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="702" y="220" width="388" height="78" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="286" y="308" width="400" height="78" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="702" y="308" width="388" height="78" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="286" y="396" width="400" height="78" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="702" y="396" width="388" height="78" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两边都得回答的四个问题:单实例内的分发,和跨实例的网关</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每一行是任何一个分发器都绕不开的问题;绿 = 单实例内那套的答案,紫 = 网关的答案,灰 = 这一层压根没有这件事。两边的参数名都在第五节。</text><text x="30" y="108" font-size="13" fill="#9ca3af" text-anchor="start">都绕不开的问题</text><text x="486" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">单实例内的分发(01 章)</text><text x="896" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">跨实例的网关(本章)</text><text x="30" y="164" font-size="13" fill="#111827" text-anchor="start" font-weight="700">谁来算这一条?</text><text x="30" y="186" font-size="11" fill="#9ca3af" text-anchor="start">候选是一堆等价的算力</text><text x="486" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">轮流发,或按在跑加排队的条数发</text><text x="486" y="186" font-size="11" fill="#6b7280" text-anchor="middle">候选实例清单在启动时就定死了</text><text x="896" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">六种挑法,默认按缓存亲和挑</text><text x="896" y="186" font-size="11" fill="#6b7280" text-anchor="middle">实例清单运行时可增可减,也能去集群里按标签自己找</text><text x="30" y="252" font-size="13" fill="#111827" text-anchor="start" font-weight="700">它现在有多忙?</text><text x="30" y="274" font-size="11" fill="#9ca3af" text-anchor="start">挑之前总得有个负载数</text><text x="486" y="252" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">读调度器写下的真实快照</text><text x="486" y="274" font-size="11" fill="#6b7280" text-anchor="middle">在跑与排队的条数,或者 token 数</text><text x="896" y="252" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">只数自己发出去还没回来的条数</text><text x="896" y="274" font-size="11" fill="#6b7280" text-anchor="middle">一条 100 token 的请求和一条 100000 token 的请求一样重</text><text x="30" y="340" font-size="13" fill="#111827" text-anchor="start" font-weight="700">它坏了怎么办?</text><text x="30" y="362" font-size="11" fill="#9ca3af" text-anchor="start">远端会挂,进程内的不会</text><text x="486" y="340" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">没有这一层</text><text x="486" y="362" font-size="11" fill="#6b7280" text-anchor="middle">一个副本挂了,整台实例跟着挂</text><text x="486" y="379" font-size="11" fill="#6b7280" text-anchor="middle">官方文档写明它没有容错、也没有熔断</text><text x="896" y="340" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">探活 + 熔断 + 退避重试</text><text x="896" y="362" font-size="11" fill="#6b7280" text-anchor="middle">每次重试重新挑一台实例</text><text x="896" y="379" font-size="11" fill="#6b7280" text-anchor="middle">客户端自己的错不计入熔断</text><text x="30" y="428" font-size="13" fill="#111827" text-anchor="start" font-weight="700">同一段前缀回得到同一个目标吗?</text><text x="30" y="450" font-size="11" fill="#9ca3af" text-anchor="start">这是跨实例才有的痛</text><text x="486" y="428" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">不能</text><text x="486" y="450" font-size="11" fill="#6b7280" text-anchor="middle">官方文档写明它没有缓存感知路由</text><text x="896" y="428" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">能,靠自己记的那棵近似树</text><text x="896" y="450" font-size="11" fill="#6b7280" text-anchor="middle">代价是猜;偏得太厉害就按两个失衡条件放弃命中</text></svg>
