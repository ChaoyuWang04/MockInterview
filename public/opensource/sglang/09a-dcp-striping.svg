<text x="402" y="430" font-size="11" fill="#9ca3af" text-anchor="start">另外 12 个逻辑位置归别的 rank,这张卡一个字节都不存</text>
<text x="30" y="480" font-size="14" fill="#111827" text-anchor="start" font-weight="700">rank 3 本地池</text>
<text x="203" y="480" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3</text>
