<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">DCP 组大小为 4:一份 KV 按 token 位置条带化,页也跟着变宽</text>
<text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">绿 / 紫 / 黄 / 红 = 这个位置归哪个 rank,颜色只代表归属;白底虚线框 = 上排是一格宽页(分配与前缀命中的最小单位),下排是「不归这张卡的那部分」。</text>
<text x="30" y="76" font-size="11" fill="#6b7280" text-anchor="start">格子数本身就是答案:上排 16 格是所有 rank 共看的逻辑位置,下面每排只有 4 格。</text>
<text x="278" y="216" font-size="11" fill="#9ca3af" text-anchor="middle">宽页 0</text>
