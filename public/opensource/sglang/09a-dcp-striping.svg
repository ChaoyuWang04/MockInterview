<text x="30" y="158" font-size="14" fill="#111827" text-anchor="start" font-weight="700">虚拟清单</text>
<text x="30" y="178" font-size="11" fill="#6b7280" text-anchor="start">四个 rank 看同一份</text>
<text x="30" y="272" font-size="11" fill="#9ca3af" text-anchor="start">写入时各自只留下归属自己的位置,压进本地池:逻辑位置 v 归 rank v mod 4,落在本地第 v div 4 行。下面四排画在同一条坐标上,横向长度就是这张卡真正占的显存。</text>
<text x="203" y="296" font-size="11" fill="#9ca3af" text-anchor="middle">行 0</text>
<text x="253" y="296" font-size="11" fill="#9ca3af" text-anchor="middle">行 1</text>
