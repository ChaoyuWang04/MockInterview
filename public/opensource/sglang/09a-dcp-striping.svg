<text x="402" y="480" font-size="11" fill="#9ca3af" text-anchor="start">另外 12 个逻辑位置归别的 rank,这张卡一个字节都不存</text>
<text x="46" y="546" font-size="11" fill="#6b7280" text-anchor="start">上排 16 格、每个本地池 4 格:每卡的 KV 存量与读量都是 1/4,这是 DCP 省显存的全部来源。一格宽页在每个 rank 上正好对应一个本地页。</text>
<text x="46" y="564" font-size="11" fill="#6b7280" text-anchor="start">代价在上排的虚线框里:分配和前缀命中都以一格宽页(4 个逻辑位置)为单位,命中长度因此只落在 4 的倍数上。</text>
