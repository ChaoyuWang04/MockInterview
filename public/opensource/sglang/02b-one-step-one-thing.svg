<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一步里装的是什么:vLLM 混着装,SGLang 一步只做一件事</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">场景相同:一条长 prompt 刚进来、要切成 3 块算完,同时有 3 条请求正在一个字一个字地吐。绿 = 这一步在算 prompt,紫 = 这一步在吐字。</text><text x="224.0" y="92" font-size="11" fill="#9ca3af" text-anchor="middle">第 1 步</text><text x="382.0" y="92" font-size="11" fill="#9ca3af" text-anchor="middle">第 2 步</text><text x="540.0" y="92" font-size="11" fill="#9ca3af" text-anchor="middle">第 3 步</text><text x="698.0" y="92" font-size="11" fill="#9ca3af" text-anchor="middle">第 4 步</text><text x="856.0" y="92" font-size="11" fill="#9ca3af" text-anchor="middle">第 5 步</text><text x="1014.0" y="92" font-size="11" fill="#9ca3af" text-anchor="middle">第 6 步</text><text x="30" y="128" font-size="15" fill="#111827" text-anchor="start" font-weight="700">vLLM</text><text x="30" y="148" font-size="11" fill="#9ca3af" text-anchor="start">没有阶段概念</text><text x="30" y="164" font-size="11" fill="#9ca3af" text-anchor="start">一步里两样一起装</text><rect x="150" y="104" width="148" height="40" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="224.0" y="129" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">prompt 第 1 块</text><rect x="150" y="148" width="148" height="32" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="224.0" y="169" font-size="11" fill="#111827" text-anchor="middle">3 条各吐 1 个字</text><rect x="308" y="104" width="148" height="40" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="382.0" y="129" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">prompt 第 2 块</text><rect x="308" y="148" width="148" height="32" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="382.0" y="169" font-size="11" fill="#111827" text-anchor="middle">3 条各吐 1 个字</text><rect x="466" y="104" width="148" height="40" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="540.0" y="129" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">prompt 第 3 块</text><rect x="466" y="148" width="148" height="32" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="540.0" y="169" font-size="11" fill="#111827" text-anchor="middle">3 条各吐 1 个字</text><rect x="624" y="104" width="148" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="698.0" y="148" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3 条各吐 1 个字</text><rect x="782" y="104" width="148" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="856.0" y="148" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3 条各吐 1 个字</text><rect x="940" y="104" width="148" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="1014.0" y="148" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3 条各吐 1 个字</text><text x="1090" y="198" font-size="11" fill="#9ca3af" text-anchor="end">每一步都有字吐出来</text><text x="30" y="262" font-size="15" fill="#111827" text-anchor="start" font-weight="700">SGLang</text><text x="30" y="282" font-size="11" fill="#9ca3af" text-anchor="start">默认一步只做一件事</text><text x="30" y="298" font-size="11" fill="#9ca3af" text-anchor="start">prefill 优先</text><rect x="150" y="238" width="148" height="76" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="224.0" y="272" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">prompt 第 1 块</text><text x="224.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">整步都在算 prompt</text><rect x="308" y="238" width="148" height="76" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="382.0" y="272" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">prompt 第 2 块</text><text x="382.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">整步都在算 prompt</text><rect x="466" y="238" width="148" height="76" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="540.0" y="272" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">prompt 第 3 块</text><text x="540.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">整步都在算 prompt</text><rect x="624" y="238" width="148" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="698.0" y="282" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3 条各吐 1 个字</text><rect x="782" y="238" width="148" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="856.0" y="282" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3 条各吐 1 个字</text><rect x="940" y="238" width="148" height="76" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="1014.0" y="282" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3 条各吐 1 个字</text><text x="30" y="352" font-size="12" fill="#374151" text-anchor="start" font-weight="700">那 3 条请求</text><text x="30" y="370" font-size="11" fill="#9ca3af" text-anchor="start">眼里看到的</text><rect x="150" y="336" width="148" height="44" rx="5" fill="#ffffff" stroke="#c05c5c" stroke-width="1" stroke-dasharray="5 4"/><rect x="308" y="336" width="148" height="44" rx="5" fill="#ffffff" stroke="#c05c5c" stroke-width="1" stroke-dasharray="5 4"/><rect x="466" y="336" width="148" height="44" rx="5" fill="#ffffff" stroke="#c05c5c" stroke-width="1" stroke-dasharray="5 4"/><rect x="624" y="336" width="148" height="44" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="698.0" y="363" font-size="11" fill="#111827" text-anchor="middle">吐 1 个字</text><rect x="782" y="336" width="148" height="44" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="856.0" y="363" font-size="11" fill="#111827" text-anchor="middle">吐 1 个字</text><rect x="940" y="336" width="148" height="44" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="1014.0" y="363" font-size="11" fill="#111827" text-anchor="middle">吐 1 个字</text><line x1="150" y1="396" x2="614" y2="396" stroke="#c05c5c" stroke-width="1.4"/><line x1="150" y1="391" x2="150" y2="401" stroke="#c05c5c" stroke-width="1.4"/><line x1="614" y1="391" x2="614" y2="401" stroke="#c05c5c" stroke-width="1.4"/><text x="382.0" y="416" font-size="12" fill="#c05c5c" text-anchor="middle" font-weight="700">整整 3 步一个字都没有 —— 这就是 TPOT 上那根毛刺</text><text x="382.0" y="434" font-size="11" fill="#9ca3af" text-anchor="middle">prompt 越长、块切得越大,这根刺越高</text><rect x="30" y="452" width="1060" height="72" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="476" font-size="12" fill="#374151" text-anchor="start" font-weight="700">所以调这两边的参数,调的不是同一件事</text><text x="50" y="497" font-size="11" fill="#6b7280" text-anchor="start">vLLM:块调小 → 每步混进来的 prompt 少一点,吐字更匀;代价是长 prompt 要更多步才算完。</text><text x="50" y="514" font-size="11" fill="#6b7280" text-anchor="start">SGLang:块调小 → 毛刺变矮但变多;要让两样同步走,得手动开混合模式(第五节)。</text></svg>