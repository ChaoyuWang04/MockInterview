<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" width="1120" height="670" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d4a24c"/></marker></defs><rect x="0" y="0" width="1120" height="670" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一步的墙钟时间去哪了:不重叠时 GPU 停下来等 CPU,重叠时两条线各走各的</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">方块的宽度按时长等比画,横向 11 px = 1 毫秒。上下两组都是连着的 3 步,右端差出来的那一截就是重叠省下的时间。</text><text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">数字取小模型单卡的量级:GPU 一步前向加采样 20 毫秒,CPU 一轮调度 6 毫秒。绿 = GPU 在算,紫 = CPU 在算,灰虚线 = 这条线闲着。</text><text x="30" y="126" font-size="15" fill="#111827" text-anchor="start" font-weight="700">不重叠</text><text x="30" y="146" font-size="11" fill="#9ca3af" text-anchor="start">排障时关掉,或者</text><text x="30" y="162" font-size="11" fill="#9ca3af" text-anchor="start">某个功能不兼容</text><text x="30" y="178" font-size="11" fill="#9ca3af" text-anchor="start">时自动退回这样</text><text x="190" y="136" font-size="12" fill="#374151" text-anchor="end" font-weight="700">GPU</text><text x="190" y="206" font-size="12" fill="#374151" text-anchor="end" font-weight="700">CPU</text><rect x="200" y="120" width="66" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><rect x="266" y="120" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="376" y="141" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前向 + 采样 · 第 1 步</text><text x="376" y="157" font-size="11" fill="#6b7280" text-anchor="middle">20 毫秒</text><rect x="200" y="190" width="66" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="233" y="217" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">6 毫秒</text><rect x="266" y="190" width="220" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="146" font-size="11" fill="#9ca3af" text-anchor="middle">空转</text><text x="376" y="217" font-size="11" fill="#9ca3af" text-anchor="middle">闲着</text><rect x="486" y="120" width="66" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><rect x="552" y="120" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="662" y="141" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前向 + 采样 · 第 2 步</text><text x="662" y="157" font-size="11" fill="#6b7280" text-anchor="middle">20 毫秒</text><rect x="486" y="190" width="66" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="519" y="217" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">6 毫秒</text><rect x="552" y="190" width="220" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><rect x="772" y="120" width="66" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><rect x="838" y="120" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="948" y="141" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前向 + 采样 · 第 3 步</text><text x="948" y="157" font-size="11" fill="#6b7280" text-anchor="middle">20 毫秒</text><rect x="772" y="190" width="66" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="805" y="217" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">6 毫秒</text><rect x="838" y="190" width="220" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="252" font-size="11" fill="#6b7280" text-anchor="middle">处理上一步的结果 · 挑这一批</text><line x1="233" y1="236" x2="233" y2="242" stroke="#c7cbd1" stroke-width="1"/><text x="30" y="314" font-size="15" fill="#111827" text-anchor="start" font-weight="700">重叠(默认)</text><text x="30" y="334" font-size="11" fill="#9ca3af" text-anchor="start">CPU 这一轮处理的</text><text x="30" y="350" font-size="11" fill="#9ca3af" text-anchor="start">是上一步的结果,</text><text x="30" y="366" font-size="11" fill="#9ca3af" text-anchor="start">不碰 token 的值</text><rect x="200" y="306" width="660" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="530" y="333" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">显存里的格子:每个请求一个,按格子号索引</text><text x="190" y="412" font-size="12" fill="#374151" text-anchor="end" font-weight="700">GPU</text><text x="190" y="482" font-size="12" fill="#374151" text-anchor="end" font-weight="700">CPU</text><rect x="200" y="396" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="310" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前向 + 采样 · 第 1 步</text><text x="310" y="433" font-size="11" fill="#6b7280" text-anchor="middle">20 毫秒</text><rect x="200" y="466" width="66" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="233" y="493" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">6 毫秒</text><rect x="266" y="466" width="154" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><rect x="420" y="396" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="530" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前向 + 采样 · 第 2 步</text><text x="530" y="433" font-size="11" fill="#6b7280" text-anchor="middle">20 毫秒</text><rect x="420" y="466" width="66" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="453" y="493" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">6 毫秒</text><rect x="486" y="466" width="154" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><rect x="640" y="396" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="750" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">前向 + 采样 · 第 3 步</text><text x="750" y="433" font-size="11" fill="#6b7280" text-anchor="middle">20 毫秒</text><rect x="640" y="466" width="66" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="673" y="493" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">6 毫秒</text><rect x="706" y="466" width="154" height="44" rx="6" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/><line x1="404" y1="394" x2="404" y2="358" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ar)"/><line x1="436" y1="352" x2="436" y2="388" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ar)"/><text x="396" y="374" font-size="11" fill="#a9762c" text-anchor="end">采样写进格子</text><text x="444" y="374" font-size="11" fill="#a9762c" text-anchor="start">下一步前向从格子读</text><line x1="624" y1="394" x2="624" y2="358" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ar)"/><line x1="656" y1="352" x2="656" y2="388" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ar)"/><text x="233" y="528" font-size="11" fill="#6b7280" text-anchor="middle">处理上一步的结果 · 挑下一批 · 发采样</text><line x1="233" y1="512" x2="233" y2="518" stroke="#c7cbd1" stroke-width="1"/><line x1="860" y1="386" x2="860" y2="556" stroke="#c7cbd1" stroke-width="1" stroke-dasharray="4 4"/><line x1="1058" y1="110" x2="1058" y2="556" stroke="#c7cbd1" stroke-width="1" stroke-dasharray="4 4"/><line x1="860" y1="550" x2="1058" y2="550" stroke="#d98080" stroke-width="1.6"/><line x1="860" y1="545" x2="860" y2="555" stroke="#d98080" stroke-width="1.6"/><line x1="1058" y1="545" x2="1058" y2="555" stroke="#d98080" stroke-width="1.6"/><text x="959" y="540" font-size="12" fill="#b45b5b" text-anchor="middle" font-weight="700">3 步省下 18 毫秒</text><rect x="30" y="574" width="1060" height="84" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="598" font-size="13" fill="#374151" text-anchor="start" font-weight="700">这张图想说的两句话</text><text x="50" y="620" font-size="11" fill="#6b7280" text-anchor="start">一、只要 CPU 一轮比 GPU 一步短,墙钟就等于 GPU 那条线,CPU 的 6 毫秒整个消失;CPU 反过来比 GPU 长的话(超小模型、超大批),重叠也救不了,瓶颈换成 CPU。</text><text x="50" y="640" font-size="11" fill="#6b7280" text-anchor="start">二、第 N+1 步的输入是第 N 步采样出来的 token,而 CPU 在准备第 N+1 步时并不知道它——因为根本不需要知道:写和读都排在 GPU 自己的流上,CPU 只传格子号。</text></svg>