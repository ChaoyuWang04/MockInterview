<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<rect x="250" y="152" width="92" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<rect x="352" y="152" width="92" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<rect x="454" y="152" width="92" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<rect x="556" y="152" width="92" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<rect x="790" y="152" width="200" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<rect x="352" y="264" width="200" height="34" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<rect x="790" y="264" width="200" height="34" rx="8" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="352" y="364" width="200" height="34" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="690" y="364" width="190" height="34" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="900" y="364" width="190" height="34" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
<rect x="30" y="452" width="1060" height="46" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
<line x1="30" y1="96" x2="1090" y2="96" stroke="#e5e7eb" stroke-width="1"/>
<line x1="676" y1="106" x2="676" y2="440" stroke="#e5e7eb" stroke-width="1"/>
<line x1="250" y1="236" x2="1090" y2="236" stroke="#f3f4f6" stroke-width="1"/>
<line x1="250" y1="336" x2="1090" y2="336" stroke="#f3f4f6" stroke-width="1"/>
<line x1="452" y1="186" x2="452" y2="264" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="448,258 452,266 456,258" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="452" y1="298" x2="452" y2="364" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="448,358 452,366 456,358" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="552" y1="281" x2="636" y2="281" stroke="#5fa886" stroke-width="1.4"/>
<polyline points="630,277 638,281 630,285" fill="none" stroke="#5fa886" stroke-width="1.4"/>
<polyline points="352,381 242,381 242,169 244,169" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<polyline points="240,165 248,169 240,173" fill="none" stroke="#d9877a" stroke-width="1.4"/>
<polyline points="700,152 786,169 700,186" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="700" y1="169" x2="786" y2="169" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="890" y1="186" x2="890" y2="264" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="886,258 890,266 894,258" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="890,298 890,340 785,340 785,364" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="890,340 995,340 995,364" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="781,358 785,366 789,358" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<polyline points="991,358 995,366 999,358" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两边都必须做的三件事各占一行:vLLM 的形状是个闭环,SGLang 是一条没有回头路的直线</text>
<text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">紫 = 待选的 kernel 从哪来,绿 = 能不能跑的校验,红 = 跑不了时发生的事,白底虚线 = 这一格在这一边根本不存在。</text>
<text x="30" y="76" font-size="11" fill="#6b7280" text-anchor="start">方框数量本身就是答案:左边第一行有 4 个候选框,右边只有 1 个;左边第二行有一个校验框,右边那一格是空的。两边的参数名都在第五节。</text>
<text x="452" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">vLLM</text>
<text x="890" y="118" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">SGLang</text>
<text x="30" y="162" font-size="14" fill="#111827" text-anchor="start" font-weight="700">必须做的事 ①</text>
<text x="30" y="182" font-size="11" fill="#6b7280" text-anchor="start">拿到一组待选的 kernel</text>
<text x="296" y="173" font-size="10" fill="#111827" text-anchor="middle">候选 1</text>
<text x="398" y="173" font-size="10" fill="#111827" text-anchor="middle">候选 2</text>
<text x="500" y="173" font-size="10" fill="#111827" text-anchor="middle">候选 3</text>
<text x="602" y="173" font-size="10" fill="#111827" text-anchor="middle">候选 4</text>
<text x="890" y="173" font-size="11" fill="#111827" text-anchor="middle">一个名字</text>
<text x="250" y="212" font-size="11" fill="#9ca3af" text-anchor="start">顺序由硬件、精度、头数当场算出,不是静态表</text>
<text x="690" y="212" font-size="11" fill="#9ca3af" text-anchor="start">决策树按卡代与模型结构分叉,只吐一个</text>
<text x="30" y="272" font-size="14" fill="#111827" text-anchor="start" font-weight="700">必须做的事 ②</text>
<text x="30" y="292" font-size="11" fill="#6b7280" text-anchor="start">判断能不能跑当前的卡与模型</text>
<text x="452" y="285" font-size="11" fill="#111827" text-anchor="middle">每个后端自带的准入校验</text>
<text x="890" y="285" font-size="11" fill="#9ca3af" text-anchor="middle">没有这样的方法</text>
<text x="556" y="276" font-size="10" fill="#5fa886" text-anchor="start">过了就选中</text>
<text x="250" y="318" font-size="11" fill="#9ca3af" text-anchor="start">在循环里被逐个调用,谁先过谁被选中</text>
<text x="690" y="318" font-size="11" fill="#9ca3af" text-anchor="start">全树找不到一个「我能不能跑」的方法,真正的检查在后面两处</text>
<text x="30" y="372" font-size="14" fill="#111827" text-anchor="start" font-weight="700">必须做的事 ③</text>
<text x="30" y="392" font-size="11" fill="#6b7280" text-anchor="start">这一个跑不了时怎么办</text>
<text x="452" y="385" font-size="11" fill="#111827" text-anchor="middle">淘汰,取下一个候选</text>
<text x="785" y="385" font-size="11" fill="#111827" text-anchor="middle">被改写成另一个名字</text>
<text x="995" y="385" font-size="11" fill="#111827" text-anchor="middle">构造时抛错,起不来</text>
<text x="250" y="418" font-size="11" fill="#d9877a" text-anchor="start">红色虚线回到 ①:淘汰原因只打在 debug 级,默认看不见</text>
<text x="690" y="418" font-size="11" fill="#9ca3af" text-anchor="start">两条出口都是终点,没有一条回头的箭头</text>
<text x="50" y="476" font-size="11" fill="#6b7280" text-anchor="start">闭环意味着「这一条不行」有明确的下一步,代价是排障时得把 debug 日志打开才知道前面几条为什么被刷掉;没有闭环则意味着「不行」只能表现成两件事:悄悄换成</text>
<text x="50" y="492" font-size="11" fill="#6b7280" text-anchor="start">别的,或者根本起不来。这也是为什么右边那条直线上,能改写答案的地方比能报错的地方多得多。</text>
</svg>
