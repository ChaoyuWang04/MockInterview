<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 736" width="1120" height="736" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="736" fill="#ffffff"/>
<text x="46" y="40" font-size="19" fill="#111827" font-weight="700" text-anchor="start">超大 MoE 上两边都必须做的 5 件事,各自做成了什么样</text>
<text x="46" y="66" font-size="13" fill="#6b7280" text-anchor="start">每一行是一件两边都绕不开的事,左右两栏各画各的做法。绿 = 可以自己选的量,灰 = 被别的量推出来、选不了的</text>
<text x="46" y="86" font-size="13" fill="#6b7280" text-anchor="start">黄 = 跨卡通信,紫 = 计算,红 = 对外的入口。格子数、条的长度和上下错位都是信息,不是装饰</text>
<text x="475" y="120" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">vLLM</text>
<text x="865" y="120" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">SGLang</text>
<text x="46" y="164" font-size="14" fill="#111827" font-weight="700" text-anchor="start">决定每张卡放哪些专家</text>
