<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="720" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">SGLang 的三个进程,与一条流式请求走过的 7 站</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = 主进程组件,绿 = 调度器进程,黄 = 反切词进程,灰 = 客户端与可选进程;实线 = 请求与数据,虚线 = 广播。黑色编号是请求经过的顺序。</text><rect x="430" y="80" width="260" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="105" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">客户端</text><text x="560.0" y="126" font-size="11" fill="#6b7280" text-anchor="middle">N 个并发 HTTP 连接</text><rect x="40" y="150" width="1040" height="172" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="56" y="170" font-size="13" fill="#6b7280" text-anchor="start">主进程:HTTP 与切词都在这里,切词就在事件循环线程上,没有线程池</text><text x="1064" y="170" font-size="11" fill="#9ca3af" text-anchor="end">--tokenizer-worker-num 可起 N 个,各带一套</text><rect x="60" y="192" width="235" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="177.5" y="217" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">HTTP 路由</text><text x="177.5" y="238" font-size="11" fill="#6b7280" text-anchor="middle">FastAPI / uvicorn</text><text x="177.5" y="255" font-size="11" fill="#6b7280" text-anchor="middle">/generate · /v1/* · /health</text><rect x="315" y="192" width="235" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="432.5" y="217" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">协议转换</text><text x="432.5" y="238" font-size="11" fill="#6b7280" text-anchor="middle">OpenAI 与 Anthropic 都在这里</text><text x="432.5" y="255" font-size="11" fill="#6b7280" text-anchor="middle">套聊天模板 → 切词</text><rect x="570" y="192" width="235" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="687.5" y="217" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">TokenizerManager</text><text x="687.5" y="238" font-size="11" fill="#6b7280" text-anchor="middle">校验长度 · 包成 input_ids</text><text x="687.5" y="255" font-size="11" fill="#6b7280" text-anchor="middle">分配请求号,挂起协程等结果</text><rect x="825" y="192" width="235" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="942.5" y="217" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">输出回写</text><text x="942.5" y="238" font-size="11" fill="#6b7280" text-anchor="middle">推理段与工具调用在这里切</text><text x="942.5" y="255" font-size="11" fill="#6b7280" text-anchor="middle">攒 16 个请求批量唤醒 → SSE</text><circle cx="74" cy="206" r="10" fill="#111827"/><text x="74" y="210" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><circle cx="329" cy="206" r="10" fill="#111827"/><text x="329" y="210" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><circle cx="584" cy="206" r="10" fill="#111827"/><text x="584" y="210" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><circle cx="839" cy="206" r="10" fill="#111827"/><text x="839" y="210" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><text x="60" y="306" font-size="11" fill="#9ca3af" text-anchor="start">分词器第 1 份:切词</text><text x="60" y="348" font-size="12" fill="#6b7280" text-anchor="start">ZMQ PUSH / PULL · Unix 域套接字 · 消息默认 pickle,关掉才走 msgpack</text><rect x="40" y="372" width="660" height="268" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="56" y="392" font-size="13" fill="#6b7280" text-anchor="start">Scheduler 子进程:每个 TP × PP rank 一个,调度与 GPU 前向在同一个进程里</text><rect x="60" y="410" width="620" height="128" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="370.0" y="435" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Scheduler rank 0</text><text x="370.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle">每轮开头非阻塞地把管子里的请求一次拉空 → 等待队列 → 准入 → 调度</text><text x="370.0" y="473" font-size="11" fill="#6b7280" text-anchor="middle">同进程里 TpModelWorker 跑前向与采样,不再跨进程</text><text x="370.0" y="490" font-size="11" fill="#6b7280" text-anchor="middle">自带一份分词器,每步 decode 输出尾巴自己判停止串</text><circle cx="74" cy="424" r="10" fill="#111827"/><text x="74" y="428" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="370" y="530" font-size="11" fill="#9ca3af" text-anchor="middle">分词器第 2 份:判停止串</text><rect x="60" y="552" width="620" height="68" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="370.0" y="577" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Scheduler rank 1 … N−1</text><text x="370.0" y="598" font-size="11" fill="#6b7280" text-anchor="middle">只执行不收请求;TP all-reduce 与 PP P2P 走 NCCL</text><polyline points="370,540 370,550" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="500" y="548" font-size="11" fill="#9ca3af" text-anchor="start">rank 0 每步用 gloo 广播</text><rect x="730" y="372" width="350" height="196" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="746" y="392" font-size="13" fill="#6b7280" text-anchor="start">Detokenizer 子进程</text><rect x="750" y="410" width="310" height="128" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="905.0" y="435" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">增量反切词</text><text x="905.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle">每请求记 2 个偏移</text><text x="905.0" y="473" font-size="11" fill="#6b7280" text-anchor="middle">整段 decode 减去前缀 decode</text><text x="905.0" y="490" font-size="11" fill="#6b7280" text-anchor="middle">差就是这一步的新文字</text><text x="905.0" y="507" font-size="11" fill="#6b7280" text-anchor="middle">半个 UTF-8 字符先扣着不发</text><circle cx="764" cy="424" r="10" fill="#111827"/><text x="764" y="428" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="905" y="558" font-size="11" fill="#9ca3af" text-anchor="middle">分词器第 3 份:反切词 · 最多记 65536 个请求</text><rect x="730" y="590" width="350" height="90" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="746" y="610" font-size="13" fill="#6b7280" text-anchor="start">可选:开数据并行时多一个进程</text><rect x="750" y="622" width="310" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="905.0" y="647" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">DataParallelController</text><text x="905" y="662" font-size="11" fill="#9ca3af" text-anchor="middle">默认轮询,不看负载</text><polyline points="560,124 560,140 177,140 177,190" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="295,236 313,236" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="550,236 568,236" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="687,282 687,362 370,362 370,408" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="682,447 748,447" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><circle cx="715" cy="430" r="10" fill="#111827"/><text x="715" y="434" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><polyline points="905,408 905,332 942,332 942,282" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="942,190 942,102 692,102" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/></svg>