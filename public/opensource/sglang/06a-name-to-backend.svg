<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 616" width="1120" height="616" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
