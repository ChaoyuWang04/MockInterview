<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 552" width="1120" height="552" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="552" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一步里必须装的三类 token,谁在管它们的量</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每一行是一类 token,上下贯穿两边。一个方框纵向盖住几行,就是这个额度管着这几类;灰虚框表示这一类根本不进预算。</text><text x="38" y="104" font-size="12" fill="#9ca3af" text-anchor="start">一步里必须装的三类 token</text><text x="529" y="104" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">vLLM</text><text x="909" y="104" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">SGLang</text><rect x="30" y="118" width="1060" height="88" rx="0" fill="#fafafa" stroke="#fafafa" stroke-width="1"/><line x1="30" y1="118" x2="1090" y2="118" stroke="#e5e7eb" stroke-width="1"/><text x="46" y="154" font-size="13" fill="#374151" text-anchor="start" font-weight="700">这一步新收进来的 prompt</text><text x="46" y="176" font-size="11" fill="#9ca3af" text-anchor="start">刚进批的请求,整条 prompt 都要算一遍</text><line x1="30" y1="206" x2="1090" y2="206" stroke="#e5e7eb" stroke-width="1"/><text x="46" y="242" font-size="13" fill="#374151" text-anchor="start" font-weight="700">长 prompt 的当前这一块</text><text x="46" y="264" font-size="11" fill="#9ca3af" text-anchor="start">超过一块的 prompt 被切开,这一步只算其中一块</text><rect x="30" y="294" width="1060" height="88" rx="0" fill="#fafafa" stroke="#fafafa" stroke-width="1"/><line x1="30" y1="294" x2="1090" y2="294" stroke="#e5e7eb" stroke-width="1"/><text x="46" y="330" font-size="13" fill="#374151" text-anchor="start" font-weight="700">在跑的请求各自的那 1 个 token</text><text x="46" y="352" font-size="11" fill="#9ca3af" text-anchor="start">每条在跑的请求这一步吐 1 个 token</text><line x1="30" y1="382" x2="1090" y2="382" stroke="#e5e7eb" stroke-width="1"/><rect x="348" y="126" width="362" height="248" rx="8" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="529" y="238" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">一步最多算多少 token</text><text x="529" y="260" font-size="11" fill="#6b7280" text-anchor="middle">一个总额,三类都算在里面</text><text x="529" y="278" font-size="11" fill="#6b7280" text-anchor="middle">长 prompt 的块和 decode 天然在同一步里</text><rect x="728" y="126" width="362" height="72" rx="8" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="909" y="156" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">一批 prefill 的总量</text><text x="909" y="178" font-size="11" fill="#6b7280" text-anchor="middle">默认 16384,不小于模型上下文</text><text x="1078" y="144" font-size="10" fill="#9ca3af" text-anchor="end">prefill 步</text><rect x="728" y="214" width="362" height="72" rx="8" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="909" y="244" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">一块的大小</text><text x="909" y="266" font-size="11" fill="#6b7280" text-anchor="middle">按显卡定在 2048–16384;DP attention 下再除以 dp 数</text><text x="1078" y="232" font-size="10" fill="#9ca3af" text-anchor="end">prefill 步</text><rect x="728" y="302" width="362" height="72" rx="8" fill="#f6f7f8" stroke="#c7cbd1" stroke-width="1" stroke-dasharray="5 4"/><text x="909" y="332" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">不进任何预算</text><text x="909" y="354" font-size="11" fill="#6b7280" text-anchor="middle">能同时跑多少条,由剩余显存和一个单独的并发上限决定</text><text x="1078" y="320" font-size="10" fill="#9ca3af" text-anchor="end">decode 步</text><text x="1090" y="402" font-size="11" fill="#9ca3af" text-anchor="end">SGLang 默认一步只做一件事:上面两行和第三行不会出现在同一步里,开混合模式才同框</text><rect x="30" y="418" width="1060" height="104" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="444" font-size="13" fill="#374151" text-anchor="start" font-weight="700">并排摆在这里,是因为这三行两边都必须装;装法不同带来两个后果</text><text x="50" y="468" font-size="11" fill="#6b7280" text-anchor="start">一、调 SGLang 那两个 prefill 预算,对同时能跑多少条 decode 没有任何影响;调 vLLM 那个总额,则同时动了 prefill 的大小和并发。名字长得像,管的范围不是一回事。</text><text x="50" y="488" font-size="11" fill="#6b7280" text-anchor="start">二、第三行单独成步,意味着一条长 prompt 进来时在跑的 decode 都要等这一块算完,TPOT 上出现一根和块大小成正比的毛刺;vLLM 没有这根刺,但它的 decode 要和 prefill 抢同一个总额。</text><text x="50" y="508" font-size="11" fill="#9ca3af" text-anchor="start">两边的参数名都在第五节的参数表里,这张图只画范围。</text></svg>