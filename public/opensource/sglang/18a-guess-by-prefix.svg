<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="600" fill="#ffffff"/><rect x="30" y="78" width="500" height="496" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><circle cx="70" cy="128" r="13" fill="#eeeeee"/><rect x="50" y="158" width="460" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="50" y="262" width="220" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="290" y="262" width="220" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="50" y="378" width="220" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="556" y="78" width="534" height="496" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="572" y="112" width="502" height="64" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><rect x="572" y="236" width="474" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="1046" y="236" width="14" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="572" y="326" width="24" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="596" y="326" width="464" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="572" y="400" width="502" height="86" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><polyline points="70,141 70,156" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="160,218 160,260" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="400,218 400,260" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="160,334 160,376" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">网关怎么猜:原文在字符树上走多远,决定它粘哪一台</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = 这条新请求在树上匹配到的路径,紫 = 树上的其他分支,灰 = 新请求里树上没有的部分;横条长度按字符数画,绿段占整条的比例就是命中率</text><text x="46" y="98" font-size="13" fill="#6b7280" text-anchor="start">网关的树:按字符存,节点上记的是「哪几台见过」</text><text x="70" y="132" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">根</text><text x="96" y="133" font-size="11" fill="#9ca3af" text-anchor="start">每台实例注册时都挂到这里</text><text x="280" y="184" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">系统提示 + 工具说明</text><text x="280" y="205" font-size="11" fill="#6b7280" text-anchor="middle">甲、乙 都见过 · 1200 字符</text><text x="160" y="290" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">第 1 轮:问订单</text><text x="160" y="312" font-size="11" fill="#6b7280" text-anchor="middle">只有甲见过 · 800 字符</text><text x="400" y="290" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">第 1 轮:问退款</text><text x="400" y="312" font-size="11" fill="#6b7280" text-anchor="middle">只有乙见过 · 700 字符</text><text x="160" y="406" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">甲 上一轮的回答</text><text x="160" y="428" font-size="11" fill="#6b7280" text-anchor="middle">只有甲见过 · 1500 字符</text><text x="50" y="482" font-size="11" fill="#9ca3af" text-anchor="start">绿色这条路径合计 3500 字符</text><text x="50" y="504" font-size="11" fill="#9ca3af" text-anchor="start">节点上没有 KV 槽号,只有「谁见过」</text><text x="50" y="526" font-size="11" fill="#9ca3af" text-anchor="start">定时线程按每台实例的字符总数,从最旧的叶子往回删</text><text x="572" y="98" font-size="13" fill="#6b7280" text-anchor="start">一条新请求进来,网关按顺序做三件事</text><text x="823" y="138" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">① 先看失衡</text><text x="823" y="159" font-size="11" fill="#6b7280" text-anchor="middle">最忙 − 最闲 &gt; 绝对阈值,并且 最忙 &gt; 最闲 × 倍数 → 两条同时成立就跳过 ②,直接发最闲那台</text><text x="572" y="202" font-size="13" fill="#6b7280" text-anchor="start">② 把原文放到树上走一遍,算命中率</text><text x="572" y="228" font-size="11" fill="#9ca3af" text-anchor="start">同一个用户接着问订单 · 原文 3600 字符</text><text x="809" y="253" font-size="11" fill="#6b7280" text-anchor="middle">匹配 3500 字符</text><text x="572" y="282" font-size="11" fill="#6b7280" text-anchor="start">命中率 0.97 高于阈值 0.3 → 发给树上记着的那台(甲)</text><text x="572" y="318" font-size="11" fill="#9ca3af" text-anchor="start">另一个用户,全新的系统提示 · 原文 3600 字符</text><text x="606" y="343" font-size="11" fill="#6b7280" text-anchor="start">匹配 180 字符</text><text x="572" y="372" font-size="11" fill="#6b7280" text-anchor="start">命中率 0.05 不到阈值 0.3 → 不看树,发给在飞请求最少的那台</text><text x="823" y="426" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">③ 不管走的是哪一条,都把这条原文插回树</text><text x="823" y="447" font-size="11" fill="#6b7280" text-anchor="middle">被选中那台的名字,挂到走过的每一个节点上</text><text x="823" y="466" font-size="11" fill="#6b7280" text-anchor="middle">树只记「我发给过谁」,从不去问实例缓存了什么</text><text x="572" y="514" font-size="11" fill="#9ca3af" text-anchor="start">猜错的代价只是那台实例多算一次 prefill,和轮询一样差,不会更差</text><text x="572" y="536" font-size="11" fill="#9ca3af" text-anchor="start">PD 分离时这三步做两遍:P 池一棵树、D 池一棵树,同一份原文,两套策略</text></svg>
