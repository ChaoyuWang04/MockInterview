<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 544" width="1120" height="544" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="544" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一段 KV 的四个时刻:树上的节点一直在,三层里的副本各自增减</text><text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">绿 = 显存里有这一段,紫 = 本机内存里有,黄 = 外部存储里有,灰 = 树上的节点本身;白虚框 = 这一层此刻没有。</text><text x="30" y="76" font-size="11" fill="#6b7280" text-anchor="start">写策略、预取策略这些名字和默认值都在第五节。</text><line x1="30" y1="98" x2="1090" y2="98" stroke="#e5e7eb" stroke-width="1"/><text x="212" y="124" font-size="14" fill="#111827" text-anchor="start" font-weight="700">① 算完,插进树</text><text x="212" y="144" font-size="11" fill="#9ca3af" text-anchor="start">请求结束,或一次 prefill 结束</text><text x="434" y="124" font-size="14" fill="#111827" text-anchor="start" font-weight="700">② 备份到内存,再写出去</text><text x="434" y="144" font-size="11" fill="#9ca3af" text-anchor="start">拷完内存那份并确认之后</text><text x="656" y="124" font-size="14" fill="#111827" text-anchor="start" font-weight="700">③ 显存吃紧,丢叶子</text><text x="656" y="144" font-size="11" fill="#9ca3af" text-anchor="start">要腾格子给新请求</text><text x="878" y="124" font-size="14" fill="#111827" text-anchor="start" font-weight="700">④ 下一轮又命中</text><text x="878" y="144" font-size="11" fill="#9ca3af" text-anchor="start">同一个前缀又来了</text><text x="200" y="190" font-size="13" fill="#111827" text-anchor="end" font-weight="700">树上的那个节点</text><text x="200" y="207" font-size="11" fill="#6b7280" text-anchor="end">它记着两个地址</text><rect x="212" y="172" width="204" height="46" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="314" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">新节点</text><text x="314" y="209" font-size="11" fill="#6b7280" text-anchor="middle">记 1 个显存格子号</text><rect x="434" y="172" width="204" height="46" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="536" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">同一个节点</text><text x="536" y="209" font-size="11" fill="#6b7280" text-anchor="middle">多记内存格子号 · 已备份</text><rect x="656" y="172" width="204" height="46" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="758" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">节点还在树上</text><text x="758" y="209" font-size="11" fill="#6b7280" text-anchor="middle">显存格子号清空</text><rect x="878" y="172" width="204" height="46" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="980" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">同一个节点</text><text x="980" y="209" font-size="11" fill="#6b7280" text-anchor="middle">显存格子号又填上</text><text x="200" y="256" font-size="13" fill="#111827" text-anchor="end" font-weight="700">L1 · 显存</text><text x="200" y="273" font-size="11" fill="#6b7280" text-anchor="end">算出来就在这</text><rect x="212" y="238" width="204" height="46" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="314" y="266" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">刚算出来的这一段</text><rect x="434" y="238" width="204" height="46" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="536" y="266" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">还在,没动</text><rect x="656" y="238" width="204" height="46" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="758" y="266" font-size="11" fill="#9ca3af" text-anchor="middle">格子被别人拿走了</text><rect x="878" y="238" width="204" height="46" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="980" y="258" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">整段拉回</text><text x="980" y="274" font-size="11" fill="#6b7280" text-anchor="middle">按层拉,和计算重叠</text><text x="200" y="322" font-size="13" fill="#111827" text-anchor="end" font-weight="700">L2 · 本机内存</text><text x="200" y="339" font-size="11" fill="#6b7280" text-anchor="end">每张卡各买一份</text><rect x="212" y="304" width="204" height="46" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="314" y="332" font-size="11" fill="#9ca3af" text-anchor="middle">还没有副本</text><rect x="434" y="304" width="204" height="46" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="536" y="324" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">后台线程拷一份</text><text x="536" y="341" font-size="11" fill="#6b7280" text-anchor="middle">和以后用不用无关</text><rect x="656" y="304" width="204" height="46" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="758" y="324" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">现在唯一的一份</text><text x="758" y="341" font-size="11" fill="#6b7280" text-anchor="middle">节点指着它</text><rect x="878" y="304" width="204" height="46" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="980" y="324" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">留着不动</text><text x="980" y="341" font-size="11" fill="#6b7280" text-anchor="middle">要么全拉,要么不拉</text><text x="200" y="388" font-size="13" fill="#111827" text-anchor="end" font-weight="700">L3 · 外部存储</text><text x="200" y="405" font-size="11" fill="#6b7280" text-anchor="end">有的后端跨实例</text><rect x="212" y="370" width="204" height="46" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="314" y="398" font-size="11" fill="#9ca3af" text-anchor="middle">还没有副本</text><rect x="434" y="370" width="204" height="46" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="536" y="390" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">按页哈希写出</text><text x="536" y="407" font-size="11" fill="#6b7280" text-anchor="middle">已经有的页跳过</text><rect x="656" y="370" width="204" height="46" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="758" y="390" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">还在</text><text x="758" y="407" font-size="11" fill="#6b7280" text-anchor="middle">别的实例也看得见</text><rect x="878" y="370" width="204" height="46" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="980" y="390" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">更靠前的那段</text><text x="980" y="407" font-size="11" fill="#6b7280" text-anchor="middle">排队时就预取到 L2</text><text x="425" y="266" font-size="12" fill="#9ca3af" text-anchor="middle">→</text><text x="647" y="266" font-size="12" fill="#9ca3af" text-anchor="middle">→</text><text x="869" y="266" font-size="12" fill="#9ca3af" text-anchor="middle">→</text><text x="758" y="438" font-size="11" fill="#d9877a" text-anchor="middle" font-weight="700">↑ 驱逐只释放显存格子,树上的节点没删,所以下一轮还能命中</text><rect x="30" y="458" width="1060" height="66" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="484" font-size="11" fill="#6b7280" text-anchor="start">① 到 ② 这一步默认对每段 KV 都走一遍,不管以后用不用;另外两种写策略把它推迟到同一段第 2 次插入、或者干脆推迟到 ③ 那一刻。</text><text x="50" y="506" font-size="11" fill="#6b7280" text-anchor="start">④ 里那两段的来路不同:内存那段是准入时整段拉回,外部存储那段是这条请求还在排队时就开始预取的。</text></svg>
