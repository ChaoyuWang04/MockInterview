<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="600" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一棵树上,谁先被丢,由三件事一起决定</text><text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">绿 = 被在跑的请求锁住,丢不掉;灰 = 已经结束,可以丢;红 = 结束时代码主动劈的那一刀,以及它造成的丢弃顺序。</text><text x="30" y="76" font-size="11" fill="#9ca3af" text-anchor="start">方框的长短与 token 数无关,只表示它在树上的位置;从左到右就是从根到叶。</text><line x1="30" y1="98" x2="1090" y2="98" stroke="#e5e7eb" stroke-width="1"/><circle cx="68" cy="290" r="9" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="68" y="320" font-size="11" fill="#9ca3af" text-anchor="middle">根</text><line x1="77" y1="290" x2="100" y2="290" stroke="#9ca3af" stroke-width="1.4"/><rect x="100" y="266" width="250" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="225" y="287" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">系统提示词 + 工具说明</text><text x="225" y="304" font-size="11" fill="#6b7280" text-anchor="middle">1800 token · 3 条请求的共同开头</text><polyline points="350,290 372,290 372,160 396,160" fill="none" stroke="#9ca3af" stroke-width="1.4"/><line x1="350" y1="290" x2="396" y2="290" stroke="#9ca3af" stroke-width="1.4"/><polyline points="350,290 372,290 372,420 396,420" fill="none" stroke="#9ca3af" stroke-width="1.4"/><rect x="396" y="136" width="180" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="486" y="157" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">会话 A 第 1 轮</text><text x="486" y="174" font-size="11" fill="#6b7280" text-anchor="middle">prompt · 300 token</text><line x1="576" y1="160" x2="600" y2="160" stroke="#9ca3af" stroke-width="1.4"/><rect x="600" y="136" width="150" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="675" y="157" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">第 1 轮回答</text><text x="675" y="174" font-size="11" fill="#6b7280" text-anchor="middle">120 token</text><line x1="750" y1="160" x2="774" y2="160" stroke="#9ca3af" stroke-width="1.4"/><rect x="774" y="136" width="210" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="879" y="157" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">会话 A 第 2 轮 prompt</text><text x="879" y="174" font-size="11" fill="#6b7280" text-anchor="middle">正在跑 · 80 token</text><text x="774" y="204" font-size="11" fill="#5fa886" text-anchor="start" font-weight="600">这条路径上每个节点都被它锁住,一路锁到根</text><rect x="396" y="266" width="180" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="486" y="287" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">会话 B 的 prompt</text><text x="486" y="304" font-size="11" fill="#6b7280" text-anchor="middle">300 token</text><text x="588" y="246" font-size="10" fill="#d9877a" text-anchor="middle" font-weight="700">结束时劈的一刀</text><line x1="588" y1="252" x2="588" y2="330" stroke="#d9877a" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="600" y="266" width="150" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="675" y="287" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">会话 B 的回答</text><text x="675" y="304" font-size="11" fill="#6b7280" text-anchor="middle">200 token</text><rect x="764" y="278" width="54" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="791" y="293" font-size="12" fill="#d9877a" text-anchor="middle" font-weight="700">可丢</text><text x="600" y="344" font-size="11" fill="#d9877a" text-anchor="start">回答被劈到 prompt 外侧,成了独立的叶子</text><rect x="396" y="396" width="260" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="526" y="417" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">一条一次性请求的整条路径</text><text x="526" y="434" font-size="11" fill="#6b7280" text-anchor="middle">prompt + 回答 · 900 token</text><rect x="670" y="408" width="54" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="697" y="423" font-size="12" fill="#d9877a" text-anchor="middle" font-weight="700">可丢</text><text x="100" y="344" font-size="11" fill="#6b7280" text-anchor="start">主干要等底下三条分支全空,才第一次成为叶子</text><rect x="30" y="472" width="1060" height="104" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="500" font-size="11" fill="#6b7280" text-anchor="start">① 进批时:从根往下走到分叉点,走到节点中间就把这个节点劈成两半 —— 劈开只改树的拓扑,KV 一个字节都不动。</text><text x="50" y="526" font-size="11" fill="#6b7280" text-anchor="start">② 在跑时:锁从叶子一路加到根,所以只要有一条请求还在用,它上面的整条路径都丢不掉。</text><text x="50" y="552" font-size="11" fill="#6b7280" text-anchor="start">③ 结束时:先把整条路径插进去,再拿 prompt 那一截补插一次,把叶子从 prompt 与回答的交界处劈开,并给 prompt 更高的保留优先级。</text></svg>