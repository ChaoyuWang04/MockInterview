oke-width="1.6"/><path d="M 315 384 L 319 391 L 323 384 Z" fill="#5fa886"/><text x="341" y="286" font-size="11" fill="#374151" text-anchor="start" font-weight="700">A 和 B 的第 0 个 token 都写着 3 号格 —— 仓库里这一格只存一份</text><text x="341" y="304" font-size="11" fill="#9ca3af" text-anchor="start">前 12 格全是这样;第 12 个起两条各分各的,谁也不用重算谁的</text><text x="30" y="370" font-size="14" fill="#111827" text-anchor="start" font-weight="700">第二级 · 仓库</text><text x="30" y="388" font-size="11" fill="#9ca3af" text-anchor="start">格子号 → 这一层的</text><text x="30" y="404" font-size="11" fill="#9ca3af" text-anchor="start">K 和 V</text><rect x="210" y="378" width="850" height="40" rx="4" fill="#ffffff" stroke="#d7dce1" stroke-width="1"/><rect x="205" y="385" width="850" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><rect x="200" y="392" width="34" height="40" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="217" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">0</text><rect x="234" y="392" width="34" height="40" rx="3" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="251" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">1</text><rect x="268" y="392" width="34" height="40" rx="3" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="285" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">2</text><rect x="302" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="319" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">3</text><rect x="336" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="353" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">4</text><rect x="370" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="387" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="6