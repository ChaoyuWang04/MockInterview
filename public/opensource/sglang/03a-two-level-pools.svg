 font-weight="600">15</text><rect x="744" y="392" width="34" height="40" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="761" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">16</text><rect x="778" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="795" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">17</text><rect x="812" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="829" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">18</text><rect x="846" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="863" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">19</text><rect x="880" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="897" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">20</text><rect x="914" y="392" width="34" height="40" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="931" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">21</text><rect x="948" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="965" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">22</text><rect x="982" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="999" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">23</text><rect x="1016" y="392" width="34" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="1033" y="417" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">24</text><text x="200" y="454" font-size="11" fill="#9ca3af" text-anchor="start">0 号格是垫片。其余 24 格散落在显存任何位置,顺序和请求里的先后没有关系。</text><text x="1050" y="454" font-size="11" fill="#9ca3af" text-anchor="end">每层各有一间这样的仓库,同一个格子号在每层各指一份 K 和 V</text><rect x="30" y="482" width="1060" height="58" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="506" font-size="11" fill="#6b7280" text-anchor="start">一格装多少:本卡的 KV 头数 × 头维 × 精度,常见模型 256 字节到 2 KB;所以「一格一个 token」并不会让 GPU 空跑一趟。</text><text x="50" y="526" font-size="11" fill="#6b7280" text-anchor="start">真正的代价在上面那张清单:行数 × 最大上下文的整数矩阵,4096 并发、131072 上下文就是 2 GB,跑短请求也是 2 GB。</text></svg>
