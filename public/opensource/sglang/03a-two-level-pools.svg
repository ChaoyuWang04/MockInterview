<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 556" width="1120" height="556" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="556" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两级 KV 存储:一张清单记「谁的第几个 token 在几号格」,一间仓库记「几号格里是什么」</text><text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">绿 = A、B 两条请求共用的格子,紫 = 只有 A 用,黄 = 只有 B 用,灰 = 买断了但这一刻没用上。</text><text x="30" y="76" font-size="11" fill="#6b7280" text-anchor="start">A 和 B 在第 12 个 token 处分叉 —— 12 不是 16 的倍数,页的大小是 1 才切得出来。</text><text x="30" y="110" font-size="14" fill="#111827" text-anchor="start" font-weight="700">第一级 · 清单</text><text x="30" y="128" font-size="11" fill="#9ca3af" text-anchor="start">请求 → 它每个</text><text x="30" y="144" font-size="11" fill="#9ca3af" text-anchor="start">token 的格子号</text><text x="245" y="130" font-size="10" fill="#9ca3af" text-anchor="middle">第 0 个</text><text x="365" y="130" font-size="10" fill="#9ca3af" text-anchor="middle">第 4 个</text><text x="485" y="130" font-size="10" fill="#9ca3af" text-anchor="middle">第 8 个</text><text x="725" y="130" font-size="10" fill="#9ca3af" text-anchor="middle">第 16 个</text><text x="911" y="130" font-size="10" fill="#9ca3af" text-anchor="middle">……</text><text x="218" y="161" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">第 0 行</text><rect x="230" y="140" width="540" height="32" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="240" y="160" font-size="11" fill="#6b7280" text-anchor="start">CUDA graph 的假批次写这一行</text><text x="218" y="199" font-size="11" fill="#111827" text-anchor="end" font-weight="700">请求 A</text><rect x="230" y="178" width="30" height="32" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="245" y="199" font-size="11" fill="#111827" text-anchor="middle" font-weight="600">3</text><rect x="260" y="178" wid