<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 548" width="1120" height="548" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="548" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一套多级缓存,五个必须回答的问题,谁来回答</text><text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">绿 = 项目自己的 KV 数据结构在回答这一行,紫 = 外挂或控制层在回答,黄 = 第三层的落点,白虚框 = 这一格没人。</text><text x="30" y="76" font-size="11" fill="#6b7280" text-anchor="start">方框纵向盖住几行,就是这个部件回答了几个问题;左边那道窄列是各自的 KV 数据结构本身。</text><line x1="30" y1="98" x2="1090" y2="98" stroke="#e5e7eb" stroke-width="1"/><line x1="698" y1="110" x2="698" y2="450" stroke="#e5e7eb" stroke-width="1"/><text x="500" y="122" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">vLLM</text><text x="897" y="122" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">SGLang</text><text x="296" y="162" font-size="13" fill="#111827" text-anchor="end" font-weight="700">必须回答的 ①</text><text x="296" y="182" font-size="11" fill="#6b7280" text-anchor="end">什么时候产生副本</text><text x="296" y="224" font-size="13" fill="#111827" text-anchor="end" font-weight="700">必须回答的 ②</text><text x="296" y="244" font-size="11" fill="#6b7280" text-anchor="end">拿回来时等不等</text><text x="296" y="286" font-size="13" fill="#111827" text-anchor="end" font-weight="700">必须回答的 ③</text><text x="296" y="306" font-size="11" fill="#6b7280" text-anchor="end">副本记在哪</text><text x="296" y="348" font-size="13" fill="#111827" text-anchor="end" font-weight="700">必须回答的 ④</text><text x="296" y="368" font-size="11" fill="#6b7280" text-anchor="end">存取的单位是什么</text><text x="296" y="410" font-size="13" fill="#111827" text-anchor="end" font-weight="700">必须回答的 ⑤</text><text x="296" y="430" font-size="11" fill="#6b7280" text-anchor="end">第三层落在哪</text><rect x="308" y="140" width="148" height="304" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="382" y="270" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">block 池</text><text x="382" y="296" font-size="11" fill="#6b7280" text-anchor="middle">五行一行都不沾</text><text x="382" y="316" font-size="11" fill="#9ca3af" text-anchor="middle">驱逐就是驱逐</text><rect x="464" y="140" width="228" height="118" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="578" y="162" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">搬运器 connector</text><text x="578" y="185" font-size="11" fill="#6b7280" text-anchor="middle">① 每个调度步末尾扫新算完的块</text><text x="578" y="234" font-size="11" fill="#6b7280" text-anchor="middle">② 逐块查,不等,能拿多少拿多少</text><rect x="464" y="264" width="228" height="118" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="578" y="286" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">CPU 侧管理器</text><text x="578" y="308" font-size="11" fill="#6b7280" text-anchor="middle">③ 登记映射:哪个块组在哪个槽</text><text x="578" y="356" font-size="11" fill="#6b7280" text-anchor="middle">④ 若干个 block 合成一个块组</text><rect x="464" y="388" width="228" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="578" y="408" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">本机文件系统</text><text x="578" y="428" font-size="11" fill="#6b7280" text-anchor="middle">⑤ CPU 层满了才换下去</text><rect x="704" y="140" width="148" height="180" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="778" y="162" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">前缀树本身</text><text x="778" y="185" font-size="11" fill="#6b7280" text-anchor="middle">① 插进树就拷一份</text><text x="778" y="234" font-size="11" fill="#6b7280" text-anchor="middle">② 三种停法,自己判</text><text x="778" y="296" font-size="11" fill="#6b7280" text-anchor="middle">③ 节点自己记地址</text><rect x="704" y="326" width="148" height="118" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="778" y="390" font-size="11" fill="#9ca3af" text-anchor="middle">后两行不归它</text><rect x="860" y="140" width="230" height="180" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="975" y="222" font-size="11" fill="#9ca3af" text-anchor="middle">这三行没有外挂</text><text x="975" y="244" font-size="11" fill="#9ca3af" text-anchor="middle">能换的只有最底下那一格</text><rect x="860" y="326" width="230" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="975" y="346" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">搬运控制器与后台线程</text><text x="975" y="366" font-size="11" fill="#6b7280" text-anchor="middle">④ 内存按 token 编号,L3 按页哈希</text><rect x="860" y="388" width="230" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="975" y="408" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">可换的 L3 后端</text><text x="975" y="428" font-size="11" fill="#6b7280" text-anchor="middle">⑤ 11 个内置,再加一个自定义口子</text><rect x="30" y="462" width="1060" height="66" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="486" font-size="11" fill="#6b7280" text-anchor="start">五行两边都得回答,差别在谁回答:vLLM 把五行全推给外挂,它的 block 池对多级缓存一无所知;SGLang 让树自己回答了前三行。</text><text x="50" y="508" font-size="11" fill="#6b7280" text-anchor="start">代价也对称:vLLM 换掉外挂就换掉整套;SGLang 能换的只有最底下那一格,前三行的行为焊死在树里。两边的参数名都在第五节。</text></svg>
