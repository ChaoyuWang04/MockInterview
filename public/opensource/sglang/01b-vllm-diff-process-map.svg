<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 652" width="1120" height="652" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="652" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一条流水线上的 5 件事,两边各用 3 个进程去切,切法不一样</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每一行是一件必须有人做的事,上下贯穿两边。一个方框就是一个进程,它纵向盖住几行,就是这个进程包办了这几件事。</text><text x="38" y="104" font-size="12" fill="#9ca3af" text-anchor="start">必须有人做的 5 件事</text><text x="532.0" y="104" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">vLLM</text><text x="928.0" y="104" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">SGLang</text><rect x="30" y="118" width="1060" height="76" rx="0" fill="#fafafa" stroke="#fafafa" stroke-width="1"/><text x="46" y="148" font-size="13" fill="#374151" text-anchor="start" font-weight="700">收 HTTP、套模板、切词</text><text x="46" y="168" font-size="11" fill="#9ca3af" text-anchor="start">请求进来的第一站</text><line x1="30" y1="118" x2="1090" y2="118" stroke="#e5e7eb" stroke-width="1"/><text x="46" y="224" font-size="13" fill="#374151" text-anchor="start" font-weight="700">把 token 变回文字</text><text x="46" y="244" font-size="11" fill="#9ca3af" text-anchor="start">每一步给所有在跑的请求各做一次</text><line x1="30" y1="194" x2="1090" y2="194" stroke="#e5e7eb" stroke-width="1"/><rect x="30" y="270" width="1060" height="76" rx="0" fill="#fafafa" stroke="#fafafa" stroke-width="1"/><text x="46" y="300" font-size="13" fill="#374151" text-anchor="start" font-weight="700">判断该不该停下来</text><text x="46" y="320" font-size="11" fill="#9ca3af" text-anchor="start">撞到停止词就结束这条请求</text><line x1="30" y1="270" x2="1090" y2="270" stroke="#e5e7eb" stroke-width="1"/><text x="46" y="376" font-size="13" fill="#374151" text-anchor="start" font-weight="700">谁进这一批、KV 怎么记账</text><text x="46" y="396" font-size="11" fill="#9ca3af" text-anchor="start">决定下一步算哪些请求</text><line x1="30" y1="346" x2="1090" y2="346" stroke="#e5e7eb" stroke-width="1"/><rect x="30" y="422" width="1060" height="76" rx="0" fill="#fafafa" stroke="#fafafa" stroke-width="1"/><text x="46" y="452" font-size="13" fill="#374151" text-anchor="start" font-weight="700">GPU 前向与采样</text><text x="46" y="472" font-size="11" fill="#9ca3af" text-anchor="start">真正吃显卡的那一步</text><line x1="30" y1="422" x2="1090" y2="422" stroke="#e5e7eb" stroke-width="1"/><line x1="30" y1="498" x2="1090" y2="498" stroke="#e5e7eb" stroke-width="1"/><rect x="348" y="126" width="368" height="212" rx="8" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="532.0" y="228.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">API 进程</text><text x="532.0" y="248.0" font-size="11" fill="#6b7280" text-anchor="middle">1 个 · 切词与反切词都在这里,停止串也在这里判</text><rect x="348" y="354" width="368" height="60" rx="8" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="532.0" y="380.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">EngineCore 进程</text><text x="532.0" y="400.0" font-size="11" fill="#6b7280" text-anchor="middle">1 个</text><rect x="348" y="430" width="368" height="60" rx="8" fill="#e0edf8" stroke="#6b9fd0" stroke-width="1"/><text x="532.0" y="456.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">GPU Worker 进程</text><text x="532.0" y="476.0" font-size="11" fill="#6b7280" text-anchor="middle">N = TP × PP</text><rect x="744" y="126" width="368" height="60" rx="8" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="928.0" y="152.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主进程</text><text x="928.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle">1 个;可起 N 个 · 就是 vLLM 那个 API 进程,换了个名字</text><rect x="744" y="202" width="368" height="60" rx="8" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="928.0" y="228.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Detokenizer 子进程</text><text x="928.0" y="248.0" font-size="11" fill="#6b7280" text-anchor="middle">1 个;可起 N 个 · vLLM 没有这个进程</text><rect x="744" y="278" width="368" height="212" rx="8" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="928.0" y="380.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Scheduler 子进程</text><text x="928.0" y="400.0" font-size="11" fill="#6b7280" text-anchor="middle">N = TP × PP · 调度与 GPU 前向在同一个进程里</text><rect x="30" y="202" width="4" height="60" rx="2" fill="#d98080"/><rect x="30" y="278" width="4" height="60" rx="2" fill="#d98080"/><rect x="30" y="430" width="4" height="60" rx="2" fill="#d98080"/><text x="1090" y="520" font-size="11" fill="#9ca3af" text-anchor="end">左边三条红杠 = 这一行两边不在同一个进程里,也就是这一章说的前 3 处差异</text><rect x="30" y="538" width="1060" height="86" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="562" font-size="13" fill="#374151" text-anchor="start" font-weight="700">搬动带来的三件事</text><text x="50" y="584" font-size="11" fill="#6b7280" text-anchor="start">反切词单独一个进程 → 主进程只剩 HTTP 与切词;代价是多一个进程、多一趟消息,还多一份分词器</text><text x="50" y="601" font-size="11" fill="#6b7280" text-anchor="start">停止串改在调度器判 → 判到直接结束,不再需要 vLLM 那条从对外进程反向发回去的中止消息;代价是调度器也得自带一份分词器</text><text x="50" y="618" font-size="11" fill="#6b7280" text-anchor="start">调度与 GPU 前向合进一个进程 → 少一跳跨进程调用;代价是 rank 0 每一步都要把这批广播给其他 rank</text></svg>