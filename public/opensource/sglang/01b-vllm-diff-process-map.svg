<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 748" width="1120" height="748" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="748" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一条请求的 5 件事,在 vLLM 和 SGLang 各落在哪个进程</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">颜色 = 这件事本身,位置 = 它在哪个进程里做。两行的三列是同一个位置,所以色块换了列,就是这一处差异。</text><rect x="30" y="96" width="1060" height="1" rx="0" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="120" font-size="16" fill="#111827" text-anchor="start" font-weight="700">vLLM</text><text x="1090" y="120" font-size="11" fill="#9ca3af" text-anchor="end">三个进程</text><rect x="30" y="134" width="330" height="193" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="195.0" y="154" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">API 进程</text><rect x="44" y="172" width="302" height="30" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="195.0" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">切词</text><rect x="44" y="211" width="302" height="30" rx="5" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="195.0" y="231" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">反切词</text><rect x="44" y="250" width="302" height="30" rx="5" fill="#fde8e8" stroke="#d98080" stroke-width="1"/><text x="195.0" y="270" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">停止串判定</text><rect x="44" y="289" width="302" height="30" rx="5" fill="#f1efe9" stroke="#b8ae95" stroke-width="1"/><text x="195.0" y="309" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">流式分发</text><text x="195.0" y="343" font-size="11" fill="#9ca3af" text-anchor="middle">1 个</text><rect x="395" y="134" width="330" height="76" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="560.0" y="154" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">EngineCore 进程</text><rect x="409" y="172" width="302" height="30" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">调度 + KV 记账</text><text x="560.0" y="226" font-size="11" fill="#9ca3af" text-anchor="middle">1 个</text><rect x="760" y="134" width="330" height="76" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="925.0" y="154" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">GPU Worker 进程</text><rect x="774" y="172" width="302" height="30" rx="5" fill="#e0edf8" stroke="#6b9fd0" stroke-width="1"/><text x="925.0" y="192" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">前向与采样</text><text x="925.0" y="226" font-size="11" fill="#9ca3af" text-anchor="middle">N = TP × PP</text><rect x="30" y="381" width="1060" height="1" rx="0" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="405" font-size="16" fill="#111827" text-anchor="start" font-weight="700">SGLang</text><text x="1090" y="405" font-size="11" fill="#9ca3af" text-anchor="end">同样三个进程,分工不一样</text><rect x="30" y="419" width="330" height="115" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="195.0" y="439" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">主进程</text><rect x="44" y="457" width="302" height="30" rx="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="195.0" y="477" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">切词</text><rect x="44" y="496" width="302" height="30" rx="5" fill="#f1efe9" stroke="#b8ae95" stroke-width="1"/><text x="195.0" y="516" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">流式分发</text><text x="195.0" y="550" font-size="11" fill="#9ca3af" text-anchor="middle">1 个;可起 N 个</text><rect x="395" y="419" width="330" height="154" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="560.0" y="439" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">Scheduler 子进程</text><rect x="409" y="457" width="302" height="30" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="477" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">调度</text><rect x="409" y="496" width="302" height="30" rx="5" fill="#e0edf8" stroke="#6b9fd0" stroke-width="1"/><text x="560.0" y="516" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">前向与采样</text><rect x="409" y="535" width="302" height="30" rx="5" fill="#fde8e8" stroke="#d98080" stroke-width="1"/><text x="560.0" y="555" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">停止串判定</text><text x="560.0" y="589" font-size="11" fill="#9ca3af" text-anchor="middle">N = TP × PP</text><rect x="760" y="419" width="330" height="76" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="925.0" y="439" font-size="13" fill="#374151" text-anchor="middle" font-weight="700">Detokenizer 子进程</text><rect x="774" y="457" width="302" height="30" rx="5" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="925.0" y="477" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">反切词</text><text x="925.0" y="511" font-size="11" fill="#9ca3af" text-anchor="middle">1 个;可起 N 个</text><rect x="30" y="609" width="1060" height="84" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="50" y="633" font-size="13" fill="#374151" text-anchor="start" font-weight="700">搬动带来的三件事</text><text x="50" y="655" font-size="11" fill="#6b7280" text-anchor="start">反切词搬出主进程 → 主进程只管 HTTP 与切词;代价是多一个进程、多一趟消息,而且它最多记 65536 个请求的状态</text><text x="50" y="672" font-size="11" fill="#6b7280" text-anchor="start">停止串搬进调度器 → 调度器自带一份分词器,判到直接结束,不再需要 vLLM 那条反向中止通路;代价是第 3 份分词器的内存</text><text x="50" y="689" font-size="11" fill="#6b7280" text-anchor="start">调度与前向合进一个进程 → 少一跳跨进程 RPC;代价是 rank 0 每一步都要用 gloo 把这批广播给其他 rank</text><text x="30" y="732" font-size="11" fill="#9ca3af" text-anchor="start">另外三处不改变分工:进程间默认 pickle 而不是 msgpack;调度器是单线程忙轮询,不像 EngineCore 有收、主、发 3 个线程;多开 HTTP 进程用 --tokenizer-worker-num,不是 --api-server-count。</text></svg>