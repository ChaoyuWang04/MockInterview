<rect x="0" y="0" width="1120" height="918" fill="#ffffff"/>
<text x="46" y="40" font-size="19" fill="#111827" font-weight="700" text-anchor="start">一层 MoE 的三种摆法:专家落在哪张卡,token 怎么过去</text>
<text x="46" y="66" font-size="13" fill="#6b7280" text-anchor="start">4 张卡、8 个逻辑专家。绿 = 本卡持有且这一步要算的槽,灰 = 不在本卡、编号置 -1 跳过的槽,红 = 被复制到多张卡的热门专家</text>
<text x="46" y="86" font-size="13" fill="#6b7280" text-anchor="start">紫 = 一批 token,黄 = 跨卡通信。格子数就是槽数,紫条长度就是这张卡这一步要过的 token 量</text>
<text x="46" y="126" font-size="14" fill="#111827" font-weight="700" text-anchor="start">① 默认路径:不点名后端,每张卡都跑全批 token,末尾 all-reduce</text>
