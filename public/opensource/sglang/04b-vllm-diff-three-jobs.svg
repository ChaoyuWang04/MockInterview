<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 616" width="1120" height="616" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1120" height="616" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两边都必须做的三件事,各占一行:方框的数量就是答案本身</text><text x="30" y="58" font-size="11" fill="#6b7280" text-anchor="start">绿 = 两边答的是同一件事,紫 = SGLang 多答出来的东西,灰 = 不读缓存的选项,红 = 读缓存但会自动失效的选项。</text><text x="30" y="76" font-size="11" fill="#9ca3af" text-anchor="start">两边的参数名都在第五节。</text><line x1="30" y1="98" x2="1090" y2="98" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="134" font-size="14" fill="#111827" text-anchor="start" font-weight="700">必须做的事 ①</text><text x="30" y="154" font-size="11" fill="#9ca3af" text-anchor="start">认出哪一段算过</text><text x="202" y="150" font-size="12" fill="#111827" text-anchor="end" font-weight="700">vLLM</text><text x="202" y="166" font-size="11" fill="#6b7280" text-anchor="end">查一次哈希表</text><rect x="212" y="130" width="250" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="337" y="149" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">算过 / 没算过</text><text x="337" y="166" font-size="11" fill="#6b7280" text-anchor="middle">一个布尔</text><text x="478" y="156" font-size="11" fill="#9ca3af" text-anchor="start">拿回 1 个答案</text><text x="202" y="212" font-size="12" fill="#111827" text-anchor="end" font-weight="700">SGLang</text><text x="202" y="228" font-size="11" fill="#6b7280" text-anchor="end">走一趟树</text><rect x="212" y="192" width="250" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="337" y="211" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">命中多长</text><text x="337" y="228" font-size="11" fill="#6b7280" text-anchor="middle">和哈希表答的是同一件事</text><rect x="474" y="192" width="250" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="599" y="211" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">停在哪个节点</text><text x="599" y="228" font-size="11" fill="#6b7280" text-anchor="middle">谁和谁共享到这里</text><rect x="736" y="192" width="250" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="861" y="211" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">底下还挂着谁</text><text x="861" y="228" font-size="11" fill="#6b7280" text-anchor="middle">辈分</text><text x="998" y="218" font-size="11" fill="#9ca3af" text-anchor="start">拿回 3 个</text><line x1="30" y1="262" x2="1090" y2="262" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="298" font-size="14" fill="#111827" text-anchor="start" font-weight="700">必须做的事 ②</text><text x="30" y="318" font-size="11" fill="#9ca3af" text-anchor="start">显存不够时挑谁丢</text><text x="212" y="288" font-size="10" fill="#9ca3af" text-anchor="start">队首,先丢</text><text x="992" y="288" font-size="10" fill="#9ca3af" text-anchor="end">队尾</text><text x="202" y="318" font-size="12" fill="#111827" text-anchor="end" font-weight="700">vLLM</text><text x="202" y="334" font-size="11" fill="#6b7280" text-anchor="end">一条 LRU 队列</text><rect x="212" y="298" width="120" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="272" y="322" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">某条会话的块</text><rect x="344" y="298" width="120" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="404" y="322" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">某条会话的块</text><rect x="476" y="298" width="120" height="38" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="536" y="322" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">系统提示词的块</text><rect x="608" y="298" width="120" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="668" y="322" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">某条会话的块</text><rect x="740" y="298" width="120" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="800" y="322" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">某条会话的块</text><rect x="872" y="298" width="120" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="932" y="322" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">某条会话的块</text><text x="212" y="358" font-size="11" fill="#d9877a" text-anchor="start">主干块只是队列里的一格,位置只看它多久没被碰过</text><text x="202" y="396" font-size="12" fill="#111827" text-anchor="end" font-weight="700">SGLang</text><text x="202" y="412" font-size="11" fill="#6b7280" text-anchor="end">只从叶子挑</text><rect x="212" y="378" width="200" height="38" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="312" y="402" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">系统提示词的段</text><polyline points="412,397 442,397 442,369 472,369" fill="none" stroke="#9ca3af" stroke-width="1.4"/><polyline points="412,397 442,397 442,425 472,425" fill="none" stroke="#9ca3af" stroke-width="1.4"/><rect x="472" y="350" width="200" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="572" y="374" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">某条会话的段</text><rect x="472" y="406" width="200" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="572" y="430" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">另一条会话的段</text><text x="692" y="374" font-size="11" fill="#d9877a" text-anchor="start">先丢这两片叶子</text><text x="692" y="430" font-size="11" fill="#d9877a" text-anchor="start">底下全空了才轮到主干</text><line x1="30" y1="462" x2="1090" y2="462" stroke="#e5e7eb" stroke-width="1"/><text x="30" y="498" font-size="14" fill="#111827" text-anchor="start" font-weight="700">必须做的事 ③</text><text x="30" y="518" font-size="11" fill="#9ca3af" text-anchor="start">等待队列里谁先进批</text><text x="202" y="502" font-size="12" fill="#111827" text-anchor="end" font-weight="700">vLLM</text><rect x="212" y="482" width="200" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="312" y="505" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">到达顺序</text><rect x="424" y="482" width="200" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="524" y="505" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">按优先级</text><text x="640" y="504" font-size="11" fill="#9ca3af" text-anchor="start">两种都不读缓存 —— 读树的策略 0 种</text><text x="202" y="562" font-size="12" fill="#111827" text-anchor="end" font-weight="700">SGLang</text><rect x="212" y="542" width="200" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="312" y="565" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">到达顺序(默认)</text><rect x="424" y="542" width="200" height="36" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="524" y="565" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">按命中长度排</text><rect x="636" y="542" width="200" height="36" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><text x="736" y="565" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">按等待比排</text><rect x="848" y="542" width="200" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="948" y="565" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">按子树权重排</text><text x="212" y="598" font-size="11" fill="#9ca3af" text-anchor="start">另有 3 种不读缓存的</text><text x="424" y="598" font-size="11" fill="#d9877a" text-anchor="start">这两种在等待队列长到一定程度时自动退回到达顺序</text><text x="1048" y="598" font-size="11" fill="#8f8bd8" text-anchor="end">这种不退</text></svg>