<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="610" fill="#ffffff"/><rect x="30" y="126" width="230" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="272" y="126" width="264" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="548" y="126" width="264" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="824" y="126" width="264" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="30" y="226" width="230" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="272" y="226" width="264" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="548" y="226" width="264" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="824" y="226" width="264" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="30" y="326" width="230" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="272" y="326" width="264" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="548" y="326" width="264" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="824" y="326" width="264" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="30" y="426" width="230" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="272" y="426" width="264" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="548" y="426" width="264" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="824" y="426" width="264" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同样是共卡,三家把话说在了不同的地方</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = 三家都得回答的那件事;绿 = verl;灰 = slime;黄 = ROLL。按「都得回答的那几件事」分行,不按各自的模块凑列</text><text x="404" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">verl</text><text x="680" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">slime</text><text x="956" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">ROLL</text><text x="30" y="106" font-size="13" fill="#111827" text-anchor="start" font-weight="700">都得回答的那件事</text><text x="145" y="175.0" font-size="12" fill="#111827" text-anchor="middle">共卡怎么说出口</text><text x="404" y="164.0" font-size="11" fill="#6b7280" text-anchor="middle">池名:角色登记到一个池上</text><text x="404" y="186.0" font-size="11" fill="#6b7280" text-anchor="middle">同名就是共卡,默认只有一个池</text><text x="680" y="164.0" font-size="11" fill="#6b7280" text-anchor="middle">一个布尔开关:卡排成一条</text><text x="680" y="186.0" font-size="11" fill="#6b7280" text-anchor="middle">开了共卡,生成侧偏移量就是 0</text><text x="956" y="164.0" font-size="11" fill="#6b7280" text-anchor="middle">卡号:每个角色写一串序号</text><text x="956" y="186.0" font-size="11" fill="#6b7280" text-anchor="middle">序号有交集就算共卡</text><text x="145" y="275.0" font-size="12" fill="#111827" text-anchor="middle">Critic 能单独放吗</text><text x="404" y="275.0" font-size="11" fill="#6b7280" text-anchor="middle">不能,配置里没有这个字段</text><text x="680" y="275.0" font-size="11" fill="#6b7280" text-anchor="middle">不能,永远跟着训练那一段</text><text x="956" y="275.0" font-size="11" fill="#6b7280" text-anchor="middle">能,给它自己的一串序号</text><text x="145" y="375.0" font-size="12" fill="#111827" text-anchor="middle">训练参数装卸时机</text><text x="404" y="364.0" font-size="11" fill="#6b7280" text-anchor="middle">Engine 上下文按配置执行</text><text x="404" y="386.0" font-size="11" fill="#6b7280" text-anchor="middle">藏在引擎上下场的上下文里</text><text x="680" y="364.0" font-size="11" fill="#6b7280" text-anchor="middle">控制器下令</text><text x="680" y="386.0" font-size="11" fill="#6b7280" text-anchor="middle">睡与醒都是它发的</text><text x="956" y="364.0" font-size="11" fill="#6b7280" text-anchor="middle">控制器下令</text><text x="956" y="386.0" font-size="11" fill="#6b7280" text-anchor="middle">还能点名只卸哪一类状态</text><text x="145" y="475.0" font-size="12" fill="#111827" text-anchor="middle">训练侧让出的方式</text><text x="404" y="475.0" font-size="11" fill="#6b7280" text-anchor="middle">张量拷回主机内存</text><text x="680" y="464.0" font-size="11" fill="#6b7280" text-anchor="middle">调用 Torch Memory Saver 暂停/恢复</text><text x="680" y="486.0" font-size="11" fill="#6b7280" text-anchor="middle">还能把训练进程整个杀掉重建</text><text x="956" y="475.0" font-size="11" fill="#6b7280" text-anchor="middle">张量拷回主机内存,用锁页内存</text><text x="30" y="540" font-size="11" fill="#9ca3af" text-anchor="start">此处的自动装卸只指训练 Engine;Rollout 的 sleep 与权重更新仍由控制器通过生命周期钩子安排。</text><text x="30" y="562" font-size="11" fill="#9ca3af" text-anchor="start">三家的差别不在能不能共卡,而在这句话说得有多细:一个布尔开关、一个池名、一串卡号</text><text x="30" y="584" font-size="11" fill="#9ca3af" text-anchor="start">两边的参数名都在第五节</text></svg>