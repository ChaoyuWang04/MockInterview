<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"><path d="M343 207 H394"/><path d="M724 207 H775"/></g>
<text x="341" y="190" font-size="11" fill="#6b7280">去 padding</text><text x="729" y="190" font-size="11" fill="#6b7280">再均衡</text>
<text x="32" y="361" font-size="13" fill="#6b7280">实际默认流程先在控制器均衡、再由引擎组 micro-batch 和 packed 输入;图将两种收益拆开说明。</text>
<text x="32" y="381" font-size="11" fill="#9ca3af">实际工作量估计还包含长度平方,所以长度总和接近不等于真实耗时完全相同。</text>
