<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="790" fill="white"/>
<text x="30" y="34" font-size="21" fill="#172033" text-anchor="start" font-weight="700">默认同步模式：角色怎样使用进程与 GPU</text>
<text x="30" y="63" font-size="14" fill="#475569" text-anchor="start">角色框不是进程数；Reference、Critic、模型 Reward 与 Teacher 均按配置启用。</text>
<rect x="35" y="100" width="170" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="120" y="130" font-size="16" fill="#172033" text-anchor="middle" font-weight="700">数据集</text>
<text x="120" y="154" font-size="14" fill="#172033" text-anchor="middle">提供 prompts</text>
<rect x="275" y="100" width="375" height="70" rx="8" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="462" y="129" font-size="16" fill="#172033" text-anchor="middle" font-weight="700">控制器进程 · TaskRunnerV1</text>
<text x="462" y="153" font-size="14" fill="#172033" text-anchor="middle">安排训练步骤，按需读取和处理数据</text>
<polyline points="205,135 273,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="735" y="100" width="350" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="910" y="130" font-size="16" fill="#172033" text-anchor="middle" font-weight="700">Agent Loop workers</text>
<text x="910" y="153" font-size="14" fill="#172033" text-anchor="middle">组织生成、工具调用与轨迹打分</text>
<polyline points="650,135 733,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="235" width="650" height="375" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="55" y="263" font-size="17" fill="#172033" text-anchor="start" font-weight="700">全局 GPU 池：训练与 Rollout 交替使用</text>
<rect x="55" y="286" width="285" height="240" rx="8" fill="#e3f4ec" stroke="#5fa886"/>
<text x="72" y="314" font-size="15" fill="#172033" text-anchor="start" font-weight="700">每个训练 rank 的共置 worker</text>
<rect x="73" y="333" width="249" height="49" rx="8" fill="#ffffff" stroke="#5fa886"/>
<text x="87" y="354" font-size="14" fill="#172033" text-anchor="start" font-weight="700">Actor</text>
<text x="87" y="373" font-size="13" fill="#172033" text-anchor="start">训练策略模型</text>
<rect x="73" y="392" width="249" height="49" rx="8" fill="#ffffff" stroke="#5fa886"/>
<text x="87" y="413" font-size="14" fill="#172033" text-anchor="start" font-weight="700">Reference · 按需</text>
<text x="87" y="432" font-size="13" fill="#172033" text-anchor="start">计算参考策略 logprob</text>
<rect x="73" y="451" width="249" height="49" rx="8" fill="#ffffff" stroke="#5fa886"/>
<text x="87" y="472" font-size="14" fill="#172033" text-anchor="start" font-weight="700">Critic · 按需</text>
<text x="87" y="491" font-size="13" fill="#172033" text-anchor="start">计算 value 并更新</text>
<rect x="405" y="286" width="258" height="145" rx="8" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="421" y="313" font-size="16" fill="#172033" text-anchor="start" font-weight="700">Rollout 服务 / 副本</text>
<text x="421" y="342" font-size="14" fill="#172033" text-anchor="start">使用同一批 GPU 生成</text>
<text x="421" y="368" font-size="14" fill="#172033" text-anchor="start">取样后睡眠，让出显存</text>
<text x="421" y="395" font-size="14" fill="#172033" text-anchor="start">权重更新后恢复生成</text>
<polyline points="340,370 403,370" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="354" font-size="13" fill="#172033" text-anchor="start">权重</text>
<rect x="405" y="455" width="258" height="71" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="421" y="481" font-size="14" fill="#172033" text-anchor="start" font-weight="700">共卡 Reward model · 按需</text>
<text x="421" y="506" font-size="13" fill="#172033" text-anchor="start">Rollout 睡眠后再打分</text>
<text x="55" y="557" font-size="14" fill="#172033" text-anchor="start">共置：多个角色可在同一 worker 进程中组织。</text>
<text x="55" y="585" font-size="14" fill="#172033" text-anchor="start">LoRA 还可复用底座参数；这不等于新增一种进程合并。</text>
<polyline points="462,170 462,206 198,206 198,284" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="910,170 910,204 534,204 534,284" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="735" y="235" width="350" height="170" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="754" y="265" font-size="16" fill="#172033" text-anchor="start" font-weight="700">独立 Reward GPU 池 · 按需</text>
<text x="754" y="297" font-size="14" fill="#172033" text-anchor="start">Reward Loop 调用独立模型打分</text>
<text x="754" y="327" font-size="14" fill="#172033" text-anchor="start">规则奖励不需要这份模型 GPU 池</text>
<text x="754" y="371" font-size="13" fill="#172033" text-anchor="start">独立打分可随轨迹处理执行</text>
<rect x="735" y="435" width="350" height="175" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="754" y="466" font-size="16" fill="#172033" text-anchor="start" font-weight="700">独立 Teacher GPU 池 · 按需</text>
<text x="754" y="503" font-size="14" fill="#172033" text-anchor="start">蒸馏路径提供 Teacher 输出</text>
<text x="754" y="538" font-size="14" fill="#172033" text-anchor="start">与 Reward 的资源池分别配置</text>
<text x="754" y="580" font-size="13" fill="#172033" text-anchor="start">两者均不等于额外的默认角色</text>
<polyline points="1057,170 1057,233" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="1085,135 1100,135 1100,520 1087,520" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="667" width="1050" height="88" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="55" y="696" font-size="17" fill="#172033" text-anchor="start" font-weight="700">TransferQueue：按键存放样本与阶段结果</text>
<text x="55" y="727" font-size="14" fill="#172033" text-anchor="start">控制器与 workers 按需读写；跨阶段主要传引用，不代表控制器完全不读取张量。</text>
<polyline points="275,155 235,155 235,190 20,190 20,630 95,630 95,665" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<polyline points="198,610 198,665" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<polyline points="700,135 700,710 687,710" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="754" y="646" font-size="13" fill="#172033" text-anchor="start">虚线框 = GPU 池；虚线箭头 = 数据存取</text>
</svg>