<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="790" fill="#ffffff"/><rect x="30" y="132" width="1060" height="122" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="300" y="156" width="240" height="74" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="560" y="156" width="240" height="74" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="820" y="156" width="240" height="74" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="30" y="270" width="1060" height="76" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="820" y="284" width="240" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="30" y="362" width="1060" height="76" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="820" y="376" width="240" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="30" y="454" width="1060" height="76" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="820" y="468" width="240" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="30" y="586" width="1060" height="128" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="300" y="604" width="440" height="92" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="760" y="604" width="300" height="92" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><polyline points="740,650 756,650" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">谁跟谁挤在同一批卡上:先看池子表,再看池里的一张卡</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = 全局池内的角色（按条件启用）;灰 = 默认不创建,要另外给它一组机器数与卡数才有;虚线框是一个资源池或一张卡</text><text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">下半张图里紫 = 训练角色与生成资源,黄 = 生成侧占的那一份</text><text x="30" y="116" font-size="13" fill="#111827" text-anchor="start" font-weight="700">① 启动时声明的池子表:每个角色登记到一个池名上,同名就是共卡</text><text x="52" y="160" font-size="14" fill="#111827" text-anchor="start" font-weight="700">全局池</text><text x="52" y="184" font-size="11" fill="#6b7280" text-anchor="start">形状 = 训练节点数 × 每节点卡数</text><text x="52" y="206" font-size="11" fill="#9ca3af" text-anchor="start">默认路径上只声明这一个池</text><text x="420" y="186" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Actor + Rollout 副本</text><text x="420" y="208" font-size="11" fill="#6b7280" text-anchor="middle">同一个角色对象</text><text x="680" y="186" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Critic</text><text x="680" y="208" font-size="11" fill="#6b7280" text-anchor="middle">默认由 GAE 决定</text><text x="940" y="186" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Reference</text><text x="940" y="208" font-size="11" fill="#6b7280" text-anchor="middle">需要参考策略时启用</text><text x="52" y="296" font-size="14" fill="#111827" text-anchor="start" font-weight="700">奖励模型池</text><text x="52" y="320" font-size="11" fill="#6b7280" text-anchor="start">默认不创建。开关关着时,它这两个字段会被就地改写成训练侧的值,奖励模型和训练挤在同一批卡上</text><text x="940" y="313" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">奖励模型</text><text x="52" y="388" font-size="14" fill="#111827" text-anchor="start" font-weight="700">教师模型池</text><text x="52" y="412" font-size="11" fill="#6b7280" text-anchor="start">默认不创建。开了蒸馏、并且把机器数与卡数都填上,才会多出这一个池</text><text x="940" y="405" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">教师模型</text><text x="52" y="480" font-size="14" fill="#111827" text-anchor="start" font-weight="700">独占生成池</text><text x="52" y="504" font-size="11" fill="#6b7280" text-anchor="start">压根不在池子表里。分卡异步档在作业跑起来之后自建,所以启动时那次卡数检查看不到它</text><text x="940" y="497" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Rollout 副本</text><text x="30" y="570" font-size="13" fill="#111827" text-anchor="start" font-weight="700">② 全局池里的一张卡上住着什么</text><text x="52" y="614" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一张 GPU</text><text x="52" y="638" font-size="11" fill="#6b7280" text-anchor="start">Ray 只按三分之一张卡</text><text x="52" y="658" font-size="11" fill="#6b7280" text-anchor="start">给每个进程记账,不看显存</text><text x="520" y="630" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">worker 进程(合成出来的一个类)</text><text x="520" y="652" font-size="11" fill="#6b7280" text-anchor="middle">Actor · 可选 Reference / Critic</text><text x="520" y="674" font-size="11" fill="#6b7280" text-anchor="middle">各角色按自己的配置管理状态</text><text x="910" y="630" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Rollout 副本</text><text x="910" y="652" font-size="11" fill="#6b7280" text-anchor="middle">权重 + KV 缓存</text><text x="910" y="674" font-size="11" fill="#6b7280" text-anchor="middle">每步睡一次、醒一次</text><text x="30" y="744" font-size="11" fill="#9ca3af" text-anchor="start">同一个池里的训练侧角色被合成成一个类,控制器手里的几个 worker 组对象,底下是同一批进程</text><text x="30" y="766" font-size="11" fill="#9ca3af" text-anchor="start">Reference 的 FSDP 前向路径采用 CPU offload;不可据此推及所有训练后端。</text></svg>