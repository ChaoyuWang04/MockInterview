<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="1120" height="660" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="32" y="35" font-size="19" font-weight="700" fill="#111827">先安排执行时机，再选择评分出口</text>
<text x="32" y="59" font-size="13" fill="#6b7280">绿：样本与结果　紫：奖励调度　黄：模型服务　红：代码执行　灰：规则处理</text>
<rect x="32" y="90" width="490" height="106" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="52" y="117" font-size="14" font-weight="700" fill="#111827">规则奖励 / 独立奖励模型</text>
<text x="52" y="143" font-size="11" fill="#6b7280">完整轨迹 → 立即提交评分 → 写入训练数据</text>
<text x="52" y="171" font-size="11" fill="#6b7280">可与其他轨迹生成重叠；独立内置 DisRM 的字段缺口见正文</text>
<rect x="594" y="90" width="494" height="106" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="614" y="117" font-size="14" font-weight="700" fill="#111827">共卡奖励模型 · 默认同步训练</text>
<text x="614" y="143" font-size="11" fill="#6b7280">取样结束 → Rollout 睡眠 → 奖励模型唤醒 → 批量评分</text>
<text x="614" y="171" font-size="11" fill="#6b7280">评分后奖励模型睡眠，再进入训练计算</text>
<path d="M277 196 V220 H841 V196" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<path d="M560 220 V244" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="355" y="244" width="410" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="375" y="272" font-size="14" font-weight="700" fill="#111827">Reward Worker：自定义函数优先</text>
<text x="375" y="297" font-size="11" fill="#6b7280">无自定义函数：未开模型走规则；开模型走 DisRM</text>
<path d="M445 320 V343 H170 V372" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M560 320 V372" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M675 320 V343 H950 V372" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="372" width="280" height="94" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="52" y="400" font-size="14" font-weight="700" fill="#111827">规则函数</text>
<text x="52" y="426" font-size="11" fill="#6b7280">按数据来源选择判题逻辑</text>
<text x="52" y="449" font-size="11" fill="#6b7280">回答文本 + 标准答案 + 附加信息</text>
<rect x="420" y="372" width="280" height="94" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="440" y="400" font-size="14" font-weight="700" fill="#111827">模型路由器 → 奖励模型副本</text>
<text x="440" y="426" font-size="11" fill="#6b7280">内置 DisRM：模板化输入 → 取分数</text>
<text x="440" y="449" font-size="11" fill="#6b7280">GenRM：自定义函数调用并解析文本</text>
<rect x="808" y="372" width="280" height="94" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="828" y="400" font-size="14" font-weight="700" fill="#111827">代码规则 → Sandbox Fusion</text>
<text x="828" y="426" font-size="11" fill="#6b7280">抽取代码 → 并发提交测试用例</text>
<text x="828" y="449" font-size="11" fill="#6b7280">独立 HTTP 出口，不经过模型路由器</text>
<path d="M170 466 V514 H950 V466" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<path d="M560 466 V551" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="355" y="551" width="410" height="77" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="375" y="579" font-size="14" font-weight="700" fill="#111827">统一奖励结果 → 训练</text>
<text x="375" y="605" font-size="11" fill="#6b7280">默认标量落在回答最后有效 token；诊断字段另传</text>
</g></svg>
