<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="620" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一个 Rollout 副本对外登记一个入口</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">灰 = 不持有模型的角色;黄 = 持有引擎、对外露地址的服务;绿 = 只参与计算的无头服务;虚线框 = 一个副本</text><rect x="40" y="90" width="1040" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="560.0" y="116" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">路由进程</text><text x="560.0" y="137" font-size="11" fill="#6b7280" text-anchor="middle">管着所有服务的池子:同一条轨迹尽量回原处(前缀缓存才命中),没有历史的挑在途最少的那台</text><text x="1080" y="172" font-size="11" fill="#9ca3af" text-anchor="end">打开逐位可复现后这套规则整个换掉,改成按请求编号哈希</text><rect x="40" y="200" width="500" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="56" y="222" font-size="13" fill="#6b7280" text-anchor="start">Rollout 副本 0</text><rect x="60" y="248" width="215" height="110" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="167.5" y="274" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">节点 0 的服务</text><text x="167.5" y="295" font-size="11" fill="#6b7280" text-anchor="middle">持有引擎对象</text><text x="167.5" y="312" font-size="11" fill="#6b7280" text-anchor="middle">对外露出地址</text><text x="167.5" y="329" font-size="11" fill="#6b7280" text-anchor="middle">睡醒、换权重、中断只认它</text><rect x="305" y="248" width="215" height="110" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="412.5" y="274" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">节点 1…n 的服务</text><text x="412.5" y="295" font-size="11" fill="#6b7280" text-anchor="middle">无头进程</text><text x="412.5" y="312" font-size="11" fill="#6b7280" text-anchor="middle">只参与计算</text><text x="412.5" y="329" font-size="11" fill="#6b7280" text-anchor="middle">不接请求</text><text x="60" y="385" font-size="11" fill="#9ca3af" text-anchor="start">默认融合路径:训练池卡数 ÷ 每副本卡数</text><rect x="60" y="400" width="460" height="80" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="290.0" y="426" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">这个副本占几张卡</text><text x="290.0" y="447" font-size="11" fill="#6b7280" text-anchor="middle">张量并行 × 数据并行 × 流水线并行,再除以每节点卡数得出跨几个节点</text><rect x="580" y="200" width="500" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="596" y="222" font-size="13" fill="#6b7280" text-anchor="start">Rollout 副本 1</text><rect x="600" y="248" width="215" height="110" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="707.5" y="274" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">节点 0 的服务</text><text x="707.5" y="295" font-size="11" fill="#6b7280" text-anchor="middle">持有引擎对象</text><text x="707.5" y="312" font-size="11" fill="#6b7280" text-anchor="middle">对外露出地址</text><text x="707.5" y="329" font-size="11" fill="#6b7280" text-anchor="middle">睡醒、换权重、中断只认它</text><rect x="845" y="248" width="215" height="110" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="952.5" y="274" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">节点 1…n 的服务</text><text x="952.5" y="295" font-size="11" fill="#6b7280" text-anchor="middle">无头进程</text><text x="952.5" y="312" font-size="11" fill="#6b7280" text-anchor="middle">只参与计算</text><text x="952.5" y="329" font-size="11" fill="#6b7280" text-anchor="middle">不接请求</text><text x="600" y="385" font-size="11" fill="#9ca3af" text-anchor="start">独立生成路径:使用生成池自身的卡数</text><rect x="600" y="400" width="460" height="80" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="830.0" y="426" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">这个副本占几张卡</text><text x="830.0" y="447" font-size="11" fill="#6b7280" text-anchor="middle">张量并行 × 数据并行 × 流水线并行,再除以每节点卡数得出跨几个节点</text><polyline points="290,154 290,224" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="830,154 830,224" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><text x="40" y="545" font-size="12" fill="#6b7280" text-anchor="start">PD 分离时副本内部再拆成预填充与解码两组服务,但登记进路由池的仍然只有预填充那一个地址,解码侧藏在它后面按轮转领活</text><text x="40" y="575" font-size="11" fill="#9ca3af" text-anchor="start">代价:睡醒、中断、清缓存全部只有节点 0 响应;这个点一卡整个副本不动,而且从外面看不出卡在哪个节点</text></svg>