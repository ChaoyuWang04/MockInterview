<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="484" viewBox="0 0 1120 484">
<rect width="1120" height="484" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="32" y="34" font-size="19" font-weight="700" fill="#111827">同一段墙钟时间,有不同的观察边界</text>
<text x="32" y="60" font-size="13" fill="#6b7280">灰:控制器等待/调度　紫:训练进程计算　绿:生成进程计算　黄:交接　示意不按比例,不是实测</text>
<path d="M210 90H1065" stroke="#9ca3af" stroke-width="1.4"/><path d="m1057 86 8 4-8 4" fill="none" stroke="#9ca3af"/>
<text x="32" y="94" font-size="14" font-weight="700" fill="#111827">时间向右 →</text>
<rect x="200" y="112" width="865" height="112" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="32" y="154" font-size="14" font-weight="700" fill="#111827">控制器阶段计时</text>
<text x="32" y="177" font-size="11" fill="#6b7280">等待调用完成的区间</text>
<text x="215" y="136" font-size="11" fill="#6b7280">step 包住内层阶段;评测在此窗口之外</text>
<rect x="215" y="150" width="235" height="53" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="460" y="150" width="325" height="53" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="795" y="150" width="252" height="53" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="230" y="172" font-size="14" font-weight="700" fill="#111827">gen:取样及前后钩子</text>
<text x="230" y="190" font-size="11" fill="#6b7280">同步模式还包含 Rollout 睡眠</text>
<text x="475" y="172" font-size="14" font-weight="700" fill="#111827">模型调用、优势与更新</text>
<text x="475" y="190" font-size="11" fill="#6b7280">按调用区间计时,不是独占 GPU 时间</text>
<text x="810" y="172" font-size="14" font-weight="700" fill="#111827">存档(按需)、步末交接</text>
<text x="810" y="190" font-size="11" fill="#6b7280">权重同步属于交接的一部分</text>
<text x="32" y="272" font-size="14" font-weight="700" fill="#111827">共置训练 worker</text>
<text x="32" y="295" font-size="11" fill="#6b7280">同一进程的一份 trace</text>
<rect x="460" y="246" width="94" height="65" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="564" y="246" width="94" height="65" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="668" y="246" width="117" height="65" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="471" y="270" font-size="14" font-weight="700" fill="#111827">Actor</text><text x="471" y="291" font-size="11" fill="#6b7280">old logprob</text>
<text x="574" y="270" font-size="14" font-weight="700" fill="#111827">Reference</text><text x="574" y="291" font-size="11" fill="#6b7280">按需前向</text>
<text x="680" y="270" font-size="14" font-weight="700" fill="#111827">Actor 更新</text><text x="680" y="291" font-size="11" fill="#6b7280">前向/反向/通信</text>
<path d="M460 208V241M785 208V241" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="32" y="359" font-size="14" font-weight="700" fill="#111827">Rollout 引擎</text><text x="32" y="382" font-size="11" fill="#6b7280">另一进程,另写 trace</text>
<rect x="215" y="337" width="235" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="230" y="362" font-size="14" font-weight="700" fill="#111827">生成:prefill / decode</text><text x="230" y="382" font-size="11" fill="#6b7280">不能从 Actor 文件里寻找</text>
<rect x="460" y="337" width="325" height="58" rx="6" fill="#ffffff" stroke="#5fa886" stroke-dasharray="5 4"/>
<text x="475" y="362" font-size="14" font-weight="700" fill="#111827">分卡异步时,生成可继续</text><text x="475" y="382" font-size="11" fill="#6b7280">虚线为异步重叠的可能区间,不是额外串行开销</text>
<text x="215" y="432" font-size="13" fill="#111827">读法:阶段异常 → 定位进程 → 对齐 trace 时间戳 → 看计算、通信或等待</text>
<text x="215" y="456" font-size="11" fill="#6b7280">角色不是独立进程;这三行是同一作业的不同视角,时长不能相加。</text>
</g></svg>
