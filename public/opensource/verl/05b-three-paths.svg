<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="660" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一条权重通路,三家在哪几件事上分了岔</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">每一行是双方都必须做的同一件事,同一行才可比。绿 = 由与训练后端无关的那一层来做;黄 = 由贴着某个训练后端的代码来做;灰 = 这一路上没有这件事</text><rect x="248" y="86" width="274" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="385.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">verl</text><rect x="530" y="86" width="274" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="667.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">slime</text><rect x="812" y="86" width="274" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="949.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">ROLL</text><rect x="40" y="126" width="200" height="88" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="140.0" y="166.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">谁把参数折成</text><text x="140.0" y="184.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">双方都认的形状</text><rect x="248" y="126" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="385.0" y="158.0" font-size="11" fill="#111827" text-anchor="middle">抽成一份与训练后端无关的逐张量声明:本地块落在</text><text x="385.0" y="174.0" font-size="11" fill="#111827" text-anchor="middle">整张量的哪儿、哪一组 rank 合起来才完整、这次</text><text x="385.0" y="190.0" font-size="11" fill="#111827" text-anchor="middle">要不要出声</text><rect x="530" y="126" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="667.0" y="166.0" font-size="11" fill="#111827" text-anchor="middle">唯一那个训练后端目录里的更新器自己做,顺手就把</text><text x="667.0" y="182.0" font-size="11" fill="#111827" text-anchor="middle">东西发出去了</text><rect x="812" y="126" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="949.0" y="166.0" font-size="11" fill="#111827" text-anchor="middle">每个训练后端在自己目录下各有一份更新器,各自把</text><text x="949.0" y="182.0" font-size="11" fill="#111827" text-anchor="middle">参数拼成整张量</text><rect x="40" y="220" width="200" height="88" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="140.0" y="260.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">折好的东西</text><text x="140.0" y="278.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">靠什么过去</text><rect x="248" y="220" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="385.0" y="260.0" font-size="11" fill="#111827" text-anchor="middle">六个可选的传输后端:进程内直给、集合通信广播、</text><text x="385.0" y="276.0" font-size="11" fill="#111827" text-anchor="middle">两种点对点,外加一种先绕一趟主机内存再点对点</text><rect x="530" y="220" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="667.0" y="260.0" font-size="11" fill="#111827" text-anchor="middle">两种:集合通信广播,或写成一份完整检查点走共享</text><text x="667.0" y="276.0" font-size="11" fill="#111827" text-anchor="middle">文件系统</text><rect x="812" y="220" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="949.0" y="260.0" font-size="11" fill="#111827" text-anchor="middle">一种:共卡时进程内直给,分卡时临时建一个广播</text><text x="949.0" y="276.0" font-size="11" fill="#111827" text-anchor="middle">组。由摆法决定,不是选项</text><rect x="40" y="314" width="200" height="88" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="140.0" y="354.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">生成侧怎么</text><text x="140.0" y="372.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">装进自己的切法</text><rect x="248" y="314" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="385.0" y="354.0" font-size="11" fill="#111827" text-anchor="middle">全量走原生加载器;增量走后端的加载或 patch</text><text x="385.0" y="370.0" font-size="11" fill="#111827" text-anchor="middle">接口,按生成侧布局写入</text><rect x="530" y="314" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="667.0" y="354.0" font-size="11" fill="#111827" text-anchor="middle">一样:交完整张量;走盘那条路改成让引擎重读一遍</text><text x="667.0" y="370.0" font-size="11" fill="#111827" text-anchor="middle">本地检查点</text><rect x="812" y="314" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="949.0" y="362.0" font-size="11" fill="#111827" text-anchor="middle">一样:交完整张量,引擎自己切</text><rect x="40" y="408" width="200" height="88" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="140.0" y="448.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">只传变了的部分</text><text x="140.0" y="466.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">走哪条线</text><rect x="248" y="408" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="385.0" y="448.0" font-size="11" fill="#111827" text-anchor="middle">有。比每个 rank 自己那一块,稀疏汇拢后走同一条</text><text x="385.0" y="464.0" font-size="11" fill="#111827" text-anchor="middle">集合通信线,落地是就地覆盖;只能在不共卡时用</text><rect x="530" y="408" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="667.0" y="448.0" font-size="11" fill="#111827" text-anchor="middle">有。比拼好的整张量,写成补丁目录走共享文件系</text><text x="667.0" y="464.0" font-size="11" fill="#111827" text-anchor="middle">统,各机重载检查点;明文禁止与共卡同用</text><rect x="812" y="408" width="274" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="949.0" y="456.0" font-size="11" fill="#111827" text-anchor="middle">没有这条路,每次同步都是整模型</text><rect x="40" y="502" width="200" height="88" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="140.0" y="542.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">传输这一层</text><text x="140.0" y="560.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">认不认识训练后端</text><rect x="248" y="502" width="274" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="385.0" y="550.0" font-size="11" fill="#111827" text-anchor="middle">不认识。它只看得到字节和那份声明</text><rect x="530" y="502" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="667.0" y="550.0" font-size="11" fill="#111827" text-anchor="middle">就是同一份代码,它本来也只贴一个后端</text><rect x="812" y="502" width="274" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="949.0" y="550.0" font-size="11" fill="#111827" text-anchor="middle">认识。更新器按训练后端分文件</text><text x="40" y="620" font-size="12" fill="#6b7280" text-anchor="start">并列摆放本身就是一句断言:这里的五行是三家都绕不开的同一批动作,不是把各自的模块名硬凑成列。</text><text x="40" y="642" font-size="11" fill="#9ca3af" text-anchor="start">verl 这一侧对应的参数名都在第五节;另两家的开关名不在本站解读范围内。</text></svg>