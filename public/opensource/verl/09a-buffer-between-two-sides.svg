<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" width="1120" height="690" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="690" fill="#ffffff"/><rect x="30" y="130" width="290" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="360" y="130" width="360" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="760" y="130" width="320" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><rect x="46" y="196" width="258" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="46" y="244" width="258" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="46" y="292" width="258" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="392" y="206" width="56" height="18" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="392" y="228" width="56" height="18" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><rect x="472" y="206" width="56" height="18" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="472" y="228" width="56" height="18" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="472" y="250" width="56" height="18" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="472" y="272" width="56" height="18" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="472" y="294" width="56" height="18" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><rect x="552" y="206" width="56" height="18" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="552" y="228" width="56" height="18" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="552" y="250" width="56" height="18" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="552" y="272" width="56" height="18" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><rect x="632" y="206" width="56" height="18" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/><rect x="776" y="196" width="288" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="776" y="244" width="288" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="776" y="292" width="288" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="776" y="340" width="288" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><rect x="360" y="500" width="360" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><line x1="322" y1="300" x2="356" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><line x1="722" y1="300" x2="756" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><line x1="450" y1="472" x2="450" y2="498" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><line x1="630" y1="498" x2="630" y2="472" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="920,472 920,562 175,562 175,472" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">生成不停时,两侧靠中间这个缓冲解耦</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">灰 = 待发的题;黄 = 还在跑;绿 = 跑完可取样;红 = 生成失败或已被淘汰;紫 = 卡上真正在干活的那一格</text><text x="30" y="78" font-size="13" fill="#6b7280" text-anchor="start">小方块代表题组,每组可含多条回答;数量为示意。两侧通过样本交接和权重同步协作</text><text x="175" y="152" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成器</text><text x="175" y="172" font-size="11" fill="#6b7280" text-anchor="middle">独占的那组卡,整个训练期间不睡</text><text x="175" y="220" font-size="12" fill="#111827" text-anchor="middle">Rollout 副本</text><text x="175" y="268" font-size="12" fill="#111827" text-anchor="middle">Rollout 副本</text><text x="175" y="316" font-size="12" fill="#111827" text-anchor="middle">Rollout 副本</text><text x="175" y="356" font-size="11" fill="#111827" text-anchor="middle">轨迹陆续写入数据面</text><text x="175" y="380" font-size="11" fill="#9ca3af" text-anchor="middle">同题所有回答落定后完成</text><text x="175" y="404" font-size="11" fill="#9ca3af" text-anchor="middle">被打断的半条下一版接着跑</text><text x="540" y="152" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">缓冲</text><text x="540" y="172" font-size="11" fill="#6b7280" text-anchor="middle">只持有键与状态标签,轨迹本体在数据面里(02 章)</text><text x="420" y="196" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">待发</text><text x="500" y="196" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">在跑</text><text x="580" y="196" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">完成</text><text x="660" y="196" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">失败</text><text x="540" y="340" font-size="11" fill="#6b7280" text-anchor="middle">每一轮:同步标签 → 挑淘汰 → 补题 → 够了交货</text><text x="378" y="364" font-size="11" fill="#111827" text-anchor="start">太旧:提交年龄超阈值（丢弃策略）</text><text x="378" y="386" font-size="11" fill="#111827" text-anchor="start">组内无信号:一组回答得分全同</text><text x="378" y="408" font-size="11" fill="#111827" text-anchor="start">生成失败:题组的终态为失败</text><text x="378" y="432" font-size="11" fill="#9ca3af" text-anchor="start">三条取并集,同一组只淘汰一次</text><text x="920" y="152" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">训练器</text><text x="920" y="172" font-size="11" fill="#6b7280" text-anchor="middle">训练卡上的那组 worker</text><text x="788" y="222" font-size="12" fill="#111827" text-anchor="start" font-weight="700">第 1 个训练子循环</text><text x="788" y="270" font-size="12" fill="#111827" text-anchor="start" font-weight="700">第 2 个训练子循环</text><text x="788" y="318" font-size="12" fill="#111827" text-anchor="start" font-weight="700">第 3 个训练子循环</text><text x="788" y="366" font-size="12" fill="#111827" text-anchor="start" font-weight="700">第 4 个训练子循环</text><text x="1052" y="222" font-size="11" fill="#6b7280" text-anchor="end">取走 1/4 个训练批</text><text x="1052" y="270" font-size="11" fill="#6b7280" text-anchor="end">取走 1/4 个训练批</text><text x="1052" y="318" font-size="11" fill="#6b7280" text-anchor="end">取走 1/4 个训练批</text><text x="1052" y="366" font-size="11" fill="#6b7280" text-anchor="end">取走 1/4 个训练批</text><text x="920" y="410" font-size="11" fill="#111827" text-anchor="middle">四次跑完才同步一次权重</text><text x="920" y="432" font-size="11" fill="#9ca3af" text-anchor="middle">同一周期共用同一份旧策略概率</text><text x="339" y="322" font-size="11" fill="#111827" text-anchor="middle">入队</text><text x="739" y="322" font-size="11" fill="#111827" text-anchor="middle">取走</text><text x="458" y="490" font-size="11" fill="#111827" text-anchor="start">淘汰整组</text><text x="638" y="490" font-size="11" fill="#111827" text-anchor="start">补上同样多</text><text x="540" y="524" font-size="12" fill="#111827" text-anchor="middle">数据集:淘汰几道题就精确取几道新题</text><text x="560" y="582" font-size="11" fill="#111827" text-anchor="middle">每个同步周期末回推权重;子循环内部还可包含多次优化器更新(05 章)</text><text x="30" y="616" font-size="11" fill="#9ca3af" text-anchor="start">生成侧从不睡下,所以共卡的奖励模型在这一档下被直接拒掉——它找不到停下来腾显存的时机</text><text x="30" y="638" font-size="11" fill="#9ca3af" text-anchor="start">上面画的是分卡异步档;完全异步那一档把缓冲换成一条真正的消息队列,生成器按条入队、训练器按条出队</text><text x="30" y="660" font-size="11" fill="#9ca3af" text-anchor="start">训练子循环默认 4 次;训练批 = 子批 × 子循环次数,并非固定只执行 4 次优化器更新</text></svg>