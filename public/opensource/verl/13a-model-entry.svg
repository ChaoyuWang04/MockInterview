<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9ca3af"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="32" y="35" font-size="19" font-weight="700" fill="#111827">同一份模型资料，不同的训练模型实现</text>
<text x="32" y="60" font-size="13" fill="#6b7280">灰：模型资料　绿：Transformers 路径　紫：Megatron 路径　黄：verl 输入输出适配</text>
<rect x="32" y="91" width="240" height="240" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="52" y="123" font-size="14" font-weight="700" fill="#111827">Hugging Face 模型资料</text>
<text x="52" y="156" font-size="13" fill="#6b7280">配置 · tokenizer · processor</text>
<text x="52" y="181" font-size="13" fill="#6b7280">checkpoint 权重</text>
<text x="52" y="231" font-size="11" fill="#6b7280">公共配置解析与路径准备</text>
<text x="52" y="254" font-size="11" fill="#6b7280">不等于已经构造训练模型</text>
<path d="M272 153H320" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M272 278H320" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="328" y="91" width="286" height="111" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="346" y="119" font-size="14" font-weight="700" fill="#111827">FSDP / FSDP2 直接加载</text>
<text x="346" y="148" font-size="11" fill="#6b7280">选择 HF AutoModel 类并加载权重</text>
<text x="346" y="175" font-size="11" fill="#6b7280">保留 Transformers 模型实现</text>
<rect x="328" y="227" width="286" height="153" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="346" y="255" font-size="14" font-weight="700" fill="#111827">Megatron-Bridge 默认入口</text>
<text x="346" y="284" font-size="11" fill="#6b7280">读取模型 → 生成 provider → 构造模型</text>
<text x="346" y="311" font-size="11" fill="#6b7280">补充并行与执行配置，再加载权重</text>
<text x="346" y="354" font-size="11" fill="#6b7280">兼容分支：旧 mbridge；内置旧表已弃用</text>
<path d="M614 153H660" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M614 300H660" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="668" y="91" width="420" height="111" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="686" y="119" font-size="14" font-weight="700" fill="#111827">按需补丁：使 HF 行为符合 verl</text>
<text x="686" y="148" font-size="11" fill="#6b7280">多模态处理 · 去 padding / Ulysses · fused 输出</text>
<text x="686" y="175" font-size="11" fill="#6b7280">能加载的模型仍须核对所选补丁组合</text>
<rect x="668" y="227" width="420" height="153" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="686" y="255" font-size="14" font-weight="700" fill="#111827">forward 适配：使输入符合 Megatron</text>
<text x="686" y="284" font-size="11" fill="#6b7280">准备 token 布局、packed 信息与多模态输入</text>
<text x="686" y="311" font-size="11" fill="#6b7280">调用 Megatron 模型并处理输出</text>
<text x="686" y="354" font-size="11" fill="#6b7280">Bridge 能构造模型，不代替这一层兼容性</text>
<path d="M152 331V444" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="453" width="1056" height="75" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="52" y="480" font-size="14" font-weight="700" fill="#111827">独立边界：Rollout 引擎也要认识架构和 checkpoint 布局</text>
<text x="52" y="505" font-size="11" fill="#6b7280">训练模型构造成功，不等于在线权重更新成功；权重如何交接见 05 章，训推差异见 12 章。</text>
<text x="300" y="421" font-size="11" fill="#9ca3af">两条路限定模型接入方式，不代表 verl 只有两种训练后端。</text>
</g></svg>
