<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
<rect width="1120" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="32" y="36" font-size="19" font-weight="700" fill="#111827">同一批 token，两种概率比值，不能混成一条</text>
<text x="32" y="62" font-size="13" fill="#6b7280">绿：采样端　紫：训练端　黄：固定修正结果　灰：数据与最终损失；描述默认 V1 的非 bypass 路径</text>
<rect x="32" y="90" width="1056" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="52" y="113" font-size="14" font-weight="700" fill="#111827">同一组 prompt + 已生成 token + 有效位置</text><text x="52" y="132" font-size="11" fill="#6b7280">比较已发生的 token 概率，不要求两侧重新采样出相同回答</text>
<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"><path d="M 195 142 V 177"/><path d="M 557 142 V 177"/><path d="M 919 142 V 177"/></g>
<rect x="32" y="180" width="326" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="394" y="180" width="326" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="756" y="180" width="332" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="52" y="206" font-size="14" font-weight="700" fill="#111827">Rollout：采样概率</text><text x="52" y="229" font-size="11" fill="#6b7280">随生成结果返回，来自实际生成侧</text><text x="52" y="246" font-size="11" fill="#6b7280">本批更新期间固定</text>
<text x="414" y="206" font-size="14" font-weight="700" fill="#111827">更新前 Actor：锚点概率</text><text x="414" y="229" font-size="11" fill="#6b7280">重算一次，作为策略更新的比较基准</text><text x="414" y="246" font-size="11" fill="#6b7280">本批更新期间固定</text>
<text x="776" y="206" font-size="14" font-weight="700" fill="#111827">更新中 Actor：当前概率</text><text x="776" y="229" font-size="11" fill="#6b7280">随参数更新重新计算</text><text x="776" y="246" font-size="11" fill="#6b7280">与锚点的差异用于策略损失</text>
<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"><path d="M 195 256 V 283 H 300 V 312"/><path d="M 500 256 V 283 H 420 V 312"/><path d="M 615 256 V 283 H 800 V 312"/><path d="M 919 256 V 283 H 950 V 312"/></g>
<rect x="150" y="315" width="430" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="690" y="315" width="398" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="170" y="341" font-size="14" font-weight="700" fill="#111827">锚点 ÷ 采样 → IS 权重 / RS mask</text><text x="170" y="365" font-size="11" fill="#6b7280">控制器算一次；截断权重或排除越界部分</text><text x="170" y="382" font-size="11" fill="#6b7280">处理训推与离策偏差，不改写生成历史</text>
<text x="710" y="341" font-size="14" font-weight="700" fill="#111827">当前 ÷ 锚点 → 策略比值</text><text x="710" y="365" font-size="11" fill="#6b7280">worker 随当前前向计算</text><text x="710" y="382" font-size="11" fill="#6b7280">约束更新幅度，与左侧修正分工不同</text>
<g fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"><path d="M 365 391 V 424 H 480 V 445"/><path d="M 889 391 V 424 H 700 V 445"/></g>
<rect x="370" y="448" width="440" height="46" rx="6" fill="#eeeeee" stroke="#b9b9b9"/><text x="393" y="476" font-size="14" font-weight="700" fill="#111827">默认损失：策略损失 × IS 权重，再按 mask 聚合</text>
</g></svg>
