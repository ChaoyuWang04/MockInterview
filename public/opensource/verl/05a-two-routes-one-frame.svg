d="url(#ar)"/><text x="765.0" y="450" font-size="11" fill="#6b7280" text-anchor="middle">SGLang 加载器</text><text x="765.0" y="466" font-size="11" fill="#6b7280" text-anchor="middle">跳过没值的格</text><text x="40" y="632" font-size="12" fill="#6b7280" text-anchor="start">上路传整张量,下路传坐标与取值。下路以 SGLang 空洞加载为例;vLLM 使用原生 checkpoint patch 接口。</text><text x="40" y="652" font-size="11" fill="#9ca3af" text-anchor="start">下路的红格子是对得上的:左边四块合起来正好是中间那 9 格,竖虚线左边的 5 格归生成 rank 0、右边的 4 格归 rank 1。</text><text x="40" y="672" font-size="11" fill="#9ca3af" text-anchor="start">块数与格子数按示意画,实际有几块由两侧各自的并行度决定;下路的第一次同步不走红格子,是把整张推一遍并顺手钉下以后比对用的副本。</text></svg>