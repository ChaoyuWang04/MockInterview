<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="660" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">控制器上的一行调用,底下是切、发、等、拼</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = 控制器;绿 = 返回有效引用的 worker;灰 = 交回空壳的 worker;黄 = 数据本体的去处。实线 = 调用与返回,虚线 = 按键存取</text><rect x="40" y="150" width="210" height="150" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="145.0" y="180" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">控制器进程</text><text x="145.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle">一行调用:</text><text x="145.0" y="218" font-size="11" fill="#6b7280" text-anchor="middle">「把这批算一遍」</text><text x="145.0" y="235" font-size="11" fill="#6b7280" text-anchor="middle">本次分发主要传引用</text><rect x="290" y="100" width="300" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="306" y="122" font-size="13" fill="#6b7280" text-anchor="start">worker 组代理</text><rect x="308" y="140" width="264" height="85" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="440.0" y="168" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">① 切</text><text x="440.0" y="189" font-size="11" fill="#6b7280" text-anchor="middle">按问来的那张表分成 2 份</text><rect x="308" y="245" width="264" height="85" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="440.0" y="273" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">② 发</text><text x="440.0" y="294" font-size="11" fill="#6b7280" text-anchor="middle">向 8 个 worker 各发一次</text><rect x="308" y="350" width="264" height="85" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="440.0" y="378" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">③ 等</text><text x="440.0" y="399" font-size="11" fill="#6b7280" text-anchor="middle">阻塞到全部返回</text><rect x="308" y="455" width="264" height="85" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="440.0" y="483" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">④ 拼</text><text x="440.0" y="504" font-size="11" fill="#6b7280" text-anchor="middle">只拼出口 rank 的结果</text><polyline points="250,225 306,225" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><rect x="650" y="100" width="430" height="190" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="666" y="122" font-size="13" fill="#6b7280" text-anchor="start">数据并行第 0 份 · 张量并行组内 4 个 rank</text><rect x="666" y="148" width="96" height="120" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="714.0" y="174" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 0</text><text x="714.0" y="195" font-size="11" fill="#6b7280" text-anchor="middle">出口</text><text x="714.0" y="212" font-size="11" fill="#6b7280" text-anchor="middle">返回有效引用</text><rect x="770" y="148" width="96" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="818.0" y="174" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 1</text><text x="818.0" y="195" font-size="11" fill="#6b7280" text-anchor="middle"></text><text x="818.0" y="212" font-size="11" fill="#6b7280" text-anchor="middle">交回空壳</text><rect x="874" y="148" width="96" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="922.0" y="174" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 2</text><text x="922.0" y="195" font-size="11" fill="#6b7280" text-anchor="middle"></text><text x="922.0" y="212" font-size="11" fill="#6b7280" text-anchor="middle">交回空壳</text><rect x="978" y="148" width="96" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="1026.0" y="174" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 3</text><text x="1026.0" y="195" font-size="11" fill="#6b7280" text-anchor="middle"></text><text x="1026.0" y="212" font-size="11" fill="#6b7280" text-anchor="middle">交回空壳</text><text x="666" y="285" font-size="11" fill="#9ca3af" text-anchor="start">同一份输出只被搬一次,不是 4 次</text><rect x="650" y="330" width="430" height="190" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/><text x="666" y="352" font-size="13" fill="#6b7280" text-anchor="start">数据并行第 1 份 · 同上</text><rect x="666" y="378" width="96" height="120" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="714.0" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 0</text><text x="714.0" y="425" font-size="11" fill="#6b7280" text-anchor="middle">出口</text><text x="714.0" y="442" font-size="11" fill="#6b7280" text-anchor="middle">返回有效引用</text><rect x="770" y="378" width="96" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="818.0" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 1</text><text x="818.0" y="425" font-size="11" fill="#6b7280" text-anchor="middle"></text><text x="818.0" y="442" font-size="11" fill="#6b7280" text-anchor="middle">交回空壳</text><rect x="874" y="378" width="96" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="922.0" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 2</text><text x="922.0" y="425" font-size="11" fill="#6b7280" text-anchor="middle"></text><text x="922.0" y="442" font-size="11" fill="#6b7280" text-anchor="middle">交回空壳</text><rect x="978" y="378" width="96" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="1026.0" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">rank 3</text><text x="1026.0" y="425" font-size="11" fill="#6b7280" text-anchor="middle"></text><text x="1026.0" y="442" font-size="11" fill="#6b7280" text-anchor="middle">交回空壳</text><text x="666" y="515" font-size="11" fill="#9ca3af" text-anchor="start">同一份输出只被搬一次,不是 4 次</text><polyline points="572,287 612,287 612,195 648,195" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="572,287 612,287 612,425 648,425" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="648,265 628,265 628,497 574,497" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="648,495 628,495 628,497 574,497" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/><rect x="290" y="590" width="790" height="55" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="685.0" y="614" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">TransferQueue</text><text x="685.0" y="635" font-size="11" fill="#6b7280" text-anchor="middle">样本存放在这里;worker 自取自写,控制器本地计算时也按需取数</text><polyline points="866,290 866,588" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/><polyline points="866,520 866,588" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/><polyline points="145,300 145,617 288,617" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/></svg>