<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="1120" height="660" fill="#ffffff"/><text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一道题,三家答成了三个样子</text><text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">绿 = verl;灰 = slime;黄 = ROLL。比较接入方式与适配职责,不按目录数量排列能力高低</text><text x="415" y="116" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">verl</text><text x="685" y="116" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">slime</text><text x="955" y="116" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">ROLL</text><text x="40" y="116" font-size="13" fill="#111827" text-anchor="start" font-weight="700">都得回答的那件事</text><rect x="40" y="136" width="230" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="155" y="179" font-size="12" fill="#111827" text-anchor="middle">训练框架主线</text><rect x="290" y="136" width="250" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="415" y="179" font-size="11" fill="#6b7280" text-anchor="middle">FSDP / Megatron 等</text><rect x="560" y="136" width="250" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="685" y="179" font-size="11" fill="#6b7280" text-anchor="middle">Megatron</text><rect x="830" y="136" width="250" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="955" y="179" font-size="11" fill="#6b7280" text-anchor="middle">Megatron / DeepSpeed 等</text><rect x="40" y="224" width="230" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="155" y="267" font-size="12" fill="#111827" text-anchor="middle">生成服务接入</text><rect x="290" y="224" width="250" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="415" y="258" font-size="11" fill="#6b7280" text-anchor="middle">vLLM / SGLang</text><text x="415" y="277" font-size="11" fill="#6b7280" text-anchor="middle">TensorRT-LLM</text><rect x="560" y="224" width="250" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="685" y="267" font-size="11" fill="#6b7280" text-anchor="middle">SGLang</text><rect x="830" y="224" width="250" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="955" y="267" font-size="11" fill="#6b7280" text-anchor="middle">vLLM / SGLang</text><rect x="40" y="312" width="230" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="155" y="355" font-size="12" fill="#111827" text-anchor="middle">怎么取到后端</text><rect x="290" y="312" width="250" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="415" y="346" font-size="11" fill="#6b7280" text-anchor="middle">注册表,钥匙四段:</text><text x="415" y="365" font-size="11" fill="#6b7280" text-anchor="middle">模型类型 + 后端名 + 设备 + 厂商</text><rect x="560" y="312" width="250" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="685" y="346" font-size="11" fill="#6b7280" text-anchor="middle">主线直接接入</text><text x="685" y="365" font-size="11" fill="#6b7280" text-anchor="middle">Megatron 与 SGLang</text><rect x="830" y="312" width="250" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="955" y="346" font-size="11" fill="#6b7280" text-anchor="middle">一个策略工厂</text><text x="955" y="365" font-size="11" fill="#6b7280" text-anchor="middle">按名字取</text><rect x="40" y="400" width="230" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="155" y="443" font-size="12" fill="#111827" text-anchor="middle">谁写模型与 loss</text><rect x="290" y="400" width="250" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="415" y="434" font-size="11" fill="#6b7280" text-anchor="middle">worker 组织 loss</text><text x="415" y="453" font-size="11" fill="#6b7280" text-anchor="middle">Engine adapter 对接底层能力</text><rect x="560" y="400" width="250" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="685" y="434" font-size="11" fill="#6b7280" text-anchor="middle">模型、loss、存档、权重转换</text><text x="685" y="453" font-size="11" fill="#6b7280" text-anchor="middle">都在自己手里</text><rect x="830" y="400" width="250" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="955" y="443" font-size="11" fill="#6b7280" text-anchor="middle">策略各自包一层上游</text><rect x="40" y="488" width="230" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="155" y="531" font-size="12" fill="#111827" text-anchor="middle">扩展实现的组织</text><rect x="290" y="488" width="250" height="76" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="415" y="522" font-size="11" fill="#6b7280" text-anchor="middle">能:装另一个包</text><text x="415" y="541" font-size="11" fill="#6b7280" text-anchor="middle">把配置搜索路径指过去</text><rect x="560" y="488" width="250" height="76" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="685" y="531" font-size="11" fill="#6b7280" text-anchor="middle">主要实现集中在后端目录</text><rect x="830" y="488" width="250" height="76" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="955" y="531" font-size="11" fill="#6b7280" text-anchor="middle">策略都在自己树里</text><text x="40" y="600" font-size="11" fill="#9ca3af" text-anchor="start">三家都有自己的建模、优化器与存档对接代码;区别在这些工作如何组织,而不是谁完全不写。</text><text x="40" y="628" font-size="11" fill="#9ca3af" text-anchor="start">统一接口可以隔离后端差异,但不能消除模型支持、配置和依赖版本的差异。参数名在第五节。</text></svg>