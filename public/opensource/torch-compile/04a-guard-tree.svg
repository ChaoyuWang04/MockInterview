<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9877a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">一份编译结果的 guard 检查树:按来源分叉,从根往下查</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 按来源取值的节点,绿 = 挂在节点上的具体检查,黄 = 根上的全局检查与收尾检查,红 = 第一条不成立的检查,虚线框 = 它在重编日志里的样子</text>

  <!-- 连线 -->
  <line x1="100" y1="250" x2="100" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M170,282 H200 V116 H228" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M200,282 H228" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M200,282 V446 H228" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="400" y1="116" x2="448" y2="116" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M400,282 H425 V223 H448" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M425,282 V310 H448" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M640,310 H665 V266 H688" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M665,310 V356 H688" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="880" y1="266" x2="918" y2="266" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="880" y1="356" x2="918" y2="356" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="400" y1="446" x2="448" y2="446" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="640" y1="446" x2="688" y2="446" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M100,314 V541 H228" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="640" y1="116" x2="688" y2="116" stroke="#d9877a" stroke-width="1.4" marker-end="url(#arr-red)"/>

  <!-- ① 根上的全局检查 -->
  <rect x="30" y="112" width="140" height="86" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="100" y="136" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">① 全局状态</text>
  <text x="100" y="156" font-size="11" fill="#6b7280" text-anchor="middle">grad 开关、autocast、</text>
  <text x="100" y="172" font-size="11" fill="#6b7280" text-anchor="middle">默认 dtype、线程数、</text>
  <text x="100" y="188" font-size="11" fill="#6b7280" text-anchor="middle">矩阵乘精度……</text>

  <!-- 根 -->
  <rect x="30" y="250" width="140" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="100" y="276" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">根</text>
  <text x="100" y="298" font-size="11" fill="#6b7280" text-anchor="middle">这一帧,查的起点</text>

  <!-- 第一层:来源 -->
  <rect x="230" y="90" width="170" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="315" y="112" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">局部变量 x</text>
  <text x="315" y="131" font-size="11" fill="#6b7280" text-anchor="middle">L['x']</text>

  <rect x="230" y="256" width="170" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="315" y="278" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">局部变量 self</text>
  <text x="315" y="297" font-size="11" fill="#6b7280" text-anchor="middle">L['self']</text>

  <rect x="230" y="420" width="170" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="315" y="442" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">全局变量字典</text>
  <text x="315" y="461" font-size="11" fill="#6b7280" text-anchor="middle">G,只取读过的键</text>

  <!-- x 的检查:第一条不成立 -->
  <rect x="450" y="80" width="190" height="72" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="545" y="102" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">张量检查</text>
  <text x="545" y="122" font-size="11" fill="#6b7280" text-anchor="middle">dtype、设备、requires_grad、</text>
  <text x="545" y="138" font-size="11" fill="#6b7280" text-anchor="middle">维数、各维大小与步长</text>

  <!-- 重编日志 -->
  <rect x="690" y="80" width="400" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="706" y="102" font-size="14" font-weight="700" fill="#111827">重编原因:只报第一条</text>
  <text x="706" y="122" font-size="11" fill="#6b7280">0/0: tensor 'x' size mismatch at index 0.</text>
  <text x="706" y="138" font-size="11" fill="#6b7280">expected 3, actual 4</text>

  <!-- self 分支 -->
  <rect x="450" y="200" width="190" height="46" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="545" y="228" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">类型 = MyModel</text>

  <rect x="450" y="284" width="190" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="545" y="306" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">属性字典</text>
  <text x="545" y="325" font-size="11" fill="#6b7280" text-anchor="middle">直接查字典,绕开模块的 getattr</text>

  <rect x="690" y="240" width="190" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="785" y="262" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">training</text>
  <text x="785" y="281" font-size="11" fill="#6b7280" text-anchor="middle">属性字典里的一个键</text>

  <rect x="690" y="330" width="190" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="785" y="352" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">linear → weight</text>
  <text x="785" y="371" font-size="11" fill="#6b7280" text-anchor="middle">子模块表、参数表两级取值</text>

  <rect x="920" y="240" width="170" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="1005" y="262" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">值 == True</text>
  <text x="1005" y="281" font-size="11" fill="#6b7280" text-anchor="middle">按值记录</text>

  <rect x="920" y="330" width="170" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="1005" y="352" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">张量检查</text>
  <text x="1005" y="371" font-size="11" fill="#6b7280" text-anchor="middle">与 x 的同一组元信息</text>

  <!-- G 分支 -->
  <rect x="450" y="420" width="190" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="545" y="442" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">scale</text>
  <text x="545" y="461" font-size="11" fill="#6b7280" text-anchor="middle">G['scale']</text>

  <rect x="690" y="420" width="190" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="785" y="442" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">值 == 0.5</text>
  <text x="785" y="461" font-size="11" fill="#6b7280" text-anchor="middle">按值记录</text>

  <!-- ③ 收尾 -->
  <rect x="230" y="514" width="650" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="250" y="536" font-size="14" font-weight="700" fill="#111827">③ 收尾检查</text>
  <text x="250" y="556" font-size="11" fill="#6b7280">形状之间的关系(06 章)默认拼成一个 Python 函数挂在根上,全部子树都过了才跑</text>

  <!-- 查的顺序 -->
  <text x="30" y="598" font-size="13" fill="#6b7280">查的顺序:① 根上的全局状态 → ② 各子树,每个节点先查挂在自己身上的检查,再依次进子节点,任何一条不过立即返回 → ③ 收尾检查。</text>
  <text x="30" y="620" font-size="13" fill="#6b7280">某个子节点失败过,下次就按失败次数把它排到兄弟节点前面;同一前缀只取一次值,self 之下的取值被两个叶子共用。</text>
</svg>
