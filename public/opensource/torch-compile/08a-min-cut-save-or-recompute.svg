<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" width="1120" height="550" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="550" fill="#ffffff"/>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#111827">一张小联合图上的最小割:存下 x 与 h,σ 留到反向里重算</text>
  <text x="40" y="58" font-size="13" fill="#6b7280">用户代码 h = x·W,y = h·sigmoid(h)。黄 = 不许重算的节点,绿 = 允许重算的逐元素运算,紫 = 反向算子,灰 = 图的出入口,红 = 割线与被它切断而存下的张量</text>

  <!-- 连线先画,方框后画 -->
  <!-- 前向链 -->
  <line x1="200" y1="126" x2="248" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="410" y1="126" x2="458" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="620" y1="126" x2="668" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="830" y1="126" x2="878" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M330,96 C330,74 750,74 750,94" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 跨割线:x 与 h -->
  <line x1="120" y1="156" x2="120" y2="418" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="330,156 330,392 770,392 770,418" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="330" y1="340" x2="458" y2="340" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 重算的 σ 喂给反向 -->
  <line x1="550" y1="370" x2="550" y2="418" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="640,340 720,340 720,418" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 反向链(从右往左) -->
  <line x1="900" y1="450" x2="862" y2="450" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="680" y1="450" x2="642" y2="450" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="460" y1="450" x2="422" y2="450" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="250" y1="450" x2="212" y2="450" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M740,480 C740,512 335,512 335,482" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 割线 -->
  <line x1="30" y1="292" x2="1090" y2="292" stroke="#d9877a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <circle cx="120" cy="292" r="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.6"/>
  <circle cx="330" cy="292" r="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.6"/>

  <!-- 前向行 -->
  <text x="40" y="88" font-size="11" fill="#9ca3af">前向 · 割线上方的在前向里算</text>
  <rect x="40" y="96" width="160" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="120" y="121" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">输入 x 与参数 W</text>
  <text x="120" y="142" font-size="11" fill="#6b7280" text-anchor="middle">输入不能重算,只能存</text>

  <rect x="250" y="96" width="160" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="330" y="121" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">矩阵乘 h = x·W</text>
  <text x="330" y="142" font-size="11" fill="#6b7280" text-anchor="middle">不在白名单上,不许重算</text>

  <rect x="460" y="96" width="160" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="540" y="121" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">σ = sigmoid(h)</text>
  <text x="540" y="142" font-size="11" fill="#6b7280" text-anchor="middle">逐元素,允许重算</text>

  <rect x="670" y="96" width="160" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="750" y="121" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">y = h·σ</text>
  <text x="750" y="142" font-size="11" fill="#6b7280" text-anchor="middle">逐元素,和 σ 融成一个 kernel</text>

  <rect x="880" y="96" width="160" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="960" y="121" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">前向输出 y</text>
  <text x="960" y="142" font-size="11" fill="#6b7280" text-anchor="middle">之后交给 loss</text>

  <!-- 存 σ 的代价 -->
  <rect x="660" y="180" width="420" height="80" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="680" y="204" font-size="14" font-weight="700" fill="#111827">如果把 σ 也存下</text>
  <text x="680" y="226" font-size="11" fill="#6b7280">σ 本来和乘法融在一个 kernel 里,不落显存</text>
  <text x="680" y="246" font-size="11" fill="#6b7280">存它 = 前向多写一次 + 占着显存直到反向 + 反向再读一次</text>

  <!-- 割线标注 -->
  <text x="360" y="284" font-size="11" fill="#6b7280">割线:被它切断的边上的张量,就是前向存下、交给反向的</text>
  <text x="134" y="314" font-size="11" fill="#6b7280">存 x</text>
  <text x="134" y="330" font-size="11" fill="#9ca3af">W 是参数,存它不计代价</text>
  <text x="340" y="314" font-size="11" fill="#6b7280">存 h</text>

  <!-- 反向里重算的 σ -->
  <rect x="460" y="310" width="180" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-dasharray="5 3"/>
  <text x="550" y="335" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">重算 σ = sigmoid(h)</text>
  <text x="550" y="356" font-size="11" fill="#6b7280" text-anchor="middle">复制进反向图的一份</text>

  <!-- 重算的代价 -->
  <rect x="800" y="306" width="280" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="820" y="330" font-size="14" font-weight="700" fill="#111827">重算 σ 的代价</text>
  <text x="820" y="350" font-size="11" fill="#6b7280">反向的逐元素 kernel 本来就在读 h</text>
  <text x="820" y="367" font-size="11" fill="#6b7280">顺手多做一次 sigmoid,不多一次读写</text>

  <!-- 反向行 -->
  <text x="140" y="412" font-size="11" fill="#9ca3af">反向 · 割线下方的在反向里算</text>
  <rect x="40" y="420" width="170" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="125" y="445" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">矩阵乘的反向</text>
  <text x="125" y="466" font-size="11" fill="#6b7280" text-anchor="middle">dW = xᵀ·dh,dx = dh·Wᵀ</text>

  <rect x="250" y="420" width="170" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="335" y="445" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">两路相加得 dh</text>
  <text x="335" y="466" font-size="11" fill="#6b7280" text-anchor="middle">逐元素</text>

  <rect x="460" y="420" width="180" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="550" y="445" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">sigmoid 的反向</text>
  <text x="550" y="466" font-size="11" fill="#6b7280" text-anchor="middle">乘 σ(1−σ),要用 σ</text>

  <rect x="680" y="420" width="180" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="770" y="445" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">乘法的反向</text>
  <text x="770" y="466" font-size="11" fill="#6b7280" text-anchor="middle">dy·σ 与 dy·h,要用 σ 和 h</text>

  <rect x="900" y="420" width="180" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="990" y="445" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">上游梯度 dy</text>
  <text x="990" y="466" font-size="11" fill="#6b7280" text-anchor="middle">loss 传回来的</text>

  <text x="440" y="530" font-size="11" fill="#9ca3af">dy·σ 那一路直接进相加</text>
</svg>
