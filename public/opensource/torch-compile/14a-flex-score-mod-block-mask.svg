<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" fill="#111827" font-weight="700">FlexAttention:两个小函数 → 块掩码 → 内联进同一个注意力 kernel</text>
  <text x="24" y="58" font-size="13" fill="#6b7280">示意,非运行结果:因果掩码加按距离的偏置,Q = KV = 512,稀疏块 128 × 128。紫 = 用户函数及其内联位置;黄 = 部分块;绿 = 整块;灰 = 整块跳过</text>
  <rect x="24" y="78" width="316" height="414" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="44" y="104" font-size="14" fill="#111827" font-weight="700">① 用户只写两个小函数</text>
  <rect x="44" y="120" width="276" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="182" y="144" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">打分改写 score_mod</text>
  <text x="60" y="166" font-size="11" fill="#6b7280">输入:分数,以及 b、h、q、kv 共 5 个 0 维张量</text>
  <text x="60" y="184" font-size="11" fill="#6b7280">输出:改写后的分数</text>
  <text x="60" y="204" font-size="11" fill="#6b7280">例:score − slope[h] × (q − kv)</text>
  <text x="60" y="222" font-size="11" fill="#6b7280">每个格子各算一次,互不相干</text>
  <rect x="44" y="256" width="276" height="100" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="182" y="280" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">掩码 mask_mod</text>
  <text x="60" y="302" font-size="11" fill="#6b7280">输入:b、h、q、kv 共 4 个 0 维张量</text>
  <text x="60" y="320" font-size="11" fill="#6b7280">输出:这个格子算不算(真 / 假)</text>
  <text x="60" y="340" font-size="11" fill="#6b7280">例:q ≥ kv(因果)</text>
  <text x="44" y="384" font-size="11" fill="#9ca3af">Dynamo 把两个函数各抓成一张子图</text>
  <text x="44" y="402" font-size="11" fill="#9ca3af">slope 这类闭包里的张量成为子图的额外输入</text>
  <text x="44" y="420" font-size="11" fill="#9ca3af">不编译直接调用:退回参考实现,</text>
  <text x="44" y="438" font-size="11" fill="#9ca3af">整张分数矩阵落显存</text>
  <line x1="342" y1="300" x2="366" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="368" y="78" width="340" height="414" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="388" y="104" font-size="14" fill="#111827" font-weight="700">② 块掩码:每 128 × 128 一格</text>
  <text x="388" y="124" font-size="11" fill="#6b7280">create_block_mask 数每块里要算的格子</text>
  <text x="480" y="156" font-size="11" fill="#6b7280" text-anchor="middle">KV 0</text>
  <text x="536" y="156" font-size="11" fill="#6b7280" text-anchor="middle">KV 1</text>
  <text x="592" y="156" font-size="11" fill="#6b7280" text-anchor="middle">KV 2</text>
  <text x="648" y="156" font-size="11" fill="#6b7280" text-anchor="middle">KV 3</text>
  <text x="444" y="196" font-size="11" fill="#6b7280" text-anchor="end">Q 0</text>
  <rect x="454" y="166" width="52" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="480" y="196" font-size="11" fill="#111827" text-anchor="middle">部分</text>
  <rect x="510" y="166" width="52" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="536" y="196" font-size="11" fill="#111827" text-anchor="middle">跳过</text>
  <rect x="566" y="166" width="52" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="592" y="196" font-size="11" fill="#111827" text-anchor="middle">跳过</text>
  <rect x="622" y="166" width="52" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="648" y="196" font-size="11" fill="#111827" text-anchor="middle">跳过</text>
  <text x="444" y="252" font-size="11" fill="#6b7280" text-anchor="end">Q 1</text>
  <rect x="454" y="222" width="52" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="480" y="252" font-size="11" fill="#111827" text-anchor="middle">整块</text>
  <rect x="510" y="222" width="52" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="536" y="252" font-size="11" fill="#111827" text-anchor="middle">部分</text>
  <rect x="566" y="222" width="52" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="592" y="252" font-size="11" fill="#111827" text-anchor="middle">跳过</text>
  <rect x="622" y="222" width="52" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="648" y="252" font-size="11" fill="#111827" text-anchor="middle">跳过</text>
  <text x="444" y="308" font-size="11" fill="#6b7280" text-anchor="end">Q 2</text>
  <rect x="454" y="278" width="52" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="480" y="308" font-size="11" fill="#111827" text-anchor="middle">整块</text>
  <rect x="510" y="278" width="52" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="536" y="308" font-size="11" fill="#111827" text-anchor="middle">整块</text>
  <rect x="566" y="278" width="52" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="592" y="308" font-size="11" fill="#111827" text-anchor="middle">部分</text>
  <rect x="622" y="278" width="52" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="648" y="308" font-size="11" fill="#111827" text-anchor="middle">跳过</text>
  <text x="444" y="364" font-size="11" fill="#6b7280" text-anchor="end">Q 3</text>
  <rect x="454" y="334" width="52" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="480" y="364" font-size="11" fill="#111827" text-anchor="middle">整块</text>
  <rect x="510" y="334" width="52" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="536" y="364" font-size="11" fill="#111827" text-anchor="middle">整块</text>
  <rect x="566" y="334" width="52" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="592" y="364" font-size="11" fill="#111827" text-anchor="middle">整块</text>
  <rect x="622" y="334" width="52" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="648" y="364" font-size="11" fill="#111827" text-anchor="middle">部分</text>
  <rect x="450" y="218" width="228" height="60" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="388" y="414" font-size="11" fill="#6b7280">全要算 → 整块;部分要算 → 部分块;全不算 → 不进表</text>
  <text x="388" y="434" font-size="11" fill="#6b7280">计数:部分 4 · 整块 6 · 跳过 6</text>
  <text x="388" y="454" font-size="11" fill="#6b7280">存成两张按行的索引表,虚线框里的第 1 行:</text>
  <text x="388" y="474" font-size="11" fill="#6b7280">部分块 [1],整块 [0];KV 2、3 不出现</text>
  <line x1="710" y1="300" x2="734" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="736" y="78" width="360" height="414" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="756" y="104" font-size="14" fill="#111827" font-weight="700">③ 一个 Triton kernel(注意力模板)</text>
  <text x="756" y="124" font-size="11" fill="#6b7280">两张子图降级后填进模板的插槽;以 Q 块 1 为例</text>
  <rect x="756" y="138" width="320" height="100" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="916" y="160" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">循环一:部分块 KV 1</text>
  <text x="799.0" y="192" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">算 QKᵀ</text>
  <line x1="832" y1="188" x2="846" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="850" y="176" width="74" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="887.0" y="192" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">打分改写</text>
  <line x1="926" y1="188" x2="940" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="944" y="176" width="52" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="970.0" y="192" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">掩码</text>
  <line x1="998" y1="188" x2="1012" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1042.0" y="192" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">累加</text>
  <text x="768" y="224" font-size="11" fill="#6b7280">掩掉的格子记为 −∞,在线 softmax 照常更新</text>
  <rect x="756" y="252" width="320" height="90" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="916" y="274" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">循环二:整块 KV 0</text>
  <text x="799.0" y="306" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">算 QKᵀ</text>
  <line x1="832" y1="302" x2="846" y2="302" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="850" y="290" width="74" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="887.0" y="306" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">打分改写</text>
  <line x1="926" y1="302" x2="940" y2="302" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="972.0" y="306" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">累加</text>
  <text x="768" y="332" font-size="11" fill="#6b7280">不跑掩码函数,省掉逐格判断</text>
  <rect x="756" y="356" width="320" height="58" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="916" y="378" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">KV 2、3:不在任何表里</text>
  <text x="916" y="400" font-size="11" fill="#6b7280" text-anchor="middle">K、V 不读,QKᵀ 不算</text>
  <text x="756" y="436" font-size="11" fill="#9ca3af">输出 O,另存每行 logsumexp 供反向</text>
  <text x="756" y="454" font-size="11" fill="#9ca3af">模板 tile 可小于稀疏块:128 × 64 时一块走 2 步</text>
  <text x="756" y="472" font-size="11" fill="#9ca3af">紫色两段 = ① 的两个函数降级后的代码</text>
</svg>
