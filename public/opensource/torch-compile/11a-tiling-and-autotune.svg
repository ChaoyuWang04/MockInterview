<rect x="404" y="184" width="234" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="638" y="184" width="78" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="404" y="204" width="234" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="638" y="204" width="78" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="404" y="224" width="234" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="638" y="224" width="78" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="399" y="139" width="322" height="24" rx="6" fill="none" stroke="#8f8bd8" stroke-width="2"/>
<text x="404" y="262" font-size="11" fill="#6b7280">紫框是一个 program:XBLOCK 为 1 行,4096 个并行</text>
<text x="404" y="278" font-size="11" fill="#6b7280">R0_BLOCK 取 768 向上的 2 的幂 1024,灰 256 格掩码</text>
<rect x="404" y="294" width="312" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="560.0" y="317.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">XBLOCK 1 · 1 warp,只此一组</text>
<rect x="404" y="342" width="312" height="36" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560.0" y="365.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">1 组候选:不实测,直接用</text>
<text x="768" y="104" font-size="14" font-weight="700" fill="#111827">循环归约:块沿 r 走,边走边累加</text>
<text x="768" y="124" font-size="11" fill="#6b7280">按行求和,4096 行 × 50000 列(以 H100 为例)</text>
<rect x="768" y="144" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="806" y="144" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="844" y="144" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
