<rect x="806" y="164" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="844" y="164" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="882" y="164" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
