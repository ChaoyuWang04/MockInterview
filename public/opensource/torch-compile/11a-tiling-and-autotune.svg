<rect x="958" y="164" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1012" y="175" font-size="11" fill="#9ca3af" text-anchor="middle">…</text>
<rect x="1030" y="164" width="20" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="1052" y="164" width="28" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="768" y="184" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="806" y="184" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
