<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 612" width="1120" height="612" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="612" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#111827">一个融合 kernel 怎么切块:x 维按块并行,r 维一次读完或在块内循环;块大小几组候选,第一次调用实测挑一组</text>
<text x="24" y="58" font-size="13" fill="#6b7280">紫 = 一个 program 负责的块;黄 = 沿 r 方向一次读进块里的数据;灰 = 越界、被掩码的位置;绿 = 启发式给出的候选配置;红 = 第一次调用时的实测</text>
<rect x="24" y="78" width="344" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="388" y="78" width="344" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="752" y="78" width="344" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="104" font-size="14" font-weight="700" fill="#111827">逐元素:全部维摊平成一个 x 轴</text>
<text x="40" y="124" font-size="11" fill="#6b7280">4096 × 768 的连续张量,共 3,145,728 个元素</text>
<rect x="40" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="58" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块0</text>
<rect x="79" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="97" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块1</text>
<rect x="118" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="136" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块2</text>
<rect x="157" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="175" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块3</text>
<rect x="196" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="214" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块4</text>
<rect x="235" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="253" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块5</text>
<rect x="274" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="292" y="164" font-size="11" fill="#6b7280" text-anchor="middle">块6</text>
<rect x="313" y="142" width="36" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="331" y="164" font-size="11" fill="#6b7280" text-anchor="middle">…</text>
<text x="40" y="204" font-size="11" fill="#6b7280">每块交给一个 program,所有块同时跑</text>
<text x="40" y="220" font-size="11" fill="#6b7280">块内是 XBLOCK 个连续下标,没有 r 轴</text>
<rect x="40" y="236" width="312" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="196.0" y="259.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">XBLOCK 1024 · 4 warps · 3072 块</text>
<rect x="40" y="280" width="312" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="196.0" y="303.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">XBLOCK 512 · 8 warps · 6144 块</text>
<rect x="40" y="330" width="312" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="196.0" y="351.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">2 组候选,第一次调用各跑一遍</text>
<text x="196.0" y="368.0" font-size="11" fill="#6b7280" text-anchor="middle">按真实耗时留下快的那组</text>
<text x="404" y="104" font-size="14" font-weight="700" fill="#111827">持久化归约:一行一次读完</text>
<text x="404" y="124" font-size="11" fill="#6b7280">按行求和,4096 行 × 768 列</text>
<rect x="404" y="144" width="234" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="638" y="144" width="78" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
