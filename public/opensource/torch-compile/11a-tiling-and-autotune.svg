<rect x="1030" y="204" width="20" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="1052" y="204" width="28" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
