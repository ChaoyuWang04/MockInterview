<rect x="958" y="224" width="34" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1012" y="235" font-size="11" fill="#9ca3af" text-anchor="middle">…</text>
<rect x="1030" y="224" width="20" height="14" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="1052" y="224" width="28" height="14" rx="2" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="763" y="139" width="322" height="24" rx="6" fill="none" stroke="#8f8bd8" stroke-width="2"/>
<line x1="768" y1="252" x2="1078" y2="252" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="768" y="270" font-size="11" fill="#6b7280">每行循环 25 次,每次读 2048 个,第 25 次只有 848 个</text>
<text x="768" y="286" font-size="11" fill="#6b7280">累加器与块同形,循环结束后在块内再归约一次</text>
<rect x="768" y="296" width="312" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="924.0" y="319.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">XBLOCK 1 · R0_BLOCK 2048 · 16 warps</text>
<rect x="768" y="340" width="312" height="48" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="924.0" y="361.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">占用率被寄存器压住时加一组</text>
<text x="924.0" y="378.0" font-size="11" fill="#6b7280" text-anchor="middle">R0_BLOCK 减半到 1024,两组实测比快慢</text>
<text x="24" y="426" font-size="14" font-weight="700" fill="#111827">块大小的挑选只付一次</text>
<rect x="24" y="440" width="250" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="149.0" y="460" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">编译期:列出候选</text>
<text x="149.0" y="478" font-size="11" fill="#6b7280" text-anchor="middle">按形状与归约方向给 1–6 组</text>
<text x="149.0" y="493" font-size="11" fill="#6b7280" text-anchor="middle">编译子进程逐组预编译,编不过的丢掉</text>
<rect x="298" y="440" width="250" height="64" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="423.0" y="460" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">第一次调用:逐组实测</text>
<text x="423.0" y="478" font-size="11" fill="#6b7280" text-anchor="middle">用真实输入,原地改写的参数先备份</text>
<text x="423.0" y="493" font-size="11" fill="#6b7280" text-anchor="middle">寄存器溢出超过 16 个的直接淘汰</text>
<rect x="572" y="440" width="250" height="64" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="697.0" y="460" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">留下最快的一组</text>
<text x="697.0" y="478" font-size="11" fill="#6b7280" text-anchor="middle">其余丢弃</text>
<text x="697.0" y="493" font-size="11" fill="#6b7280" text-anchor="middle">结果写进调优缓存(16 章)</text>
<rect x="846" y="440" width="250" height="64" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="971.0" y="460" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">之后的调用</text>
<text x="971.0" y="478" font-size="11" fill="#6b7280" text-anchor="middle">直接用这一组启动,不再实测</text>
<text x="971.0" y="493" font-size="11" fill="#6b7280" text-anchor="middle">输入形状变了也不重挑</text>
<line x1="276" y1="472.0" x2="295" y2="472.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="550" y1="472.0" x2="569" y2="472.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="824" y1="472.0" x2="843" y2="472.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="697" y1="506" x2="697" y2="522" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="298" y="524" width="798" height="48" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="697.0" y="545.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">可选:坐标下降,从选中的那组出发继续找</text>
<text x="697.0" y="562.0" font-size="11" fill="#6b7280" text-anchor="middle">每次把一个块大小或 warp 数乘 2、除 2 试跑,快 0.1% 以上才换,直到一轮下来没有改进</text>
<text x="24" y="598" font-size="11" fill="#9ca3af">示意,非运行结果:形状是举例,块大小、warp 数与候选组数按基准源码的启发式手算;循环归约的最大归约块取计算能力 9.x 的卡</text>
</svg>