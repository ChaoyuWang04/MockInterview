<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#111827">一处断图把函数切成三段:图 1、交给 Python 的那一句、续跑函数里的图 2</text>
  <text x="40" y="58" font-size="13" fill="#6b7280">黄 = 编译好的图,灰 = 原样交给 Python 执行,绿 = Dynamo 生成的字节码,紫 = guard 检查,红底 = 断点所在的那一行</text>

  <!-- 源码 -->
  <text x="40" y="92" font-size="11" fill="#9ca3af">编译时:每一行归到哪一段</text>
  <rect x="40" y="102" width="380" height="198" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="60" y="130" font-size="12" fill="#111827">def f(x):</text>

  <text x="84" y="158" font-size="12" fill="#111827">a = x.sin()</text>
  <rect x="290" y="145" width="110" height="18" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="345" y="158" font-size="11" fill="#6b7280" text-anchor="middle">图 1</text>

  <text x="84" y="186" font-size="12" fill="#111827">b = a * 2</text>
  <rect x="290" y="173" width="110" height="18" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="345" y="186" font-size="11" fill="#6b7280" text-anchor="middle">图 1</text>

  <rect x="48" y="198" width="364" height="28" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="84" y="216" font-size="12" fill="#111827">print(b.sum())</text>
  <rect x="196" y="203" width="84" height="18" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="238" y="216" font-size="11" fill="#6b7280" text-anchor="middle">sum 进图 1</text>
  <rect x="290" y="203" width="110" height="18" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="345" y="216" font-size="11" fill="#6b7280" text-anchor="middle">print 走 Python</text>

  <text x="84" y="246" font-size="12" fill="#111827">c = b.cos()</text>
  <rect x="290" y="233" width="110" height="18" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="345" y="246" font-size="11" fill="#6b7280" text-anchor="middle">图 2</text>

  <text x="84" y="274" font-size="12" fill="#111827">return c + 1</text>
  <rect x="290" y="261" width="110" height="18" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="345" y="274" font-size="11" fill="#6b7280" text-anchor="middle">图 2</text>

  <!-- 生成的两段字节码 -->
  <text x="460" y="92" font-size="11" fill="#9ca3af">编译时:生成两段字节码</text>
  <rect x="460" y="102" width="620" height="86" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="480" y="126" font-size="14" font-weight="700" fill="#111827">f 的改写后字节码(挂在 f 的缓存条目上)</text>
  <text x="480" y="150" font-size="11" fill="#6b7280">调图 1 → 写回副作用,还原栈与之后还会被读到的局部变量 b(a 之后没人读,不还原)</text>
  <text x="480" y="170" font-size="11" fill="#6b7280">→ 原样执行 print 那一条调用 → 调续跑函数,把 b 与栈上的值当参数传进去 → 返回它的结果</text>

  <line x1="770" y1="188" x2="770" y2="210" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="780" y="203" font-size="11" fill="#9ca3af">要调用的函数同时生成</text>

  <rect x="460" y="212" width="620" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="480" y="236" font-size="14" font-weight="700" fill="#111827">续跑函数(一个新的 code object,名字里带 f 和断点行号)</text>
  <text x="480" y="260" font-size="11" fill="#6b7280">f 的字节码整份拷贝,前面加一段序言:参数压回栈,重进断点时仍在进行的 with 块,跳到断点的下一条</text>
  <text x="480" y="280" font-size="11" fill="#6b7280">它被当成普通 Python 函数调用,帧钩子照常截下,从它的开头抓出图 2;它里面再断,就再切一次</text>

  <!-- 时间线 -->
  <text x="40" y="340" font-size="11" fill="#9ca3af">之后每次调用 f(x):一条时间线</text>

  <rect x="40" y="352" width="130" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="105" y="378" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">查 f 的 guard</text>
  <text x="105" y="400" font-size="11" fill="#6b7280" text-anchor="middle">命中第 1 条</text>
  <line x1="170" y1="384" x2="188" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="190" y="352" width="170" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="275" y="378" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">图 1</text>
  <text x="275" y="400" font-size="11" fill="#6b7280" text-anchor="middle">sin · mul · sum</text>
  <line x1="360" y1="384" x2="378" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="380" y="352" width="150" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="455" y="378" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">还原与写回</text>
  <text x="455" y="400" font-size="11" fill="#6b7280" text-anchor="middle">b 从图 1 的输出取出</text>
  <line x1="530" y1="384" x2="548" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="550" y="352" width="140" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="620" y="378" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">print(…)</text>
  <text x="620" y="400" font-size="11" fill="#6b7280" text-anchor="middle">真的由 Python 执行</text>
  <line x1="690" y1="384" x2="708" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="710" y="352" width="150" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="785" y="378" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">截下续跑函数</text>
  <text x="785" y="400" font-size="11" fill="#6b7280" text-anchor="middle">查它自己的 guard</text>
  <line x1="860" y1="384" x2="878" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="880" y="352" width="200" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="980" y="378" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">图 2</text>
  <text x="980" y="400" font-size="11" fill="#6b7280" text-anchor="middle">cos · add → 返回</text>

  <text x="40" y="450" font-size="11" fill="#9ca3af">图 1 与图 2 之间:b 在图 1 末尾写回显存,图 2 开头再读进来;sin、mul 与 cos、add 不可能融进同一个 kernel</text>
  <text x="40" y="472" font-size="11" fill="#9ca3af">绿、灰、紫这三格是每处断点每次调用都要多付的:回到 Python、还原变量、多查一份 guard</text>
</svg>
