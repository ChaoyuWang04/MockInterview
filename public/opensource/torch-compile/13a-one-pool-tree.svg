<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#111827">一个训练步的四张图共用一个池:按执行先后排成树,后面的图复用前面已死的地址</text>
  <text x="40" y="58" font-size="13" fill="#6b7280">示意,非运行结果。黄 = 录下的一张图(树上的节点);绿 = 仍活着的池内缓冲;紫 = 复用已死缓冲地址的新缓冲;红 = 用户拿走、下一步回放时被覆盖的输出</text>

  <!-- 上半:录制出的树 -->
  <text x="40" y="118" font-size="14" font-weight="700" fill="#111827">录制出的树</text>
  <text x="40" y="138" font-size="11" fill="#9ca3af">父节点 = 紧挨着它之前执行、</text>
  <text x="40" y="154" font-size="11" fill="#9ca3af">输出还活着的那张图</text>

  <!-- 连线先画 -->
  <line x1="450" y1="126" x2="468" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="660" y1="126" x2="678" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="870" y1="126" x2="888" y2="126" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="355,156 355,201 468,201" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="260" y="96" width="190" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="355" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">区域 1 前向</text>
  <text x="355" y="140" font-size="11" fill="#6b7280" text-anchor="middle">根:池里没有活着的输出</text>

  <rect x="470" y="96" width="190" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="565" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">区域 2 前向</text>
  <text x="565" y="140" font-size="11" fill="#6b7280" text-anchor="middle">断图之后的第二段</text>

  <rect x="680" y="96" width="190" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="775" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">区域 2 反向</text>
  <text x="775" y="140" font-size="11" fill="#6b7280" text-anchor="middle">读区域 2 存下的激活</text>

  <rect x="890" y="96" width="190" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="985" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">区域 1 反向</text>
  <text x="985" y="140" font-size="11" fill="#6b7280" text-anchor="middle">读区域 1 存下的激活</text>

  <rect x="470" y="176" width="190" height="50" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="565" y="197" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">区域 2 前向′</text>
  <text x="565" y="215" font-size="11" fill="#6b7280" text-anchor="middle">走另一分支,另录一个孩子</text>

  <text x="680" y="197" font-size="11" fill="#9ca3af">两条分支都接在区域 1 前向之后,用同一段池内存;</text>
  <text x="680" y="213" font-size="11" fill="#9ca3af">池的峰值取两条路径里较大的那条,不是两者之和</text>

  <!-- 下半:同一个池里的地址段 -->
  <text x="40" y="262" font-size="14" font-weight="700" fill="#111827">同一个池里的地址段</text>
  <text x="260" y="262" font-size="11" fill="#9ca3af">横向与上面的四张图对齐,表示这段地址在哪几张图执行期间被占着</text>

  <text x="40" y="317" font-size="11" fill="#6b7280">地址段 1</text>
  <rect x="260" y="290" width="820" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="274" y="309" font-size="14" font-weight="700" fill="#111827">区域 1 存下的激活</text>
  <text x="274" y="326" font-size="11" fill="#6b7280">前向写入,一直活到区域 1 反向读完它</text>

  <text x="40" y="373" font-size="11" fill="#6b7280">地址段 2</text>
  <rect x="260" y="346" width="400" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="274" y="365" font-size="14" font-weight="700" fill="#111827">h:区域 1 的输出</text>
  <text x="274" y="382" font-size="11" fill="#6b7280">直接作区域 2 前向的输入,不拷贝</text>
  <rect x="680" y="346" width="400" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="694" y="365" font-size="14" font-weight="700" fill="#111827">区域 2 反向写出的梯度</text>
  <text x="694" y="382" font-size="11" fill="#6b7280">h 已死,录制时分配器把它的地址分给这里</text>

  <text x="40" y="429" font-size="11" fill="#6b7280">地址段 3</text>
  <rect x="470" y="402" width="400" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="484" y="421" font-size="14" font-weight="700" fill="#111827">区域 2 存下的激活</text>
  <text x="484" y="438" font-size="11" fill="#6b7280">活到区域 2 反向读完它</text>
  <rect x="890" y="402" width="190" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="904" y="421" font-size="14" font-weight="700" fill="#111827">区域 1 反向的输出</text>
  <text x="904" y="438" font-size="11" fill="#6b7280">复用左边已死的地址</text>

  <text x="40" y="485" font-size="11" fill="#6b7280">地址段 4</text>
  <rect x="470" y="458" width="610" height="44" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="484" y="477" font-size="14" font-weight="700" fill="#111827">loss:用户拿走的输出</text>
  <text x="484" y="494" font-size="11" fill="#6b7280">它活着,后面的图录制时绕开这段地址;下一步回放区域 2 前向时写回这里,旧值被覆盖</text>

  <!-- 下一步 -->
  <rect x="260" y="524" width="820" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="276" y="548" font-size="14" font-weight="700" fill="#111827">下一步</text>
  <text x="276" y="570" font-size="11" fill="#6b7280">四张图按同一顺序回放,每张写回和录制时完全相同的地址。回放前只查三件事:上一张图的输出(如 h)地址没变,</text>
  <text x="276" y="588" font-size="11" fill="#6b7280">录制时已死的缓冲现在也已死,参数地址没变。都成立就直接回放;任何一条不成立,就在当前节点下再录一个孩子。</text>
  <text x="276" y="606" font-size="11" fill="#6b7280">上一步拿走的 loss 和这一步返回的是同一个张量对象,回放过区域 2 前向之后,它的值已经是新一步的。</text>
</svg>
