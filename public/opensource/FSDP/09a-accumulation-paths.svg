<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590">
<rect width="1120" height="590" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="28" y="34" font-size="19" font-weight="700" fill="#111827">梯度累积:省哪一次通信,就得留下哪一种梯度</text>
<text x="28" y="60" font-size="13" fill="#6b7280">同一个 HSDP 参数组 · 分片规模 2、复制规模 2 · 绿 = 梯度,紫 = reduce-scatter,黄 = all-reduce</text>
<text x="270" y="99" font-size="14" font-weight="700" fill="#111827">microbatch 1</text>
<text x="530" y="99" font-size="14" font-weight="700" fill="#111827">microbatch 2</text>
<text x="790" y="99" font-size="14" font-weight="700" fill="#111827">microbatch 3</text>
<text x="28" y="151" font-size="14" font-weight="700" fill="#111827">每次都同步</text>
<text x="28" y="177" font-size="11" fill="#6b7280">3 次 RS + 3 次 AR</text>
<rect x="270" y="127" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="295" y="147" font-size="14" font-weight="700" fill="#111827">RS</text>
