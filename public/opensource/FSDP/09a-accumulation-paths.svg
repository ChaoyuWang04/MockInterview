<rect x="270" y="428" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="405" y="445" font-size="11" fill="#6b7280">1/2</text>
<rect x="530" y="381" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="555" y="401" font-size="14" font-weight="700" fill="#111827">RS</text>
<rect x="530" y="428" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="530" y="428" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="665" y="445" font-size="11" fill="#6b7280">1/2</text>
<rect x="790" y="381" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="815" y="401" font-size="14" font-weight="700" fill="#111827">RS</text>
<rect x="880" y="381" width="74" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="905" y="401" font-size="14" font-weight="700" fill="#111827">AR</text>
<rect x="790" y="428" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="790" y="428" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="925" y="445" font-size="11" fill="#6b7280">1/2</text>
<path d="M 453 442 H 506 m -7 -5 l 7 5 -7 5 M 713 442 H 766 m -7 -5 l 7 5 -7 5" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="28" y="510" font-size="13" fill="#6b7280">绿条表示该次反向后留待累积/更新的本卡梯度元素量,不是累计 microbatch 数,也不是总显存。</text>
<text x="28" y="537" font-size="11" fill="#9ca3af">同 dtype、均匀分片;虚线全长是完整梯度。计数限本组每个 rank 的逻辑归约,不含其他组或参数 all-gather。</text>
<text x="28" y="564" font-size="11" fill="#9ca3af">3 次反向之后才做 1 次 optimizer step;图中位置表示先后顺序,不表示耗时。</text>
</g></svg>
