<text x="905" y="274" font-size="14" font-weight="700" fill="#111827">AR</text>
<rect x="790" y="301" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="790" y="301" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="925" y="318" font-size="11" fill="#6b7280">1/2</text>
<path d="M 453 315 H 506 m -7 -5 l 7 5 -7 5 M 713 315 H 766 m -7 -5 l 7 5 -7 5" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="28" y="405" font-size="14" font-weight="700" fill="#111827">只推迟 all-reduce</text>
<text x="28" y="431" font-size="11" fill="#6b7280">3 次 RS + 1 次 AR</text>
<rect x="270" y="381" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="295" y="401" font-size="14" font-weight="700" fill="#111827">RS</text>
