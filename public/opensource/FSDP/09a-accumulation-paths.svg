<text x="385" y="147" font-size="14" font-weight="700" fill="#111827">AR</text>
<rect x="270" y="174" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="270" y="174" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="405" y="191" font-size="11" fill="#6b7280">1/2</text>
<rect x="530" y="127" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="555" y="147" font-size="14" font-weight="700" fill="#111827">RS</text>
<rect x="620" y="127" width="74" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="645" y="147" font-size="14" font-weight="700" fill="#111827">AR</text>
<rect x="530" y="174" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="530" y="174" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="665" y="191" font-size="11" fill="#6b7280">1/2</text>
<rect x="790" y="127" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="815" y="147" font-size="14" font-weight="700" fill="#111827">RS</text>
<rect x="880" y="127" width="74" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="905" y="147" font-size="14" font-weight="700" fill="#111827">AR</text>
<rect x="790" y="174" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="790" y="174" width="60" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="925" y="191" font-size="11" fill="#6b7280">1/2</text>
<path d="M 453 188 H 506 m -7 -5 l 7 5 -7 5 M 713 188 H 766 m -7 -5 l 7 5 -7 5" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="28" y="278" font-size="14" font-weight="700" fill="#111827">完全推迟归约</text>
<text x="28" y="304" font-size="11" fill="#6b7280">1 次 RS + 1 次 AR</text>
<text x="270" y="275" font-size="13" fill="#6b7280">本次不归约</text>
<rect x="270" y="301" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="270" y="301" width="120" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="405" y="318" font-size="11" fill="#6b7280">完整</text>
<text x="530" y="275" font-size="13" fill="#6b7280">本次不归约</text>
<rect x="530" y="301" width="120" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="530" y="301" width="120" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="665" y="318" font-size="11" fill="#6b7280">完整</text>
<rect x="790" y="254" width="74" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
