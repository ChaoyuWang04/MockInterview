<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>

  <text x="40" y="46" font-size="19" font-weight="700" fill="#111827">流是 GPU 上的队伍,通信器是网线上的队伍</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">绿 = 反向计算,紫 = 凑参数,黄 = 打散梯度;上方是期望的提交关系,下方比较通信排队;上方不是默认实际执行时间线</text>

  <rect x="40" y="96" width="1040" height="176" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="40" y="288" width="1040" height="100" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="40" y="404" width="1040" height="140" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>

  <text x="56" y="120" font-size="13" fill="#6b7280">提交关系示意:m4 的参数已在图区开始前聚合</text>
  <text x="184" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="end">计算流</text>
  <text x="184" y="204" font-size="14" font-weight="700" fill="#111827" text-anchor="end">all-gather 流</text>
  <text x="184" y="252" font-size="14" font-weight="700" fill="#111827" text-anchor="end">reduce-scatter 流</text>

  <rect x="200" y="134" width="120" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="260" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m4</text>
  <rect x="320" y="134" width="120" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="380" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="440" y="134" width="120" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="500" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="560" y="134" width="120" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <text x="620" y="156" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>

  <rect x="210" y="182" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="250" y="204" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="330" y="182" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="370" y="204" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="450" y="182" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="490" y="204" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>

  <rect x="330" y="230" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="370" y="252" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m4</text>
  <rect x="450" y="230" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="490" y="252" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="570" y="230" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="610" y="252" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="690" y="230" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="730" y="252" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>

  <text x="56" y="312" font-size="13" fill="#6b7280">默认:凑参数和打散共用一个进程组,communicator一次只处理一件,于是在网线上排成一队</text>
  <text x="184" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="end">communicator</text>

  <rect x="210" y="326" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="250" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="330" y="326" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="370" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="410" y="326" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="450" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m4</text>
  <rect x="490" y="326" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="530" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>
  <rect x="570" y="326" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="610" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="650" y="326" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="690" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="730" y="326" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="770" y="348" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>

  <text x="56" y="428" font-size="13" fill="#6b7280">独立进程组:两类通信可并发,实际重叠还取决于计算依赖与网络资源</text>
  <text x="184" y="464" font-size="14" font-weight="700" fill="#111827" text-anchor="end">AG communicator</text>
  <text x="184" y="512" font-size="14" font-weight="700" fill="#111827" text-anchor="end">RS communicator</text>

  <rect x="210" y="442" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="250" y="464" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="330" y="442" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="370" y="464" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="450" y="442" width="80" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="490" y="464" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>

  <rect x="330" y="490" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="370" y="512" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m4</text>
  <rect x="450" y="490" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="490" y="512" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m3</text>
  <rect x="570" y="490" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="610" y="512" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m2</text>
  <rect x="690" y="490" width="80" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <text x="730" y="512" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">m1</text>

  <text x="800" y="204" font-size="11" fill="#9ca3af">这一格里 m2 在算、m1 在凑参数、m3 在打散</text>
  <text x="830" y="348" font-size="11" fill="#9ca3af">通信串行会改变完成时刻</text>
  <text x="800" y="512" font-size="11" fill="#9ca3af">两条队互不挡路</text>
  <text x="40" y="576" font-size="11" fill="#9ca3af">能不能真并发还要网络扛得住;这里只画排队规则,不画带宽,方块宽度也不代表实际耗时</text>
</svg>
