<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="602" viewBox="0 0 1120 602">
<rect width="1120" height="602" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<text x="28" y="34" font-size="19" font-weight="700" fill="#111827">切口属于长条,不属于某一个参数</text>
<text x="28" y="61" font-size="13" fill="#6b7280">3 个 FP32 参数,各 8 个元素 · 2 个 rank · 绿 = A,紫 = B,黄 = C;宽度与元素数成正比</text>
<text x="28" y="153" font-size="14" font-weight="700" fill="#111827">原参数</text>
<rect x="280" y="126" width="240" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="292" y="154" font-size="14" font-weight="700" fill="#111827">A · 8</text>
<rect x="540" y="126" width="240" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="552" y="154" font-size="14" font-weight="700" fill="#111827">B · 8</text>
<rect x="800" y="126" width="240" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="812" y="154" font-size="14" font-weight="700" fill="#111827">C · 8</text>
<text x="280" y="206" font-size="13" font-weight="400" fill="#6b7280">展平后按顺序拼接,记录形状与偏移</text>
<path d="M 640 181 V 227 m -5 -7 l 5 7 5 -7" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="28" y="281" font-size="14" font-weight="700" fill="#111827">完整 FlatParameter</text>
<rect x="280" y="253" width="240" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="292" y="281" font-size="14" font-weight="700" fill="#111827">A · 8</text>
<rect x="520" y="253" width="240" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="532" y="281" font-size="14" font-weight="700" fill="#111827">B · 8</text>
<rect x="760" y="253" width="240" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="772" y="281" font-size="14" font-weight="700" fill="#111827">C · 8</text>
<path d="M 640 238 V 313" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="653" y="326" font-size="13" font-weight="400" fill="#6b7280">12 / 24 处切开:B 横跨两片</text>
<text x="28" y="410" font-size="14" font-weight="700" fill="#111827">本地长条分片</text>
<rect x="280" y="383" width="240" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="292" y="411" font-size="14" font-weight="700" fill="#111827">A · 8</text>
<rect x="520" y="383" width="120" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="532" y="411" font-size="14" font-weight="700" fill="#111827">B 前半 · 4</text>
<rect x="660" y="383" width="120" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="672" y="411" font-size="14" font-weight="700" fill="#111827">B 后半 · 4</text>
<rect x="780" y="383" width="240" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="792" y="411" font-size="14" font-weight="700" fill="#111827">C · 8</text>
<text x="280" y="365" font-size="14" font-weight="700" fill="#111827">rank 0 · 12 元素</text>
<text x="660" y="365" font-size="14" font-weight="700" fill="#111827">rank 1 · 12 元素</text>
<path d="M 460 305 V 337 m -5 -7 l 5 7 5 -7 M 960 305 V 337 m -5 -7 l 5 7 5 -7" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="28" y="477" font-size="14" font-weight="700" fill="#111827">use_orig_params=True</text>
<text x="280" y="477" font-size="14" font-weight="700" fill="#111827">rank 0 的原对象视图:A → 8,B → 4,C → 0</text>
<text x="280" y="506" font-size="13" font-weight="400" fill="#6b7280">视图指向上面的同一片存储,不是再复制一套;C 对象仍在,本地数据为空。</text>
<text x="28" y="550" font-size="11" font-weight="400" fill="#9ca3af">本例各参数大小与起点满足 FP32 的 16 字节对齐,总长可被 2 整除,因此没有额外 padding。</text>
<text x="28" y="577" font-size="11" font-weight="400" fill="#9ca3af">示意普通连续参数,不含扩展变换;真实形状不满足对齐或整除条件时,还会加入 padding。</text>
</g></svg>
