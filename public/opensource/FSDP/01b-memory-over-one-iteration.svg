<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
  <text x="40" y="46" font-size="19" font-weight="700" fill="#111827">一个非根组的参数与梯度生命周期</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">4 卡均匀分片、同 dtype、前向后重分片;灰 = 分片参数,紫 = 完整参数,黄 = 梯度。横轴为阶段。</text>

  <line x1="140" y1="380" x2="1060" y2="380" stroke="#9ca3af" stroke-width="1.4"/>

  <rect x="160" y="355" width="110" height="25" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>

  <rect x="310" y="355" width="110" height="25" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <rect x="310" y="255" width="110" height="100" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>

  <rect x="460" y="355" width="110" height="25" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>

  <rect x="610" y="355" width="110" height="25" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <rect x="610" y="255" width="110" height="100" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>

  <rect x="760" y="355" width="110" height="25" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <rect x="760" y="255" width="110" height="100" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="760" y="155" width="110" height="100" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>

  <rect x="910" y="355" width="110" height="25" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
  <rect x="910" y="330" width="110" height="25" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>

  <text x="700" y="137" font-size="11" fill="#9ca3af">局部时刻:完整参数与梯度共存</text>

  <text x="215" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">一步开始</text>
  <text x="365" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">前向计算</text>
  <text x="515" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">算完释放</text>
  <text x="665" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">反向计算</text>
  <text x="815" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">反向算完</text>
  <text x="965" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">归约后更新</text>

  <text x="215" y="426" font-size="11" fill="#9ca3af" text-anchor="middle">手里只有自己那段</text>
  <text x="365" y="426" font-size="11" fill="#9ca3af" text-anchor="middle">all-gather 后</text>
  <text x="515" y="426" font-size="11" fill="#9ca3af" text-anchor="middle">立刻扔掉,回到起点</text>
  <text x="665" y="426" font-size="11" fill="#9ca3af" text-anchor="middle">再次 all-gather</text>
  <text x="815" y="426" font-size="11" fill="#9ca3af" text-anchor="middle">梯度也是完整形状</text>
  <text x="965" y="426" font-size="11" fill="#9ca3af" text-anchor="middle">reduce-scatter 后</text>

  <text x="140" y="462" font-size="11" fill="#9ca3af">只画本组参数与梯度,省略优化器状态、激活、其他组与通信缓冲;不是整步显存峰值曲线。</text>
</svg>
