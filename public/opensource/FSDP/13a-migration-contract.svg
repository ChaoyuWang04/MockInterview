<rect x="664" y="346" width="352" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="114" y="379" font-size="14" font-weight="700" fill="#111827">建立优化器，绑定处理后的参数</text>
<text x="684" y="379" font-size="14" font-weight="700" fill="#111827">建立优化器，绑定处理后的参数</text>
<path d="M270 400 V448 H420" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M840 400 V448 H700" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="428" y="421" width="264" height="65" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="448" y="446" font-size="14" font-weight="700" fill="#111827">统一状态字典入口</text>
<text x="448" y="470" font-size="11" fill="#6b7280">模型 ＋ 优化器，按规范参数名连接</text>
<text x="32" y="525" font-size="13" fill="#6b7280">共享入口帮助取写状态；不表示两代直接嵌套，也不保证任意旧 checkpoint 文件无需转换即可加载。</text>
<text x="32" y="550" font-size="11" fill="#9ca3af">两边的具体参数名与迁移配置都在第五节。</text>
