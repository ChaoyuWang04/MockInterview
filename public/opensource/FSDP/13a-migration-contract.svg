<text x="32" y="36" font-size="19" font-weight="700" fill="#111827">两套接入方式，共享状态连接点</text>
<text x="32" y="62" font-size="13" fill="#6b7280">紫：FSDP 接管机制；绿：模型；黄：各自的优化器；灰：统一状态接口。两边是独立实例。</text>
<text x="52" y="105" font-size="14" font-weight="700" fill="#111827">FSDP1：外层包装持有模型</text>
<text x="622" y="105" font-size="14" font-weight="700" fill="#111827">FSDP2：原模型加入 hooks 与方法</text>
<rect x="52" y="125" width="436" height="178" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="72" y="153" font-size="14" font-weight="700" fill="#111827">wrapper</text>
<rect x="94" y="174" width="352" height="104" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="114" y="205" font-size="14" font-weight="700" fill="#111827">原模型</text>
<text x="114" y="231" font-size="11" fill="#6b7280">暴露 flat 参数，或暴露原参数视图</text>
<text x="114" y="253" font-size="11" fill="#6b7280">由包装选项决定优化器看到什么</text>
<rect x="622" y="125" width="436" height="178" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="642" y="153" font-size="14" font-weight="700" fill="#111827">同一个模型对象</text>
<rect x="644" y="174" width="392" height="38" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="660" y="198" font-size="14" font-weight="700" fill="#111827">加入 hooks 与分片方法</text>
<text x="642" y="240" font-size="11" fill="#6b7280">逐参数 DTensor，保留原来的完整参数名</text>
<text x="642" y="265" font-size="11" fill="#6b7280">模型身份不变，不代表参数对象不变</text>
<path d="M270 309 V337" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M840 309 V337" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
