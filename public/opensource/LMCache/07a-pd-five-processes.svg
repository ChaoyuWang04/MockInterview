<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="ar-y" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d4a24c"/></marker>
    <marker id="ar-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">PD 五进程：当前请求走引擎侧，跨请求才进 LMCache</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">灰 = 路由器。紫 = 推理引擎。绿 = 同机独立缓存服务。黄实线 = 当前请求的预填充到译码（NIXL）。绿虚线 = 跨请求卸载。没有从缓存服务指向译码引擎的黄线。</text>

  <rect x="360" y="78" width="400" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="560" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">路由器</text>
  <text x="560" y="130" font-size="11" fill="#6b7280" text-anchor="middle">先预填充、再译码；串起引擎侧握手</text>

  <rect x="24" y="200" width="520" height="430" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="224" font-size="13" fill="#6b7280">预填充主机（生产者）</text>

  <rect x="576" y="200" width="520" height="430" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="592" y="224" font-size="13" fill="#6b7280">译码主机（消费者）</text>

  <line x1="480" y1="150" x2="284" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="640" y1="150" x2="836" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="56" y="248" width="456" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="284" y="288" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">预填充引擎</text>
  <text x="284" y="310" font-size="11" fill="#6b7280" text-anchor="middle">算 prompt 的 KV</text>
  <text x="284" y="328" font-size="11" fill="#6b7280" text-anchor="middle">组合连接器：NIXL 生产者 + 本仓多进程连接器</text>
  <text x="284" y="346" font-size="11" fill="#6b7280" text-anchor="middle">当前请求交给 NIXL，不经过下方面板</text>

  <rect x="608" y="248" width="456" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="836" y="288" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">译码引擎</text>
  <text x="836" y="310" font-size="11" fill="#6b7280" text-anchor="middle">拉当前请求的 prompt KV 再生成</text>
  <text x="836" y="328" font-size="11" fill="#6b7280" text-anchor="middle">组合连接器：NIXL 消费者 + 本仓多进程连接器</text>
  <text x="836" y="346" font-size="11" fill="#6b7280" text-anchor="middle">当前请求从左边引擎来，不从缓存服务来</text>

  <line x1="512" y1="308" x2="604" y2="308" stroke="#d4a24c" stroke-width="2.2" marker-end="url(#ar-y)"/>
  <text x="560" y="296" font-size="11" fill="#d4a24c" text-anchor="middle">当前请求 P→D</text>
  <text x="560" y="336" font-size="11" fill="#d4a24c" text-anchor="middle">NIXL / UCX / RDMA</text>

  <rect x="56" y="460" width="456" height="140" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="284" y="504" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">预填充侧 lmcache server</text>
  <text x="284" y="526" font-size="11" fill="#6b7280" text-anchor="middle">只服务这一台预填充引擎</text>
  <text x="284" y="544" font-size="11" fill="#6b7280" text-anchor="middle">跨请求复用：本地 GPU → 本机热层 → 重算</text>
  <text x="284" y="562" font-size="11" fill="#6b7280" text-anchor="middle">不把当前请求的 prompt KV 送给译码</text>

  <rect x="608" y="460" width="456" height="140" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="836" y="504" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">译码侧 lmcache server</text>
  <text x="836" y="526" font-size="11" fill="#6b7280" text-anchor="middle">只服务这一台译码引擎</text>
  <text x="836" y="544" font-size="11" fill="#6b7280" text-anchor="middle">另一份热层，端口和身份都要分开</text>
  <text x="836" y="562" font-size="11" fill="#6b7280" text-anchor="middle">两台服务不得共用一个</text>

  <line x1="284" y1="368" x2="284" y2="456" stroke="#5fa886" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-g)"/>
  <line x1="836" y1="368" x2="836" y2="456" stroke="#5fa886" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-g)"/>
  <text x="168" y="420" font-size="11" fill="#5fa886">跨请求卸载</text>
  <text x="920" y="420" font-size="11" fill="#5fa886">跨请求卸载</text>

  <text x="560" y="656" font-size="11" fill="#9ca3af" text-anchor="middle">跨预填充池和译码池复用再叠点对点，见 06 章；本图不画那条边</text>
</svg>
