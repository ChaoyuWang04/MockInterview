<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="ar10g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">管理面：推荐路径实际有的，和文档尚未落地的</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">绿 = 推荐独立服务里已落地，紫 = 引擎侧探活，黄 = 遗留进程内控制器，灰虚线 = 多进程文档仍标未齐。实线不从推荐服务连到钉住/搬走/压缩。</text>

  <rect x="24" y="78" width="1072" height="318" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="102" font-size="13" fill="#6b7280">推荐：独立缓存服务进程。管理模块必装，不管钉住</text>

  <rect x="48" y="124" width="200" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="148" y="154" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">引擎连接器</text>
  <text x="148" y="176" font-size="11" fill="#6b7280" text-anchor="middle">探活带实例号</text>

  <rect x="48" y="220" width="200" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="148" y="250" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">运维 / CLI</text>
  <text x="148" y="272" font-size="11" fill="#6b7280" text-anchor="middle">打探活口，不打请求口</text>

  <rect x="300" y="116" width="520" height="256" rx="8" fill="#ffffff" stroke="#5fa886" stroke-width="1.4"/>
  <text x="316" y="140" font-size="13" fill="#6b7280">独立缓存服务</text>

  <rect x="320" y="156" width="220" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="430" y="182" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">请求口</text>
  <text x="430" y="202" font-size="11" fill="#6b7280" text-anchor="middle">探活、问块大小、清空</text>

  <rect x="560" y="156" width="236" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="678" y="182" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">探活口</text>
  <text x="678" y="202" font-size="11" fill="#6b7280" text-anchor="middle">HTTP 清热层；按键删、预取</text>

  <rect x="320" y="244" width="476" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="558" y="268" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">管理模块</text>
  <text x="558" y="286" font-size="11" fill="#6b7280" text-anchor="middle">清空加锁；收尸扫沉默的 worker</text>

  <rect x="320" y="316" width="220" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="430" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主机热层</text>
  <rect x="560" y="316" width="236" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="678" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">传输上的存活登记</text>

  <rect x="848" y="124" width="224" height="248" rx="8" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="960" y="152" font-size="13" fill="#6b7280" text-anchor="middle">多进程文档：尚未落地</text>
  <rect x="868" y="172" width="184" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="960" y="202" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">钉住</text>
  <rect x="868" y="232" width="184" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="960" y="262" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">搬走</text>
  <rect x="868" y="292" width="184" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="960" y="322" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">压缩</text>

  <line x1="248" y1="160" x2="296" y2="160" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <text x="272" y="150" font-size="11" fill="#9ca3af" text-anchor="middle">探活</text>
  <line x1="248" y1="256" x2="560" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <text x="300" y="230" font-size="11" fill="#9ca3af">清空 HTTP</text>
  <line x1="430" y1="220" x2="430" y2="242" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <line x1="678" y1="220" x2="600" y2="242" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <line x1="430" y1="300" x2="430" y2="314" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <text x="500" y="312" font-size="11" fill="#9ca3af">默认不碰锁着的对象</text>
  <line x1="678" y1="300" x2="678" y2="314" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <text x="790" y="312" font-size="11" fill="#9ca3af">收尸</text>

  <rect x="24" y="414" width="1072" height="186" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="438" font-size="13" fill="#6b7280">遗留：进程内控制器。钉住、搬走、压缩只在这里，不是推荐热路径</text>

  <rect x="48" y="456" width="240" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="168" y="500" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">推理引擎进程</text>
  <text x="168" y="522" font-size="11" fill="#6b7280" text-anchor="middle">worker 线程挂号</text>
  <text x="168" y="542" font-size="11" fill="#6b7280" text-anchor="middle">跟引擎同生共死</text>

  <rect x="336" y="456" width="360" height="120" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="516" y="492" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">进程内控制器进程</text>
  <text x="516" y="514" font-size="11" fill="#6b7280" text-anchor="middle">默认端口 9000</text>
  <text x="516" y="534" font-size="11" fill="#6b7280" text-anchor="middle">钉住 / 搬走 / 压缩 / 按位置清空</text>
  <text x="516" y="554" font-size="11" fill="#6b7280" text-anchor="middle">网页控制台不接到推荐服务</text>

  <rect x="744" y="456" width="328" height="120" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="908" y="504" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">各 rank 的 worker</text>
  <text x="908" y="528" font-size="11" fill="#6b7280" text-anchor="middle">集群执行器把命令打下去</text>

  <line x1="288" y1="516" x2="332" y2="516" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
  <line x1="696" y1="516" x2="740" y2="516" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar10)"/>
</svg>
