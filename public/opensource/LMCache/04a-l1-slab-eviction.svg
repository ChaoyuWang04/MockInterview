<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">热层是一块钉住的板：先切空位，水位到了再赶块</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 引擎侧拷贝，绿 = 本机热层板，黄 = 对象账与读写锁，红 = 后台水位驱逐。实线 = 会走的路径，虚线 = 水位未到则跳过。</text>

  <rect x="24" y="78" width="200" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="124" y="112" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">引擎 GPU</text>
  <text x="124" y="134" font-size="11" fill="#6b7280" text-anchor="middle">要把块搬进搬出</text>
  <text x="124" y="152" font-size="11" fill="#6b7280" text-anchor="middle">碰不到碎页就堵</text>

  <rect x="268" y="78" width="828" height="232" rx="8" fill="#ffffff" stroke="#5fa886" stroke-width="1.4"/>
  <text x="284" y="102" font-size="13" fill="#6b7280">独立服务进程里的热层（三选一，同时只开一种）</text>

  <rect x="284" y="118" width="248" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="408" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">钉住的主机内存</text>
  <text x="408" y="170" font-size="11" fill="#6b7280" text-anchor="middle">默认可后台长大，默认开</text>
  <text x="408" y="186" font-size="11" fill="#6b7280" text-anchor="middle">一块连续区，可整段登记</text>

  <rect x="548" y="118" width="248" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="672" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">GDS 板</text>
  <text x="672" y="170" font-size="11" fill="#6b7280" text-anchor="middle">开了就关掉钉住内存</text>
  <text x="672" y="186" font-size="11" fill="#6b7280" text-anchor="middle">不是一整块可登记内存</text>

  <rect x="812" y="118" width="260" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="942" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Device-DAX</text>
  <text x="942" y="170" font-size="11" fill="#6b7280" text-anchor="middle">开了就关掉纯 CPU 热层</text>
  <text x="942" y="186" font-size="11" fill="#6b7280" text-anchor="middle">同样不能整段登记</text>

  <rect x="284" y="214" width="776" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="672" y="244" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">空闲表：对齐后从左往右找第一块够大的</text>
  <text x="672" y="268" font-size="11" fill="#6b7280" text-anchor="middle">总字节够但没有连续空位 → 分配失败，整批回滚。释放时相邻空位会并回去。</text>

  <line x1="224" y1="122" x2="264" y2="122" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="244" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">DMA 拷贝</text>
  <line x1="408" y1="198" x2="408" y2="212" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="24" y="334" width="520" height="128" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="284" y="366" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">对象账：先占写锁再切空位</text>
  <text x="284" y="390" font-size="11" fill="#6b7280" text-anchor="middle">新键一次性要一整批；切不到就全标内存不够</text>
  <text x="284" y="410" font-size="11" fill="#6b7280" text-anchor="middle">读锁未放、写锁未放的键，后台不许赶</text>
  <text x="284" y="430" font-size="11" fill="#6b7280" text-anchor="middle">写锁默认 600 秒过期，读锁默认 300 秒</text>

  <rect x="568" y="334" width="528" height="128" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
  <text x="832" y="366" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">驱逐环：每秒看占用比</text>
  <text x="832" y="390" font-size="11" fill="#6b7280" text-anchor="middle">占用 / 当前堆 &lt; 0.8 → 本轮不赶（虚线）</text>
  <text x="832" y="410" font-size="11" fill="#6b7280" text-anchor="middle">到了水位：按策略挑最旧的，丢掉约 0.2 已分配</text>
  <text x="832" y="430" font-size="11" fill="#6b7280" text-anchor="middle">热层丢掉就是丢掉，不在这里泄到冷层</text>

  <line x1="408" y1="294" x2="284" y2="332" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="832" y1="294" x2="832" y2="332" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="544" y1="398" x2="564" y2="398" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="700" y1="462" x2="700" y2="490" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <rect x="24" y="500" width="1072" height="96" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="560" y="536" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">水位未到：环空转，不删键</text>
  <text x="560" y="562" font-size="11" fill="#6b7280" text-anchor="middle">懒增长时「当前堆」是已经提交的那一段，不是启动时填的上限。用上限当分母会把水位算错。</text>
</svg>
