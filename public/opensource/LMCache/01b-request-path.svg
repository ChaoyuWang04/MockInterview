<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">推荐路径上，一条请求怎么问独立缓存服务</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 引擎侧连接器发出的动作，绿 = 缓存服务里真正干活的模块。查找先于取回；没命中的块引擎自己算，算完再交给存储。</text>

  <rect x="24" y="80" width="1072" height="100" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="104" font-size="13" fill="#6b7280">推理引擎进程</text>
  <rect x="48" y="118" width="196" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="146" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">1 登记显存</text>
  <rect x="268" y="118" width="196" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="366" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">2 查找</text>
  <rect x="488" y="118" width="196" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="586" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">3 取回或自算</text>
  <rect x="708" y="118" width="176" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="796" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">4 存新块</text>
  <rect x="908" y="118" width="168" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="992" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">5 结束会话</text>
  <line x1="244" y1="142" x2="264" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="464" y1="142" x2="484" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="684" y1="142" x2="704" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="884" y1="142" x2="904" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>

  <rect x="24" y="204" width="1072" height="248" rx="8" fill="#ffffff" stroke="#5fa886" stroke-width="1.4"/>
  <text x="40" y="228" font-size="13" fill="#6b7280">独立缓存服务进程（请求口，不是探活口）</text>

  <rect x="48" y="248" width="240" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="168" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">传输模块</text>
  <text x="168" y="300" font-size="11" fill="#6b7280" text-anchor="middle">登记、取回、存储</text>

  <rect x="320" y="248" width="240" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="440" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">查找模块</text>
  <text x="440" y="300" font-size="11" fill="#6b7280" text-anchor="middle">按块键预取，可轮询进度</text>

  <rect x="592" y="248" width="240" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="712" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">管理模块</text>
  <text x="712" y="300" font-size="11" fill="#6b7280" text-anchor="middle">清空、探活、回收失联实例</text>

  <rect x="864" y="248" width="208" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="968" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主机热层</text>
  <text x="968" y="300" font-size="11" fill="#6b7280" text-anchor="middle">块实际住在这里</text>

  <text x="40" y="360" font-size="13" fill="#6b7280">默认传输由缓存服务自己搬；换成引擎驱动时，第 3、4 步改成准备 / 提交，查找模块不变。</text>
  <text x="40" y="384" font-size="13" fill="#6b7280">点对点控制器会进模块列表，但没配广告地址时不拉起编排线程，图上不画热路径箭头。</text>
  <text x="40" y="416" font-size="11" fill="#9ca3af">未命中的箭头停在引擎「自己算」，不会从查找模块指向热层里一块不存在的数据。</text>
</svg>
