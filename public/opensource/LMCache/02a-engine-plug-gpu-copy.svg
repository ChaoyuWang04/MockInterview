<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">引擎只提供钩子，本仓适配层认布局再搬显存</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = 推理引擎进程（内核不动），绿 = 本仓适配层，黄 = 显存搬运与布局识别，灰 = 独立缓存服务。实线 = 登记与搬砖，虚线 = 查找请求。</text>

  <rect x="24" y="78" width="1072" height="248" rx="8" fill="#ffffff" stroke="#8f8bd8" stroke-width="1.4"/>
  <text x="40" y="102" font-size="13" fill="#6b7280">同一个推理引擎进程：调度与前向仍在引擎里，连接器只实现引擎规定的钩子</text>

  <rect x="48" y="120" width="232" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="164" y="152" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">调度与前向</text>
  <text x="164" y="174" font-size="11" fill="#6b7280" text-anchor="middle">不改注意力内核</text>
  <text x="164" y="192" font-size="11" fill="#6b7280" text-anchor="middle">只在规定时机回调</text>

  <rect x="320" y="120" width="248" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="444" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">本仓适配层</text>
  <text x="444" y="170" font-size="11" fill="#6b7280" text-anchor="middle">实现登记、加载、保存钩子</text>
  <text x="444" y="188" font-size="11" fill="#6b7280" text-anchor="middle">代码住在本仓，不进引擎仓</text>

  <rect x="608" y="120" width="232" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="724" y="148" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">布局识别</text>
  <text x="724" y="170" font-size="11" fill="#6b7280" text-anchor="middle">看张量形状与引擎提示</text>
  <text x="724" y="188" font-size="11" fill="#6b7280" text-anchor="middle">对不上就拒绝，不瞎搬</text>

  <rect x="872" y="120" width="200" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
  <text x="972" y="152" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">显存搬运器</text>
  <text x="972" y="174" font-size="11" fill="#6b7280" text-anchor="middle">按页块拷进拷出</text>
  <text x="972" y="192" font-size="11" fill="#6b7280" text-anchor="middle">引擎类型决定实现</text>

  <rect x="48" y="232" width="504" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
  <text x="300" y="262" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">引擎侧分页 KV 显存</text>
  <text x="300" y="284" font-size="11" fill="#6b7280" text-anchor="middle">块的物理排布归引擎；搬运器必须按识别结果寻址</text>

  <rect x="608" y="232" width="464" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
  <text x="840" y="262" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">登记时一次性认出格式</text>
  <text x="840" y="284" font-size="11" fill="#6b7280" text-anchor="middle">之后每步搬砖只带块号，不再猜布局</text>

  <line x1="280" y1="164" x2="316" y2="164" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="568" y1="164" x2="604" y2="164" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="840" y1="164" x2="868" y2="164" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="300" y1="208" x2="300" y2="228" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="972" y1="208" x2="972" y2="228" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <text x="300" y="224" font-size="11" fill="#9ca3af" text-anchor="middle">登记显存</text>
  <text x="848" y="224" font-size="11" fill="#9ca3af" text-anchor="middle">识别结果交给搬运</text>

  <rect x="24" y="348" width="1072" height="188" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="372" font-size="13" fill="#6b7280">推荐路径：查找和热层在独立缓存服务进程，引擎进程只负责钩子和搬砖</text>

  <rect x="48" y="396" width="320" height="112" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="208" y="436" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">请求服务</text>
  <text x="208" y="458" font-size="11" fill="#6b7280" text-anchor="middle">查找、取回、存新块</text>
  <text x="208" y="476" font-size="11" fill="#6b7280" text-anchor="middle">不改引擎内核</text>

  <rect x="424" y="396" width="320" height="112" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
  <text x="584" y="436" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主机热层</text>
  <text x="584" y="458" font-size="11" fill="#6b7280" text-anchor="middle">块已经按本仓格式排好</text>
  <text x="584" y="476" font-size="11" fill="#6b7280" text-anchor="middle">与引擎分页布局解耦</text>

  <rect x="800" y="396" width="272" height="112" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="936" y="436" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">遗留进程内引擎</text>
  <text x="936" y="458" font-size="11" fill="#6b7280" text-anchor="middle">搬运器仍在本仓</text>
  <text x="936" y="476" font-size="11" fill="#6b7280" text-anchor="middle">热层跟引擎共命运</text>

  <line x1="444" y1="326" x2="208" y2="392" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar2)"/>
  <line x1="368" y1="452" x2="420" y2="452" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar2)"/>
  <text x="300" y="340" font-size="11" fill="#9ca3af" text-anchor="middle">查找（虚线，不搬整块权重）</text>
</svg>
