<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="24" y="36" font-size="19" font-weight="700" fill="#111827">VeOmni 一次训练:构造期分两半,每一步先在 CPU 备好微批</text>
  <text x="24" y="60" font-size="13" fill="#6b7280">紫色是 trainer 管的作业级步骤,绿色是模型运行时在自己的并行拓扑下做的事,黄色在 dataloader 的 CPU 进程里完成</text>

  <!-- 左:构造期 -->
  <rect x="24" y="84" width="516" height="536" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#111827">构造期 · 只走一次</text>

  <rect x="48" y="122" width="468" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="64" y="143" font-size="14" font-weight="700" fill="#111827">① 作业级准备</text>
  <text x="64" y="162" font-size="11" fill="#6b7280">初始化进程组 · 注册名为 base 的并行拓扑 · 设随机种子</text>

  <line x1="282" y1="172" x2="282" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="48" y="190" width="468" height="286" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="64" y="212" font-size="14" font-weight="700" fill="#111827">② 模型运行时:构造它就等于建好模型</text>
  <text x="64" y="230" font-size="11" fill="#6b7280">以下六步全部在这个模型自己的并行拓扑下执行</text>

  <rect x="68" y="242" width="428" height="30" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="84" y="262" font-size="14" font-weight="700" fill="#111827">取类</text>
  <text x="160" y="261" font-size="11" fill="#6b7280">注册表按模型类型取出生成的 modeling 类</text>

  <rect x="68" y="280" width="428" height="30" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="84" y="300" font-size="14" font-weight="700" fill="#111827">绑算子</text>
  <text x="160" y="299" font-size="11" fill="#6b7280">按配置与硬件把各算子空位绑上实现</text>

  <rect x="68" y="318" width="428" height="30" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="84" y="338" font-size="14" font-weight="700" fill="#111827">建空壳</text>
  <text x="160" y="337" font-size="11" fill="#6b7280">在元设备上搭出结构,不分配显存</text>

  <rect x="68" y="356" width="428" height="30" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="84" y="376" font-size="14" font-weight="700" fill="#111827">定可训</text>
  <text x="160" y="375" font-size="11" fill="#6b7280">冻结不训的部分,或挂上 LoRA</text>

  <rect x="68" y="394" width="428" height="30" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="84" y="414" font-size="14" font-weight="700" fill="#111827">切与装</text>
  <text x="160" y="413" font-size="11" fill="#6b7280">先按并行计划切额外并行,再逐层 FSDP2 分片,后装权重</text>

  <rect x="68" y="432" width="428" height="30" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="84" y="452" font-size="14" font-weight="700" fill="#111827">优化器</text>
  <text x="160" y="451" font-size="11" fill="#6b7280">按分片之后的参数建优化器</text>

  <line x1="282" y1="476" x2="282" y2="494" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="48" y="496" width="468" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="64" y="517" font-size="14" font-weight="700" fill="#111827">③ 数据管线</text>
  <text x="64" y="536" font-size="11" fill="#6b7280">同一套拓扑下依次建:数据变换 → 数据集 → collator → dataloader</text>

  <line x1="282" y1="546" x2="282" y2="560" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="48" y="562" width="468" height="46" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="64" y="582" font-size="14" font-weight="700" fill="#111827">④ 学习率调度器与回调</text>
  <text x="64" y="599" font-size="11" fill="#6b7280">数据集建好才知道一共多少步,所以调度器最后建</text>

  <!-- 构造期 → 每一步 -->
  <line x1="540" y1="352" x2="578" y2="352" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 右:每一步 -->
  <rect x="580" y="84" width="516" height="536" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="596" y="108" font-size="14" font-weight="700" fill="#111827">每一步 · 重复到训练结束</text>

  <rect x="604" y="122" width="468" height="94" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="620" y="143" font-size="14" font-weight="700" fill="#111827">dataloader:微批在 CPU 进程里就备好</text>
  <text x="620" y="163" font-size="11" fill="#6b7280">去掉 padding 首尾相接,样本边界记成位置编号</text>
  <text x="620" y="182" font-size="11" fill="#6b7280">开了序列并行:在这里按 rank 切好</text>
  <text x="620" y="201" font-size="11" fill="#6b7280">开了动态批:按 token 预算决定每个微批装几条样本</text>

  <line x1="640" y1="216" x2="640" y2="260" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="654" y="243" font-size="11" fill="#9ca3af">一组微批:个数 = 全局批 ÷(微批大小 × 数据并行度)</text>

  <rect x="604" y="262" width="468" height="46" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="620" y="282" font-size="14" font-weight="700" fill="#111827">全局有效 token 数先归约一次</text>
  <text x="620" y="299" font-size="11" fill="#6b7280">loss 按它平均,不管每张卡分到多长的样本,每个 token 权重相同</text>

  <line x1="838" y1="308" x2="838" y2="326" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="604" y="328" width="468" height="118" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="620" y="349" font-size="14" font-weight="700" fill="#111827">逐个微批</text>
  <text x="700" y="349" font-size="11" fill="#6b7280">在这个模型自己的并行拓扑下前向、反向</text>
  <rect x="624" y="362" width="190" height="34" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="719" y="384" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">前向</text>
  <rect x="862" y="362" width="190" height="34" rx="6" fill="#ffffff" stroke="#5fa886"/>
  <text x="957" y="384" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">反向</text>
  <line x1="814" y1="379" x2="860" y2="379" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M957,396 L957,416 L719,416 L719,398" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="838" y="434" font-size="11" fill="#6b7280" text-anchor="middle">下一个微批</text>

  <line x1="838" y1="446" x2="838" y2="464" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="604" y="466" width="468" height="46" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="620" y="486" font-size="14" font-weight="700" fill="#111827">裁剪梯度 → 优化器 → 调度器</text>
  <text x="620" y="503" font-size="11" fill="#6b7280">裁剪读的是这个模型自己的分片组与专家组</text>

  <line x1="838" y1="512" x2="838" y2="530" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="604" y="532" width="468" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="620" y="553" font-size="14" font-weight="700" fill="#111827">回调按顺序执行</text>
  <text x="620" y="573" font-size="11" fill="#6b7280">指标与 MFU → checkpoint → 评估</text>
  <text x="620" y="592" font-size="11" fill="#6b7280">checkpoint 先写权重、后写数据游标:中间崩了只丢游标</text>
</svg>
