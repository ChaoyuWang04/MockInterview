<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#111827">一层 MoE 的专家 LoRA:底座一块融合张量,挂三对 A、B</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">以 Qwen3-30B-A3B 一层为例:128 个专家、H 2048、I 768,秩 r 16;8 卡、专家并行度 8</text>
  <text x="40" y="80" font-size="13" fill="#6b7280">灰 = 冻结的底座专家张量;绿 = 独立模式的 A、B(每个专家一对);紫 = 共享模式的 A、B(整层一对)</text>

  <rect x="24" y="100" width="560" height="520" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="44" y="128" font-size="14" font-weight="700" fill="#111827">一个专家 e 上的三对 A、B</text>
  <text x="44" y="148" font-size="11" fill="#6b7280">矩形按 1/10 画,r 方向放大 5 倍;增量 = B · A · 缩放,加在同名底座输出上</text>

  <rect x="36" y="168" width="222" height="187" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="44" y="176" width="205" height="77" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="146" y="210" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">gate 半</text>
  <text x="146" y="228" font-size="11" fill="#6b7280" text-anchor="middle">[768, 2048]</text>
  <rect x="44" y="270" width="205" height="77" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="146" y="304" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">up 半</text>
  <text x="146" y="322" font-size="11" fill="#6b7280" text-anchor="middle">[768, 2048]</text>
  <text x="44" y="372" font-size="11" fill="#9ca3af">虚框:底座里 gate 与 up 是同一块 [1536, 2048] 的上下两半</text>

  <rect x="282" y="176" width="8" height="77" rx="2" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="300" y="176" width="205" height="8" rx="2" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="300" y="204" font-size="11" fill="#6b7280">A [16, 2048](横条)</text>
  <text x="300" y="222" font-size="11" fill="#6b7280">B [768, 16](竖条)</text>
  <text x="300" y="240" font-size="11" fill="#9ca3af">B · A 正好是 [768, 2048]</text>

  <rect x="282" y="270" width="8" height="77" rx="2" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="300" y="270" width="205" height="8" rx="2" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="300" y="298" font-size="11" fill="#6b7280">A [16, 2048]</text>
  <text x="300" y="316" font-size="11" fill="#6b7280">B [768, 16]</text>
  <text x="300" y="334" font-size="11" fill="#9ca3af">SiLU 夹在 gate 与 up 之间,</text>
  <text x="300" y="350" font-size="11" fill="#9ca3af">所以两半各挂一对,增量加在激活之前</text>

  <rect x="44" y="392" width="77" height="205" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="82" y="488" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">down</text>
  <text x="82" y="506" font-size="11" fill="#6b7280" text-anchor="middle">[2048, 768]</text>
  <rect x="141" y="392" width="8" height="205" rx="2" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="159" y="392" width="77" height="8" rx="2" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="252" y="402" font-size="11" fill="#6b7280">A [16, 768]</text>
  <text x="252" y="420" font-size="11" fill="#6b7280">B [2048, 16]</text>
  <text x="252" y="446" font-size="11" fill="#9ca3af">down 只有一对:它的输入是</text>
  <text x="252" y="462" font-size="11" fill="#9ca3af">激活之后、每个专家各自的中间结果</text>
  <text x="252" y="496" font-size="11" fill="#6b7280">独立模式:三对都在最前面多一维 128,</text>
  <text x="252" y="512" font-size="11" fill="#6b7280">例如 A [128, 16, 2048]</text>
  <text x="252" y="538" font-size="11" fill="#6b7280">共享模式:形状就是左边这三对,</text>
  <text x="252" y="554" font-size="11" fill="#6b7280">128 个专家共用</text>

  <rect x="604" y="100" width="492" height="520" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="624" y="128" font-size="14" font-weight="700" fill="#111827">专家并行 8:每张卡持有哪几份</text>
  <text x="624" y="148" font-size="11" fill="#6b7280">128 个专家按第 0 维切 8 份,每卡 16 个;格子里是这张卡上的专家编号</text>

  <text x="650" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 0</text>
  <text x="708" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 1</text>
  <text x="766" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 2</text>
  <text x="824" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 3</text>
  <text x="882" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 4</text>
  <text x="940" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 5</text>
  <text x="998" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 6</text>
  <text x="1056" y="172" font-size="11" fill="#6b7280" text-anchor="middle">rank 7</text>

  <rect x="624" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="650" y="206" font-size="11" fill="#111827" text-anchor="middle">0–15</text>
  <rect x="682" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="708" y="206" font-size="11" fill="#111827" text-anchor="middle">16–31</text>
  <rect x="740" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="766" y="206" font-size="11" fill="#111827" text-anchor="middle">32–47</text>
  <rect x="798" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="824" y="206" font-size="11" fill="#111827" text-anchor="middle">48–63</text>
  <rect x="856" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="882" y="206" font-size="11" fill="#111827" text-anchor="middle">64–79</text>
  <rect x="914" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="940" y="206" font-size="11" fill="#111827" text-anchor="middle">80–95</text>
  <rect x="972" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="998" y="206" font-size="11" fill="#111827" text-anchor="middle">96–111</text>
  <rect x="1030" y="180" width="52" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="1056" y="206" font-size="11" fill="#111827" text-anchor="middle">112–127</text>
  <text x="624" y="244" font-size="11" fill="#6b7280">底座:每卡 [16, 1536, 2048] 与 [16, 2048, 768]</text>

  <rect x="624" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="650" y="288" font-size="11" fill="#111827" text-anchor="middle">0–15</text>
  <rect x="682" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="708" y="288" font-size="11" fill="#111827" text-anchor="middle">16–31</text>
  <rect x="740" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="766" y="288" font-size="11" fill="#111827" text-anchor="middle">32–47</text>
  <rect x="798" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="824" y="288" font-size="11" fill="#111827" text-anchor="middle">48–63</text>
  <rect x="856" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="882" y="288" font-size="11" fill="#111827" text-anchor="middle">64–79</text>
  <rect x="914" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="940" y="288" font-size="11" fill="#111827" text-anchor="middle">80–95</text>
  <rect x="972" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="998" y="288" font-size="11" fill="#111827" text-anchor="middle">96–111</text>
  <rect x="1030" y="262" width="52" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="1056" y="288" font-size="11" fill="#111827" text-anchor="middle">112–127</text>
  <text x="624" y="326" font-size="11" fill="#6b7280">独立模式:A、B 随底座一起按第 0 维切,编号一一对上</text>
  <text x="624" y="342" font-size="11" fill="#6b7280">每卡 gate 的 A [16, 16, 2048]、B [16, 768, 16],up 与 down 同理</text>

  <rect x="624" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="650" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="682" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="708" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="740" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="766" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="798" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="824" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="856" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="882" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="914" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="940" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="972" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="998" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <rect x="1030" y="360" width="52" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="1056" y="386" font-size="11" fill="#111827" text-anchor="middle">整份</text>
  <line x1="650" y1="416" x2="1056" y2="416" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="650" y1="408" x2="650" y2="416" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="1056" y1="408" x2="1056" y2="416" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="853" y="434" font-size="11" fill="#6b7280" text-anchor="middle">反向后 8 卡对这组梯度求和</text>
  <text x="624" y="462" font-size="11" fill="#6b7280">共享模式:A、B 没有专家维,每卡一份完整的 [16, 2048] 与 [768, 16]</text>
  <text x="624" y="486" font-size="11" fill="#9ca3af">每卡只见到本卡 16 个专家贡献的那份梯度;不求和,</text>
  <text x="624" y="502" font-size="11" fill="#9ca3af">8 份共享 A、B 从第一步起就各走各的</text>
  <text x="624" y="526" font-size="11" fill="#9ca3af">算梯度范数时这组参数只计一次,不按 8 卡重复累加</text>
</svg>
