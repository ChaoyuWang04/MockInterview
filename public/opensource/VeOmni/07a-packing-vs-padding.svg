  <text x="214" y="292" font-size="11" fill="#6b7280">D · 4</text>
  <text x="40" y="348" font-size="11" font-weight="700" fill="#111827">这一步的计算量</text>
  <text x="40" y="375" font-size="11" font-weight="700" fill="#111827">rank 0</text>
