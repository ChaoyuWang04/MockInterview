  <text x="266.0" y="404" font-size="11" fill="#111827" text-anchor="middle">等 10</text>
  <text x="40" y="436" font-size="11" fill="#9ca3af">padding 的 8 格照样要算;rank 1 算完 8 格,等 rank 0 的 18 格</text>
  <text x="556" y="124" font-size="14" font-weight="700" fill="#111827">去 padding、按 token 预算凑批:每个微批预算 12</text>
  <text x="556" y="142" font-size="11" fill="#6b7280">每个 rank 按顺序扫自己的缓冲区,放得下就放,凑到 12 就停</text>
