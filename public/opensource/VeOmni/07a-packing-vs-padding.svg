  <text x="24" y="36" font-size="19" font-weight="700" fill="#111827">同样的样本流,两个数据并行 rank:按条数补齐成矩形,和去 padding 按 token 预算凑批</text>
  <text x="24" y="60" font-size="13" fill="#6b7280">绿格是真 token,格里的数字是位置编号,每条样本从 0 重新数,粗竖线是样本边界;灰格是 padding;黄块是缓冲区里的样本,宽度按 token 数,虚线的这一步没被选中</text>
  <text x="24" y="80" font-size="13" fill="#6b7280">紫条是这一步的计算量,1 格 1 个 token 位置;红条是算完之后在梯度同步处等别的 rank</text>
  <text x="40" y="124" font-size="14" font-weight="700" fill="#111827">按条数凑批:每个微批 2 条,补齐成矩形</text>
  <text x="40" y="142" font-size="11" fill="#6b7280">每个 rank 取自己分片里的前 2 条,短的补到这一批里最长那条</text>
  <text x="40" y="166" font-size="11" font-weight="700" fill="#111827">rank 0</text>
