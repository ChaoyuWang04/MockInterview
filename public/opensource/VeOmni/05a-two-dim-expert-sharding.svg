  <rect x="145" y="183" width="538" height="66" rx="8" fill="none" stroke="#5fa886" stroke-width="2.5"/>
  <rect x="147" y="178" width="72" height="140" rx="8" fill="none" stroke="#8f8bd8" stroke-width="2.5"/>
  <text x="44" y="344" font-size="11" fill="#6b7280">每格本地形状 [16, 1024, 768]:第 0 维 128 ÷ 8,第 1 维 2048 ÷ 2,第 2 维 768 不切</text>
  <line x1="44" y1="366" x2="62" y2="366" stroke="#5fa886" stroke-width="2.5"/>
  <text x="70" y="370" font-size="11" fill="#6b7280">绿框:一个专家并行组 = rank 0–7(另一组是 8–15)。token 在组内 all-to-all 找到专家,再原路收回</text>
  <line x1="44" y1="392" x2="62" y2="392" stroke="#8f8bd8" stroke-width="2.5"/>
  <text x="70" y="396" font-size="11" fill="#6b7280">紫框:一个专家内 FSDP 组 = rank 0 与 8(共 8 组)。两卡持有同一批专家,算前聚合第 1 维,反向后归约梯度</text>
  <text x="44" y="428" font-size="11" fill="#6b7280">专家并行组是 8 张编号相邻的卡;专家内 FSDP 组隔 8 号取一张,只有 2 张卡</text>
  <text x="44" y="452" font-size="11" fill="#6b7280">要满足的只有两条整除:128 能被 8 整除,8 能整除分片组的 16 张卡</text>
  <rect x="744" y="100" width="352" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="764" y="128" font-size="14" font-weight="700" fill="#111827">非专家参数:一维 FSDP</text>
  <text x="764" y="150" font-size="11" fill="#6b7280">注意力、路由、norm 等,第 0 维切 16 份</text>
