<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#111827">16 卡、专家并行度 8:专家权重切两维,非专家参数切一维</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">以 Qwen3-30B-A3B 一层的 down 投影 [128, 2048, 768] 为例;每格或每条是一张卡上的本地分片,里面的数字是全局 rank</text>
  <text x="40" y="80" font-size="13" fill="#6b7280">黄 = 专家分片,灰 = 非专家分片;绿框 = 专家并行组,紫框 = 专家内 FSDP 组;同一张卡同时持有左边一格和右边一条</text>
  <rect x="24" y="100" width="700" height="380" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="44" y="128" font-size="14" font-weight="700" fill="#111827">专家权重:二维网格 [专家内 FSDP 2 × 专家并行 8]</text>
  <text x="152" y="150" font-size="11" fill="#6b7280">第 0 维(128 个专家)按专家并行切 8 块,每块 16 个专家 →</text>
  <text x="183" y="172" font-size="11" fill="#6b7280" text-anchor="middle">专家 0–15</text>
  <text x="249" y="172" font-size="11" fill="#6b7280" text-anchor="middle">16–31</text>
  <text x="315" y="172" font-size="11" fill="#6b7280" text-anchor="middle">32–47</text>
  <text x="381" y="172" font-size="11" fill="#6b7280" text-anchor="middle">48–63</text>
  <text x="447" y="172" font-size="11" fill="#6b7280" text-anchor="middle">64–79</text>
  <text x="513" y="172" font-size="11" fill="#6b7280" text-anchor="middle">80–95</text>
  <text x="579" y="172" font-size="11" fill="#6b7280" text-anchor="middle">96–111</text>
  <text x="645" y="172" font-size="11" fill="#6b7280" text-anchor="middle">112–127</text>
  <text x="44" y="220" font-size="11" fill="#6b7280">H 0–1023</text>
