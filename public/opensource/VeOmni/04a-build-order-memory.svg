<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#111827">一次构建里,显存从哪一步开始出现</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">每一列是一个构建步骤;下面三行是同一张卡在这一步之后的显存。虚线轨道全长 = 一整份模型在一张卡上的大小(按分片数 N=8 画)</text>
  <text x="40" y="80" font-size="13" fill="#6b7280">紫 = 构建步骤,绿 = 本卡常驻的 1/N 分片,红 = 未切分的完整数据,灰 = 这一步被跳过</text>

  <!-- step boxes -->
  <rect x="40" y="100" width="165" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="52" y="124" font-size="14" font-weight="700" fill="#111827">① 元设备建空壳</text>
  <text x="52" y="146" font-size="11" fill="#6b7280">只记形状与精度</text>
  <text x="52" y="163" font-size="11" fill="#6b7280">不分配任何字节</text>

  <rect x="217" y="100" width="165" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="229" y="124" font-size="14" font-weight="700" fill="#111827">② 先切额外并行</text>
  <text x="229" y="146" font-size="11" fill="#6b7280">按模型的并行计划</text>
  <text x="229" y="163" font-size="11" fill="#6b7280">先切专家等(05 章)</text>

  <rect x="394" y="100" width="165" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="406" y="124" font-size="14" font-weight="700" fill="#111827">③ 逐层分片</text>
  <text x="406" y="146" font-size="11" fill="#6b7280">按 _no_split_modules</text>
  <text x="406" y="163" font-size="11" fill="#6b7280">每个解码层一组</text>

  <rect x="571" y="100" width="165" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="583" y="124" font-size="14" font-weight="700" fill="#111827">④ 根模块分片</text>
  <text x="583" y="146" font-size="11" fill="#6b7280">剩下的参数归根</text>
  <text x="583" y="163" font-size="11" fill="#6b7280">根前向后不重分片</text>

  <rect x="748" y="100" width="165" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="760" y="124" font-size="14" font-weight="700" fill="#111827">⑤ 物化</text>
  <text x="760" y="146" font-size="11" fill="#6b7280">每卡只为自己那段</text>
  <text x="760" y="163" font-size="11" fill="#6b7280">分配显存</text>

  <rect x="925" y="100" width="165" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="937" y="124" font-size="14" font-weight="700" fill="#111827">⑥ 装载权重</text>
  <text x="937" y="146" font-size="11" fill="#6b7280">逐个张量读入</text>
  <text x="937" y="163" font-size="11" fill="#6b7280">切好写进本卡分片</text>

  <line x1="206" y1="138" x2="216" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="383" y1="138" x2="393" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="560" y1="138" x2="570" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="737" y1="138" x2="747" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="914" y1="138" x2="924" y2="138" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- lane A: first run from HF weights -->
  <text x="40" y="210" font-size="13" font-weight="700" fill="#111827">从 HF 权重起步(首次训练)</text>
  <rect x="47" y="222" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="224" y="222" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="401" y="222" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="578" y="222" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="755" y="222" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="932" y="222" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="122" y="238" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <text x="299" y="238" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <text x="476" y="238" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <text x="653" y="238" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <rect x="755" y="222" width="19" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="782" y="238" font-size="11" fill="#6b7280">1/N 分片</text>
  <rect x="932" y="222" width="19" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="951" y="222" width="38" height="24" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="997" y="238" font-size="11" fill="#6b7280">峰值在这里</text>
  <text x="388" y="268" font-size="11" fill="#9ca3af" text-anchor="middle">前四步都停在元设备上,显存一点不动</text>
  <text x="932" y="268" font-size="11" fill="#6b7280">峰值 = 本卡分片</text>
  <text x="932" y="284" font-size="11" fill="#6b7280">+ 正在装的一个完整张量</text>

  <!-- lane B: resume -->
  <text x="40" y="330" font-size="13" font-weight="700" fill="#111827">续训(设了 checkpoint 路径且不是 LoRA)</text>
  <rect x="47" y="342" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="224" y="342" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="401" y="342" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="578" y="342" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="755" y="342" width="150" height="24" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="122" y="358" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <text x="299" y="358" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <text x="476" y="358" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <text x="653" y="358" font-size="11" fill="#9ca3af" text-anchor="middle">0 字节</text>
  <rect x="755" y="342" width="19" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="782" y="358" font-size="11" fill="#6b7280">不写随机初值</text>
  <rect x="932" y="342" width="150" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="1007" y="358" font-size="11" fill="#6b7280" text-anchor="middle">跳过 HF 装载</text>
  <text x="388" y="388" font-size="11" fill="#9ca3af" text-anchor="middle">同上</text>
  <text x="932" y="388" font-size="11" fill="#6b7280">训练开始时由 DCP</text>
  <text x="932" y="404" font-size="11" fill="#6b7280">按分片读回(13 章)</text>

  <!-- lane C: contrast -->
  <text x="40" y="450" font-size="13" font-weight="700" fill="#111827">对照:先在每张卡上建出完整模型再切</text>
  <rect x="47" y="462" width="150" height="24" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="122" y="478" font-size="11" fill="#6b7280" text-anchor="middle">每卡一整份</text>
  <text x="224" y="478" font-size="11" fill="#6b7280">还没轮到分片,大 MoE 就在第一步 OOM;这一整条是绿色分片的 N 倍</text>

  <text x="40" y="520" font-size="11" fill="#9ca3af">红色临时块的长度只是示意:它是权重文件里正在装的那一个张量;属于额外并行组、又超过广播上限的大张量,每张卡只收自己那 1/ep 块</text>
</svg>
