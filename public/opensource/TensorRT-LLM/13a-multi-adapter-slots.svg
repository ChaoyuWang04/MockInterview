<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt13a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">一份底模、多份适配器：装得下进批，装不下排队</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">绿 = 底模常驻，紫 = 已在显存页里的适配器，黄 = 主机缓存，红 = 本批页预算不够。实线是进批前向，虚线是调度器跳过、请求留在队列。</text>

  <rect x="40" y="88" width="200" height="96" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="140" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">请求带适配器名</text>
  <text x="140" y="144" font-size="11" fill="#6b7280" text-anchor="middle">同一份底模</text>
  <text x="140" y="162" font-size="11" fill="#6b7280" text-anchor="middle">点名哪一套瘦矩阵</text>

  <line x1="240" y1="136" x2="300" y2="136" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt13a)"/>

  <rect x="300" y="88" width="220" height="96" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="410" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">调度器看显存页</text>
  <text x="410" y="144" font-size="11" fill="#6b7280" text-anchor="middle">同一种已在批里免费</text>
  <text x="410" y="162" font-size="11" fill="#6b7280" text-anchor="middle">新种类要加页</text>

  <line x1="520" y1="120" x2="590" y2="90" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt13a)"/>
  <line x1="520" y1="160" x2="590" y2="210" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#trt13a)"/>

  <rect x="590" y="72" width="240" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="710" y="100" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">页够：装进设备缓存</text>
  <text x="710" y="122" font-size="11" fill="#6b7280" text-anchor="middle">主机有则拷，没有则读盘</text>

  <rect x="590" y="176" width="240" height="72" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="710" y="204" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">页不够：本批跳过</text>
  <text x="710" y="226" font-size="11" fill="#6b7280" text-anchor="middle">请求留在队列，KV 可能空着</text>

  <line x1="830" y1="108" x2="890" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt13a)"/>

  <rect x="890" y="72" width="190" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="985" y="100" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">槽位 LRU</text>
  <text x="985" y="122" font-size="11" fill="#6b7280" text-anchor="middle">decode 图用固定槽</text>

  <rect x="40" y="300" width="1040" height="220" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="56" y="330" font-size="13" fill="#6b7280">显存与主机两级：底模只装一份；适配器按页占设备缓存，挤不下的先停在主机侧</text>

  <rect x="70" y="356" width="300" height="120" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="220" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">底模权重</text>
  <text x="220" y="422" font-size="11" fill="#6b7280" text-anchor="middle">始终一份，不随租户翻倍</text>
  <text x="220" y="444" font-size="11" fill="#6b7280" text-anchor="middle">不用适配器的请求走这里</text>

  <rect x="400" y="356" width="300" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="550" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">设备缓存（有上限）</text>
  <text x="550" y="422" font-size="11" fill="#6b7280" text-anchor="middle">同时活着的种类受页数限制</text>
  <text x="550" y="444" font-size="11" fill="#6b7280" text-anchor="middle">默认还可按空闲显存比例划</text>

  <rect x="730" y="356" width="310" height="120" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="885" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">主机缓存</text>
  <text x="885" y="422" font-size="11" fill="#6b7280" text-anchor="middle">默认约 1 GB，给预取</text>
  <text x="885" y="444" font-size="11" fill="#6b7280" text-anchor="middle">把页全开大会和 KV 抢显存</text>
</svg>
