<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt04a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">注意力:先换 kernel 名字,稀疏再叠一层选 KV</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">绿 = 默认自家路径,紫 = 换名字,黄 = 稀疏算法(选),灰 = 不认识的名字。实线按名字分发,虚线是开了稀疏才叠上去。</text>

  <rect x="40" y="84" width="220" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="150" y="118" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">启动字符串</text>
  <text x="150" y="140" font-size="11" fill="#6b7280" text-anchor="middle">注意力层构造时读一次</text>
  <text x="150" y="158" font-size="11" fill="#6b7280" text-anchor="middle">运行期不再换</text>

  <line x1="260" y1="128" x2="310" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt04a)"/>

  <rect x="310" y="84" width="240" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="430" y="118" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">工厂</text>
  <text x="430" y="140" font-size="11" fill="#6b7280" text-anchor="middle">三个名字:自家 / 核库 / 参考</text>
  <text x="430" y="158" font-size="11" fill="#6b7280" text-anchor="middle">有稀疏配置再换成稀疏子类</text>

  <line x1="550" y1="110" x2="610" y2="90" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt04a)"/>
  <line x1="550" y1="128" x2="610" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt04a)"/>
  <line x1="550" y1="146" x2="610" y2="210" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt04a)"/>
  <line x1="430" y1="172" x2="430" y2="348" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#trt04a)"/>

  <rect x="610" y="72" width="230" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="725" y="96" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">自家默认 kernel</text>
  <text x="725" y="116" font-size="11" fill="#6b7280" text-anchor="middle">融合 QKV、MLA、分页 KV</text>

  <rect x="610" y="140" width="230" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="725" y="164" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">核库或参考实现</text>
  <text x="725" y="184" font-size="11" fill="#6b7280" text-anchor="middle">参考路径不给生产用</text>

  <rect x="610" y="208" width="230" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-dasharray="5 4"/>
  <text x="725" y="232" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">不认识的名字</text>
  <text x="725" y="252" font-size="11" fill="#6b7280" text-anchor="middle">打警告,退回自家默认</text>

  <rect x="40" y="300" width="1040" height="180" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="56" y="326" font-size="13" fill="#6b7280">稀疏不是第三条注意力:算法先选 token 或页,kernel 只按这份名单算</text>

  <rect x="60" y="348" width="280" height="100" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="200" y="380" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">算法</text>
  <text x="200" y="402" font-size="11" fill="#6b7280" text-anchor="middle">淘汰、索引器或跳过 softmax</text>
  <text x="200" y="422" font-size="11" fill="#6b7280" text-anchor="middle">产出 pattern,不自己做注意力</text>

  <rect x="400" y="348" width="280" height="100" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="540" y="380" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">稀疏子类 kernel</text>
  <text x="540" y="402" font-size="11" fill="#6b7280" text-anchor="middle">仍挂在原来的后端名字下</text>
  <text x="540" y="422" font-size="11" fill="#6b7280" text-anchor="middle">只消费选出来的 KV</text>

  <rect x="740" y="348" width="300" height="100" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="890" y="380" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">注意力层前向</text>
  <text x="890" y="402" font-size="11" fill="#6b7280" text-anchor="middle">模型代码仍是同一行调用</text>
  <text x="890" y="422" font-size="11" fill="#6b7280" text-anchor="middle">少算的是 KV,不是另起一套</text>

  <line x1="340" y1="398" x2="400" y2="398" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt04a)"/>
  <line x1="680" y1="398" x2="740" y2="398" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt04a)"/>

  <text x="560" y="508" font-size="11" fill="#9ca3af" text-anchor="middle">黄框默认不在热路径:稀疏配置为空时工厂直接返回稠密后端,没有算法这一站</text>
</svg>
