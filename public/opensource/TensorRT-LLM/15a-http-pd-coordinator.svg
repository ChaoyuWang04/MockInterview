<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt15a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">HTTP 网关把请求送进引擎,多实例 PD 靠协调器对上请求</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = OpenAI 网关,绿 = 协调器,黄 = prefill 实例,灰 = decode 实例。实线是默认合池服务;虚线是工人问协调器选哪台(有状态路由才走这一站)。</text>

  <rect x="40" y="84" width="200" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="140" y="114" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">客户端</text>
  <text x="140" y="134" font-size="11" fill="#6b7280" text-anchor="middle">聊天或补全 HTTP</text>

  <line x1="240" y1="120" x2="292" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt15a)"/>

  <rect x="296" y="84" width="280" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="436" y="110" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">OpenAI HTTP 网关</text>
  <text x="436" y="130" font-size="11" fill="#6b7280" text-anchor="middle">默认本机 8000,切词后交引擎</text>
  <text x="436" y="146" font-size="11" fill="#6b7280" text-anchor="middle">合池时不再问协调器</text>

  <line x1="576" y1="120" x2="628" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt15a)"/>

  <rect x="632" y="84" width="448" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="856" y="110" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">合池引擎(对外进程 + MPI 工人)</text>
  <text x="856" y="130" font-size="11" fill="#6b7280" text-anchor="middle">编排器空着就走 MPI,不是 Ray</text>
  <text x="856" y="146" font-size="11" fill="#6b7280" text-anchor="middle">一条请求在同一组卡上做完</text>

  <rect x="40" y="196" width="1040" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="56" y="222" font-size="13" fill="#6b7280">分池路径:网关先拿全局请求号,再分别打 prefill 与 decode;工人自己不定实例</text>

  <rect x="60" y="244" width="240" height="88" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="180" y="274" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">分池网关工人</text>
  <text x="180" y="294" font-size="11" fill="#6b7280" text-anchor="middle">先 context 再 generation</text>
  <text x="180" y="312" font-size="11" fill="#6b7280" text-anchor="middle">无状态路由可本地选</text>

  <rect x="440" y="244" width="240" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="560" y="274" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">协调器</text>
  <text x="560" y="294" font-size="11" fill="#6b7280" text-anchor="middle">选实例、发号、结束记账</text>
  <text x="560" y="312" font-size="11" fill="#6b7280" text-anchor="middle">单工人时可嵌在同进程</text>

  <line x1="300" y1="288" x2="436" y2="288" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#trt15a)"/>
  <text x="368" y="278" font-size="11" fill="#9ca3af" text-anchor="middle">选哪台</text>

  <rect x="60" y="380" width="460" height="88" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="290" y="410" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">prefill 实例</text>
  <text x="290" y="430" font-size="11" fill="#6b7280" text-anchor="middle">只做 context,带上同一请求号</text>
  <text x="290" y="448" font-size="11" fill="#6b7280" text-anchor="middle">KV 怎么搬见 09 章,本页不画</text>

  <rect x="580" y="380" width="460" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="810" y="410" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">decode 实例</text>
  <text x="810" y="430" font-size="11" fill="#6b7280" text-anchor="middle">只做 generation,对上同一号</text>
  <text x="810" y="448" font-size="11" fill="#6b7280" text-anchor="middle">号对不上就对不上请求</text>

  <line x1="180" y1="332" x2="180" y2="376" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt15a)"/>
  <line x1="290" y1="332" x2="290" y2="376" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt15a)"/>
  <line x1="180" y1="424" x2="576" y2="424" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt15a)"/>

  <text x="560" y="536" font-size="11" fill="#9ca3af" text-anchor="middle">虚线只落到协调器这一站:有状态路由才问它选实例;轮询与按负载可在工人本地选</text>
</svg>
