<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt02a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">一步里新请求的 prefill 和别人的 decode 进同一批</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">绿 = 已经在 decode 的请求,紫 = 新来的 prefill 或一块切出来的 prompt。黄 = 一步的 token 预算上限。</text>

  <rect x="30" y="78" width="1060" height="44" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="48" y="106" font-size="13" fill="#6b7280">一步预算：最多若干条请求、最多若干个 token。decode 先占坑，剩下的才给新 prompt。</text>

  <text x="30" y="154" font-size="13" fill="#6b7280">这一步实际进批</text>
  <rect x="180" y="136" width="70" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="215" y="159" font-size="12" fill="#111827" text-anchor="middle">A 1</text>
  <rect x="258" y="136" width="70" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="293" y="159" font-size="12" fill="#111827" text-anchor="middle">B 1</text>
  <rect x="336" y="136" width="70" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="371" y="159" font-size="12" fill="#111827" text-anchor="middle">C 1</text>
  <rect x="414" y="136" width="280" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="554" y="159" font-size="12" fill="#111827" text-anchor="middle">D 的一块 prompt</text>
  <rect x="702" y="136" width="200" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="802" y="159" font-size="12" fill="#111827" text-anchor="middle">预算还剩，但不能再塞整条</text>
  <line x1="170" y1="154" x2="180" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt02a)"/>

  <text x="30" y="214" font-size="13" fill="#6b7280">送进前向的张量顺序</text>
  <rect x="180" y="196" width="360" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="360" y="219" font-size="12" fill="#111827" text-anchor="middle">先排 context 段（D 的这一块）</text>
  <rect x="548" y="196" width="240" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="668" y="219" font-size="12" fill="#111827" text-anchor="middle">再排 generation 段（A B C）</text>
  <line x1="540" y1="214" x2="548" y2="214" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt02a)"/>

  <text x="30" y="268" font-size="11" fill="#9ca3af">官方约束：context 序列必须排在 generation 序列前面；预算却是 decode 先占、prompt 吃剩余。</text>

  <rect x="30" y="292" width="510" height="96" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="48" y="318" font-size="14" fill="#111827" font-weight="700">切块关着</text>
  <text x="48" y="342" font-size="12" fill="#6b7280">D 整条 prompt 塞不进剩余预算就整条等。</text>
  <text x="48" y="364" font-size="12" fill="#6b7280">A B C 的 decode 仍进这一步；D 的 TTFT 往后拖。</text>

  <rect x="560" y="292" width="530" height="96" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="578" y="318" font-size="14" fill="#111827" font-weight="700">切块开着</text>
  <text x="578" y="342" font-size="12" fill="#6b7280">D 切一块进来，和 A B C 同一步。</text>
  <text x="578" y="364" font-size="12" fill="#6b7280">decode 不被整条超长 prompt 顶出批。</text>
</svg>
