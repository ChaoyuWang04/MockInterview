<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt11a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="390" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">分数表到 token：约束挂在采样前</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">绿 = 每步都走的前向与采样。黄 = 调用方改分。紫 = 带约束才走的 CPU 填位图。虚线箭头落到填位图。</text>

  <rect x="30" y="84" width="200" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="130" y="114" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">GPU 前向</text>
  <text x="130" y="136" font-size="11" fill="#6b7280" text-anchor="middle">交出词表宽的分数表</text>

  <rect x="280" y="84" width="200" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="380" y="114" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">调用方改分</text>
  <text x="380" y="136" font-size="11" fill="#6b7280" text-anchor="middle">前向末尾，可空过</text>

  <rect x="530" y="84" width="220" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="640" y="114" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">填位图</text>
  <text x="640" y="136" font-size="11" fill="#6b7280" text-anchor="middle">CPU 逐行，压进负无穷</text>

  <rect x="800" y="84" width="280" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="940" y="114" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">采样出一个 token</text>
  <text x="940" y="136" font-size="11" fill="#6b7280" text-anchor="middle">默认贪心；一步只出一个</text>

  <line x1="230" y1="120" x2="280" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt11a)"/>
  <line x1="480" y1="120" x2="530" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt11a)"/>
  <line x1="750" y1="120" x2="800" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt11a)"/>

  <line x1="380" y1="156" x2="380" y2="210" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="380" y1="210" x2="640" y2="210" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="640" y1="210" x2="640" y2="156" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#trt11a)"/>

  <rect x="30" y="248" width="1060" height="110" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="48" y="278" font-size="14" fill="#111827" font-weight="700">和重叠、推测解码抢哪一段 CPU</text>
  <text x="48" y="304" font-size="12" fill="#6b7280">填位图必须发生在当前这一步的分数表上，才能再采样，不能藏进下一步 GPU。</text>
  <text x="48" y="326" font-size="12" fill="#6b7280">重叠循环里停词与回包也要这段空档；草稿还要按个推进、核错回滚状态机。</text>
  <text x="48" y="348" font-size="11" fill="#9ca3af">虚线框是说明，不是跳转。不带约束则填位图整站不起，走实线贪心。</text>
</svg>
