<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt14a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">四种插件拼一种格式：读盘和映射拆开</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">绿 = 总装加载器，紫 = 配置解析，黄 = 权重加载器，灰 = 映射器。实线是 HuggingFace 热路径。虚线落到同节点条带预读（页缓存），不是每人各读一份盘。</text>

  <rect x="40" y="88" width="200" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="140" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">磁盘 checkpoint</text>
  <text x="140" y="144" font-size="11" fill="#6b7280" text-anchor="middle">HuggingFace 目录</text>
  <text x="140" y="162" font-size="11" fill="#6b7280" text-anchor="middle">训练时的模块名</text>

  <line x1="240" y1="132" x2="300" y2="132" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt14a)"/>

  <rect x="300" y="88" width="220" height="88" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="410" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">总装加载器</text>
  <text x="410" y="144" font-size="11" fill="#6b7280" text-anchor="middle">捏齐四件插件</text>
  <text x="410" y="162" font-size="11" fill="#6b7280" text-anchor="middle">默认填 HuggingFace</text>

  <line x1="410" y1="176" x2="250" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt14a)"/>
  <line x1="410" y1="176" x2="410" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt14a)"/>
  <line x1="410" y1="176" x2="570" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt14a)"/>

  <rect x="140" y="236" width="220" height="80" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="250" y="268" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">配置解析器</text>
  <text x="250" y="292" font-size="11" fill="#6b7280" text-anchor="middle">收成运行时模型配置</text>

  <rect x="300" y="236" width="220" height="80" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="410" y="268" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">权重加载器</text>
  <text x="410" y="292" font-size="11" fill="#6b7280" text-anchor="middle">只把字节读进主机</text>

  <rect x="460" y="236" width="220" height="80" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="570" y="268" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">权重映射器</text>
  <text x="570" y="292" font-size="11" fill="#6b7280" text-anchor="middle">改名、融合、按并行切</text>

  <line x1="410" y1="316" x2="410" y2="368" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt14a)"/>
  <line x1="570" y1="316" x2="500" y2="368" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt14a)"/>

  <rect x="300" y="372" width="280" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="440" y="404" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">运行时模型参数</text>
  <text x="440" y="428" font-size="11" fill="#6b7280" text-anchor="middle">缺键断言；切错会装上错数</text>

  <line x1="520" y1="276" x2="720" y2="276" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#trt14a)"/>

  <rect x="720" y="236" width="360" height="80" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="900" y="268" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">同节点条带预读</text>
  <text x="900" y="292" font-size="11" fill="#6b7280" text-anchor="middle">各 rank 热互不重叠区间，进页缓存</text>

  <rect x="720" y="88" width="360" height="88" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="900" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">条带预读说明</text>
  <text x="900" y="144" font-size="11" fill="#6b7280" text-anchor="middle">映射与上卡仍走左边实线</text>
  <text x="900" y="162" font-size="11" fill="#6b7280" text-anchor="middle">不兼容则警告并退回同步预取</text>
</svg>
