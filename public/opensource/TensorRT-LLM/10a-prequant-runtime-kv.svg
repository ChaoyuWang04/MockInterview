<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt10a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">预量化权重直接进运行时，KV 精度可单独覆盖</text>
  <text x="30" y="56" font-size="13" fill="#6b7280">绿 = 权重配方从仓库读入，紫 = PyTorch 运行时，黄 = KV 池。虚线 = 启动时单独改 KV 精度。</text>

  <rect x="30" y="88" width="240" height="96" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="150" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">预量化仓库</text>
  <text x="150" y="144" font-size="11" fill="#6b7280" text-anchor="middle">离线校准已做完</text>
  <text x="150" y="164" font-size="11" fill="#6b7280" text-anchor="middle">自带量化段</text>

  <rect x="330" y="88" width="240" height="96" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="450" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">读量化段</text>
  <text x="450" y="144" font-size="11" fill="#6b7280" text-anchor="middle">对齐权重算法</text>
  <text x="450" y="164" font-size="11" fill="#6b7280" text-anchor="middle">KV 声明可缺省</text>

  <rect x="630" y="88" width="240" height="96" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="750" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">PyTorch 运行时</text>
  <text x="750" y="144" font-size="11" fill="#6b7280" text-anchor="middle">低精度张量直接加载</text>
  <text x="750" y="164" font-size="11" fill="#6b7280" text-anchor="middle">不再编译旧引擎</text>

  <line x1="270" y1="136" x2="330" y2="136" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt10a)"/>
  <line x1="570" y1="136" x2="630" y2="136" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt10a)"/>

  <rect x="630" y="228" width="240" height="96" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="750" y="262" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">KV 池</text>
  <text x="750" y="284" font-size="11" fill="#6b7280" text-anchor="middle">默认沿用仓库声明</text>
  <text x="750" y="304" font-size="11" fill="#6b7280" text-anchor="middle">未声明则满精度写</text>

  <line x1="750" y1="184" x2="750" y2="228" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt10a)"/>

  <rect x="30" y="228" width="240" height="96" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="150" y="262" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">启动覆盖 KV</text>
  <text x="150" y="284" font-size="11" fill="#6b7280" text-anchor="middle">FP8 可盖未声明仓库</text>
  <text x="150" y="304" font-size="11" fill="#6b7280" text-anchor="middle">NVFP4 必须先离线出</text>

  <line x1="270" y1="276" x2="630" y2="276" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#trt10a)"/>

  <rect x="30" y="368" width="840" height="112" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="50" y="400" font-size="14" fill="#111827" font-weight="700">选错落点</text>
  <text x="50" y="424" font-size="11" fill="#6b7280">卡代次对不上配方表：权重省了，矩阵乘仍走宽精度，每个 token 间隔比不量化还长。</text>
  <text x="50" y="446" font-size="11" fill="#6b7280">只压权重、KV 仍满精度：长上下文池先满。只压 KV、注意力每步还原：槽数涨了，间隔同样拉长。</text>
  <text x="50" y="468" font-size="11" fill="#6b7280">覆盖与按层旧宽度拧着：池按新元素宽分配，注意力仍按仓库读写。</text>
</svg>
