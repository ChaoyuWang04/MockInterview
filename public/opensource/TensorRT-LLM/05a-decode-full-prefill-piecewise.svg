<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="trt05a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" fill="#111827" font-weight="700">decode 整图按批大小抓;prefill 把注意力留在 eager</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">紫 = decode 整图,绿 = prefill 已进图的段,黄 = 注意力 eager,灰 = 批不在桶上整步 eager。实线是图内重放,虚线是注意力留在 eager。</text>

  <rect x="40" y="84" width="700" height="200" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="56" y="108" font-size="13" fill="#6b7280">纯 decode:这一步没有 prefill 行,形状只剩批大小</text>
  <rect x="60" y="128" width="200" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="160" y="168" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">纯 decode 批</text>
  <text x="160" y="190" font-size="11" fill="#6b7280" text-anchor="middle">每个请求 1 个 token</text>
  <text x="160" y="208" font-size="11" fill="#6b7280" text-anchor="middle">按批大小对桶</text>
  <rect x="320" y="128" width="200" height="120" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="420" y="168" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">整图重放</text>
  <text x="420" y="190" font-size="11" fill="#6b7280" text-anchor="middle">注意力也在图里</text>
  <text x="420" y="208" font-size="11" fill="#6b7280" text-anchor="middle">一次下发整步前向</text>
  <rect x="580" y="128" width="140" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="650" y="176" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">整步 eager</text>
  <text x="650" y="198" font-size="11" fill="#6b7280" text-anchor="middle">批不在桶上</text>
  <line x1="260" y1="188" x2="320" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt05a)"/>
  <line x1="420" y1="248" x2="650" y2="248" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt05a)"/>
  <text x="535" y="270" font-size="11" fill="#9ca3af" text-anchor="middle">未命中不抓图,整步退回 eager</text>

  <rect x="40" y="308" width="1040" height="210" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="56" y="332" font-size="13" fill="#6b7280">prefill 或混合批:token 数每步都变,整图对不上形状</text>
  <rect x="60" y="356" width="180" height="120" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="150" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">线性段进图</text>
  <text x="150" y="418" font-size="11" fill="#6b7280" text-anchor="middle">按 token 桶录</text>
  <text x="150" y="436" font-size="11" fill="#6b7280" text-anchor="middle">形状固定才能重放</text>
  <rect x="320" y="356" width="220" height="120" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-dasharray="5 4"/>
  <text x="430" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">注意力 eager</text>
  <text x="430" y="418" font-size="11" fill="#6b7280" text-anchor="middle">元数据随序列变</text>
  <text x="430" y="436" font-size="11" fill="#6b7280" text-anchor="middle">不进 CUDA Graph</text>
  <rect x="620" y="356" width="180" height="120" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="710" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">MLP 段再进图</text>
  <text x="710" y="418" font-size="11" fill="#6b7280" text-anchor="middle">同一 token 桶</text>
  <text x="710" y="436" font-size="11" fill="#6b7280" text-anchor="middle">层与层之间可再断</text>
  <rect x="860" y="356" width="190" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="955" y="396" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">prefill 默认关</text>
  <text x="955" y="418" font-size="11" fill="#6b7280" text-anchor="middle">字段默认不抓分段</text>
  <text x="955" y="436" font-size="11" fill="#6b7280" text-anchor="middle">文档推荐不等于默认</text>
  <line x1="240" y1="416" x2="320" y2="416" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#trt05a)"/>
  <line x1="540" y1="416" x2="620" y2="416" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#trt05a)"/>
  <text x="560" y="538" font-size="11" fill="#9ca3af" text-anchor="middle">虚线只落在注意力:分段图在两边,中间那步现场发</text>
</svg>
