  <text x="40" y="44" font-size="19" fill="#111827" font-weight="700">标准稠密块前向:TP、SP 与默认 P2P CP 的通信边界</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">绿=TP 分片计算 · 灰=TP 内复制区域 · 黄=TP 内序列分片 · 紫=通信 · 省略残差等细节,不按条宽计时</text>
  <text x="40" y="108" font-size="14" fill="#111827" font-weight="700">只开张量并行</text>
  <text x="138" y="108" font-size="11" fill="#9ca3af">两次 TP all-reduce;灰色区域表示 LayerNorm、dropout 等逐 token 操作</text>
  <text x="50" y="150" font-size="13" fill="#111827" font-weight="700">逐 token 区域</text>
  <text x="50" y="170" font-size="11" fill="#6b7280">Norm / dropout</text>
  <text x="50" y="187" font-size="11" fill="#6b7280">每卡各一份</text>
  <text x="192" y="150" font-size="13" fill="#111827" font-weight="700">QKV 投影</text>
  <text x="192" y="170" font-size="11" fill="#6b7280">按输出维切</text>
  <text x="334" y="150" font-size="13" fill="#111827" font-weight="700">attention</text>
  <text x="334" y="170" font-size="11" fill="#6b7280">头按卡分开</text>
  <text x="476" y="150" font-size="13" fill="#111827" font-weight="700">输出投影</text>
  <text x="476" y="170" font-size="11" fill="#6b7280">按输入维切</text>
  <text x="618" y="150" font-size="13" fill="#111827" font-weight="700">逐 token 区域</text>
  <text x="618" y="170" font-size="11" fill="#6b7280">Norm / dropout</text>
  <text x="618" y="187" font-size="11" fill="#6b7280">每卡各一份</text>
  <text x="760" y="150" font-size="13" fill="#111827" font-weight="700">MLP 第一层</text>
  <text x="760" y="170" font-size="11" fill="#6b7280">按输出维切</text>
  <text x="902" y="150" font-size="13" fill="#111827" font-weight="700">MLP 第二层</text>
  <text x="902" y="170" font-size="11" fill="#6b7280">按输入维切</text>
  <text x="599" y="216" font-size="11" fill="#6b7280" text-anchor="middle">all-reduce</text>
  <text x="1025" y="216" font-size="11" fill="#6b7280" text-anchor="middle">all-reduce</text>
  <text x="40" y="268" font-size="14" fill="#111827" font-weight="700">TP + SP</text>
  <text x="152" y="268" font-size="11" fill="#9ca3af">两次 all-gather 加两次 reduce-scatter;复制区域的激活按序列切开</text>
  <text x="50" y="310" font-size="13" fill="#111827" font-weight="700">逐 token 区域</text>
  <text x="50" y="330" font-size="11" fill="#6b7280">Norm / dropout</text>
  <text x="50" y="347" font-size="11" fill="#6b7280">按序列切开</text>
  <text x="192" y="310" font-size="13" fill="#111827" font-weight="700">QKV 投影</text>
  <text x="192" y="330" font-size="11" fill="#6b7280">按输出维切</text>
  <text x="334" y="310" font-size="13" fill="#111827" font-weight="700">attention</text>
  <text x="334" y="330" font-size="11" fill="#6b7280">头按卡分开</text>
  <text x="476" y="310" font-size="13" fill="#111827" font-weight="700">输出投影</text>
  <text x="476" y="330" font-size="11" fill="#6b7280">按输入维切</text>
  <text x="618" y="310" font-size="13" fill="#111827" font-weight="700">逐 token 区域</text>
  <text x="618" y="330" font-size="11" fill="#6b7280">Norm / dropout</text>
  <text x="618" y="347" font-size="11" fill="#6b7280">按序列切开</text>
  <text x="760" y="310" font-size="13" fill="#111827" font-weight="700">MLP 第一层</text>
  <text x="760" y="330" font-size="11" fill="#6b7280">按输出维切</text>
  <text x="902" y="310" font-size="13" fill="#111827" font-weight="700">MLP 第二层</text>
  <text x="902" y="330" font-size="11" fill="#6b7280">按输入维切</text>
  <text x="173" y="376" font-size="11" fill="#6b7280" text-anchor="middle">all-gather</text>
  <text x="599" y="376" font-size="11" fill="#6b7280" text-anchor="middle">reduce-scatter</text>
  <text x="741" y="376" font-size="11" fill="#6b7280" text-anchor="middle">all-gather</text>
  <text x="1012" y="376" font-size="11" fill="#6b7280" text-anchor="middle">reduce-scatter</text>
  <text x="40" y="428" font-size="14" fill="#111827" font-weight="700">TP + SP + CP</text>
  <text x="166" y="428" font-size="11" fill="#9ca3af">各 CP rank 处理 1/CP 的序列;attention 额外交换 KV,TP/SP 通信仍保留</text>
  <text x="50" y="470" font-size="13" fill="#111827" font-weight="700">逐 token 区域</text>
  <text x="50" y="490" font-size="11" fill="#6b7280">Norm / dropout</text>
  <text x="50" y="507" font-size="11" fill="#6b7280">按序列切开</text>
  <text x="192" y="470" font-size="13" fill="#111827" font-weight="700">QKV 投影</text>
  <text x="192" y="490" font-size="11" fill="#6b7280">按输出维切</text>
  <text x="334" y="470" font-size="13" fill="#111827" font-weight="700">attention</text>
  <text x="334" y="490" font-size="11" fill="#6b7280">环形交换</text>
  <text x="334" y="507" font-size="11" fill="#6b7280">key 与 value</text>
  <text x="476" y="470" font-size="13" fill="#111827" font-weight="700">输出投影</text>
  <text x="476" y="490" font-size="11" fill="#6b7280">按输入维切</text>
  <text x="618" y="470" font-size="13" fill="#111827" font-weight="700">逐 token 区域</text>
  <text x="618" y="490" font-size="11" fill="#6b7280">Norm / dropout</text>
  <text x="618" y="507" font-size="11" fill="#6b7280">按序列切开</text>
  <text x="760" y="470" font-size="13" fill="#111827" font-weight="700">MLP 第一层</text>
  <text x="760" y="490" font-size="11" fill="#6b7280">按输出维切</text>
  <text x="902" y="470" font-size="13" fill="#111827" font-weight="700">MLP 第二层</text>
  <text x="902" y="490" font-size="11" fill="#6b7280">按输入维切</text>
  <text x="173" y="536" font-size="11" fill="#6b7280" text-anchor="middle">all-gather</text>
  <text x="599" y="536" font-size="11" fill="#6b7280" text-anchor="middle">reduce-scatter</text>
  <text x="741" y="536" font-size="11" fill="#6b7280" text-anchor="middle">all-gather</text>
  <text x="1012" y="536" font-size="11" fill="#6b7280" text-anchor="middle">reduce-scatter</text>
  <text x="56" y="584" font-size="13" fill="#111827" font-weight="700">SP 将 all-reduce 换成 all-gather + reduce-scatter,减少复制区域的激活</text>
  <text x="56" y="604" font-size="11" fill="#6b7280">常见集合通信分解下字节量相当,调用次数与耗时不等价;行 3 仅画默认 P2P CP,不涵盖 MoE、Mamba 或额外权重all-gather</text>
</svg>
