<text x="320" y="235" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">4 B</text>
<text x="44" y="273" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">FP4</text>
