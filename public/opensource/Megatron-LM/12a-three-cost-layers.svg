<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc"><title id="title">三层执行优化作用于不同边界</title><desc id="desc">以GEMM、bias、GELU、GEMM链为示意。低精度缩小选中操作数payload。fusion移除bias与GELU之间的中间tensor边界。CUDA graph保持kernel节点并用一次replay提交。不是实测kernel数量或时间比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="900" rx="16" fill="#f8fafc"/>
<text x="32" y="43" font-family="Arial, PingFang SC, sans-serif" font-size="27" fill="#0f172a" font-weight="700" text-anchor="start">同一条计算链，三种不同的成本</text>
<text x="32" y="75" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">示意链：GEMM → bias → GELU → GEMM；分别观察三种机制，不表示默认全开。</text>
<rect x="24" y="98" width="1072" height="225" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="44" y="131" font-family="Arial, PingFang SC, sans-serif" font-size="21" fill="#1e40af" font-weight="700" text-anchor="start">1  低精度：缩小选中操作数的 payload</text>
<text x="44" y="160" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#334155" font-weight="400" text-anchor="start">4 个值的纯数据部分</text>
<text x="44" y="197" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">BF16</text>
<rect x="113.0" y="179" width="48.0" height="24" rx="0" fill="#93c5fd" stroke="#fff"/>
<rect x="161.0" y="179" width="48.0" height="24" rx="0" fill="#93c5fd" stroke="#fff"/>
