<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect width="1120" height="630" fill="#ffffff"/>
<defs><marker id="arr08" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#9ca3af"/></marker></defs>
<text x="40" y="40" font-size="19" font-weight="700" fill="#111827">同一份规格,分别构造本地各层</text>
<text x="40" y="66" font-size="13" fill="#6b7280">黄 = 配置与实现选择；紫 = 构造规格；绿 = 已创建的实例。箭头表示构造依赖,不是张量流。</text>
<text x="40" y="88" font-size="13" fill="#6b7280">示例只画本 stage 的 2 个普通 Transformer layer；实际层数由模型与流水线布局决定。</text>

<rect x="40" y="126" width="255" height="126" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="60" y="153" font-size="14" font-weight="700" fill="#111827">TransformerConfig</text>
<text x="60" y="180" font-size="13" fill="#6b7280">层数、hidden size、head 数</text>
<text x="60" y="205" font-size="13" fill="#6b7280">归一化、attention 等行为</text>
<text x="60" y="232" font-size="11" fill="#6b7280">构造各实例时继续传入</text>
<rect x="40" y="297" width="255" height="116" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="60" y="324" font-size="14" font-weight="700" fill="#111827">GPT 规格工厂 + 后端</text>
<text x="60" y="350" font-size="13" fill="#6b7280">选择 norm、投影、attention</text>
<text x="60" y="375" font-size="13" fill="#6b7280">以及 MLP builder</text>
<text x="60" y="397" font-size="11" fill="#6b7280">自定义工厂也可交付相同契约</text>
<path d="M167 254V286" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr08)"/>
<path d="M298 353H355" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr08)"/>

<rect x="370" y="126" width="320" height="374" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="390" y="153" font-size="14" font-weight="700" fill="#111827">层规格：ModuleSpec</text>
<rect x="388" y="172" width="284" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="404" y="196" font-size="14" font-weight="700" fill="#111827">module = TransformerLayer</text>
<text x="404" y="218" font-size="11" fill="#6b7280">params 与 submodules 交给构造器</text>
<rect x="388" y="247" width="284" height="103" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="404" y="271" font-size="14" font-weight="700" fill="#111827">attention 的嵌套规格</text>
<text x="404" y="296" font-size="13" fill="#6b7280">SelfAttention 或 MLA</text>
<text x="404" y="323" font-size="11" fill="#6b7280">内部再指定投影、core attention 等</text>
<rect x="388" y="365" width="284" height="55" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="404" y="388" font-size="14" font-weight="700" fill="#111827">MLP builder</text>
<text x="404" y="409" font-size="11" fill="#6b7280">内部指定线性层与 activation</text>
<rect x="388" y="435" width="284" height="47" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="404" y="464" font-size="13" fill="#111827">norm、残差操作等其余位置</text>

<path d="M295 176H334V111H930V144" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr08)"/>
<path d="M691 203H749" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr08)"/>
<text x="702" y="189" font-size="11" fill="#6b7280">构造</text>
<rect x="765" y="150" width="315" height="390" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="785" y="178" font-size="14" font-weight="700" fill="#111827">TransformerBlock：本地实例</text>
<rect x="783" y="197" width="279" height="114" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="801" y="221" font-size="14" font-weight="700" fill="#111827">layer 1：独立实例</text>
<text x="801" y="247" font-size="13" fill="#6b7280">attention 实例 + MLP 实例</text>
<text x="801" y="271" font-size="13" fill="#6b7280">norm 与残差接线</text>
<text x="801" y="296" font-size="11" fill="#6b7280">自己的参数,不是规格对象里的权重</text>
<rect x="783" y="329" width="279" height="114" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="801" y="354" font-size="14" font-weight="700" fill="#111827">layer 2：另一个独立实例</text>
<text x="801" y="380" font-size="13" fill="#6b7280">再次按同一份规格构造</text>
<text x="801" y="406" font-size="13" fill="#6b7280">也可以为此层提供不同规格</text>
<text x="801" y="429" font-size="11" fill="#6b7280">block 保存并依次调用层列表</text>
<path d="M691 203H729V355H775" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr08)"/>
<rect x="783" y="464" width="279" height="55" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="801" y="487" font-size="14" font-weight="700" fill="#111827">final norm：按 stage 条件创建</text>
<text x="801" y="508" font-size="11" fill="#6b7280">实现由 block 的 norm 规格提供</text>

<text x="40" y="554" font-size="13" fill="#6b7280">构造器还接收本 stage 的进程组、层编号与位置；同一规格可以复用,已创建的层参数并不因此共享。</text>
<text x="40" y="583" font-size="11" fill="#9ca3af">图只展开普通 decoder 的装配骨架；MLA 替换 attention 位置,MTP 使用独立 block 包装内部模型层。</text>
<text x="40" y="605" font-size="11" fill="#9ca3af">融合 norm 可以位于后续投影内部,所以逻辑位置不一定对应一个独立模块。</text>
</svg>
