<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
  <rect x="40" y="160" width="76" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <rect x="120" y="160" width="76" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <rect x="200" y="160" width="76" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="280" y="160" width="76" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="360" y="160" width="76" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <rect x="440" y="160" width="76" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <rect x="160" y="236" width="72" height="28" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <rect x="160" y="286" width="168" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="160" y="336" width="264" height="28" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <rect x="580" y="160" width="76" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <rect x="660" y="160" width="76" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="740" y="160" width="76" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <rect x="820" y="160" width="76" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <rect x="900" y="160" width="76" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="980" y="160" width="76" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <rect x="700" y="236" width="168" height="28" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
  <rect x="700" y="286" width="168" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
  <rect x="700" y="336" width="168" height="28" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
  <rect x="40" y="396" width="1040" height="52" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="40" y="44" font-size="19" fill="#111827" font-weight="700">因果 attention 的首尾配对:让序列分片负载更均衡</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">3 张卡、6 段的示意 · 绿=卡 0 · 紫=卡 1 · 黄=卡 2 · 条长编码简化负载,不编码时间</text>
  <text x="40" y="88" font-size="13" fill="#6b7280">演示假设:第 k 段记作 k 个负载单位,仅表达后段可见前文更多;不是精确 FLOPs 模型</text>
  <text x="40" y="124" font-size="14" fill="#111827" font-weight="700">天真切法:每张卡拿连续两段</text>
  <text x="40" y="144" font-size="11" fill="#9ca3af">最大示意负载为 11 个单位</text>
  <text x="52" y="180" font-size="13" fill="#111827" font-weight="700">段 1</text>
  <text x="52" y="197" font-size="11" fill="#6b7280">卡 0</text>
  <text x="132" y="180" font-size="13" fill="#111827" font-weight="700">段 2</text>
  <text x="132" y="197" font-size="11" fill="#6b7280">卡 0</text>
  <text x="212" y="180" font-size="13" fill="#111827" font-weight="700">段 3</text>
  <text x="212" y="197" font-size="11" fill="#6b7280">卡 1</text>
  <text x="292" y="180" font-size="13" fill="#111827" font-weight="700">段 4</text>
  <text x="292" y="197" font-size="11" fill="#6b7280">卡 1</text>
  <text x="372" y="180" font-size="13" fill="#111827" font-weight="700">段 5</text>
  <text x="372" y="197" font-size="11" fill="#6b7280">卡 2</text>
  <text x="452" y="180" font-size="13" fill="#111827" font-weight="700">段 6</text>
  <text x="452" y="197" font-size="11" fill="#6b7280">卡 2</text>
  <text x="40" y="255" font-size="13" fill="#111827" font-weight="700">卡 0</text>
  <text x="82" y="255" font-size="11" fill="#9ca3af">段 1 + 段 2</text>
  <text x="246" y="255" font-size="11" fill="#6b7280">3 个单位</text>
  <text x="40" y="305" font-size="13" fill="#111827" font-weight="700">卡 1</text>
  <text x="82" y="305" font-size="11" fill="#9ca3af">段 3 + 段 4</text>
  <text x="348" y="305" font-size="11" fill="#6b7280">7 个单位</text>
  <text x="40" y="355" font-size="13" fill="#111827" font-weight="700">卡 2</text>
  <text x="82" y="355" font-size="11" fill="#9ca3af">段 5 + 段 6</text>
  <text x="450" y="355" font-size="11" fill="#6b7280">11 个单位</text>
  <text x="580" y="124" font-size="14" fill="#111827" font-weight="700">实际切法:每张卡拿一头一尾</text>
  <text x="580" y="144" font-size="11" fill="#9ca3af">三张卡都是 7 个单位</text>
  <text x="592" y="180" font-size="13" fill="#111827" font-weight="700">段 1</text>
  <text x="592" y="197" font-size="11" fill="#6b7280">卡 0</text>
  <text x="672" y="180" font-size="13" fill="#111827" font-weight="700">段 2</text>
  <text x="672" y="197" font-size="11" fill="#6b7280">卡 1</text>
  <text x="752" y="180" font-size="13" fill="#111827" font-weight="700">段 3</text>
  <text x="752" y="197" font-size="11" fill="#6b7280">卡 2</text>
  <text x="832" y="180" font-size="13" fill="#111827" font-weight="700">段 4</text>
  <text x="832" y="197" font-size="11" fill="#6b7280">卡 2</text>
  <text x="912" y="180" font-size="13" fill="#111827" font-weight="700">段 5</text>
  <text x="912" y="197" font-size="11" fill="#6b7280">卡 1</text>
  <text x="992" y="180" font-size="13" fill="#111827" font-weight="700">段 6</text>
  <text x="992" y="197" font-size="11" fill="#6b7280">卡 0</text>
  <text x="580" y="255" font-size="13" fill="#111827" font-weight="700">卡 0</text>
  <text x="622" y="255" font-size="11" fill="#9ca3af">段 1 + 段 6</text>
  <text x="888" y="255" font-size="11" fill="#6b7280">7 个单位</text>
  <text x="580" y="305" font-size="13" fill="#111827" font-weight="700">卡 1</text>
  <text x="622" y="305" font-size="11" fill="#9ca3af">段 2 + 段 5</text>
  <text x="888" y="305" font-size="11" fill="#6b7280">7 个单位</text>
  <text x="580" y="355" font-size="13" fill="#111827" font-weight="700">卡 2</text>
  <text x="622" y="355" font-size="11" fill="#9ca3af">段 3 + 段 4</text>
  <text x="888" y="355" font-size="11" fill="#6b7280">7 个单位</text>
  <text x="56" y="422" font-size="13" fill="#111827" font-weight="700">两种分配都拿 2 段,首尾配对平衡了示意负载</text>
  <text x="56" y="442" font-size="11" fill="#6b7280">3/7/11 与 7/7/7 只解释均衡思路;实际 kernel、通信和其他层耗时均未计入,不能据此推导 11:7 加速比</text>
</svg>
