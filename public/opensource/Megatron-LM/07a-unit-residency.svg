<text x="751" y="428" font-size="11" fill="#111827" font-weight="400" text-anchor="middle">归约 g1</text>
<path d="M329 391 L607 391" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="407" y="377" font-size="13" fill="#111827" font-weight="400" text-anchor="start">reduce-scatter</text>
<text x="790" y="380" font-size="13" fill="#111827" font-weight="400" text-anchor="start">累积本地梯度分片</text>
<text x="790" y="402" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">本单元完整参数可回收</text>
<rect x="32" y="478" width="1056" height="98" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="502" font-size="14" fill="#111827" font-weight="700" text-anchor="start">optimizer state / main weight 按分片常驻,用归约后的本地梯度更新</text>
<rect x="48" y="518" width="300" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="62" y="541" font-size="13" fill="#111827" font-weight="400" text-anchor="start">rank 0:state 0 + main weight 0</text>
<rect x="393" y="518" width="300" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="407" y="541" font-size="13" fill="#111827" font-weight="400" text-anchor="start">rank 1:state 1 + main weight 1</text>
<text x="756" y="534" font-size="13" fill="#111827" font-weight="400" text-anchor="start">更新后刷新计算参数分片</text>
<text x="756" y="555" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">无需聚合完整 optimizer state</text>
<text x="32" y="603" font-size="11" fill="#9ca3af" font-weight="400" text-anchor="start">这是单元生命周期示意,不是时长或显存比例图；重算会延后释放,持久buffer可回收复用而不退还内存。</text>
</svg>