<text x="32" y="36" font-size="19" fill="#111827" font-weight="700" text-anchor="start">Megatron-FSDP:完整参数只在管理单元计算时出现</text>
<text x="32" y="61" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">限定:默认实现 v1 / optim_grads_params / 2 个 DP rank / 普通前反向,省略预取和激活</text>
<text x="32" y="83" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">紫 = 计算参数 · 黄 = 梯度 · 绿 = optimizer state / main weight；W0 / W1 是同一单元的两片</text>
<text x="154" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="start">分片常驻</text>
