<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="736" viewBox="0 0 1120 736" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect width="1120" height="736" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#9ca3af"/></marker></defs>
<text x="32" y="36" font-size="19" fill="#111827" font-weight="700" text-anchor="start">选谁与给多大权重:expert bias只修正选择</text>
<text x="32" y="60" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">演示:3 token / 3 expert / top-2 / sigmoid / 无capacity、无aux；不是默认训练配置</text>
<text x="32" y="81" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">紫 = 未加bias分数 · 黄 = 选择分数 · 绿 = 选中后的权重；柱长按分数比例绘制</text>
<text x="32" y="115" font-size="14" fill="#111827" font-weight="700" text-anchor="start">放大 token A</text>
<text x="142" y="115" font-size="14" fill="#111827" font-weight="700" text-anchor="start">原始分数</text>
<text x="456" y="115" font-size="14" fill="#111827" font-weight="700" text-anchor="start">加bias后,仅用于选择</text>
<text x="813" y="115" font-size="14" fill="#111827" font-weight="700" text-anchor="start">按原始分数算权重</text>
<text x="32" y="160" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E0</text>
<rect x="142" y="138" width="150.0" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="307" y="158" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0.6</text>
<text x="366" y="158" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">-0.2</text>
<rect x="456" y="138" width="100.0" height="28" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="574" y="158" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0.4</text>
<path d="M612 152 L785 152" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="810" y="136" width="240" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="824" y="157" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E0:0.6 / 0.7 = 6/7</text>
<text x="32" y="203" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E1</text>
<rect x="142" y="181" width="75.0" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="307" y="201" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0.3</text>
<text x="366" y="201" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">+0</text>
<rect x="456" y="181" width="75.0" height="28" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="574" y="201" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0.3</text>
<text x="648" y="201" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">E1落选</text>
<text x="32" y="246" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E2</text>
<rect x="142" y="224" width="25.0" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="307" y="244" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0.1</text>
<text x="366" y="244" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">+0.25</text>
<rect x="456" y="224" width="87.5" height="28" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="574" y="244" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0.35</text>
<path d="M612 238 L785 238" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="810" y="222" width="240" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="824" y="243" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E2:0.1 / 0.7 = 1/7</text>
<text x="142" y="287" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">bias向量:[−0.2, 0, +0.25]；E2由原本第3变为第2,但计算权重只占1/7。</text>
<rect x="32" y="312" width="1056" height="310" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="340" font-size="14" fill="#111827" font-weight="700" text-anchor="start">同一演示batch的实际分配:每条连线是一条token→expert连接</text>
<path d="M396 386 C500 386,540 386,650 386" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M396 386 C500 386,540 510,650 510" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M396 448 C500 448,540 386,650 386" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M396 448 C500 448,540 510,650 510" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M396 510 C500 510,540 448,650 448" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M396 510 C500 510,540 510,650 510" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="48" y="365" width="348" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="63" y="391" font-size="13" fill="#111827" font-weight="400" text-anchor="start">token A · 原始分数 [0.6, 0.3, 0.1]</text>
<rect x="48" y="427" width="348" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="63" y="453" font-size="13" fill="#111827" font-weight="400" text-anchor="start">token B · 原始分数 [0.7, 0.2, 0.1]</text>
<rect x="48" y="489" width="348" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="63" y="515" font-size="13" fill="#111827" font-weight="400" text-anchor="start">token C · 原始分数 [0.2, 0.6, 0.4]</text>
<rect x="654" y="365" width="168" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="668" y="391" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E0 ← A、B</text>
<rect x="850" y="369" width="36" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="894" y="369" width="36" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1001" y="391" font-size="13" fill="#111827" font-weight="400" text-anchor="start">2次</text>
<rect x="654" y="427" width="168" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="668" y="453" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E1 ← C</text>
<rect x="850" y="431" width="36" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1001" y="453" font-size="13" fill="#111827" font-weight="400" text-anchor="start">1次</text>
<rect x="654" y="489" width="168" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="668" y="515" font-size="13" fill="#111827" font-weight="400" text-anchor="start">E2 ← A、B、C</text>
<rect x="850" y="493" width="36" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="894" y="493" width="36" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="938" y="493" width="36" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1001" y="515" font-size="13" fill="#111827" font-weight="400" text-anchor="start">3次</text>
<text x="48" y="579" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">global batch共6条连接,平均每expert 2条；计数为E0=2、E1=1、E2=3。</text>
<text x="48" y="601" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">反馈:不改本次权重；下一步bias分别变化 0、+η、−η,其中η是更新步长。</text>
<path d="M980 628 L980 652 L20 652 L20 298 L390 298" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="480" y="675" font-size="13" fill="#111827" font-weight="400" text-anchor="start">负载反馈回到选择偏置</text>
<text x="32" y="712" font-size="11" fill="#9ca3af" font-weight="400" text-anchor="start">分数与bias均为人为演示值；权重按源码归一化规则计算,省略浮点舍入。aux loss是另一条梯度反馈路径,本图未启用。</text>
</svg>