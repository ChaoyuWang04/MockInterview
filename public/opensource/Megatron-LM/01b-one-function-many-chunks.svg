<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ca3af"/></marker></defs>
<rect width="1120" height="640" fill="#ffffff"/>
<text x="32" y="38" font-size="19" font-weight="700" fill="#111827">构造本 rank 的 model chunks，再按配置包装</text>
<text x="32" y="63" font-size="13" font-weight="400" fill="#6b7280">绿＝构造入口 · 紫＝model chunk · 黄＝可选包装；嵌套表示包含，一格 / 多格表示 chunk 数</text>
<rect x="32" y="106" width="290" height="126" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
<text x="44" y="131" font-size="14" font-weight="700" fill="#111827">模型构造入口</text>
<text x="44" y="153" font-size="13" font-weight="400" fill="#6b7280">当前 GPT：配置容器 + builder</text>
<text x="44" y="172" font-size="13" font-weight="400" fill="#6b7280">也支持 model provider 回调</text>
<text x="44" y="191" font-size="13" font-weight="400" fill="#6b7280">按 rank / 流水段确定本地模型</text>
<rect x="370" y="96" width="718" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="384" y="121" font-size="14" font-weight="700" fill="#111827">不开交错式流水线：本 rank 通常持有 1 个 chunk</text>
<rect x="390" y="142" width="280" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="402" y="167" font-size="14" font-weight="700" fill="#111827">model chunk 0</text>
<text x="402" y="189" font-size="13" font-weight="400" fill="#6b7280">调度接口收到长度为 1 的列表</text>
<path d="M322 153 L390 178" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370" y="270" width="718" height="158" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="384" y="295" font-size="14" font-weight="700" fill="#111827">开启交错式流水线：本 rank 持有多个 chunks（示意 4 个）</text>
<rect x="390" y="321" width="151" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="402" y="346" font-size="14" font-weight="700" fill="#111827">chunk 0</text>
<text x="402" y="368" font-size="13" font-weight="400" fill="#6b7280">一段本地模型</text>
<rect x="561" y="321" width="151" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="573" y="346" font-size="14" font-weight="700" fill="#111827">chunk 1</text>
<text x="573" y="368" font-size="13" font-weight="400" fill="#6b7280">一段本地模型</text>
<rect x="732" y="321" width="151" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="744" y="346" font-size="14" font-weight="700" fill="#111827">chunk 2</text>
<text x="744" y="368" font-size="13" font-weight="400" fill="#6b7280">一段本地模型</text>
<rect x="903" y="321" width="151" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="915" y="346" font-size="14" font-weight="700" fill="#111827">chunk 3</text>
<text x="915" y="368" font-size="13" font-weight="400" fill="#6b7280">一段本地模型</text>
<path d="M322 196 H344 V357 H390" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="270" width="290" height="158" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="46" y="295" font-size="14" font-weight="700" fill="#111827">构造时的条件</text>
<text x="48" y="323" font-size="13" font-weight="400" fill="#6b7280">设备与 dtype 由配置决定</text>
<text x="48" y="350" font-size="13" font-weight="400" fill="#6b7280">不要求统一在 CPU 上初始化</text>
<text x="48" y="377" font-size="13" font-weight="400" fill="#6b7280">每个 chunk 可有不同边界职责</text>
<rect x="32" y="463" width="650" height="146" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
<text x="44" y="488" font-size="14" font-weight="700" fill="#111827">每个 chunk 的包装：按配置选择</text>
<text x="44" y="510" font-size="13" font-weight="400" fill="#6b7280">DDP / FSDP 包装（如启用）</text>
<rect x="52" y="521" width="610" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
<text x="64" y="546" font-size="14" font-weight="700" fill="#111827">精度包装（如需要）</text>
<rect x="300" y="539" width="340" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="312" y="564" font-size="14" font-weight="700" fill="#111827">model chunk</text>
<text x="718" y="493" font-size="14" font-weight="700" fill="#111827">不是固定两层壳</text>
<text x="718" y="525" font-size="13" font-weight="400" fill="#6b7280">精度包装与数据并行包装分别有条件</text>
<text x="718" y="551" font-size="13" font-weight="400" fill="#6b7280">调度、清梯度与存档按模型列表处理</text>
<text x="718" y="577" font-size="13" font-weight="400" fill="#6b7280">具体实现入口见代码索引</text>
</svg>
