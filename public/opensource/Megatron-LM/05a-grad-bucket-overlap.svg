<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect width="1120" height="620" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#9ca3af" stroke-width="1"/></marker></defs>
<text x="40" y="40" font-size="19" font-weight="700" fill="#111827">梯度就绪一桶,通信先走一桶</text>
<text x="40" y="65" font-size="13" fill="#6b7280">稳定阶段的常规自动触发路径；每个桶组简化为一个桶。横向表示先后,宽度不代表实测耗时。</text>
<text x="40" y="88" font-size="13" fill="#6b7280">灰 = 暂缓同步的累积；绿 = 反向计算；紫 = 桶就绪；黄 = 梯度通信。</text>

<rect x="40" y="112" width="1040" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="60" y="130" width="436" height="55" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="80" y="153" font-size="14" font-weight="700" fill="#111827">前面的 microbatch：累积梯度,暂不报就绪</text>
<text x="80" y="174" font-size="11" fill="#6b7280">no_sync 只控制同步时机,反向与本地梯度累积仍执行</text>
<path d="M507 157H563" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="578" y="130" width="481" height="55" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="598" y="153" font-size="14" font-weight="700" fill="#111827">最后一个 microbatch：允许登记就绪</text>
<text x="598" y="174" font-size="11" fill="#6b7280">下面展开这次反向：桶内参数计数达到首批记录后发起通信</text>

<path d="M246 237H1037" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="60" y="242" font-size="13" fill="#6b7280">执行先后</text>
<text x="60" y="291" font-size="14" font-weight="700" fill="#111827">反向计算</text>
<rect x="250" y="262" width="230" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="270" y="286" font-size="14" font-weight="700" fill="#111827">生成桶 A 的梯度</text>
<text x="270" y="306" font-size="11" fill="#6b7280">这些参数在反向中较早完成</text>
<rect x="490" y="262" width="230" height="58" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="510" y="286" font-size="14" font-weight="700" fill="#111827">继续生成桶 B 的梯度</text>
<text x="510" y="306" font-size="11" fill="#6b7280">与下方桶 A 的通信重叠</text>

<path d="M480 322V353" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M720 322V353" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="60" y="386" font-size="14" font-weight="700" fill="#111827">连续梯度桶</text>
<text x="60" y="406" font-size="11" fill="#6b7280">桶内各参数已累积完整</text>
<rect x="420" y="360" width="150" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="442" y="383" font-size="14" font-weight="700" fill="#111827">桶 A 就绪</text>
<text x="442" y="403" font-size="11" fill="#6b7280">发起异步同步</text>
<rect x="660" y="360" width="150" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="682" y="383" font-size="14" font-weight="700" fill="#111827">桶 B 就绪</text>
<text x="682" y="403" font-size="11" fill="#6b7280">加入通信队列</text>
<path d="M490 416V449" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M735 416L773 449" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>

<text x="60" y="480" font-size="14" font-weight="700" fill="#111827">DP 通信</text>
<rect x="490" y="456" width="260" height="53" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="512" y="479" font-size="14" font-weight="700" fill="#111827">桶 A 通信</text>
<text x="512" y="499" font-size="11" fill="#6b7280">早就绪,无需等桶 B 算完</text>
<rect x="760" y="456" width="160" height="53" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="780" y="479" font-size="14" font-weight="700" fill="#111827">桶 B 通信</text>
<text x="780" y="499" font-size="11" fill="#6b7280">末尾仍可能暴露</text>
<path d="M930 482H959" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="970" y="456" width="110" height="53" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="984" y="479" font-size="14" font-weight="700" fill="#111827">梯度收尾</text>
<text x="984" y="499" font-size="11" fill="#6b7280">确认通信完成</text>

<text x="40" y="550" font-size="13" fill="#6b7280">黄色通信：普通路径是 all-reduce；分布式优化器的常规路径是 reduce-scatter。</text>
<text x="40" y="575" font-size="11" fill="#9ca3af">示意假设：首批记录已建立、允许细分桶、单个分布式优化器实例；不表示所有流水线 stage 都采用相同分桶。</text>
<text x="40" y="596" font-size="11" fill="#9ca3af">进入参数更新前,还须完成模型配置要求的其他梯度同步；开启 overlap 不等于消除全部等待。</text>
</svg>
