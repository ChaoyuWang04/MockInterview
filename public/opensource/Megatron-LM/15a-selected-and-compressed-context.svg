<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc"><title id="title">DSA选择原始位置，CSA选择压缩位置并保留窗口</title><desc id="desc">16-token教学序列，以query15为例。DSA示意选择2和9。CSA以4倍重叠gated pooling形成C0至C3，indexer选择C0与C2，主attention同时使用窗口12至15。示意索引不是实测输出。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="920" rx="16" fill="#f8fafc"/>
<text x="30" y="43" font-family="Arial, PingFang SC, sans-serif" font-size="27" fill="#0f172a" font-weight="700" text-anchor="start">先决定看哪些位置，再计算 attention 权重</text>
<text x="30" y="75" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">教学示例：16 个 token，query 位置 15；图中 top-k 选择人为指定，不是实测结果。</text>
<rect x="24" y="97" width="1072" height="240" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="44" y="130" font-family="Arial, PingFang SC, sans-serif" font-size="21" fill="#166534" font-weight="700" text-anchor="start">DSA：在原始 token 位置中选择</text>
<rect x="120" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="142.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">0</text>
<rect x="173" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="195.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">1</text>
<rect x="226" y="153" width="45" height="34" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<text x="248.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">2</text>
<rect x="279" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="301.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">3</text>
<rect x="332" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="354.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">4</text>
<rect x="385" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="407.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">5</text>
<rect x="438" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="460.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">6</text>
<rect x="491" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="513.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">7</text>
<rect x="544" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="566.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">8</text>
<rect x="597" y="153" width="45" height="34" rx="4" fill="#dcfce7" stroke="#22c55e"/>
<text x="619.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">9</text>
<rect x="650" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="672.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">10</text>
<rect x="703" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="725.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">11</text>
<rect x="756" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="778.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">12</text>
<rect x="809" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="831.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">13</text>
<rect x="862" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="884.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">14</text>
<rect x="915" y="153" width="45" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="937.5" y="176" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">15</text>
<text x="44" y="211" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">causal 可见：0–15；示意 top-2 → {2, 9}</text>
<rect x="120" y="239" width="250" height="50" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
<text x="245" y="270" font-family="Arial, PingFang SC, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">indexer：评分 → top-k</text>
<rect x="452" y="239" width="280" height="50" rx="8" fill="#dcfce7" stroke="#22c55e"/>
<text x="592" y="270" font-family="Arial, PingFang SC, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">主 attention：Q/K 重算权重</text>
<path d="M372 264L450 264" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="408" y="233" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">索引</text>
<text x="773" y="263" font-family="Arial, PingFang SC, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">对选中 value 加权</text>
<path d="M734 264L764 264" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="120" y="316" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#334155" font-weight="400" text-anchor="start">indexer 辅助 KL loss 学习 teacher 分布；选择分数不是最终混合权重。</text>
<rect x="24" y="354" width="1072" height="530" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="44" y="388" font-family="Arial, PingFang SC, sans-serif" font-size="21" fill="#1e40af" font-weight="700" text-anchor="start">CSA：压缩候选 + 原始局部窗口</text>
<text x="44" y="419" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">4 倍压缩：相邻组重叠，gated pooling；每 4 个新 token 形成 1 个压缩位置。</text>
<rect x="120" y="441" width="188" height="39" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="214" y="466" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">原始位置 0–3</text>
<rect x="346" y="441" width="188" height="39" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="440" y="466" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">原始位置 4–7</text>
<rect x="572" y="441" width="188" height="39" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="666" y="466" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">原始位置 8–11</text>
<rect x="798" y="441" width="188" height="39" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="892" y="466" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">原始位置 12–15</text>
<path d="M214 482L214 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M440 482L440 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M259 482L395 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M666 482L666 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M485 482L621 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M892 482L892 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M711 482L847 523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="525" width="188" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<text x="214" y="548" font-family="Arial, PingFang SC, sans-serif" font-size="19" fill="#1e40af" font-weight="700" text-anchor="middle">C0</text>
<text x="214" y="570" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">覆盖 0–3</text>
<rect x="346" y="525" width="188" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<text x="440" y="548" font-family="Arial, PingFang SC, sans-serif" font-size="19" fill="#1e40af" font-weight="700" text-anchor="middle">C1</text>
<text x="440" y="570" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">覆盖 0–7</text>
<rect x="572" y="525" width="188" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<text x="666" y="548" font-family="Arial, PingFang SC, sans-serif" font-size="19" fill="#1e40af" font-weight="700" text-anchor="middle">C2</text>
<text x="666" y="570" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">覆盖 4–11</text>
<rect x="798" y="525" width="188" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<text x="892" y="548" font-family="Arial, PingFang SC, sans-serif" font-size="19" fill="#1e40af" font-weight="700" text-anchor="middle">C3</text>
<text x="892" y="570" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">覆盖 8–15</text>
<text x="120" y="609" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#334155" font-weight="400" text-anchor="start">首块缺少的前组被 mask；每块采用不同投影分量与学习权重，不是均值。</text>
<rect x="120" y="638" width="400" height="53" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
<text x="320" y="661" font-family="Arial, PingFang SC, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">独立 indexer 压缩表示 → top-2</text>
<text x="320" y="682" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#334155" font-weight="400" text-anchor="middle">本例选择位置 C0、C2</text>
<rect x="631" y="638" width="367" height="53" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="814" y="661" font-family="Arial, PingFang SC, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">query 15 的原始窗口</text>
<text x="814" y="682" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#334155" font-weight="400" text-anchor="middle">窗口长 4 → {12, 13, 14, 15}</text>
<path d="M320 694L400 743" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M814 694L750 743" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="255" y="746" width="690" height="55" rx="8" fill="#dcfce7" stroke="#22c55e"/>
<text x="600" y="769" font-family="Arial, PingFang SC, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">主 attention 候选：C0、C2、token 12、13、14、15</text>
<text x="600" y="791" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#334155" font-weight="400" text-anchor="middle">主 KV compressor 的值；合并计算权重，sink 参与分母</text>
<text x="120" y="835" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">因果规则：query 15 可见 4 个完整压缩位置；query 6 只能看 C0。</text>
<text x="120" y="863" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">128 倍路径：非重叠压缩 + 全部有效压缩位置；0：仅窗口。</text>
<text x="30" y="908" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155" font-weight="400" text-anchor="start">框宽不表示时间或显存；图只展示位置选择、压缩覆盖与候选合并。</text>
</svg>