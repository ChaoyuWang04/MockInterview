<text x="40" y="44" font-size="19" fill="#111827" font-weight="700">同一套并行度,两种合法摆位</text>
<text x="40" y="68" font-size="13" fill="#6b7280">16 张卡、两台 8 卡机,张量并行 2 × 流水线并行 4 × 数据并行 2。绿=张量并行组,紫=数据并行组,黄=流水线组。</text>
<text x="40" y="88" font-size="13" fill="#6b7280">每一维只画含 0 号卡的那一组;红色表示这一组的成员分在两台机器上。</text>
