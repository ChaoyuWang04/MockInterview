<text x="556" y="594" font-size="11" fill="#9ca3af">机内 {0, 2, 4, 6}</text>
<text x="40" y="626" font-size="11" fill="#9ca3af">两种摆法都合法、都跑得起来;差别只在哪一类通信落到机间链路上。开关名在第五节。</text>
