<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">lm_head 输出的峰值显存:先乘后 mask、先 mask 后乘、分块融合</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">N = 本批 token 数,V = 词表大小,d = 隐层维度。SFT 里只有回答部分算 loss,prompt 部分的 logits 算了就扔。黄 = 要算 loss 的行,灰 = 算了没用或只是过一遍。</text>
<text x="30" y="100" font-size="15" fill="#111827" text-anchor="start" font-weight="700">先乘后 mask:全算完再扔,峰值 ≈ N × V</text>
<rect x="60" y="112" width="50" height="90" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="85.0" y="162.0" font-size="12" fill="#6b7280" text-anchor="middle"></text>
<text x="85.0" y="218" font-size="11" fill="#6b7280" text-anchor="middle">N×d</text>
<text x="140" y="162" font-size="14" fill="#111827" text-anchor="middle">×</text>
<rect x="170" y="132" width="170" height="50" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="255.0" y="162.0" font-size="12" fill="#6b7280" text-anchor="middle">lm_head d×V</text>
<text x="370" y="162" font-size="14" fill="#111827" text-anchor="middle">=</text>
<rect x="400" y="112" width="220" height="90" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="400" y="140" width="220" height="20" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="510" y="218" font-size="11" fill="#6b7280" text-anchor="middle">logits N×V,灰色行算了就扔</text>
<line x1="630" y1="157" x2="680" y2="157" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="690" y="162" font-size="13" fill="#111827" text-anchor="start">乘 mask 再算 loss:例子里约 10 GB</text>
<text x="30" y="262" font-size="15" fill="#111827" text-anchor="start" font-weight="700">先 mask 后乘:只挑要算 loss 的行,峰值 ≈ N′ × V</text>
<rect x="60" y="274" width="50" height="90" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="85.0" y="324.0" font-size="12" fill="#6b7280" text-anchor="middle"></text>
<text x="85.0" y="380" font-size="11" fill="#6b7280" text-anchor="middle">N×d</text>
<line x1="118" y1="319" x2="148" y2="319" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="152" y="309" width="50" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="177.0" y="324.0" font-size="12" fill="#111827" text-anchor="middle"></text>
<text x="177.0" y="345" font-size="11" fill="#6b7280" text-anchor="middle">N′×d</text>
<text x="230" y="324" font-size="14" fill="#111827" text-anchor="middle">×</text>
<rect x="260" y="294" width="170" height="50" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="345.0" y="324.0" font-size="12" fill="#6b7280" text-anchor="middle">lm_head d×V</text>
<text x="460" y="324" font-size="14" fill="#111827" text-anchor="middle">=</text>
<rect x="490" y="309" width="220" height="20" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="600" y="346" font-size="11" fill="#6b7280" text-anchor="middle">logits N′×V</text>
<line x1="720" y1="319" x2="770" y2="319" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="780" y="324" font-size="13" fill="#111827" text-anchor="start">直接算 loss:只算 30% 的行就 ≈ 3 GB</text>
<text x="30" y="404" font-size="15" fill="#111827" text-anchor="start" font-weight="700">分块融合:每次一小块,算完立刻丢,峰值 ≈ c × V,和 N 无关</text>
<rect x="60" y="416" width="50" height="90" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="85.0" y="466.0" font-size="12" fill="#6b7280" text-anchor="middle"></text>
<rect x="60" y="446" width="50" height="12" rx="1" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<line x1="118" y1="452" x2="148" y2="452" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="152" y="446" width="50" height="12" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="177.0" y="457.0" font-size="12" fill="#111827" text-anchor="middle"></text>
<text x="230" y="457" font-size="14" fill="#111827" text-anchor="middle">×</text>
<rect x="260" y="427" width="170" height="50" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="345.0" y="457.0" font-size="12" fill="#6b7280" text-anchor="middle">lm_head d×V</text>
<text x="460" y="457" font-size="14" fill="#111827" text-anchor="middle">=</text>
<rect x="490" y="446" width="220" height="12" rx="1" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<line x1="720" y1="452" x2="770" y2="452" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="780" y="448" font-size="13" fill="#111827" text-anchor="start">loss + 梯度,c = 2k 时 ≈ 1 GB;</text>
<text x="780" y="468" font-size="13" fill="#111827" text-anchor="start">丢掉这块,取下一块 ↻</text>
<text x="30" y="506" font-size="12" fill="#6b7280" text-anchor="start">三种做法算出的 loss 完全一样,差的只是峰值:N×V 在长序列大词表下能到十几 GB,是 SFT 里最常见的一处 OOM 来源</text>
</svg>