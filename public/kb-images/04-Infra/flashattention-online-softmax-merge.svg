<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" width="1120" height="980" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="980" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">切 q 与切 KV 用的是同一个公式:块内一片片折算,或块间一份份折算</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">① 打分矩阵的两根轴决定能怎么切;② 两种切法的循环体完全相同;③ 一个三个数的例子验证合并结果和不切一模一样。</text>
<text x="30" y="96" font-size="15" fill="#111827" text-anchor="start" font-weight="700">① 打分矩阵 S:行 = q(独立轴),列 = KV(归约轴,softmax 在这个方向求和)</text>
<rect x="160" y="108" width="800" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="127.32" font-size="12" fill="#111827" text-anchor="middle">q 行块 1:自己的 softmax,扫完所有列,直接出结果</text>
<rect x="160" y="144" width="800" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="163.32" font-size="12" fill="#111827" text-anchor="middle">q 行块 2:同上,和块 1 毫无关系</text>
<rect x="160" y="180" width="800" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="560.0" y="199.32" font-size="12" fill="#111827" text-anchor="middle">q 行块 3</text>
<rect x="160" y="216" width="196" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="360" y="216" width="196" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="560" y="216" width="196" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="760" y="216" width="196" height="30" rx="2" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="560" y="236" font-size="12" fill="#111827" text-anchor="middle">同一行沿列切 4 段:每段一份 (m, l, o),必须合并</text>
<text x="160" y="272" font-size="12" fill="#6b7280" text-anchor="start">原则:先用独立轴(行、头、序列)铺并行,不够再动归约轴(列),代价是一次合并。</text>
<line x1="30" y1="292" x2="1090" y2="292" stroke="#e5e7eb"/>
<text x="30" y="322" font-size="15" fill="#111827" text-anchor="start" font-weight="700">② 切 q(prefill):一块管一行到底</text>
<text x="600" y="322" font-size="15" fill="#111827" text-anchor="start" font-weight="700">切 KV(decode):多块分一行,再合并</text>
<rect x="60" y="334" width="470" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="295.0" y="356.32" font-size="12" fill="#111827" text-anchor="middle">线程块拿 128 行 q,m = −∞  l = 0  o = 0</text>
<line x1="295" y1="372" x2="295" y2="386" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="60" y="388" width="470" height="150" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="295.0" y="432.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">对 KV 的每一片,循环:</text><text x="295.0" y="450.0" font-size="11" fill="#6b7280" text-anchor="middle">S = Q_tile · K_tileᵀ / √d,套 mask</text><text x="295.0" y="468.0" font-size="11" fill="#6b7280" text-anchor="middle">m_new = max(m, rowmax(S)),α = e^(m − m_new)</text><text x="295.0" y="486.0" font-size="11" fill="#6b7280" text-anchor="middle">l = α·l + rowsum(e^(S − m_new))</text><text x="295.0" y="504.0" font-size="11" fill="#6b7280" text-anchor="middle">o = α·o + e^(S − m_new) · V_tile;m = m_new</text>
<line x1="295" y1="540" x2="295" y2="554" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="60" y="556" width="470" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="295.0" y="578.32" font-size="12" fill="#111827" text-anchor="middle">扫完全部 KV:O = o / l,写出,结束</text>
<text x="295" y="612" font-size="11" fill="#6b7280" text-anchor="middle">这一行的 KV 全在这一个块里扫完,所以块内的 online 更新就是全部</text>
<rect x="600" y="334" width="470" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="835.0" y="356.32" font-size="12" fill="#111827" text-anchor="middle">块 i 拿同一行 q,只负责 KV 第 i 段</text>
<line x1="835" y1="372" x2="835" y2="386" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="600" y="388" width="470" height="150" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="835.0" y="441.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">对本段 KV 的每一片,循环:</text><text x="835.0" y="459.0" font-size="11" fill="#6b7280" text-anchor="middle">和左边一模一样的五步:S、m_new、α、l、o</text><text x="835.0" y="477.0" font-size="11" fill="#6b7280" text-anchor="middle">扫完本段得到 (mᵢ, lᵢ, oᵢ)</text><text x="835.0" y="495.0" font-size="11" fill="#6b7280" text-anchor="middle">不除,原样写到工作区</text>
<line x1="835" y1="540" x2="835" y2="554" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="600" y="556" width="470" height="76" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="835.0" y="590.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">合并 kernel:收齐所有块的 (mᵢ, lᵢ, oᵢ)</text><text x="835.0" y="608.0" font-size="11" fill="#6b7280" text-anchor="middle">M = max(mᵢ),αᵢ = e^(mᵢ − M);L = Σ αᵢ·lᵢ,O′ = Σ αᵢ·oᵢ,O = O′ / L</text>
<line x1="30" y1="652" x2="1090" y2="652" stroke="#e5e7eb"/>
<text x="30" y="682" font-size="15" fill="#111827" text-anchor="start" font-weight="700">③ 一行 q,三个 KV,打分 s = [2, 1, 3],切成 A = [2, 1] 和 B = [3]</text>
<rect x="60" y="694" width="470" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="295.0" y="721.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 A(只看 s₁=2, s₂=1)</text><text x="295.0" y="739.0" font-size="11" fill="#6b7280" text-anchor="middle">m_A = 2;l_A = e⁰ + e⁻¹ = 1 + 0.368 = 1.368</text><text x="295.0" y="757.0" font-size="11" fill="#6b7280" text-anchor="middle">o_A = 1·v₁ + 0.368·v₂</text>
<rect x="600" y="694" width="470" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="835.0" y="721.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 B(只看 s₃=3)</text><text x="835.0" y="739.0" font-size="11" fill="#6b7280" text-anchor="middle">m_B = 3;l_B = e⁰ = 1</text><text x="835.0" y="757.0" font-size="11" fill="#6b7280" text-anchor="middle">o_B = 1·v₃</text>
<line x1="295" y1="776" x2="500" y2="800" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="835" y1="776" x2="630" y2="800" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200" y="802" width="720" height="90" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="560.0" y="834.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">合并:折算到全局最大值 M = max(2, 3) = 3</text><text x="560.0" y="852.0" font-size="11" fill="#6b7280" text-anchor="middle">块 A 的缩放 = e^(2 − 3) = 0.368,块 B 的缩放 = 1;L = 1.368 × 0.368 + 1 = 1.503</text><text x="560.0" y="870.0" font-size="11" fill="#6b7280" text-anchor="middle">O = 0.368·v₁ + 0.135·v₂ + 1·v₃;O / L → 权重 0.245 v₁ + 0.090 v₂ + 0.665 v₃</text>
<rect x="200" y="904" width="720" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="560.0" y="928.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">不切,直接算一整行:M = 3,指数 = [0.368, 0.135, 1],L = 1.503</text><text x="560.0" y="946.0" font-size="11" fill="#6b7280" text-anchor="middle">权重 = [0.245, 0.090, 0.665],和上面一模一样</text>
</svg>