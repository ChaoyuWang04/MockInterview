<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">一个位置的前向与反向:loss 只用了概率里的一个数,梯度要用全部,所以前向的产物必须留到反向</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">位置 3,前文是「今天 天气 很」,正确答案是「好」;词表只有四个词(好 差 热 冷),d = 2。黄 = 前向产出、反向要用的东西,绿 = 反向算出的梯度。</text>
<text x="30" y="100" font-size="15" fill="#111827" text-anchor="start" font-weight="700">前向</text>
<rect x="40" y="112" width="150" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/>
<text x="115.0" y="134" font-size="13" fill="#111827" text-anchor="middle">隐状态 h</text>
<text x="115.0" y="154" font-size="12" fill="#6b7280" text-anchor="middle">[1.0, 0.5]</text>
<text x="210" y="146" font-size="14" fill="#111827" text-anchor="middle">×</text>
<rect x="230" y="112" width="170" height="56" rx="5" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="315.0" y="134" font-size="13" fill="#111827" text-anchor="middle">lm_head W</text>
<text x="315.0" y="154" font-size="12" fill="#6b7280" text-anchor="middle">2 行 × 4 列</text>
<text x="420" y="146" font-size="14" fill="#111827" text-anchor="middle">=</text>
<rect x="440" y="112" width="250" height="56" rx="5" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="565.0" y="134" font-size="13" fill="#111827" text-anchor="middle">打分 z(好 差 热 冷)</text>
<text x="565.0" y="154" font-size="12" fill="#6b7280" text-anchor="middle">[2.0, 1.1, 1.1, 0.4]</text>
<line x1="692" y1="140" x2="738" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="740" y="112" width="260" height="56" rx="5" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="870.0" y="134" font-size="13" fill="#111827" text-anchor="middle">softmax → 概率 p</text>
<text x="870.0" y="154" font-size="12" fill="#6b7280" text-anchor="middle">[0.5, 0.2, 0.2, 0.1]</text>
<text x="740" y="190" font-size="12" fill="#111827" text-anchor="start">loss = −log p[好] = −log 0.5 = 0.69</text>
<text x="740" y="208" font-size="12" fill="#6b7280" text-anchor="start">loss 数值只用了 0.5 这一个数</text>
<text x="30" y="252" font-size="15" fill="#111827" text-anchor="start" font-weight="700">反向:算「每个参数该往哪边改多少」</text>
<rect x="740" y="264" width="260" height="56" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="870.0" y="286" font-size="13" fill="#111827" text-anchor="middle">对打分的梯度 g = p − 独热(好)</text>
<text x="870.0" y="306" font-size="12" fill="#6b7280" text-anchor="middle">[−0.5, 0.2, 0.2, 0.1]</text>
<line x1="738" y1="292" x2="692" y2="292" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="440" y="264" width="250" height="56" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="565.0" y="286" font-size="13" fill="#111827" text-anchor="middle">W 的梯度 = hᵀ × g</text>
<text x="565.0" y="306" font-size="12" fill="#6b7280" text-anchor="middle">2×4 = 8 个格子全非零</text>
<line x1="438" y1="292" x2="392" y2="292" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="264" width="350" height="56" rx="5" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="215.0" y="286" font-size="13" fill="#111827" text-anchor="middle">h 的梯度 = g × Wᵀ</text>
<text x="215.0" y="306" font-size="12" fill="#6b7280" text-anchor="middle">继续往前面的层传</text>
<text x="40" y="356" font-size="12" fill="#6b7280" text-anchor="start">算 g 的时候用到了 p 的全部 4 个数,不只是 0.5;算 W 的梯度还要用到 h。这些都是前向算出来的,反向发生在很久之后,中间要么留着它们(激活显存),要么到时重算(激活重计算)。</text>
<text x="40" y="376" font-size="12" fill="#6b7280" text-anchor="start">训练显存里「激活」那一大块,就是每一层、每个位置这样留下的前向产物;它随 batch × 序列长度 × 层数线性增长,而权重和优化器状态不随序列长度变。</text>
<text x="30" y="440" font-size="12" fill="#6b7280" text-anchor="start">黄 = 前向产出、反向要用,绿 = 反向算出的梯度,灰 = 参数</text>
</svg>