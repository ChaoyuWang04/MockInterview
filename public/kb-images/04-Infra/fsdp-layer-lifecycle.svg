<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="460" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">FSDP:第 i 层在每张卡上的一生,前向反向各凑一次</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = 通信,绿 = 计算,灰 = 驻留状态;同一时刻显存里最多只有一两层的完整权重。以 4 卡为例。</text>
<text x="30" y="100" font-size="15" fill="#111827" text-anchor="start" font-weight="700">前向经过第 i 层</text>
<rect x="60" y="112" width="230" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="175.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">常驻</text><text x="175.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">本卡持有的 1/4 参数 + 1/4 优化器</text>
<line x1="292" y1="142" x2="318" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="320" y="112" width="230" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="435.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">all-gather</text><text x="435.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">凑齐整层权重</text>
<line x1="552" y1="142" x2="578" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="580" y="112" width="230" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="695.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">前向计算</text><text x="695.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">存这层的输入</text>
<line x1="812" y1="142" x2="838" y2="142" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="840" y="112" width="230" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="955.0" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">释放整层权重</text><text x="955.0" y="153" font-size="12" fill="#6b7280" text-anchor="middle">只剩 1/4</text>
<text x="560" y="200" font-size="12" fill="#6b7280" text-anchor="middle">算这层时,第 i+1 层的 all-gather 已经在后台跑(prefetch),通信藏在计算后面</text>
<text x="30" y="250" font-size="15" fill="#111827" text-anchor="start" font-weight="700">反向经过第 i 层</text>
<rect x="60" y="262" width="230" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="175.0" y="283" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">all-gather</text><text x="175.0" y="303" font-size="12" fill="#6b7280" text-anchor="middle">再凑一次</text>
<line x1="292" y1="292" x2="318" y2="292" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="320" y="262" width="230" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="435.0" y="283" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">算整层的梯度</text><text x="435.0" y="303" font-size="12" fill="#6b7280" text-anchor="middle">用前向存的输入</text>
<line x1="552" y1="292" x2="578" y2="292" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="580" y="262" width="230" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="695.0" y="283" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">reduce-scatter</text><text x="695.0" y="303" font-size="12" fill="#6b7280" text-anchor="middle">各卡只留 1/4 梯度</text>
<line x1="812" y1="292" x2="838" y2="292" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="840" y="262" width="230" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/><text x="955.0" y="283" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">释放权重和完整梯度</text><text x="955.0" y="303" font-size="12" fill="#6b7280" text-anchor="middle">优化器只更新自己 1/4</text>
<text x="60" y="360" font-size="12" fill="#6b7280" text-anchor="start">一层两次 all-gather 一次 reduce-scatter:通信量是 DDP 的 1.5 倍,换来的是参数、梯度、优化器状态都只驻留 1/N。wrap 粒度决定「一层」有多大(三)。</text>
<text x="30" y="430" font-size="12" fill="#6b7280" text-anchor="start">紫 = 通信,绿 = 计算,灰 = 驻留状态</text>
</svg>