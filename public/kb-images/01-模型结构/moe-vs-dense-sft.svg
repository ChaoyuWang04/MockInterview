<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b9b9b9"/></marker></defs>
<rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">MoE 和稠密的区别:CE 不变,加辅助项,专家层的前向反向多了通信</text>
<text x="30" y="58" font-size="13" fill="#6b7280" text-anchor="start">紫 = MoE 多出来的跨卡步骤,黄 = MoE 多出来的损失项;绿色的主损失两边完全相同。</text>
<text x="290" y="100" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">稠密模型 SFT</text>
<text x="830" y="100" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">MoE + EP 的 SFT</text>
<line x1="560" y1="90" x2="560" y2="640" stroke="#d1d5db" stroke-dasharray="4 4"/>
<rect x="140" y="116" width="300" height="44" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><text x="290.0" y="142.68" font-size="13" fill="#111827" text-anchor="middle">注意力</text>
<line x1="290" y1="162" x2="290" y2="186" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="140" y="190" width="300" height="44" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><text x="290.0" y="216.68" font-size="13" fill="#111827" text-anchor="middle">FFN(本卡算完)</text>
<line x1="290" y1="236" x2="290" y2="260" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="290" y="292" font-size="13" fill="#6b7280" text-anchor="middle">… × L 层</text>
<line x1="290" y1="304" x2="290" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="140" y="338" width="300" height="44" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><text x="290.0" y="364.68" font-size="13" fill="#111827" text-anchor="middle">lm_head(只算回复位置)</text>
<line x1="290" y1="384" x2="290" y2="408" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="140" y="412" width="300" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="290.0" y="433" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">交叉熵</text><text x="290.0" y="453" font-size="12" fill="#6b7280" text-anchor="middle">回复位置求平均</text>
<text x="290" y="496" font-size="12" fill="#6b7280" text-anchor="middle">反向:原路返回,跨卡只有数据并行的梯度同步</text>
<rect x="620" y="116" width="420" height="44" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><text x="830.0" y="142.68" font-size="13" fill="#111827" text-anchor="middle">注意力(和稠密一样)</text>
<line x1="830" y1="162" x2="830" y2="186" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="620" y="190" width="420" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="830.0" y="216.68" font-size="13" fill="#111827" text-anchor="middle">门控选 top-k → dispatch 跨卡发 → 专家</text>
<line x1="830" y1="236" x2="830" y2="260" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="620" y="264" width="420" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/><text x="830.0" y="290.68" font-size="13" fill="#111827" text-anchor="middle">combine 跨卡收回 → 按门控权重加权求和</text>
<line x1="830" y1="310" x2="830" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="620" y="338" width="420" height="44" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1"/><text x="830.0" y="364.68" font-size="13" fill="#111827" text-anchor="middle">lm_head(只算回复位置)</text>
<line x1="830" y1="384" x2="830" y2="408" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="620" y="412" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/><text x="720.0" y="433" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">交叉熵</text><text x="720.0" y="453" font-size="12" fill="#6b7280" text-anchor="middle">和左边一模一样</text>
<rect x="840" y="412" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/><text x="940.0" y="433" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">+ 辅助损失</text><text x="940.0" y="453" font-size="12" fill="#6b7280" text-anchor="middle">专家负载均衡</text>
<text x="830" y="496" font-size="12" fill="#6b7280" text-anchor="middle">反向:combine 的反向 = 一次 dispatch,dispatch 的反向 = 一次 combine</text>
<text x="830" y="514" font-size="12" fill="#6b7280" text-anchor="middle">每层前向 2 次 + 反向 2 次跨卡通信;专家梯度留在各自的卡上</text>
<text x="30" y="672" font-size="12" fill="#6b7280" text-anchor="start">紫 = MoE 多出来的跨卡步骤,黄 = MoE 多出来的损失项,绿 = 两边相同的主损失</text>
</svg>